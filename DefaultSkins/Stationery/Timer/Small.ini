; Stationery · Timer, small (170 × 170): a countdown timer with 5, 15, 25 and 45-minute presets. The ring shows the
; time left and is the play/pause button. Original work, MIT licensed.
;
; The skin is static (Update=-1). While the timer runs, an ActionTimer list updates the Tick group once a second.
; Its state is saved in Stationery.inc (Deskset's settings folder), so a refresh, sleep or relaunch keeps the timer.

[Rainmeter]
Update=-1
AccurateText=1
SkinWidth=170
SkinHeight=170
DynamicWindowSize=0
Group=Stationery
; the window's own look, once Deskset reads it (until then it is macOS's)
MacAppearance=#LookAppearance#
; Stationery.inc again if it was deleted since Deskset started; then a timer that was running when the skin loaded
; (refresh, login, wake, upgrade) ticks on
OnRefreshAction=[!CommandMeasure MeasureStationeryFile "Run"][!CommandMeasure MeasureTicker "[#TickCommand[#TimerState]]"]
ContextTitle=#TimerMenuMinutes#
ContextAction=[!CommandMeasure MeasureInput "ExecuteBatch 1"]
ContextTitle2=[#TimerMenuSound[#TimerSound]]
ContextAction2=[!WriteKeyValue Variables TimerSound "(1 - #TimerSound#)" "#@#Variables.inc"][!Refresh]
ContextTitle3=#TimerMenuReset#
ContextAction3=#ResetAction#
ContextTitle4=---
ContextTitle5=#MenuLookTitle#
ContextAction5=#MenuLookAction#
ContextTitle6=#MenuCardsTitle#
ContextAction6=#MenuCardsAction#

[Metadata]
Name=Timer
Author=Deskset
License=MIT
Version=1.0
Information=Stationery · A countdown timer with 5, 15, 25 and 45-minute presets. Click the ring to start or pause; scroll to change the minutes while it is stopped. It chimes when time is up (Sound in the right-click menu) and keeps running through a refresh, sleep or restart. No permission needed.

[Variables]
; this widget's menu choice: the menu writes it into Variables.inc, which is read next and wins
TimerSound=1
@Include=#@#Variables.inc
@Include2=#@#Suite/Tokens.inc
@Include3=#@#Suite/Styles.inc
@Include4=#@#Timer/Strings-#Language#.inc
; the timer's state: these defaults, then Stationery.inc, which the widget writes
TimerMinutes=25
TimerState=0
TimerEnd=0
TimerLeft=0
@Include5=#StationeryFile#
CardW=170
CardH=170
; the presets, in minutes
Preset1=5
Preset2=15
Preset3=25
Preset4=45
NewMinutes=0
ScrollDelta=0
; per state (0 ready, 1 running, 2 paused, 3 done)
TickCommand0=Stop 1
TickCommand1=Execute 1
TickCommand2=Stop 1
TickCommand3=Stop 1
ArcColor0=#TimerColor#
ArcColor1=#TimerColor#
ArcColor2=#TimerColor#
ArcColor3=0,0,0,0
TimeText0=%1
TimeText1=%1
TimeText2=%1
TimeText3=#TimerDone#
TimeInk0=#TextColor#
TimeInk1=#TextColor#
TimeInk2=#SecondaryTextColor#
TimeInk3=#TextColor#
; The transitions. They live in [Variables], where #Var# and [#Var] are fixed when the skin loads: anything that
; changes at run time is read through a measure ([MeasureNow:], [MeasureStartLeft:], [MeasureLeft:0]), which stays a
; section variable and is resolved when the bang runs. The skin is static, so "now" is updated first.
; Once Deskset can post notifications, Start also schedules one for the end, and Pause and Reset cancel it.
StartAction=[!UpdateMeasure MeasureNow][!UpdateMeasure MeasureStartLeft][!SetVariable TimerEnd "([MeasureNow:] + [MeasureStartLeft:])"][!SetVariable TimerState 1][!WriteKeyValue Variables TimerEnd "([MeasureNow:] + [MeasureStartLeft:])" "#StationeryFile#"][!WriteKeyValue Variables TimerState 1 "#StationeryFile#"][!CommandMeasure MeasureTicker "Execute 1"][!UpdateMeasureGroup Tick][!UpdateMeterGroup Face][!Redraw]
PauseAction=[!UpdateMeasure MeasureNow][!UpdateMeasure MeasureLeft][!SetVariable TimerLeft "(Max([MeasureLeft:0], 1))"][!SetVariable TimerState 2][!WriteKeyValue Variables TimerLeft "(Max([MeasureLeft:0], 1))" "#StationeryFile#"][!WriteKeyValue Variables TimerState 2 "#StationeryFile#"][!CommandMeasure MeasureTicker "Stop 1"][!UpdateMeasureGroup Tick][!UpdateMeterGroup Face][!Redraw]
ResetAction=[!SetVariable TimerState 0][!WriteKeyValue Variables TimerState 0 "#StationeryFile#"][!CommandMeasure MeasureTicker "Stop 1"][!UpdateMeasure MeasureNow][!UpdateMeasureGroup Tick][!UpdateMeterGroup Face][!Redraw]
DoneAction=[!CommandMeasure MeasureTicker "Stop 1"][!SetVariable TimerState 3][!WriteKeyValue Variables TimerState 3 "#StationeryFile#"][!UpdateMeterGroup Face][!Redraw]

; ---------------------------------------------------------------- measures

[MeasureStationeryFile]
; Deskset makes Stationery.inc at every launch, and !WriteKeyValue writes only into a file that exists: this makes it
; again (empty) if it was deleted since
Measure=Plugin
Plugin=RunCommand
Parameter=test -e "#StationeryFile#" || : > "#StationeryFile#"
UpdateDivider=-1

[MeasureNow]
; UTC seconds since 1601, so a daylight-saving change never moves a running timer
Measure=Time
TimeZone=0
DaylightSavingTime=0
TimeStamp=#TestNow#
UpdateDivider=-1
Group=Tick

[MeasureNowLocal]
; the Mac's wall clock, for the end time
Measure=Time
TimeStamp=#TestNow#
UpdateDivider=-1
Group=Tick

[MeasureStartLeft]
; what a start runs: the paused remainder, or the whole duration
Measure=Calc
Formula=(#TimerState# = 2) ? #TimerLeft# : #TimerMinutes# * 60
DynamicVariables=1
UpdateDivider=-1

[MeasureLeft]
; seconds left: to the stored end while running; the stored remainder while paused; all of it when ready; 0 when done
Measure=Calc
Formula=(#TimerState# = 1) ? Max(#TimerEnd# - MeasureNow, 0) : ((#TimerState# = 2) ? #TimerLeft# : ((#TimerState# = 3) ? 0 : #TimerMinutes# * 60))
DynamicVariables=1
UpdateDivider=-1
Group=Tick
; the chime first (only for a timer that ended within the last minute: one found long over after a quit or a sleep
; turns to Done quietly), then Done. Both are evaluated with the state read at the start of this update.
IfCondition=(#TimerState# = 1) && (MeasureLeft <= 0) && (#TimerSound# = 1) && (MeasureNow - #TimerEnd# <= 60)
IfTrueAction=[!CommandMeasure MeasureTicker "Execute 2"]
IfCondition2=(#TimerState# = 1) && (MeasureLeft <= 0)
IfTrueAction2=#DoneAction#

[MeasureLeftText]
; "25:00", "8:40", "1:12:40": H:MM:SS, without its leading "0:" or "0:0" below an hour
Measure=Uptime
SecondsValue=[MeasureLeft:]
Format=%3!i!:%2!02i!:%1!02i!
RegExpSubstitute=1
Substitute="^0:0?":""
DynamicVariables=1
UpdateDivider=-1
Group=Tick

[MeasureEndLocal]
; the end on the Mac's clock: running and done from the stored end, otherwise "if started now"
Measure=Calc
Formula=((#TimerState# = 1) || (#TimerState# = 3)) ? #TimerEnd# + (MeasureNowLocal - MeasureNow) : MeasureNowLocal + MeasureLeft
DynamicVariables=1
UpdateDivider=-1
Group=Tick

[MeasureEndText]
; "10:17", or "10:17 AM" with a 12-hour clock
Measure=Time
TimeStamp=[MeasureEndLocal:]
Format=[#CaptionTime[#Hours]]
FormatLocale=#Locale#
DynamicVariables=1
UpdateDivider=-1
Group=Tick

[MeasureArc]
; the ring shows what is left: Clamp(left ÷ duration × 360, 0.6, 359.4), so a dot stays at the last second and a
; full ring closes without a seam
Measure=Calc
Formula=Clamp(MeasureLeft / Max(#TimerMinutes# * 60, 1) * 360, 0.6, 359.4)
DynamicVariables=1
UpdateDivider=-1
Group=Tick

[MeasureArcLarge]
Measure=Calc
Formula=MeasureArc > 180
UpdateDivider=-1
Group=Tick

[MeasurePreset]
; which segment is selected: 1…4, or 0 for a duration that is no preset (no knob)
Measure=Calc
Formula=(#TimerMinutes# = #Preset1#) ? 1 : ((#TimerMinutes# = #Preset2#) ? 2 : ((#TimerMinutes# = #Preset3#) ? 3 : ((#TimerMinutes# = #Preset4#) ? 4 : 0)))
DynamicVariables=1
UpdateDivider=-1
Group=Tick

[MeasureTip]
; the card's sentence, built from "state|minutes|left|end"
Measure=String
String=#TimerState#|#TimerMinutes#|[MeasureLeftText]|[MeasureEndText]
RegExpSubstitute=1
Substitute="^0\|(\d+)\|([^|]*)\|(.*)$":"#TimerTipReady#","^1\|(\d+)\|([^|]*)\|(.*)$":"#TimerTipRunning#","^2\|(\d+)\|([^|]*)\|(.*)$":"#TimerTipPaused#","^3\|(\d+)\|([^|]*)\|(.*)$":"#TimerTipDone#"
DynamicVariables=1
UpdateDivider=-1
Group=Tick

[MeasureScroll]
; scrolling the card changes the minutes by one, only while the timer is stopped (ready or done)
Measure=Calc
Formula=#ScrollDelta#
DynamicVariables=1
UpdateDivider=-1
IfConditionMode=1
IfCondition=(MeasureScroll <> 0) && ((#TimerState# = 0) || (#TimerState# = 3))
IfTrueAction=[!SetVariable NewMinutes "(Clamp(#TimerMinutes# + [MeasureScroll:], 1, 1439))"][!UpdateMeasure MeasureNewMinutes]

[MeasureNewMinutes]
; Every change of minutes (a preset, a scroll step, "Minutes…") comes through here: 1 to 1439 is applied and resets
; the timer (more than 1439 becomes 1439); 0 or an empty entry is ignored. The value is read back as
; [MeasureNewMinutes:0], never as [#NewMinutes]: a variable in an action is resolved when the action is read.
Measure=Calc
Formula=Clamp(Round(0#NewMinutes#), 0, 1439)
DynamicVariables=1
UpdateDivider=-1
IfConditionMode=1
IfCondition=MeasureNewMinutes >= 1
IfTrueAction=[!SetVariable TimerMinutes "[MeasureNewMinutes:0]"][!WriteKeyValue Variables TimerMinutes "[MeasureNewMinutes:0]" "#StationeryFile#"]#ResetAction#

[MeasureTicker]
; 1: once a second while running (drift-free: each wait counts from the previous step's scheduled time; 86,400
; repeats outlast the longest timer, 1439 minutes). 2: the chime, three times
Measure=Plugin
Plugin=ActionTimer
ActionList1=Repeat Tick, 1000, 86400
Tick=[!UpdateMeasureGroup Tick][!UpdateMeterGroup Face][!Redraw]
ActionList2=Chime | Wait 1500 | Chime | Wait 1500 | Chime
Chime=[Play "/System/Library/Sounds/Glass.aiff"]
IgnoreWarnings=1

[MeasureInput]
; "Minutes…": a field over the time line. Its fill is opaque: today's input box fades its text with its fill's alpha
Measure=Plugin
Plugin=InputText
X=47
Y=106
W=76
H=26
FontFace=#FontNumber#
FontSize=16.5
FontColor=#InkRGB#
SolidColor=#FieldColor#
StringAlign=Center
InputNumber=1
InputLimit=4
DefaultValue=#TimerMinutes#
FocusDismiss=1
Command1=[!SetVariable NewMinutes "$UserInput$"][!UpdateMeasure MeasureNewMinutes]
DynamicVariables=1

; ---------------------------------------------------------------- meters

[MeterCard]
; a tool: the card itself does nothing on click; it scrolls the minutes while the timer is stopped
Meter=Shape
MeterStyle=sCard
MouseScrollUpAction=[!SetVariable ScrollDelta 1][!UpdateMeasure MeasureScroll]
MouseScrollDownAction=[!SetVariable ScrollDelta -1][!UpdateMeasure MeasureScroll]
ToolTipTitle=#TimerTitle#
ToolTipText=[MeasureTip]
UpdateDivider=-1
Group=Face

[MeterRing]
; Ring L: box 86 at (42, 16), centre (85, 59), radius 39, stroke 8. The arc is the time left, from 12 o'clock
Meter=Shape
X=42
Y=16
Shape=Ellipse 43,43,39 | Fill Color 0,0,0,0 | StrokeWidth 8 | Stroke Color #TimerColor#,#TrackAlpha#
Shape2=Arc 43,4,(43 + 39 * Sin(Rad([MeasureArc:]))),(43 - 39 * Cos(Rad([MeasureArc:]))),39,39,0,0,[MeasureArcLarge:] | Fill Color 0,0,0,0 | StrokeWidth 8 | Stroke Color [#ArcColor[#TimerState]] | StrokeStartCap Round | StrokeEndCap Round
DynamicVariables=1
UpdateDivider=-1
Group=Face

[MeterButtonPad]
; the ring's inner disc in HoverColor under the pointer. No pressed pad: Deskset starts no window drag where a
; LeftMouseDownAction is set, and the ring is the middle of the card
Meter=Shape
X=42
Y=16
Shape=Ellipse 43,43,35 | Fill Color #HoverColor# | StrokeWidth 0
Hidden=1
UpdateDivider=-1

[MeterPlay]
; the play glyph of the full transport set (22 pt semibold, 21 × 24), 1.5 pt right of the centre for the triangle's
; weight
Meter=Image
ImageName=sf:play.fill
MacSymbolSize=22
MacSymbolWeight=Semibold
ImageTint=#TextColor#
X=76
Y=47
W=21
H=24
Hidden=(#TimerState# = 1)
DynamicVariables=1
UpdateDivider=-1
Group=Face

[MeterPause]
; 20 × 23, centred on (85, 59)
Meter=Image
ImageName=sf:pause.fill
MacSymbolSize=22
MacSymbolWeight=Semibold
ImageTint=#TextColor#
X=75
Y=47.5
W=20
H=23
Hidden=(#TimerState# <> 1)
DynamicVariables=1
UpdateDivider=-1
Group=Face

[MeterStartHit]
; the button: the whole ring, Ø 86 (a shape takes clicks on its solid parts; alpha 1 is solid and invisible). The click
; is the mouse-up, so a drag that starts on the ring moves the card and starts nothing
Meter=Shape
X=42
Y=16
Shape=Ellipse 43,43,43 | Fill Color 0,0,0,1 | StrokeWidth 0
Hidden=(#TimerState# = 1)
MouseOverAction=[!ShowMeter MeterButtonPad][!Redraw]
MouseLeaveAction=[!HideMeter MeterButtonPad][!Redraw]
LeftMouseUpAction=#StartAction#
ToolTipText=[#TimerTipStart[#TimerState]]
DynamicVariables=1
UpdateDivider=-1
Group=Face

[MeterPauseHit]
Meter=Shape
X=42
Y=16
Shape=Ellipse 43,43,43 | Fill Color 0,0,0,1 | StrokeWidth 0
Hidden=(#TimerState# <> 1)
MouseOverAction=[!ShowMeter MeterButtonPad][!Redraw]
MouseLeaveAction=[!HideMeter MeterButtonPad][!Redraw]
LeftMouseUpAction=#PauseAction#
ToolTipText=#TimerTipPause#
DynamicVariables=1
UpdateDivider=-1
Group=Face

[MeterTime]
; 22 pt, centred under the ring on baseline 125: "25:00", "8:40", "1:12:40" ("23:59:00" is 98 wide at most); dimmed
; while paused; "Done" in SF Pro
Meter=String
MeterStyle=sMetricM
MeasureName=MeasureLeftText
Text=[#TimeText[#TimerState]]
FontColor=[#TimeInk[#TimerState]]
StringAlign=Center
X=85
Y=(125 - #Ascent22#)
InlineSetting7=Face | #FontText#
InlinePattern7=(\p{L}+)
DynamicVariables=1
UpdateDivider=-1
Group=Face

; ---- the bottom band (y 132 → 154, labels on 146.9): the presets when stopped, the end while running, Reset while
; paused

[MeterSegTrack]
; a segmented control: track 138 × 22; knob 33.5 × 18, inset 2
Meter=Shape
X=16
Y=132
Shape=Rectangle 0,0,138,22,11 | Fill Color #ControlFillColor# | StrokeWidth 0
Hidden=((#TimerState# = 1) || (#TimerState# = 2))
DynamicVariables=1
UpdateDivider=-1
Group=Face

[MeterSegKnob]
; the selected preset; none for a duration that is no preset
Meter=Shape
X=(18 + 33.5 * (Max([MeasurePreset:], 1) - 1))
Y=134
Shape=Rectangle 0,0,33.5,18,9 | Fill Color #KnobColor# | StrokeWidth 0
Hidden=(([MeasurePreset:] = 0) || (#TimerState# = 1) || (#TimerState# = 2))
DynamicVariables=1
UpdateDivider=-1
Group=Face

[sSegment]
; each label is its own hit box, 33.5 × 28 (y 129 → 157: the 22 pt track and 3 above and below); baseline 146.9
StringAlign=Center
Y=129
W=33.5
H=17.73
Padding=0,7.27,0,3
SolidColor=0,0,0,1
Hidden=((#TimerState# = 1) || (#TimerState# = 2))
DynamicVariables=1
UpdateDivider=-1
Group=Face

[MeterSeg1]
Meter=String
MeterStyle=sLabel | sSegment
X=34.75
Text=#Preset1#
FontColor=#InkRGB#,([MeasurePreset:] = 1 ? #SegmentOnAlpha# : #SegmentOffAlpha#)
LeftMouseUpAction=[!SetVariable NewMinutes #Preset1#][!UpdateMeasure MeasureNewMinutes]
ToolTipText=#Preset1##TimerMinutesUnit#

[MeterSeg2]
Meter=String
MeterStyle=sLabel | sSegment
X=68.25
Text=#Preset2#
FontColor=#InkRGB#,([MeasurePreset:] = 2 ? #SegmentOnAlpha# : #SegmentOffAlpha#)
LeftMouseUpAction=[!SetVariable NewMinutes #Preset2#][!UpdateMeasure MeasureNewMinutes]
ToolTipText=#Preset2##TimerMinutesUnit#

[MeterSeg3]
Meter=String
MeterStyle=sLabel | sSegment
X=101.75
Text=#Preset3#
FontColor=#InkRGB#,([MeasurePreset:] = 3 ? #SegmentOnAlpha# : #SegmentOffAlpha#)
LeftMouseUpAction=[!SetVariable NewMinutes #Preset3#][!UpdateMeasure MeasureNewMinutes]
ToolTipText=#Preset3##TimerMinutesUnit#

[MeterSeg4]
Meter=String
MeterStyle=sLabel | sSegment
X=135.25
Text=#Preset4#
FontColor=#InkRGB#,([MeasurePreset:] = 4 ? #SegmentOnAlpha# : #SegmentOffAlpha#)
LeftMouseUpAction=[!SetVariable NewMinutes #Preset4#][!UpdateMeasure MeasureNewMinutes]
ToolTipText=#Preset4##TimerMinutesUnit#

[MeterEnds]
; while running: "Ends at 10:17", on the band's label line (baseline 146.9)
Meter=String
MeterStyle=sCaption
MeasureName=MeasureEndText
Text=#TimerEndsAt#
StringAlign=Center
X=85
Y=(146.9 - #Ascent11#)
Hidden=(#TimerState# <> 1)
DynamicVariables=1
UpdateDivider=-1
Group=Face

[MeterResetPad]
; while paused: a capsule button, 64 × 22
Meter=Shape
X=53
Y=132
Shape=Rectangle 0,0,64,22,11 | Fill Color #ControlFillColor# | StrokeWidth 0
Hidden=(#TimerState# <> 2)
DynamicVariables=1
UpdateDivider=-1
Group=Face

[MeterResetHover]
Meter=Shape
X=53
Y=132
Shape=Rectangle 0,0,64,22,11 | Fill Color #HoverColor# | StrokeWidth 0
Hidden=1
UpdateDivider=-1

[MeterReset]
; the label, and the hit box 64 × 28 (y 129 → 157)
Meter=String
MeterStyle=sLabel
Text=#TimerReset#
FontColor=#TextColor#
StringAlign=Center
X=85
Y=129
W=64
H=17.73
Padding=0,7.27,0,3
SolidColor=0,0,0,1
Hidden=(#TimerState# <> 2)
MouseOverAction=[!ShowMeter MeterResetHover][!Redraw]
MouseLeaveAction=[!HideMeter MeterResetHover][!Redraw]
LeftMouseUpAction=[!HideMeter MeterResetHover]#ResetAction#
ToolTipText=#TimerTipReset#
DynamicVariables=1
UpdateDivider=-1
Group=Face
