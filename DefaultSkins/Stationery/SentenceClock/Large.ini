; Stationery · Sentence Clock, large (360 × 360): the time written as a sentence. The words that say it are lit inside
; a justified block of 33 dim words; a footer gives the exact time and the date. Only the words' alphas change from
; minute to minute; the layout never moves. Original work, MIT licensed.

[Rainmeter]
Update=1000
DefaultUpdateDivider=-1
AccurateText=1
SkinWidth=360
SkinHeight=360
DynamicWindowSize=0
; the suite, and the suite settings it shows (a setting refreshes only its own group)
Group=Stationery | StationeryTime | StationeryInk
; the window's own look, once Deskset reads it (until then it is macOS's)
MacAppearance=#LookAppearance#
ContextTitle=#SentenceMenuOpen#
ContextAction=#OpenAction#
ContextTitle2=---
ContextTitle3=[#SentenceMenuCard[#SentenceCard]]
ContextAction3=[!WriteKeyValue Variables SentenceCard [#SentenceCardNext[#SentenceCard]] "#@#Variables.inc"][!Refresh]
ContextTitle4=[#SentenceMenuGrid[#SentenceGrid]]
ContextAction4=[!WriteKeyValue Variables SentenceGrid "(1 - #SentenceGrid#)" "#@#Variables.inc"][!Refresh]
ContextTitle5=[#SentenceMenuGlow[#SentenceGlow]]
ContextAction5=[!WriteKeyValue Variables SentenceGlow "(1 - #SentenceGlow#)" "#@#Variables.inc"][!Refresh]
ContextTitle6=[#SentenceMenuTime[#SentenceShowTime]]
ContextAction6=[!WriteKeyValue Variables SentenceShowTime "(1 - #SentenceShowTime#)" "#@#Variables.inc"][!Refresh]
ContextTitle7=#MenuClockTitle#
ContextAction7=#MenuClockAction#
ContextTitle8=---
; Look, Cards and Language on the card; Ink and Language without it (Card-Glass.inc, Card-Frameless.inc)
ContextTitle9=#SentenceSuiteTitle1#
ContextAction9=#SentenceSuiteAction1#
ContextTitle10=#SentenceSuiteTitle2#
ContextAction10=#SentenceSuiteAction2#
ContextTitle11=#SentenceSuiteTitle3#
ContextAction11=#SentenceSuiteAction3#

[Metadata]
Name=Sentence Clock
Author=Deskset
License=MIT
Version=1.0
Information=Stationery · The time as a sentence: the words that say it are lit, the rest stay dim, and the footer gives the exact time and the date. Right-click to set it straight on the wallpaper, make the unlit words easier to read, or hide the footer's time.

[Variables]
@Include=#@#Variables.inc
@Include2=#@#Suite/Tokens.inc
@Include3=#@#Suite/Styles.inc
@Include4=#@#SentenceClock/Theme-#LookTheme#.inc
@Include5=#@#SentenceClock/Card-#SentenceCard#.inc
CardW=360
CardH=360
OpenAction=["/System/Applications/Clock.app"]
SentenceCardNextGlass=Frameless
SentenceCardNextFrameless=Glass
; the unlit words' alpha at rest (Subtle or Visible), and the one they are drawn with now (the pointer raises it)
OffRest=(#OffSubtle# + (#OffVisible# - #OffSubtle#) * #SentenceGrid#)
OffNow=#OffRest#
; the word files (English only: Chinese and Japanese need a grid of their own, not a word file)
SentenceWords=English

; ================================================================ styles

[sWord]
; 19 pt SF Pro Semibold capitals, 1.4 pt apart (the piece's display size). Padding gives the glow room: a text shadow
; is clipped to the meter frame, Padding included
FontFace=#FontText#
FontWeight=600
FontSize=14.25
AntiAlias=1
StringAlign=Left
Padding=14,12,14,12
InlineSetting=CharacterSpacing | 0 | 1.4
InlineSetting2=[#[#WordShadow]]
DynamicVariables=1
UpdateDivider=-1
Group=Words

[sFooter]
; the footer's lines: sMono (10 pt SF Mono capitals, 1.2 pt apart) with the frameless shadow in slot 7; the padding
; holds it (blur 4 + offset 1)
Padding=5,5,5,5
InlineSetting7=[#[#FootShadow]]
DynamicVariables=1
UpdateDivider=-1
Group=Footer

; ================================================================ the card

[MeterCard]
Meter=Shape
MeterStyle=sCard
ToolTipText=[MeasureSentence]#CRLF#[MeasureClock] · [MeasureDateFull]
Group=Words
UpdateDivider=-1

; ================================================================ time

[MeasureNow]
; seconds since 1601 on the Mac's clock, so % 86400 is the local time of day (daylight saving included)
Measure=Time
TimeStamp=#TestNow#
UpdateDivider=1

[MeasureMinute]
Measure=Calc
Formula=Floor((MeasureNow % 86400) / 60)
UpdateDivider=1
OnChangeAction=[!UpdateMeasureGroup Sentence][!UpdateMeasureGroup Footer][!UpdateMeterGroup Words][!UpdateMeterGroup Footer][!Redraw]

[MeasureRem]
; 0 on a five-minute mark, 1–2 "just after", 3–4 "nearly"
Measure=Calc
Formula=MeasureMinute % 5
Group=Sentence
UpdateDivider=-1

[MeasureRound5]
Measure=Calc
Formula=(Round(MeasureMinute / 5) * 5) % 1440
Group=Sentence
UpdateDivider=-1

[MeasureSlot]
; 0 o'clock, 1–6 past, 7–11 to
Measure=Calc
Formula=Floor((MeasureRound5 % 60) / 5)
Group=Sentence
UpdateDivider=-1

[MeasureHour]
; the hour the sentence names, 0–23: from :35 on it is the next hour (23:35 → 0, midnight)
Measure=Calc
Formula=Floor(((MeasureRound5 + 25) % 1440) / 60)
Group=Sentence
UpdateDivider=-1

[MeasureDist]
; five-minute steps from the named hour: 1 five, 2 ten, 3 a quarter, 4 twenty, 5 twenty five, 6 half. The words
; come right after it, so their Lit measures follow the ones they read
Measure=Calc
Formula=(MeasureSlot <= 6) ? MeasureSlot : (12 - MeasureSlot)
Group=Sentence
UpdateDivider=-1
@Include=#@#SentenceClock/Words-#SentenceWords#.inc

; ================================================================ the pointer over the words

[MeterHit]
; over the words, the dim grid comes up so it can all be read; the lit sentence stays clearly brighter. No animation
Meter=Shape
Shape=Rectangle 0,0,360,302 | Fill Color 0,0,0,1 | StrokeWidth 0
MouseOverAction=[!SetVariable OffNow "#OffHover#"][!UpdateMeterGroup Words][!Redraw]
MouseLeaveAction=[!SetVariable OffNow "#OffRest#"][!UpdateMeterGroup Words][!Redraw]
ToolTipText=[MeasureSentence]#CRLF#[MeasureClock] · [MeasureDateFull]
DynamicVariables=1
Group=Words
UpdateDivider=-1

; ================================================================ footer

[MeterRule]
; a 0.75 pt hairline at y 309.5, 308 wide; the halo bands under it are there only without the card
Meter=Shape
X=21
Y=304
Shape=Rectangle 2.5,3,313,5.75,2.875 | Fill Color #HaloRGB#,[#[#RuleHaloOuter]] | StrokeWidth 0
Shape2=Rectangle 3.8,4.3,310.4,3.15,1.575 | Fill Color #HaloRGB#,[#[#RuleHaloInner]] | StrokeWidth 0
Shape3=Rectangle 5,5.5,308,0.75 | Fill Color #InkRGB#,#RuleA# | StrokeWidth 0
DynamicVariables=1
UpdateDivider=-1
Group=Rule

[MeasureClock]
; "10:09", or "10:09 AM" in 12-hour time
Measure=Time
TimeStamp=#TestNow#
Format=[#CaptionTime[#Hours]]
FormatLocale=#Locale#
Group=Footer
UpdateDivider=-1

[MeasureDate]
; "Saturday, September 26" (capitals from the style)
Measure=Time
TimeStamp=#TestNow#
Format=#DateFormatLong#
FormatLocale=#Locale#
Group=Footer
UpdateDivider=-1

[MeasureDateFull]
Measure=Time
TimeStamp=#TestNow#
Format=#DateFormatFull#
FormatLocale=#Locale#
Group=Footer
UpdateDivider=-1

[MeterTime]
; on the footer's baseline, 334 (26 from the bottom, as the side margins)
Meter=String
MeterStyle=sMono | sFooter
MeasureName=MeasureClock
FontColor=#InkRGB#,[#[#FootTimeAlpha]]
X=(26 - 5)
Y=(334 - #Ascent10# - 5)
Hidden=(1 - #SentenceShowTime#)
LeftMouseUpAction=["/System/Applications/Clock.app"]

[MeterDate]
; right-aligned; the 1.2 after the last letter is made up, so the date ends at 334, on the words' right edge
Meter=String
MeterStyle=sMono | sFooter
MeasureName=MeasureDate
FontColor=#InkRGB#,[#[#FootDateAlpha]]
StringAlign=Right
X=(334 + 1.2 + 5)
Y=(334 - #Ascent10# - 5)
LeftMouseUpAction=["/System/Applications/Calendar.app"]
