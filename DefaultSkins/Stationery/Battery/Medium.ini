; Stationery · Battery, medium (360 × 170): the Small's ring on the left; the battery's health, cycles, temperature,
; power flow and adapter on the right. Original work, MIT licensed.

[Rainmeter]
Update=1000
AccurateText=1
SkinWidth=360
SkinHeight=170
DynamicWindowSize=0
; the suite, and the suite settings it shows (a setting refreshes only its own group)
Group=Stationery | StationeryTemp
; the window's own look, once Deskset reads it (until then it is macOS's)
MacAppearance=#LookAppearance#
ContextTitle=#BatteryOpenTitle#
ContextAction=#OpenAction#
ContextTitle2=---
ContextTitle3=#MenuTempTitle#
ContextAction3=#MenuTempAction#
ContextTitle4=---
ContextTitle5=#MenuLookTitle#
ContextAction5=#MenuLookAction#
ContextTitle6=#MenuCardsTitle#
ContextAction6=#MenuCardsAction#
ContextTitle7=#MenuLanguageTitle#
ContextAction7=#MenuLanguageAction#

[Metadata]
Name=Battery
Author=Deskset
License=MIT
Version=1.0
Information=Stationery · Your Mac's battery: charge, charging state and time left, with its health, cycles, temperature, power flow and adapter. Click to open Battery settings. Needs no permission.

[Variables]
@Include=#@#Battery/Settings.inc
@Include2=#@#Variables.inc
@Include3=#@#Suite/Tokens.inc
@Include4=#@#Suite/Styles.inc
@Include5=#@#Battery/Strings-#Language#.inc
@Include6=#@#Battery/Source-#BatterySource#.inc
@Include7=#@#Battery/Measures.inc
@Include8=#@#Battery/Sensors-#BatterySource#.inc
CardW=360
CardH=170
; Battery on a laptop, Energy on a desktop Mac: one pane
OpenAction=["x-apple.systempreferences:com.apple.Battery-Settings.extension"]

[MeterCard]
Meter=Shape
MeterStyle=sCard
ToolTipText=[MeasureSentence]
UpdateDivider=10
@Include=#@#Battery/Hero.inc
@Include2=#@#Battery/Details.inc

; ---------------------------------------------------------------- a Mac without a battery: a Notice
[MeterNoticeSymbol]
; desktopcomputer 20 pt, natural 29 × 23, at the Notice's place under the top band
Meter=Image
MeterStyle=sNoticeSymbol
ImageName=sf:desktopcomputer
X=16
Y=#ContentTop#
W=29
H=23
Hidden=1
UpdateDivider=-1
Group=Notice

[MeterNoticeTitle]
Meter=String
MeterStyle=sBodyStrong | sNoticeTitle
Text=#BatteryNoBattery#
Hidden=1
UpdateDivider=-1
Group=Notice

[MeterNoticeBody]
Meter=String
MeterStyle=sCaption | sNoticeBody
Text=#BatteryNoBatteryBody#
Hidden=1
UpdateDivider=-1
Group=Notice
