; Stationery · Battery, small (170 × 170): the charge as a ring around the Mac, and what the battery is doing.
; Original work, MIT licensed.

[Rainmeter]
Update=1000
AccurateText=1
SkinWidth=170
SkinHeight=170
DynamicWindowSize=0
Group=Stationery
; the window's own look, once Deskset reads it (until then it is macOS's)
MacAppearance=#LookAppearance#
ContextTitle=#BatteryOpenTitle#
ContextAction=#OpenAction#
ContextTitle2=---
ContextTitle3=#MenuLookTitle#
ContextAction3=#MenuLookAction#
ContextTitle4=#MenuCardsTitle#
ContextAction4=#MenuCardsAction#

[Metadata]
Name=Battery
Author=Deskset
License=MIT
Version=1.0
Information=Stationery · Your Mac's battery: charge, charging state and time left. Click to open Battery settings. Needs no permission.

[Variables]
@Include=#@#Battery/Settings.inc
@Include2=#@#Variables.inc
@Include3=#@#Suite/Tokens.inc
@Include4=#@#Suite/Styles.inc
@Include5=#@#Battery/Strings-#Language#.inc
@Include6=#@#Battery/Source-#BatterySource#.inc
@Include7=#@#Battery/Measures.inc
CardW=170
CardH=170
; Battery on a laptop, Energy on a desktop Mac: one pane
OpenAction=["x-apple.systempreferences:com.apple.Battery-Settings.extension"]

[MeterCard]
Meter=Shape
MeterStyle=sCard
ToolTipText=[MeasureSentence]
UpdateDivider=10
@Include=#@#Battery/Hero.inc

; ---------------------------------------------------------------- a Mac without a battery: a Notice
[MeterNoticeSymbol]
; desktopcomputer 20 pt, natural 29 × 23, centred on (85, 48)
Meter=Image
MeterStyle=sNoticeSymbol
ImageName=sf:desktopcomputer
X=70.5
Y=36.5
W=29
H=23
Hidden=1
UpdateDivider=-1
Group=Notice

[MeterNoticeTitle]
Meter=String
MeterStyle=sBodyStrong | sNoticeTitleSmall
Text=#BatteryNoBattery#
Hidden=1
UpdateDivider=-1
Group=Notice

[MeterNoticeBody]
Meter=String
MeterStyle=sCaption | sNoticeBodySmall
Text=#BatteryNoBatteryBody#
Hidden=1
UpdateDivider=-1
Group=Notice
