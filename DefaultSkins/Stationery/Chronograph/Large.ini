[MeterWxArc]
; 270°, open at the bottom, from today's low to today's high on the suite's temperature scale. A stroke gradient spans
; the shape's bounds grown by half the stroke (x 100 ± 34.8); the arc's ends sit at ± 23.3, so its stops are at 0.16
; and 0.84
