; Stationery · Chronograph, large (a 360 pt disc): a three-register watch. Hour and minute hands; the weather at 9
; o'clock (today's low to high as an arc, a dot at the temperature now), the battery as a power reserve at 3 (or the
; CPU on a Mac without a battery), running seconds at 6, and a date window under 12. Original work, MIT licensed.
;
; The watch is an object: its plate, steel and register inks are its own (@Resources/Chronograph/Theme-*.inc). Its
; type, colours, dates, settings and place are the suite's. The registers and the date window are dark in both looks,
; so their colours are the system colours' Dark values. Angles are clock angles (0° at 12, clockwise); a point at
; radius r and angle a from a centre (cx, cy) is (cx + r·sin a, cy − r·cos a). The dial's centre is (180, 180).

[Rainmeter]
Update=1000
DefaultUpdateDivider=1
AccurateText=1
SkinWidth=360
SkinHeight=360
DynamicWindowSize=0
; the suite, and the suite settings it shows (a setting refreshes only its own group)
Group=Stationery | StationeryTime | StationeryTemp | StationeryPlace
; the window's own look, once Deskset reads it (until then it is macOS's)
MacAppearance=#LookAppearance#
ContextTitle=#ChronoMenuOpen#
ContextAction=#OpenAction#
ContextTitle2=---
ContextTitle3=[#ChronoMenuDial[#ChronoRightDial]]
ContextAction3=[!WriteKeyValue Variables ChronoRightDial [#ChronoDialNext[#ChronoRightDial]] "#@#Variables.inc"][!Refresh]
ContextTitle4=[#ChronoMenuSeconds[#ChronoSeconds]]
ContextAction4=[!WriteKeyValue Variables ChronoSeconds "(1 - #ChronoSeconds#)" "#@#Variables.inc"][!Refresh]
ContextTitle5=#ChronoMenuDialText#
ContextAction5=[!CommandMeasure MeasureDialTextInput "ExecuteBatch 1"]
ContextTitle6=[#ChronoMenuCity[#PlaceState]]
ContextAction6=[!CommandMeasure MeasureCityInput "ExecuteBatch 1"]
ContextTitle7=#MenuTempTitle#
ContextAction7=#MenuTempAction#
ContextTitle8=---
ContextTitle9=#MenuLookTitle#
ContextAction9=#MenuLookAction#
ContextTitle10=#MenuCardsTitle#
ContextAction10=#MenuCardsAction#
ContextTitle11=#MenuLanguageTitle#
ContextAction11=#MenuLanguageAction#

[Metadata]
Name=Chronograph
Author=Deskset
License=MIT
Version=1.0
Information=Stationery · A three-register watch: the weather at 9 (today's low to high, the dot at now), the battery as a power reserve at 3 (the CPU on a Mac without a battery), running seconds at 6 and the date under 12. The weather is for the suite's place; based on data from MET Norway. Right-click for the right dial, the running seconds, the dial's text and the city.

[Variables]
@Include=#@#Variables.inc
@Include2=#@#Suite/Tokens.inc
@Include3=#@#Suite/Styles.inc
@Include4=#@#Chronograph/Theme-#LookTheme#.inc
; the wordmark under the date window; Dial Text… keeps what the user types in Stationery.inc (read after this line)
ChronoDialText=#ChronoDialTextDefault#
@Include5=#StationeryFile#
CardW=360
CardH=360
OpenAction=["/System/Applications/Clock.app"]
ChronoDialNext0=1
ChronoDialNext1=2
ChronoDialNext2=0
; the plate is solid with "Cards: Solid" (and with a look chosen by hand, as the suite's cards are)
ChronoSolid=[#CardsSolid[#Look]]
PlateCenter=[#PlateCenter[#ChronoSolid]]
PlateEdge=[#PlateEdge[#ChronoSolid]]
; ---------------------------------------------------------------- colours on the dark registers and window
; macOS 26's system colours, Dark values in both looks: the second hand and the cap (Orange), the reserve (Green, Red
; at 20 % or less, the CPU's Blue), the weekday in the date window (the text-safe accent's Dark value)
ChronoOrange=255,146,48
ChronoGreen=48,209,88
ChronoRed=255,66,69
ChronoBlue=0,145,255
ChronoWeekday=145,198,255
RegInk=255,255,255,240
RegInk2=255,255,255,150
RegInk3=255,255,255,100
RegScale=255,255,255,90
DateText=255,255,255,240
; ---------------------------------------------------------------- state (the skin sets these)
ReserveColor=#ChronoGreen#
; the weather register's texts and arc: values, or "--" without a forecast
WxTempText=%1°
WxLowText=L%1°
WxHighText=H%1°
; their size in FontSize units (CalcWxLowHighChars sets them)
WxLowHighSize=6
WxLetterSize=5.25
WxTempColor=#RegInk#
WxArc=WxGradient
WxSymbolTint=255,255,255,255
; today's low and high on the suite's temperature scale, and the Mac's accent without its alpha (the measures below
; set them; these are the values until they have)
WxLowRGB=120,220,140
WxHighRGB=250,210,90
AccentRGB=0,122,255
; 0 while the weather's place is looked up (at most 2 s), 1 with a place, 2 without one
PlaceState=0
; the city and dial-text fields
CityFieldX=100
CityFieldY=168
CityFieldW=160
; ---------------------------------------------------------------- screenshots only (never set in a released file)
; a battery level (0–100) and a charging state (0 on battery, 1 charging, 2 plugged in) instead of this Mac's; -1: the Mac's
TestBattery=-1
TestCharging=-1

; ================================================================ gradients and styles

[sPlate]
PlateGradient=0,-30,0,0,200,200 | #PlateCenter# ; 0 | #PlateEdge# ; 1
Crystal=270 | #CrystalTop# ; 0 | #CrystalBottom# ; 1
SteelRim=270 | #RimTop# ; 0 | #RimBottom# ; 1

[sRegisterText]
; dial print on the registers: SF Pro Rounded, centred on X / Y
FontFace=#FontNumber#
FontWeight=600
FontColor=#RegInk2#
StringAlign=CenterCenter
AntiAlias=1
InlineSetting=Typography | tnum
UpdateDivider=-1

[sHoverRing]
Hidden=1
UpdateDivider=-1
DynamicVariables=1

[sRegisterHit]
; a hit area over a register or the date window: its invisible fill (alpha 1) still catches the mouse
DynamicVariables=1

; ================================================================ time

[MeasureTime]
; seconds since 1601 on the Mac's clock: % 43200 is the 12-hour position
Measure=Time
TimeStamp=#TestNow#

[CalcHourAngle]
Measure=Calc
Formula=(MeasureTime % 43200) / 120

[CalcMinuteAngle]
Measure=Calc
Formula=(MeasureTime % 3600) / 10

[CalcSecondAngle]
; ticks once a second
Measure=Calc
Formula=Floor(MeasureTime % 60) * 6

[MeasureClockSeconds]
; "10:09:08" (or "10:09:08 AM"), for the tooltips
Measure=Time
TimeStamp=#TestNow#
Format=[#ChronoTimeSeconds[#Hours]]
FormatLocale=#Locale#

[MeasureWeekday]
; "SAT" (capitals from the meter)
Measure=Time
TimeStamp=#TestNow#
Format=%a
FormatLocale=#Locale#
UpdateDivider=60

[MeasureDay]
Measure=Time
TimeStamp=#TestNow#
Format=%#d
UpdateDivider=60

[MeasureDateFull]
Measure=Time
TimeStamp=#TestNow#
Format=#DateFormatFull#
FormatLocale=#Locale#
UpdateDivider=60

[MeasureWeekNumber]
; the ISO week without its leading zero
Measure=Time
TimeStamp=#TestNow#
Format=%V
RegExpSubstitute=1
Substitute="^0":""
UpdateDivider=60

; ================================================================ the power reserve (or the CPU)

[MeasureBattery]
Measure=Plugin
Plugin=PowerPlugin
PowerState=Percent
UpdateDivider=10

[MeasureBattStatus]
; 0 no battery, 1 charging, 2 critical, 3 low, 4 normal
Measure=Plugin
Plugin=PowerPlugin
PowerState=Status
UpdateDivider=10

[MeasureACLine]
Measure=Plugin
Plugin=PowerPlugin
PowerState=ACLine
UpdateDivider=10

[MeasureBattLife]
; seconds left on battery; -1 while unknown and on power
Measure=Plugin
Plugin=PowerPlugin
PowerState=Lifetime
UpdateDivider=10

[MeasureBattLifeMinutes]
Measure=Calc
Formula=Round(Max(MeasureBattLife, 0) / 60)
UpdateDivider=10

[MeasureBattLifeH]
Measure=Calc
Formula=Floor(MeasureBattLifeMinutes / 60)
UpdateDivider=10

[MeasureBattLifeM]
Measure=Calc
Formula=MeasureBattLifeMinutes % 60
UpdateDivider=10

[MeasureBattLifeText]
; "2 h 41 min"
Measure=String
String=[MeasureBattLifeH:0] #UnitHour# [MeasureBattLifeM:0] #UnitMinute#
RegExpSubstitute=1
Substitute="^0 #UnitHour# ":""," 0 #UnitMinute#$":""
DynamicVariables=1
UpdateDivider=10

[MeasureCPU]
Measure=CPU
Processor=0
UpdateDivider=10

[CalcReserveIsCPU]
; the CPU with "Right Dial: CPU", or automatically on a Mac without a battery (a 100 % gauge would mislead)
Measure=Calc
Formula=(#ChronoRightDial# = 2) || ((#ChronoRightDial# = 0) && (MeasureBattStatus = 0) && (#TestBattery# < 0))
UpdateDivider=10
IfCondition=CalcReserveIsCPU = 1
IfTrueAction=[!SetOption MeterReserveHit LeftMouseUpAction """["/System/Applications/Utilities/Activity Monitor.app"]"""]
IfFalseAction=[!SetOption MeterReserveHit LeftMouseUpAction """["x-apple.systempreferences:com.apple.Battery-Settings.extension"]"""]

[MeasureCharging]
; 0 on battery, 1 charging, 2 plugged in but not charging (held at a limit)
Measure=Calc
Formula=(#TestCharging# >= 0) ? #TestCharging# : ((MeasureBattStatus = 1) ? 1 : ((MeasureACLine = 1) ? 2 : 0))
UpdateDivider=10

[CalcReserveValue]
Measure=Calc
Formula=CalcReserveIsCPU ? MeasureCPU : ((#TestBattery# >= 0) ? #TestBattery# : MeasureBattery)
MinValue=0
MaxValue=100
UpdateDivider=10
; the battery reads as everywhere in the suite: green, red at 20 % or less; the CPU is the CPU's blue
IfCondition=CalcReserveIsCPU = 1
IfTrueAction=[!SetVariable ReserveColor "#ChronoBlue#"][!UpdateMeter MeterReserveArc][!UpdateMeter MeterReserveIcon][!Redraw]
IfCondition2=(CalcReserveIsCPU = 0) && (CalcReserveValue <= 20)
IfTrueAction2=[!SetVariable ReserveColor "#ChronoRed#"][!UpdateMeter MeterReserveArc][!UpdateMeter MeterReserveIcon][!Redraw]
IfCondition3=(CalcReserveIsCPU = 0) && (CalcReserveValue > 20)
IfTrueAction3=[!SetVariable ReserveColor "#ChronoGreen#"][!UpdateMeter MeterReserveArc][!UpdateMeter MeterReserveIcon][!Redraw]
IfCondition4=CalcReserveValue < 0.5
IfTrueAction4=[!HideMeter MeterReserveArc]
IfFalseAction4=[!ShowMeter MeterReserveArc]

[CalcReserveAngle]
; −135° at 0, +135° at 100
Measure=Calc
Formula=-135 + 270 * Clamp(CalcReserveValue, 0, 100) / 100
UpdateDivider=10

[CalcReserveLarge]
Measure=Calc
Formula=(CalcReserveValue > 66.67) ? 1 : 0
UpdateDivider=10

[CalcReserveIcon]
; 0 no icon (on battery), 1 charging, 2 plugged in, 3 CPU
Measure=Calc
Formula=CalcReserveIsCPU ? 3 : MeasureCharging
UpdateDivider=10
IfCondition=CalcReserveIcon = 0
IfTrueAction=[!HideMeter MeterReserveIcon][!SetOption MeterReservePct X 260][!UpdateMeter MeterReservePct]
IfCondition2=CalcReserveIcon = 1
IfTrueAction2=[!SetOption MeterReserveIcon ImageName "sf:bolt.fill"][!ShowMeter MeterReserveIcon][!SetOption MeterReservePct X 265.5][!UpdateMeter MeterReservePct]
IfCondition3=CalcReserveIcon = 2
IfTrueAction3=[!SetOption MeterReserveIcon ImageName "sf:powerplug.fill"][!ShowMeter MeterReserveIcon][!SetOption MeterReservePct X 265.5][!UpdateMeter MeterReservePct]
IfCondition4=CalcReserveIcon = 3
IfTrueAction4=[!SetOption MeterReserveIcon ImageName "sf:cpu"][!ShowMeter MeterReserveIcon][!SetOption MeterReservePct X 265.5][!UpdateMeter MeterReservePct]

[CalcReserveTip]
; the tooltip: 0 on battery, 1 charging, 2 plugged in, 3 CPU, 4 on battery with the time left unknown
Measure=Calc
Formula=(CalcReserveIcon = 0) ? ((MeasureBattLife > 0) ? 0 : 4) : CalcReserveIcon
UpdateDivider=10

; ================================================================ the weather (for the suite's place)

[MeasureWx]
; the temperature now, in the suite's unit; a new forecast updates the register at once
Measure=Plugin
Plugin=MacWeather
Location=#Location#
TemperatureUnit=#TempUnit#
Type=Temperature
Decimals=0
UpdateDivider=60
Group=Weather
FinishAction=[!UpdateMeasureGroup Weather][!UpdateMeterGroup Weather][!Redraw]

[MeasureWxLow]
Measure=Plugin
Plugin=MacWeather
Parent=MeasureWx
Type=Low
Day=0
UpdateDivider=60
Group=Weather

[MeasureWxHigh]
Measure=Plugin
Plugin=MacWeather
Parent=MeasureWx
Type=High
Day=0
UpdateDivider=60
Group=Weather

[MeasureWxLowColor]
; today's low and high on the suite's temperature scale ("R,G,B"): the arc runs from one to the other
Measure=Plugin
Plugin=MacWeather
Parent=MeasureWx
Type=TemperatureColor
Day=0
ColorOf=Low
UpdateDivider=60
Group=Weather
IfMatch=^\d
IfMatchAction=[!SetVariable WxLowRGB "[MeasureWxLowColor]"]
IfMatchMode=1

[MeasureWxHighColor]
Measure=Plugin
Plugin=MacWeather
Parent=MeasureWx
Type=TemperatureColor
Day=0
ColorOf=High
UpdateDivider=60
Group=Weather
IfMatch=^\d
IfMatchAction=[!SetVariable WxHighRGB "[MeasureWxHighColor]"]
IfMatchMode=1

[MeasureWxSymbol]
; an SF Symbol name that knows day from night ("cloud.sun.fill")
Measure=Plugin
Plugin=MacWeather
Parent=MeasureWx
Type=Symbol
UpdateDivider=60
Group=Weather

[MeasureWxCondition]
; MET's condition number, the key of Cond0…Cond50 in the Strings
Measure=Plugin
Plugin=MacWeather
Parent=MeasureWx
Type=Condition
UpdateDivider=60
Group=Weather

[MeasureWxFeels]
Measure=Plugin
Plugin=MacWeather
Parent=MeasureWx
Type=FeelsLike
Decimals=0
UpdateDivider=60
Group=Weather

[MeasureWxPlace]
Measure=Plugin
Plugin=MacWeather
Parent=MeasureWx
Type=Place
UpdateDivider=1
IfMatch=.
IfMatchAction=[!SetVariable PlaceState 1]

[MeasureWxPlaceMenu]
; the place's name for the menu title (titles stop at 30 characters)
Measure=String
String=[MeasureWxPlace]
RegExpSubstitute=1
Substitute="^(.{21}).+$":"\1…"
DynamicVariables=1
UpdateDivider=5

[MeasureLoadTimer]
; still no place after 2 s: the City item says so (not earlier, so nothing flickers at load)
Measure=Calc
Formula=Min(MeasureLoadTimer + 1, 3)
IfCondition=(MeasureLoadTimer = 2) && (#PlaceState# = 0)
IfTrueAction=[!SetVariable PlaceState 2]
DynamicVariables=1

[MeasureWxCredit]
; "Data: MET Norway", and where it links
Measure=Plugin
Plugin=MacWeather
Parent=MeasureWx
Type=AttributionShort
UpdateDivider=-1

[MeasureWxCreditFull]
Measure=Plugin
Plugin=MacWeather
Parent=MeasureWx
Type=Attribution
UpdateDivider=-1

[MeasureWxCreditURL]
Measure=Plugin
Plugin=MacWeather
Parent=MeasureWx
Type=AttributionURL
UpdateDivider=-1

[MeasureWxStatus]
; 0 ready, 1 loading, 2 stale, 3 no place, 4 place not found, 5 location off, 6 location unknown, 7–9 the service,
; 10 offline, 11 weather off, 12 preview, 13 too many places
Measure=Plugin
Plugin=MacWeather
Parent=MeasureWx
Type=Status
UpdateDivider=60
Group=Weather

[CalcWxState]
; 0 values, 1 no forecast yet (or none to be had), 2 no place, 3 location off or unknown, 4 values not up to date
Measure=Calc
Formula=((MeasureWxStatus = 0) ? 0 : (((MeasureWxStatus = 2) || (MeasureWxStatus = 10)) ? 4 : (((MeasureWxStatus = 3) || (MeasureWxStatus = 4)) ? 2 : (((MeasureWxStatus = 5) || (MeasureWxStatus = 6)) ? 3 : 1))))
UpdateDivider=60
Group=Weather
IfCondition=(CalcWxState = 0) || (CalcWxState = 4)
IfTrueAction=[!SetVariable WxTempText "%1°"][!SetVariable WxLowText "L%1°"][!SetVariable WxHighText "H%1°"][!SetVariable WxArc WxGradient][!ShowMeter MeterWxDot][!UpdateMeterGroup Weather][!Redraw]
IfFalseAction=[!SetVariable WxTempText "#Missing#°"][!SetVariable WxLowText "L#Missing#°"][!SetVariable WxHighText "H#Missing#°"][!SetVariable WxArc WxGradientDim][!HideMeter MeterWxDot][!UpdateMeterGroup Weather][!Redraw]
IfCondition2=(CalcWxState = 2) || (CalcWxState = 3)
IfTrueAction2=[!SetOption MeterWxSymbol ImageName "sf:location.slash.fill"][!SetOption MeterWxSymbol MacSymbolRendering Monochrome][!SetVariable WxSymbolTint "#RegInk2#"][!UpdateMeter MeterWxSymbol][!Redraw]
IfFalseAction2=[!SetOption MeterWxSymbol ImageName "sf:[*MeasureWxSymbol*]"][!SetOption MeterWxSymbol MacSymbolRendering Multicolor][!SetVariable WxSymbolTint "255,255,255,255"][!UpdateMeter MeterWxSymbol][!Redraw]
IfCondition3=CalcWxState = 4
IfTrueAction3=[!SetVariable WxTempColor "#RegInk2#"]
IfFalseAction3=[!SetVariable WxTempColor "#RegInk#"]
IfCondition4=CalcWxState = 2
IfTrueAction4=[!SetOption MeterWxHit LeftMouseUpAction """[!CommandMeasure MeasureCityInput "ExecuteBatch 1"]"""]
IfCondition5=CalcWxState = 3
IfTrueAction5=[!SetOption MeterWxHit LeftMouseUpAction """["x-apple.systempreferences:com.apple.preference.security?Privacy_LocationServices"]"""]
IfCondition6=(CalcWxState = 0) || (CalcWxState = 1) || (CalcWxState = 4)
IfTrueAction6=[!SetOption MeterWxHit LeftMouseUpAction """["/System/Applications/Weather.app"]"""]

[CalcWxAngle]
; the dot on the 270° arc: today's low at −135°, the high at +135° (clamped; a flat day stays finite)
Measure=Calc
Formula=-135 + 270 * Clamp((MeasureWx - MeasureWxLow) / Max(MeasureWxHigh - MeasureWxLow, 1), 0, 1)
UpdateDivider=60
Group=Weather

[CalcWxLowHighChars]
; the low and high share the arc's opening (about 42 pt), so their size follows how many characters their numbers
; have together: 8 pt up to 4 ("L14° H23°", "L8° H102°"), 7 pt at 5 ("L−12° H−3°"), 6.5 pt at 6 ("L−22° H−12°",
; "L102° H115°"); the letters are 7/8 of that
Measure=Calc
Formula=(((MeasureWxLow <= -10) || (MeasureWxLow >= 100)) ? 3 : (((MeasureWxLow < 0) || (MeasureWxLow >= 10)) ? 2 : 1)) + (((MeasureWxHigh <= -10) || (MeasureWxHigh >= 100)) ? 3 : (((MeasureWxHigh < 0) || (MeasureWxHigh >= 10)) ? 2 : 1))
UpdateDivider=60
Group=Weather
IfCondition=CalcWxLowHighChars <= 4
IfTrueAction=[!SetVariable WxLowHighSize 6][!SetVariable WxLetterSize 5.25]
IfCondition2=CalcWxLowHighChars = 5
IfTrueAction2=[!SetVariable WxLowHighSize 5.25][!SetVariable WxLetterSize 4.59]
IfCondition3=CalcWxLowHighChars >= 6
IfTrueAction3=[!SetVariable WxLowHighSize 4.875][!SetVariable WxLetterSize 4.27]

[MeasureAccentRGB]
; the Mac's accent without its alpha, for the hover rings
Measure=String
String=#AccentColor#
RegExpSubstitute=1
Substitute="^\s*(\d+\s*,\s*\d+\s*,\s*\d+).*$":"\1"
UpdateDivider=-1
IfMatch=^\d
IfMatchAction=[!SetVariable AccentRGB "[MeasureAccentRGB]"]

; ================================================================ glass, dial and batons (static)

[MeterGlass]
; a Rectangle with corner radius 180 is a disc: the glass takes it. The plate covers it but for an 8 pt crystal ring
Meter=Shape
Shape=Rectangle 0,0,360,360,180 | Fill Color 0,0,0,0 | StrokeWidth 0
MacGlass=#Glass#
MacGlassTint=#ChronoGlassTint#
LeftMouseUpAction=#OpenAction#
ToolTipText=[MeasureClockSeconds]
DynamicVariables=1

[MeterPlate]
; r 172, lit from 30 pt above the centre; the outer stroke is the crystal's bevel (172 → 173.2)
Meter=Shape
MeterStyle=sPlate
Shape=Ellipse 180,180,172 | Fill RadialGradient PlateGradient | StrokeWidth 1.2 | StrokeType Outer | Stroke LinearGradient Crystal
UpdateDivider=-1

[MeterMinuteTrack]
; 60 ticks of 0.8 pt (r 163 → 169.5) and 12 of 1.6 pt (160 → 169.5). Dashes are in stroke widths; an ellipse starts at
; 3 o'clock, so half a tick's offset puts a tick on every minute
Meter=Shape
Shape=Ellipse 180,180,166.25 | Fill Color 0,0,0,0 | StrokeWidth 6.5 | Stroke Color #TrackMinor# | StrokeDashes 0.12308,2.55533 | StrokeDashOffset 0.06154
Shape2=Ellipse 180,180,164.75 | Fill Color 0,0,0,0 | StrokeWidth 9.5 | Stroke Color #TrackMajor# | StrokeDashes 0.16842,8.91188 | StrokeDashOffset 0.08421
UpdateDivider=-1

[MeterBatons]
; hour batons r 134 → 156, each the 12 o'clock baton turned about the centre; a pair at 12
Meter=Shape
Shape=Rectangle 177.3,24,5.4,22,2.7 | Rotate 30,2.7,156 | Fill Color #Hand# | StrokeWidth 0
Shape2=Rectangle 177.3,24,5.4,22,2.7 | Rotate 60,2.7,156 | Fill Color #Hand# | StrokeWidth 0
Shape3=Rectangle 177.3,24,5.4,22,2.7 | Rotate 90,2.7,156 | Fill Color #Hand# | StrokeWidth 0
Shape4=Rectangle 177.3,24,5.4,22,2.7 | Rotate 120,2.7,156 | Fill Color #Hand# | StrokeWidth 0
Shape5=Rectangle 177.3,24,5.4,22,2.7 | Rotate 150,2.7,156 | Fill Color #Hand# | StrokeWidth 0
Shape6=Rectangle 177.3,24,5.4,22,2.7 | Rotate 180,2.7,156 | Fill Color #Hand# | StrokeWidth 0
Shape7=Rectangle 177.3,24,5.4,22,2.7 | Rotate 210,2.7,156 | Fill Color #Hand# | StrokeWidth 0
Shape8=Rectangle 177.3,24,5.4,22,2.7 | Rotate 240,2.7,156 | Fill Color #Hand# | StrokeWidth 0
Shape9=Rectangle 177.3,24,5.4,22,2.7 | Rotate 270,2.7,156 | Fill Color #Hand# | StrokeWidth 0
Shape10=Rectangle 177.3,24,5.4,22,2.7 | Rotate 300,2.7,156 | Fill Color #Hand# | StrokeWidth 0
Shape11=Rectangle 177.3,24,5.4,22,2.7 | Rotate 330,2.7,156 | Fill Color #Hand# | StrokeWidth 0
Shape12=Rectangle 173.3,24,4.2,26,2.1 | Fill Color #Hand# | StrokeWidth 0
Shape13=Rectangle 182.5,24,4.2,26,2.1 | Fill Color #Hand# | StrokeWidth 0
UpdateDivider=-1

; ================================================================ date window and wordmark (under 12)

[MeterDateWindow]
Meter=Shape
MeterStyle=sPlate
Shape=Rectangle 149,87,62,21,5.5 | Fill Color #DateFace# | StrokeWidth 1 | Stroke LinearGradient SteelRim
UpdateDivider=-1

[MeterDate]
; "SAT 26": the weekday in the text-safe accent (its Dark value: the window is dark in both looks), semibold capitals
; tracked as an eyebrow; the day bold, in SF Pro Rounded
Meter=String
MeasureName=MeasureWeekday
MeasureName2=MeasureDay
Text=%1 %2
StringCase=Upper
FontFace=#FontText#
FontSize=8.25
FontWeight=700
FontColor=#DateText#
StringAlign=CenterCenter
AntiAlias=1
X=180
Y=97.5
InlineSetting=Color | #ChronoWeekday#
InlinePattern=^\S+
InlineSetting2=Weight | 600
InlinePattern2=^\S+
InlineSetting3=CharacterSpacing | 0 | 0.6
InlinePattern3=^\S+
InlineSetting4=Face | #FontNumber#
InlinePattern4=\d+
InlineSetting5=Typography | tnum
InlinePattern5=\d+
UpdateDivider=60

[MeterWordmark]
; 7 pt capitals, 2.4 apart; +1.2 makes up for the space after the last letter. Empty text: no wordmark
Meter=String
Text=#ChronoDialText#
StringCase=Upper
FontFace=#FontText#
FontSize=5.25
FontWeight=600
FontColor=#WordmarkInk#
StringAlign=CenterCenter
AntiAlias=1
X=181.2
Y=124
InlineSetting=CharacterSpacing | 0 | 2.4
UpdateDivider=-1

; ================================================================ weather register (9 o'clock, centre 100,180)

[MeterWxBase]
; the face, its steel rim and the snailing (r 5 → 35)
Meter=Shape
MeterStyle=sPlate
Shape=Ellipse 100,180,40 | Fill Color #RegFace# | StrokeWidth 1.2 | Stroke LinearGradient SteelRim
Shape2=Ellipse 100,180,5 | Fill Color 0,0,0,0 | StrokeWidth 0.5 | Stroke Color #RegSnail#
Shape3=Ellipse 100,180,8 | Fill Color 0,0,0,0 | StrokeWidth 0.5 | Stroke Color #RegSnail#
Shape4=Ellipse 100,180,11 | Fill Color 0,0,0,0 | StrokeWidth 0.5 | Stroke Color #RegSnail#
Shape5=Ellipse 100,180,14 | Fill Color 0,0,0,0 | StrokeWidth 0.5 | Stroke Color #RegSnail#
Shape6=Ellipse 100,180,17 | Fill Color 0,0,0,0 | StrokeWidth 0.5 | Stroke Color #RegSnail#
Shape7=Ellipse 100,180,20 | Fill Color 0,0,0,0 | StrokeWidth 0.5 | Stroke Color #RegSnail#
Shape8=Ellipse 100,180,23 | Fill Color 0,0,0,0 | StrokeWidth 0.5 | Stroke Color #RegSnail#
Shape9=Ellipse 100,180,26 | Fill Color 0,0,0,0 | StrokeWidth 0.5 | Stroke Color #RegSnail#
Shape10=Ellipse 100,180,29 | Fill Color 0,0,0,0 | StrokeWidth 0.5 | Stroke Color #RegSnail#
Shape11=Ellipse 100,180,32 | Fill Color 0,0,0,0 | StrokeWidth 0.5 | Stroke Color #RegSnail#
Shape12=Ellipse 100,180,35 | Fill Color 0,0,0,0 | StrokeWidth 0.5 | Stroke Color #RegSnail#
