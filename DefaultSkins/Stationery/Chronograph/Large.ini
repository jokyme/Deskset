; ================================================================ the city and dial-text fields

[MeasureCityInput]
; "City…" in the menu (and a click on the weather register without a place). Return writes the suite's Location (a
; city, "latitude,longitude", timezone or auto) and refreshes every Stationery widget; Escape cancels
Measure=Plugin
Plugin=InputText
X=#CityFieldX#
Y=#CityFieldY#
W=#CityFieldW#
H=24
SolidColor=#FieldColor#
FontColor=#TextColor#
FontFace=#FontText#
FontSize=9.75
DefaultValue=[MeasureWxPlace]
FocusDismiss=1
Command1=[!WriteKeyValue Variables Location "$UserInput$" "#@#Variables.inc"][!RefreshGroup StationeryPlace]
DynamicVariables=1
UpdateDivider=-1

[MeasureDialTextInput]
; "Dial Text…": the wordmark (at most 12 characters; empty hides it), kept in Stationery.inc
Measure=Plugin
Plugin=InputText
X=#CityFieldX#
Y=112
W=#CityFieldW#
H=24
SolidColor=#FieldColor#
FontColor=#TextColor#
FontFace=#FontText#
FontSize=9.75
DefaultValue=#ChronoDialText#
FocusDismiss=1
Command1=[!WriteKeyValue Variables ChronoDialText "$UserInput$" "#StationeryFile#"][!Refresh]
UpdateDivider=-1
