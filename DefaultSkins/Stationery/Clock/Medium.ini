; Stationery · Clock, medium (360 × 170): the small clock on the left, and today's sunrise, sunset, day length and moon
; in a detail column on the right. Original work, MIT licensed.

[Rainmeter]
Update=1000
AccurateText=1
SkinWidth=360
SkinHeight=170
DynamicWindowSize=0
; the suite, and the suite settings it shows (a setting refreshes only its own group)
Group=Stationery | StationeryTime | StationeryPlace
; the window's own look, once Deskset reads it (until then it is macOS's)
MacAppearance=#LookAppearance#
ContextTitle=#ClockMenuOpen#
ContextAction=#OpenAction#
ContextTitle2=---
ContextTitle3=#MenuClockTitle#
ContextAction3=#MenuClockAction#
ContextTitle4=[#ClockMenuCity[#PlaceState]]
ContextAction4=[!CommandMeasure MeasureCityInput "ExecuteBatch 1"]
ContextTitle5=---
ContextTitle6=#MenuLookTitle#
ContextAction6=#MenuLookAction#
ContextTitle7=#MenuCardsTitle#
ContextAction7=#MenuCardsAction#
ContextTitle8=#MenuLanguageTitle#
ContextAction8=#MenuLanguageAction#

[Metadata]
Name=Clock
Author=Deskset
License=MIT
Version=1.0
Information=Stationery · The time and the date, with today's sunrise, sunset, day length and moon, worked out on your Mac. Right-click for 12- or 24-hour time and the city.

[Variables]
@Include=#@#Variables.inc
@Include2=#@#Suite/Tokens.inc
@Include3=#@#Suite/Styles.inc
@Include4=#@#Clock/Measures.inc
CardW=360
CardH=170
OpenAction=["/System/Applications/Clock.app"]
; the city field covers the first row
CityFieldX=197
CityFieldY=54.4
CityFieldW=147
; the rows share the left column's lines: sunrise's capitals top out with the time's (baseline 71), sunset sits on the
; time's baseline, the day length on the date's, and the moon on the week line's (the last baseline)
RowRise=71
RowSet=#HeroBaseline#
RowDay=117
RowMoon=#LastBaseline#
; the day length while the place is looked up (0), with a place (1), without one (2: the rows are hidden)
DayText0=#Missing#
DayText1=[MeasureDayLengthText]
DayText2=
; by MeasureSunState: the sun rises and sets (0), midnight sun (1), polar night (2)
DayWord0=
DayWord1=#StrAllDay#
DayWord2=#StrNone#

; ---------------------------------------------------------------- the left column: the small clock, with the week line
[MeterCard]
Meter=Shape
MeterStyle=sCard
ToolTipTitle=[MeasureDateFull]
ToolTipText=[#ClockTipTime[#Hours]]#ClockTipWeek#[#ClockTipBody[&MeasureTipState:0]]#ClockTipMoon#
Group=Clock
UpdateDivider=-1

[MeterWeekday]
; "SATURDAY", in the text-safe accent (a weekday outside the Calendar)
Meter=String
MeterStyle=sEyebrow
MeasureName=MeasureWeekday
X=16
Y=16
W=112
ClipString=1
Group=Clock
UpdateDivider=-1

[MeterAMPM]
; 12-hour time only: "AM" above the time's right end, where the small clock has it (not at the card's corner, where
; it would read as the rows' heading)
Meter=String
MeterStyle=sEyebrow | sEyebrowTrailing
MeasureName=MeasureAMPM
X=154
Hidden=(#Hours# = 24)
Group=Clock
UpdateDivider=-1

[MeterTime]
; 46 pt on baseline 94; "10:09" is 130.4 wide at most
Meter=String
MeterStyle=sHero
MeasureName=MeasureTime
X=16
Y=(#HeroBaseline# - #Ascent46#)
Group=Clock
UpdateDivider=-1

[MeterDate]
; "September 26" on baseline 117
Meter=String
MeterStyle=sSubhead
MeasureName=MeasureDate
X=16
Y=(117 - #Ascent15#)
W=138
ClipString=1
Group=Clock
UpdateDivider=-1

[MeterWeekLine]
; "Week 39 · Day 269" on the last baseline
Meter=String
MeterStyle=sCaption
FontColor=#TertiaryTextColor#
X=16
Y=(#LastBaseline# - #Ascent11#)
W=138
ClipString=1
Text=#ClockWeekLine#
DynamicVariables=1
Group=Clock
UpdateDivider=-1

; ---------------------------------------------------------------- the detail column (x 176 → 344)
; sunrise, sunset and the day length in 13 pt rows: symbols centred on x 186 at their natural size, labels at x 201,
; values right-aligned at 344. The sun glyphs are palettes: a yellow sun, the horizon and arrow in the row's ink (the
; first layer of sunrise.fill and sunset.fill; the sun is the second), no ImageTint.
[MeterRiseSymbol]
Meter=Image
MeterStyle=sSymbolM
ImageName=sf:sunrise.fill
MacSymbolRendering=Palette
MacSymbolColors=#SecondaryTextColor#|#SunColor#
X=(#DetailSlotCenterX# - 10)
Y=(#RowRise# - #CapHeight13# / 2 - 8.5)
W=20
H=17
Hidden=(#PlaceState# = 2)
DynamicVariables=1
Group=Clock
UpdateDivider=-1

[MeterRiseLabel]
Meter=String
MeterStyle=sBody
Text=#StrSunrise#
X=#DetailTextX#
Y=(#RowRise# - #Ascent13#)
Hidden=(#PlaceState# = 2)
DynamicVariables=1
Group=Clock
UpdateDivider=-1

[MeterRiseValue]
; "07:10" or "7:10 AM" (the unit kit sets AM in 11 pt); "--" while the place is looked up, "—" when the sun does not
; rise, both in Tertiary
Meter=String
MeterStyle=sValue | sUnit | sMissing | sRowValue
MeasureName=MeasureSunrise
Y=(#RowRise# - #Ascent13#)
Hidden=(#PlaceState# = 2)
DynamicVariables=1
Group=Clock
UpdateDivider=-1

[MeterSetSymbol]
Meter=Image
MeterStyle=sSymbolM
ImageName=sf:sunset.fill
MacSymbolRendering=Palette
MacSymbolColors=#SecondaryTextColor#|#SunColor#
X=(#DetailSlotCenterX# - 10)
Y=(#RowSet# - #CapHeight13# / 2 - 8.5)
W=20
H=17
Hidden=(#PlaceState# = 2)
DynamicVariables=1
Group=Clock
UpdateDivider=-1

[MeterSetLabel]
Meter=String
MeterStyle=sBody
Text=#StrSunset#
X=#DetailTextX#
Y=(#RowSet# - #Ascent13#)
Hidden=(#PlaceState# = 2)
DynamicVariables=1
Group=Clock
UpdateDivider=-1

[MeterSetValue]
Meter=String
MeterStyle=sValue | sUnit | sMissing | sRowValue
MeasureName=MeasureSunset
Y=(#RowSet# - #Ascent13#)
Hidden=(#PlaceState# = 2)
DynamicVariables=1
Group=Clock
UpdateDivider=-1

[MeterDaySymbol]
Meter=Image
MeterStyle=sSymbolM
ImageName=sf:sun.max.fill
MacSymbolRendering=Palette
MacSymbolColors=#SunColor#
X=(#DetailSlotCenterX# - 8.5)
Y=(#RowDay# - #CapHeight13# / 2 - 8.5)
W=17
H=17
Hidden=(#PlaceState# = 2)
DynamicVariables=1
Group=Clock
UpdateDivider=-1

[MeterDayLabel]
Meter=String
MeterStyle=sBody
Text=#StrDaylight#
X=#DetailTextX#
Y=(#RowDay# - #Ascent13#)
Hidden=(#PlaceState# = 2)
DynamicVariables=1
Group=Clock
UpdateDivider=-1

[MeterDayValue]
; "11 h 56 min" (h and min in 11 pt), built from MacSun's seconds; never its "11:56", which reads as a time of day
Meter=String
MeterStyle=sValue | sUnit | sMissing | sRowValue
Text=[#DayText[#PlaceState]]
Y=(#RowDay# - #Ascent13#)
Hidden=((#PlaceState# = 2) || ([MeasureSunState:] <> 0))
DynamicVariables=1
Group=Clock
UpdateDivider=-1

[MeterDayWord]
; midnight sun and polar night: "All day" or "None", a word in the value's place (SF Pro, not the Rounded digits)
Meter=String
MeterStyle=sBody | sRowValue
FontWeight=600
FontColor=#TextColor#
Text=[#DayWord[&MeasureSunState:0]]
Y=(#RowDay# - #Ascent13#)
Hidden=((#PlaceState# = 2) || ([MeasureSunState:] = 0))
DynamicVariables=1
Group=Clock
UpdateDivider=-1

; ---------------------------------------------------------------- without a place
; a one-row notice instead of the sun rows
[MeterCitySymbol]
Meter=Image
MeterStyle=sSymbolM
ImageName=sf:mappin.and.ellipse
ImageTint=#SecondaryTextColor#
X=(#DetailSlotCenterX# - 8)
Y=(#RowRise# - #CapHeight13# / 2 - 9)
W=16
H=18
Hidden=(#PlaceState# <> 2)
DynamicVariables=1
Group=Clock
UpdateDivider=-1

[MeterCityText]
Meter=String
MeterStyle=sBody
Text=#ClockNeedCity#
X=#DetailTextX#
Y=(#RowRise# - #Ascent13#)
W=143
ClipString=1
Hidden=(#PlaceState# <> 2)
DynamicVariables=1
Group=Clock
UpdateDivider=-1

[MeterCityPad]
; the hover and pressed pad of the "Choose City…" row
Meter=Shape
Shape=Rectangle 172,75,176,28,#RowPadRadius# | Fill Color #HoverColor# | StrokeWidth 0
Hidden=1
UpdateDivider=-1

[MeterCityAction]
Meter=String
MeterStyle=sBody
FontWeight=600
FontColor=#AccentTextColor#
Text=#StrChooseCity#
X=#DetailTextX#
Y=(#RowSet# - #Ascent13#)
Hidden=(#PlaceState# <> 2)
DynamicVariables=1
Group=Clock
UpdateDivider=-1

[MeterCityHit]
; the row's hit box (x 172 → 348, y 75 → 103): opens the city field over the first row
Meter=Image
MeterStyle=sHit
X=172
Y=75
W=176
H=28
Hidden=(#PlaceState# <> 2)
ToolTipText=#ClockTipChooseCity#
MouseOverAction=[!ShowMeter MeterCityPad][!Redraw]
MouseLeaveAction=[!HideMeter MeterCityPad][!Redraw]
LeftMouseDownAction=[!SetOption MeterCityPad Shape "Rectangle 172,75,176,28,#RowPadRadius# | Fill Color #PressedColor# | StrokeWidth 0"][!UpdateMeter MeterCityPad][!Redraw]
LeftMouseUpAction=[!SetOption MeterCityPad Shape "Rectangle 172,75,176,28,#RowPadRadius# | Fill Color #HoverColor# | StrokeWidth 0"][!UpdateMeter MeterCityPad][!Redraw][!CommandMeasure MeasureCityInput "ExecuteBatch 1"]
DynamicVariables=1
Group=Clock
UpdateDivider=-1

; ---------------------------------------------------------------- the moon (needs no place), on the last baseline
[MeterMoonSymbol]
; the phase's symbol by its eighth, plus the look's suffix (".inverse" in Light), so the lit part is always the lighter
; tone
Meter=Image
MeterStyle=sSymbolM
ImageName=sf:[#MoonSymbol[&MeasureMoonEighth:0]]#MoonSuffix#
MacSymbolRendering=Hierarchical
ImageTint=#SecondaryTextColor#
X=(#DetailSlotCenterX# - 8)
Y=(#RowMoon# - #CapHeight13# / 2 - 8)
W=16
H=16
DynamicVariables=1
Group=Clock
UpdateDivider=-1

[MeterMoonValue]
; "100%"; before the label, whose width reads this one's
Meter=String
MeterStyle=sValue | sRowValue
Text=[MeasureMoonIllum:0]%
Y=(#RowMoon# - #Ascent13#)
DynamicVariables=1
Group=Clock
UpdateDivider=-1

[MeterMoonLabel]
; "Full Moon"; clipped 6 pt before the value (the tooltip has the name). It reads the value's width every second too:
; within the minute's group update a meter still sees the width the value had before it
Meter=String
MeterStyle=sBody
Text=[#Moon[&MeasureMoonEighth:0]]
X=#DetailTextX#
Y=(#RowMoon# - #Ascent13#)
W=(#CardW# - 16 - 6 - [MeterMoonValue:W] - #DetailTextX#)
ClipString=1
DynamicVariables=1
Group=Clock
