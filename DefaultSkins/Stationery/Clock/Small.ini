; Stationery · Clock, small (170 × 170): the weekday, the time, the date and the next sunrise or sunset.
; Original work, MIT licensed. It is also the reference for the suite's kit (@Resources/Suite): tokens, looks, text
; styles, the card.

[Rainmeter]
Update=1000
AccurateText=1
SkinWidth=170
SkinHeight=170
DynamicWindowSize=0
; the suite, and the suite settings it shows (a setting refreshes only its own group)
Group=Stationery | StationeryTime | StationeryPlace
; the window's own look, once Deskset reads it (until then it is macOS's)
MacAppearance=#LookAppearance#
ContextTitle=#ClockMenuOpen#
ContextAction=#OpenAction#
ContextTitle2=---
ContextTitle3=#MenuClockTitle#
ContextAction3=#MenuClockAction#
ContextTitle4=[#ClockMenuLine[#ClockBottomLine]]
ContextAction4=[!WriteKeyValue Variables ClockBottomLine [#ClockLineNext[#ClockBottomLine]] "#@#Variables.inc"][!Refresh]
ContextTitle5=[#ClockMenuCity[#PlaceState]]
ContextAction5=[!CommandMeasure MeasureCityInput "ExecuteBatch 1"]
ContextTitle6=---
ContextTitle7=#MenuLookTitle#
ContextAction7=#MenuLookAction#
ContextTitle8=#MenuCardsTitle#
ContextAction8=#MenuCardsAction#
ContextTitle9=#MenuLanguageTitle#
ContextAction9=#MenuLanguageAction#

[Metadata]
Name=Clock
Author=Deskset
License=MIT
Version=1.0
Information=Stationery · The time, the date and the sun: the next sunrise or sunset, worked out on your Mac. Right-click for 12- or 24-hour time, the bottom line and the city.

[Variables]
@Include=#@#Variables.inc
@Include2=#@#Suite/Tokens.inc
@Include3=#@#Suite/Styles.inc
@Include4=#@#Clock/Measures.inc
CardW=170
CardH=170
OpenAction=["/System/Applications/Clock.app"]
; the city field covers the bottom line
CityFieldX=12
CityFieldY=135
CityFieldW=146
ClockLineNextSun=Week
ClockLineNextWeek=None
ClockLineNextNone=Sun
; the bottom line: ClockBottomLine (Variables.inc) = Sun, Week or None
LineModeSun=0
LineModeWeek=1
LineModeNone=2
LineMode=[#LineMode[#ClockBottomLine]]
; by MeasureSunLine: 0 blank, 1 sunrise today, 2 sunset, 3 sunrise tomorrow, 4 midnight sun, 5 polar night, 6 week
LineSymbol0=
LineSymbol1=sunrise.fill
LineSymbol2=sunset.fill
LineSymbol3=sunrise.fill
LineSymbol4=sun.max.fill
LineSymbol5=moon.stars.fill
LineSymbol6=
; the symbol's colours, a palette: a yellow sun on a horizon in the line's ink (sunrise and sunset draw the arrow and
; horizon in their first layer and the sun in the second)
LinePalette0=
LinePalette1=#TertiaryTextColor#|#SunColor#
LinePalette2=#TertiaryTextColor#|#SunColor#
LinePalette3=#TertiaryTextColor#|#SunColor#
LinePalette4=#SunColor#
LinePalette5=#TertiaryTextColor#
LinePalette6=
LineText0=
LineText1=#StrSunrise# [MeasureSunrise]
LineText2=#StrSunset# [MeasureSunset]
LineText3=#StrSunrise# [MeasureSunriseTomorrow]
LineText4=#StrMidnightSun#
LineText5=#StrPolarNight#
LineText6=#ClockWeekLine#
; the line's text starts after the symbol in the leading slot; the week line has no symbol
LineX0=41
LineX1=41
LineX2=41
LineX3=41
LineX4=41
LineX5=41
LineX6=16

; ---------------------------------------------------------------- the bottom line's state
[MeasureSunLine]
; the sun's next event; the missing-event guards cover the days around the polar seasons, when the sun rises but
; does not set (or the reverse) while SunState is still 0
Measure=Calc
Formula=(#LineMode# = 2) ? 0 : ((#LineMode# = 1) ? 6 : ((#PlaceState# = 0) ? 0 : ((#PlaceState# = 2) ? 6 : ((MeasureSunState = 1) ? 4 : ((MeasureSunState = 2) ? 5 : ((MeasureSunProgress <= 0) ? ((MeasureSunrise = 0) ? 5 : 1) : ((MeasureSunProgress < 1) ? ((MeasureSunset = 0) ? 4 : 2) : ((MeasureSunriseTomorrow = 0) ? 5 : 3))))))))
DynamicVariables=1
Group=Clock
UpdateDivider=-1

; ---------------------------------------------------------------- meters
[MeterCard]
Meter=Shape
MeterStyle=sCard
ToolTipTitle=[MeasureDateFull]
ToolTipText=[#ClockTipTime[#Hours]]#ClockTipWeek#[#ClockTipBody[&MeasureTipState:0]]#ClockTipMoon#
Group=Clock
UpdateDivider=-1

[MeterWeekday]
; "SATURDAY", in the text-safe accent (a weekday outside the Calendar)
Meter=String
MeterStyle=sEyebrow
MeasureName=MeasureWeekday
X=16
Y=16
W=112
ClipString=1
Group=Clock
UpdateDivider=-1

[MeterAMPM]
; 12-hour time only: "AM" above the time's right end
Meter=String
MeterStyle=sEyebrow | sEyebrowTrailing
MeasureName=MeasureAMPM
Hidden=(#Hours# = 24)
Group=Clock
UpdateDivider=-1

[MeterTime]
; 46 pt on baseline 94; "10:09" is 130.4 wide at most
Meter=String
MeterStyle=sHero
MeasureName=MeasureTime
X=16
Y=(#HeroBaseline# - #Ascent46#)
Group=Clock
UpdateDivider=-1

[MeterDate]
; "September 26" on baseline 117
Meter=String
MeterStyle=sSubhead
MeasureName=MeasureDate
X=16
Y=(117 - #Ascent15#)
W=138
ClipString=1
Group=Clock
UpdateDivider=-1

[MeterLineSymbol]
; 11 pt (a 17 × 15 box: the sunrise and sunset size; the others are centred in it), a yellow sun on a horizon in the
; line's ink: the colours of the symbol's layers (LinePalette), no ImageTint
Meter=Image
MeterStyle=sSymbolS
ImageName=sf:[#LineSymbol[&MeasureSunLine:0]]
MacSymbolRendering=Palette
MacSymbolColors=[#LinePalette[&MeasureSunLine:0]]
X=(#SlotCenterX# - 8.5)
Y=(#LastBaseline# - #CapHeight11# / 2 - 7.5)
W=17
H=15
DynamicVariables=1
Group=Clock
UpdateDivider=-1

[MeterLine]
; "Sunset 19:06" (or the week line) on the last baseline, 151
Meter=String
MeterStyle=sCaption
FontColor=#TertiaryTextColor#
X=[#LineX[&MeasureSunLine:0]]
Y=(#LastBaseline# - #Ascent11#)
W=(154 - [#LineX[&MeasureSunLine:0]])
ClipString=1
Text=[#LineText[&MeasureSunLine:0]]
DynamicVariables=1
Group=Clock
UpdateDivider=-1
