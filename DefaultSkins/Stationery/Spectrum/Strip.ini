; Stationery · Spectrum, strip (740 × 110): 64 bars of the sound the Mac plays, straight on the wallpaper in the suite's
; ink. At rest it shows a row of dots; with Hide When Idle on, it fades out after 3 s of quiet and comes back with the
; sound. Original work, MIT licensed.

[Rainmeter]
; the sound and the bars about 30 times a second while they move, everything else once a second; at rest the whole
; strip once a second (the tempo, Audio.inc)
Update=#SpectrumTick#
DefaultUpdateDivider=#SpectrumDivider#
AccurateText=1
SkinWidth=740
SkinHeight=110
DynamicWindowSize=0
; the suite, and the suite settings it shows (a setting refreshes only its own group)
Group=Stationery | StationeryMedia | StationeryInk
; first placement: centred, its bottom 120 pt above the screen's bottom edge (clear of a Dock at the bottom)
DefaultWindowX=50%
DefaultAnchorX=50%
DefaultWindowY=120B
DefaultAnchorY=100%
DefaultAlwaysOnTop=-2
DefaultFadeDuration=600
ContextTitle=[#MediaOpen[#PlayerIndex[#Player]]]
ContextAction=#OpenAction#
ContextTitle2=---
ContextTitle3=[#SpectrumMenuStripBars[#SpectrumStripBars]]
ContextAction3=[!WriteKeyValue Variables SpectrumStripBars "[#StripBarsNext[#ShowSpectrumTrack][#SpectrumStripBars]]" "#@#Variables.inc"][!Refresh]
ContextTitle4=[#SpectrumMenuHideWhenIdle[#HideSpectrumWhenIdle]]
ContextAction4=[!WriteKeyValue Variables HideSpectrumWhenIdle "[#Flip[#HideSpectrumWhenIdle]]" "#@#Variables.inc"][!Refresh]
ContextTitle5=[#SpectrumMenuMotion[#SpectrumMotion]]
ContextAction5=[!WriteKeyValue Variables SpectrumMotion "[#MotionNext[#SpectrumMotion]]" "#@#Variables.inc"][!Refresh]
ContextTitle6=[#SpectrumMenuShowTrack[#ShowSpectrumTrack]]
ContextAction6=[!WriteKeyValue Variables ShowSpectrumTrack "[#Flip[#ShowSpectrumTrack]]" "#@#Variables.inc"][!WriteKeyValue Variables SpectrumStripBars "[#StripBarsAfterTrack[#ShowSpectrumTrack][#SpectrumStripBars]]" "#@#Variables.inc"][!Refresh]
ContextTitle7=#MenuPlayerTitle#
ContextAction7=#MenuPlayerAction#
ContextTitle8=---
ContextTitle9=#MenuInkTitle#
ContextAction9=#MenuInkAction#
ContextTitle10=#MenuLanguageTitle#
ContextAction10=#MenuLanguageAction#

[Metadata]
Name=Spectrum
Author=Deskset
License=MIT
Version=1.0
Information=Stationery · Spectrum draws the sound your Mac plays: 32 bars from 40 Hz on the left to 16 kHz on the right (the Strip: 64 bars, no card). macOS asks once for System Audio Recording, the first time something plays. Before macOS 14.2 it asks for Screen Recording instead, when Spectrum loads, and Deskset must be quit and reopened. Nothing is recorded or saved. While something is playing, macOS shows its purple recording indicator in the menu bar. The track name comes from Music or Spotify, which asks for Automation the first time one of them is open; turn off Show Track to skip that. Click to open Music.

[Variables]
@Include=#@#Variables.inc
@Include2=#@#Suite/Tokens.inc
@Include3=#@#Suite/Styles.inc
@Include4=#@#Suite/Ink.inc
@Include5=#@#Media/Media.inc
; 64 bands; a silent one still draws a 6 pt stub: a bar is 6 + 84 × the band (0-1) tall, of 90
Bands=64
BandMin=(-6 / 84)
; where a click leads while a permission is missing: Privacy & Security › Screen & System Audio Recording
PrivacyPane=x-apple.systempreferences:com.apple.preference.security?Privacy_ScreenCapture
; the tempo (Audio.inc): Live or Rest. The widget rewrites these two lines itself; it ships Live
Tempo=Live
TempoLive=1
@Include6=#@#Spectrum/Track-#ShowSpectrumTrack#.inc
@Include7=#@#Spectrum/StripBars-#SpectrumStripBars#.inc
@Include8=#@#Spectrum/Audio.inc
@Include9=#@#Spectrum/Bands64.inc
; the ink samples the wallpaper every 5 s, whatever the tempo, and at once when the strip is moved
InkDividerLive=150
InkDividerRest=5
InkDivider=[#InkDivider[#Tempo]]
; the bars follow the ink as soon as it switches (StripBars-*.inc)
InkChangeAction=[!UpdateMeasure MeasureStripTint][!UpdateMeterGroup Ink][!Redraw]
; 1 while the bars rest (no scrim then)
Resting=1
; the Bars item: Ink ⇄ Album Art (Album Art needs the track: not offered with Show Track: Off)
StripBarsNext1Ink=Cover
StripBarsNext1Cover=Ink
StripBarsNext0Ink=Ink
StripBarsNext0Cover=Ink
StripBarsAfterTrack1Cover=Ink
StripBarsAfterTrack1Ink=Ink
StripBarsAfterTrack0Ink=Ink
StripBarsAfterTrack0Cover=Cover
; Hide When Idle, with the tempo: leaving Live, the strip fades out before it refreshes into Rest, and in Rest it comes
; up hidden if it rests hidden (MeasureStripComeUp). The dots show at rest either way, so a strip shown by hand (the
; Manage window's Show) can be seen and placed
StripFadeOutLive1=[!HideFade][!Delay 650]
StripFadeOutLive0=
StripFadeOutRest1=
StripFadeOutRest0=
StripFadeOutNow=[#StripFadeOut[#Tempo][#HideSpectrumWhenIdle]]
; what a new track updates, and what each mode shows (MeasureMode, Audio.inc). A missing permission: the strip rests in
; view (at the Rest tempo), its tooltip says what to allow, and a click opens the pane. A section reads a new option (an UpdateDivider, a
; mouse action) at its next update, and at -1 it has none: what changes is updated once, so it applies at once
TrackChangedActions=[!UpdateMeasureGroup Tip]
LiveActions=[!SetOptionGroup Audio UpdateDivider 1][!SetOptionGroup Bands UpdateDivider 1][!SetOptionGroup Bars UpdateDivider 1][!UpdateMeasureGroup Bands][!UpdateMeterGroup Bars][!HideMeterGroup Rest][!ShowMeterGroup Bars][!SetVariable Resting 0][!UpdateMeter MeterScrim][!SetOption MeterHitArea LeftMouseUpAction """#OpenAction#"""][!UpdateMeter MeterHitArea][!UpdateMeasureGroup Tip][!Redraw]#ToLiveNow#
RestActions=[!SetOptionGroup Audio UpdateDivider #AudioDivider#][!SetOptionGroup Bands UpdateDivider -1][!SetOptionGroup Bars UpdateDivider -1][!HideMeterGroup Bars][!ShowMeterGroup Rest][!SetVariable Resting 1][!UpdateMeter MeterScrim][!SetOption MeterHitArea LeftMouseUpAction """#OpenAction#"""][!UpdateMeter MeterHitArea][!UpdateMeasureGroup Tip][!Redraw]#StripFadeOutNow##ToRestNow#
NoticeAudioActions=[!SetOptionGroup Audio UpdateDivider #AudioDivider#][!SetOptionGroup Bands UpdateDivider -1][!SetOptionGroup Bars UpdateDivider -1][!HideMeterGroup Bars][!ShowMeterGroup Rest][!SetVariable Resting 1][!UpdateMeter MeterScrim][!SetOption MeterHitArea LeftMouseUpAction """["#PrivacyPane#"]"""][!UpdateMeter MeterHitArea][!UpdateMeasureGroup Tip][!Redraw]#ToRestNow#
NoticeScreenActions=#NoticeAudioActions#

; ---------------------------------------------------------------- hiding when idle
[MeasureGrace]
; half-seconds since load, up to 20: loaded Live, the strip stays in view at least 10 s, so it can be found and placed
Measure=Calc
Formula=Min(MeasureGrace + 1, 20)
UpdateDivider=#AudioDivider#

[MeasureStripHide]
; resting with Hide When Idle: fade out; any other mode (the Notices too) brings it back, and so does a player's access
; refused at rest, so the tooltip can say where to allow it
Measure=Calc
Formula=(#HideSpectrumWhenIdle# = 1) && (MeasureMode = 1) && (MeasureAccessOn = 0) && ((MeasureGrace >= 20) || (#TempoLive# = 0))
UpdateDivider=#AudioDivider#
IfCondition=MeasureStripHide = 1
IfTrueAction=[!HideFade]
IfFalseAction=[!ShowFade]

[MeasureStripComeUp]
; at the first update only (before the window is put on screen): a strip that rests hidden comes up hidden, instead of
; fading out in view. One that rests in view (a Notice, a refused player) comes up in view
Measure=Calc
Formula=MeasureStripHide
UpdateDivider=-1
IfCondition=MeasureStripComeUp = 1
IfTrueAction=[!Hide]

; ---------------------------------------------------------------- the tooltip (everything the strip cannot print)
[MeasureHeaderMode]
; the track names the strip while it plays, or while it waits paused at rest
Measure=Calc
Formula=(MeasureState = 1) || ((MeasureState = 2) && (MeasureMode = 1))

[MeasureTipTitle]
Measure=String
String=[MeasureHeaderMode:0]␟[MeasureTrackText]
DynamicVariables=1
RegExpSubstitute=1
Substitute="^1␟(.+)$":"\1","^\d␟.*$":"#SpectrumWidget#"
Group=Tip
OnChangeAction=[!UpdateMeter MeterHitArea][!Redraw]

[MeasureTipText]
; by mode, the player's state and access (at rest, a refused player says where to allow it)
Measure=String
String=[MeasureMode:0][MeasureState:0][MeasureAccessOn:0]
DynamicVariables=1
RegExpSubstitute=1
Substitute="^1.1$":"#NowPlayingTip3#","^0..$":"#SpectrumTipLive#","^12.$":"#SpectrumTipPaused#","^1..$":"#SpectrumTipRest#","^2..$":"#SpectrumTipAudio#","^3..$":"#SpectrumTipScreen#"
Group=Tip
OnChangeAction=[!UpdateMeter MeterHitArea][!Redraw]

; ---------------------------------------------------------------- meters
[MeterHitArea]
; the whole strip drags, takes the right-click and the click (it opens the player), and carries the tooltip
Meter=Shape
Shape=Rectangle 0,0,740,110 | Fill Color 0,0,0,1 | StrokeWidth 0
LeftMouseUpAction=#OpenAction#
ToolTipTitle=[MeasureTipTitle]
ToolTipText=[MeasureTipText]
DynamicVariables=1
UpdateDivider=-1

[MeterScrim]
; under white ink while the bars move: one static image, 18 % black at its middle fading to nothing inside the strip
; (per-bar halos would cost far more at 30 Hz); dark ink needs none
Meter=Image
ImageName=#@#Spectrum/Scrim@2x.png
X=0
Y=0
W=740
H=110
Hidden=(([MeasureInkDark:] = 1) || (#Resting# = 1))
DynamicVariables=1
UpdateDivider=-1
Group=Ink

[sStripBar]
; a bar: 6 wide, from y 10 to its foot at 100, white at load (the ink's colour is pushed with !SetOptionGroup). Flat
; until Deskset rounds Bar meters (E20 reads MacCornerRadius; ignored until then)
BarColor=255,255,255,255
BarOrientation=Vertical
Y=10
W=6
H=90
MacCornerRadius=3
Hidden=1
UpdateDivider=-1

