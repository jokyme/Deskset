[MeterIdlePlay]
; at rest: play (17 pt, 16 × 18) in a 36 × 36 hit box on (180, 78); it opens the player while the player is closed.
; Left out of the rest with Show Track: Off
Meter=Image
MeterStyle=sHit
ImageName=sf:play.fill
MacSymbolSize=17
MacSymbolWeight=Semibold
ImageTint=#SecondaryTextColor#
X=162
Y=60
W=16
H=18
Padding=10,9,10,9
MouseOverAction=[!ShowMeter MeterIdlePad][!Redraw]
MouseLeaveAction=[!HideMeter MeterIdlePad][!Redraw]
