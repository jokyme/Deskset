LeftMouseUpAction=[!SetOption MeterIdlePad Shape "Ellipse 180,78,18 | Fill Color #HoverColor# | StrokeWidth 0"][!UpdateMeter MeterIdlePad][!CommandMeasure MeasureTitle "#PlayCommand#"][!Redraw]
