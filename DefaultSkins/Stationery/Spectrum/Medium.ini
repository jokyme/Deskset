; Stationery · Spectrum, medium (360 × 170): 32 bars of the sound the Mac plays, from 40 Hz on the left to 16 kHz on
; the right, under a header that names the playing track. Original work, MIT licensed.

[Rainmeter]
; the sound and the bars about 30 times a second while they move, everything else once a second; at rest the whole
; widget once a second (the tempo, Audio.inc)
Update=#SpectrumTick#
DefaultUpdateDivider=#SpectrumDivider#
AccurateText=1
SkinWidth=360
SkinHeight=170
DynamicWindowSize=0
; the suite, and the suite settings it shows (a setting refreshes only its own group)
Group=Stationery | StationeryMedia
; the window's own look, once Deskset reads it (until then it is macOS's)
MacAppearance=#LookAppearance#
ContextTitle=[#MediaOpen[#PlayerIndex[#Player]]]
ContextAction=#OpenAction#
ContextTitle2=---
ContextTitle3=[#SpectrumMenuBars[#SpectrumBars]]
ContextAction3=[!WriteKeyValue Variables SpectrumBars "[#BarsNext[#ShowSpectrumTrack][#SpectrumBars]]" "#@#Variables.inc"][!Refresh]
ContextTitle4=[#SpectrumMenuMotion[#SpectrumMotion]]
ContextAction4=[!WriteKeyValue Variables SpectrumMotion "[#MotionNext[#SpectrumMotion]]" "#@#Variables.inc"][!Refresh]
ContextTitle5=[#SpectrumMenuShowTrack[#ShowSpectrumTrack]]
ContextAction5=[!WriteKeyValue Variables ShowSpectrumTrack "[#Flip[#ShowSpectrumTrack]]" "#@#Variables.inc"][!WriteKeyValue Variables SpectrumBars "[#BarsAfterTrack[#ShowSpectrumTrack][#SpectrumBars]]" "#@#Variables.inc"][!Refresh]
ContextTitle6=#MenuPlayerTitle#
ContextAction6=#MenuPlayerAction#
ContextTitle7=---
ContextTitle8=#MenuLookTitle#
ContextAction8=#MenuLookAction#
ContextTitle9=#MenuCardsTitle#
ContextAction9=#MenuCardsAction#
ContextTitle10=#MenuLanguageTitle#
ContextAction10=#MenuLanguageAction#

[Metadata]
Name=Spectrum
Author=Deskset
License=MIT
Version=1.0
Information=Stationery · Spectrum draws the sound your Mac plays: 32 bars from 40 Hz on the left to 16 kHz on the right (the Strip: 64 bars, no card). macOS asks once for System Audio Recording. Before macOS 14.2 it asks for Screen Recording instead, and Deskset must be quit and reopened. Nothing is recorded or saved. While Spectrum is loaded, macOS shows its purple recording indicator in the menu bar and keeps your audio output device running. The track name comes from Music or Spotify, which asks for Automation the first time one of them is open; turn off Show Track to skip that. Click to open Music.

[Variables]
@Include=#@#Variables.inc
@Include2=#@#Suite/Tokens.inc
@Include3=#@#Suite/Styles.inc
@Include4=#@#Media/Media.inc
CardW=360
CardH=170
; 32 bands; a silent one still draws a 7 pt stub: a bar is 7 + 107 × the band (0-1) tall, of 114
Bands=32
BandMin=(-7 / 107)
; where the Notices lead: Privacy & Security › Screen & System Audio Recording
PrivacyPane=x-apple.systempreferences:com.apple.preference.security?Privacy_ScreenCapture
; the tempo (Audio.inc): Live or Rest. The widget rewrites these two lines itself; it ships Live
Tempo=Live
TempoLive=1
@Include5=#@#Spectrum/Track-#ShowSpectrumTrack#.inc
@Include6=#@#Spectrum/Bars-#SpectrumBars#.inc
@Include7=#@#Spectrum/Audio.inc
@Include8=#@#Spectrum/Bands32.inc
; Bars: Album Art, per look: a dark colour of the cover on light glass, a light one on dark and clear glass
CoverPickLight=Dark2
CoverPickDark=Light1
; at rest: the label sits in the card's middle when there is no play button (Show Track: Off)
IdleLabelY1=(112 - #Ascent11#)
IdleLabelY0=(96 - #Ascent11#)
PlayGroup1=Rest
PlayGroup0=None
; the Notices' words, by mode (2 System Audio Recording, 3 Screen Recording)
NoticeTitle0=
NoticeTitle1=
NoticeTitle2=#SpectrumAllowAudioTitle#
NoticeTitle3=#SpectrumAllowScreenTitle#
NoticeBody0=
NoticeBody1=
NoticeBody2=#SpectrumAllowAudioBody#
NoticeBody3=#SpectrumAllowScreenBody#
; the Bars item: Pink → Album Art → Accent Color → Mono (Album Art needs the track: skipped with Show Track: Off)
BarsNext1Media=Cover
BarsNext1Cover=Accent
BarsNext1Accent=Mono
BarsNext1Mono=Media
BarsNext0Media=Accent
BarsNext0Accent=Mono
BarsNext0Mono=Media
BarsNext0Cover=Media
; turning Show Track off takes Album Art back to Pink
BarsAfterTrack1Cover=Media
BarsAfterTrack1Media=Media
BarsAfterTrack1Accent=Accent
BarsAfterTrack1Mono=Mono
BarsAfterTrack0Media=Media
BarsAfterTrack0Accent=Accent
BarsAfterTrack0Mono=Mono
BarsAfterTrack0Cover=Cover
; what a new track updates, and what each mode shows (MeasureMode, Audio.inc). A section reads a new UpdateDivider at
; its next update, and at -1 it has none: the bands and bars are updated once when they wake, so they start moving
TrackChangedActions=[!UpdateMeter MeterHeaderTitle][!UpdateMeasureGroup Tip][!Redraw]
LiveActions=[!SetOptionGroup Audio UpdateDivider 1][!SetOptionGroup Bands UpdateDivider 1][!SetOptionGroup Bars UpdateDivider 1][!UpdateMeasureGroup Bands][!UpdateMeterGroup Bars][!HideMeterGroup Rest][!HideMeterGroup Notice][!HideMeter MeterIdlePad][!ShowMeterGroup Bars][!UpdateMeasureGroup Tip][!Redraw]#ToLiveNow#
RestActions=[!SetOptionGroup Audio UpdateDivider #AudioDivider#][!SetOptionGroup Bands UpdateDivider -1][!SetOptionGroup Bars UpdateDivider -1][!HideMeterGroup Bars][!HideMeterGroup Notice][!ShowMeterGroup Rest][!UpdateMeasureGroup Tip][!Redraw]#ToRestNow#
NoticeAudioActions=[!SetOptionGroup Audio UpdateDivider #AudioDivider#][!SetOptionGroup Bands UpdateDivider -1][!SetOptionGroup Bars UpdateDivider -1][!HideMeterGroup Bars][!HideMeterGroup Rest][!HideMeter MeterIdlePad][!ShowMeterGroup Notice][!UpdateMeterGroup Notice][!UpdateMeasureGroup Tip][!Redraw]
NoticeScreenActions=#NoticeAudioActions#

; ---------------------------------------------------------------- what the rest shows
[MeasureIdleState]
; a paused track at rest: "Paused"
Measure=Calc
Formula=MeasureState
IfCondition=MeasureIdleState = 2
IfTrueAction=[!SetOption MeterIdleLabel Text "#SpectrumPaused#"][!UpdateMeter MeterIdleLabel][!Redraw]
IfFalseAction=[!SetOption MeterIdleLabel Text "#NowPlayingNotPlaying#"][!UpdateMeter MeterIdleLabel][!Redraw]

[MeasureIdlePlayer]
; commands never launch a closed player, so play opens it first
Measure=Calc
Formula=MeasureStatus
IfCondition=MeasureIdlePlayer = 1
IfTrueAction=[!SetVariable PlayCommand "PlayPause"][!SetOption MeterIdlePlay ToolTipText "#SpectrumPlay#"][!UpdateMeter MeterIdlePlay]
IfFalseAction=[!SetVariable PlayCommand "OpenPlayer"][!SetOption MeterIdlePlay ToolTipText "[#MediaOpen[#PlayerIndex[#Player]]]"][!UpdateMeter MeterIdlePlay]

; ---------------------------------------------------------------- the header and the tooltip
[MeasureHeaderMode]
; the track shows while it plays, or while it waits paused and the card rests; otherwise the header is "Spectrum"
Measure=Calc
Formula=(MeasureState = 1) || ((MeasureState = 2) && (MeasureMode = 1))
IfCondition=MeasureHeaderMode = 1
IfTrueAction=[!SetOption MeterHeaderTitle Text "%1"][!UpdateMeter MeterHeaderTitle][!Redraw]
IfFalseAction=[!SetOption MeterHeaderTitle Text "#SpectrumWidget#"][!UpdateMeter MeterHeaderTitle][!Redraw]

[MeasureTipTitle]
; the track, or "Spectrum"
Measure=String
String=[MeasureHeaderMode:0]␟[MeasureTrackText]
DynamicVariables=1
RegExpSubstitute=1
Substitute="^1␟(.+)$":"\1","^\d␟.*$":"#SpectrumWidget#"
Group=Tip
OnChangeAction=[!UpdateMeter MeterCard][!Redraw]

[MeasureTipText]
; by mode and the player's state: live, at rest, paused at rest, and the two Notices
Measure=String
String=[MeasureMode:0][MeasureState:0]
DynamicVariables=1
RegExpSubstitute=1
Substitute="^0.$":"#SpectrumTipLive#","^12$":"#SpectrumTipPaused#","^1.$":"#SpectrumTipRest#","^2.$":"#SpectrumTipAudio#","^3.$":"#SpectrumTipScreen#"
Group=Tip
OnChangeAction=[!UpdateMeter MeterCard][!Redraw]

; ---------------------------------------------------------------- meters
[MeterCard]
Meter=Shape
MeterStyle=sCard
ToolTipTitle=[MeasureTipTitle]
ToolTipText=[MeasureTipText]
UpdateDivider=-1

[MeterNoticeHit]
; a Notice: the whole card opens the privacy pane
Meter=Shape
Shape=Rectangle 0,0,#CardW#,#CardH#,#CardRadius# | Fill Color 0,0,0,1 | StrokeWidth 0
LeftMouseUpAction=["#PrivacyPane#"]
Hidden=1
UpdateDivider=-1
Group=Notice

[MeterHeaderSymbol]
; waveform, natural 14 × 14 on the leading slot (26, 23), in the bars' colour whatever it is
Meter=Image
MeterStyle=sSymbolS
ImageName=sf:waveform
ImageTint=#BarTint#
X=19
Y=16
W=14
H=14
UpdateDivider=-1
Group=Header

[MeterHeaderTitle]
; "Gymnopédie No. 1 · Erik Satie" while it plays (MeasureHeaderMode), else "Spectrum"; clipped at x 344
Meter=String
MeterStyle=sLabel | sHeaderTitle
MeasureName=MeasureTrackText
Text=#SpectrumWidget#
W=303
UpdateDivider=-1
Group=Header

[sSpectrumBar]
; a bar: 7 wide, from y 40 to its foot at 154. Flat until Deskset rounds Bar meters (E20 reads MacCornerRadius and
; MacBarColor2, a fade to α 153 at the top; ignored until then). No DynamicVariables at 30 Hz: a new colour is pushed
; once, with !SetOptionGroup
BarColor=#BarTint#
BarOrientation=Vertical
Y=40
W=7
H=114
MacCornerRadius=3.5
MacBarColor2=#BarTint2#
Hidden=1
UpdateDivider=-1

