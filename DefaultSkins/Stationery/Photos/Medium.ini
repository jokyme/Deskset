; Stationery · Photo Frame, medium (360 × 170): a photo from a folder on your Mac, a new one every 10 minutes.
; Original work, MIT licensed.

[Rainmeter]
Update=1000
AccurateText=1
SkinWidth=360
SkinHeight=170
DynamicWindowSize=0
Group=Stationery
; the window's own look, once Deskset reads it (until then it is macOS's)
MacAppearance=#LookAppearance#
; the right-click items: their titles from two tables (with a photo and without), their actions through MeasureMenu
ContextTitle=[#PhotoMenu1_[#HasPhoto]]
ContextAction=[!SetVariable MenuItem "(10 + #HasPhoto#)"][!UpdateMeasure MeasureMenu]
ContextTitle2=[#PhotoMenu2_[#HasPhoto]]
ContextAction2=[!SetVariable MenuItem "(20 + #HasPhoto#)"][!UpdateMeasure MeasureMenu]
ContextTitle3=[#PhotoMenu3_[#HasPhoto]]
ContextAction3=[!SetVariable MenuItem "(30 + #HasPhoto#)"][!UpdateMeasure MeasureMenu]
ContextTitle4=[#PhotoMenu4_[#HasPhoto]]
ContextAction4=[!SetVariable MenuItem "(40 + #HasPhoto#)"][!UpdateMeasure MeasureMenu]
ContextTitle5=[#PhotoMenu5_[#HasPhoto]]
ContextAction5=[!SetVariable MenuItem "(50 + #HasPhoto#)"][!UpdateMeasure MeasureMenu]
ContextTitle6=[#PhotoMenu6_[#HasPhoto]]
ContextAction6=[!SetVariable MenuItem "(60 + #HasPhoto#)"][!UpdateMeasure MeasureMenu]
ContextTitle7=[#PhotoMenu7_[#HasPhoto]]
ContextAction7=[!SetVariable MenuItem "(70 + #HasPhoto#)"][!UpdateMeasure MeasureMenu]
ContextTitle8=[#PhotoMenu8_[#HasPhoto]]
ContextAction8=[!SetVariable MenuItem "(80 + #HasPhoto#)"][!UpdateMeasure MeasureMenu]
ContextTitle9=[#PhotoMenu9_[#HasPhoto]]
ContextAction9=[!SetVariable MenuItem "(90 + #HasPhoto#)"][!UpdateMeasure MeasureMenu]
ContextTitle10=[#PhotoMenu10_[#HasPhoto]]
ContextAction10=[!SetVariable MenuItem "(100 + #HasPhoto#)"][!UpdateMeasure MeasureMenu]

[Metadata]
Name=Photo Frame
Author=Deskset
License=MIT
Version=1.0
Information=Stationery · Photos from a folder on your Mac, a new one every 10 minutes. Until you choose a folder it shows your Pictures folder. Click a photo for the next one. A folder in Desktop, Documents or Downloads, or on another disk, makes macOS ask once. The Photos library can't be shown: export pictures to a folder.

[Variables]
@Include=#@#Variables.inc
@Include2=#@#Suite/Tokens.inc
@Include3=#@#Suite/Styles.inc
@Include4=#@#Photos/Strings-#Language#.inc
CardW=360
CardH=170
CardMask=Card-Medium.png
; the folder you chose: empty shows your Pictures folder. Stationery.inc comes after, so the folder chosen there wins
PhotoFolder=
@Include5=#StationeryFile#
@Include6=#@#Photos/Photos.inc
@Include7=#@#Photos/Notice-Wide.inc
