; ---------------------------------------------------------------- with one or two volumes: a hint, centred in the space
; the empty slots leave (with three, the fourth slot stays blank)
[MeterEmptySymbol]
; externaldrive 20 pt, natural 29 × 20
Meter=Image
MeterStyle=sNoticeSymbol
ImageName=sf:externaldrive
ImageTint=#TertiaryTextColor#
X=165.5
Y=(([MeasureOtherCount:] = 0) ? 180 : 215)
W=29
H=20
Hidden=((#ListReady# = 0) || ([MeasureOtherCount:] > 1))
DynamicVariables=1
UpdateDivider=-1
Group=Volumes

[MeterEmptyText]
Meter=String
MeterStyle=sCaption
FontColor=#TertiaryTextColor#
StringAlign=Center
X=180
Y=((([MeasureOtherCount:] = 0) ? 220 : 255) - #Ascent11#)
Text=#StorageEmptyHint#
Hidden=((#ListReady# = 0) || ([MeasureOtherCount:] > 1))
DynamicVariables=1
UpdateDivider=-1
Group=Volumes

; ---------------------------------------------------------------- the Trash: its items on the last baseline (341)

[MeterSeparator]
Meter=Shape
X=16
Y=316.75
Shape=Rectangle 0,0,328,0.5 | Fill Color #SeparatorColor# | StrokeWidth 0
Hidden=#TrashRowHidden#
DynamicVariables=1
UpdateDivider=-1
Group=Trash

[MeterTrashPad]
; the row's hover pad and hit area: a click opens the Trash ("Empty Trash…" is in the menu)
Meter=Shape
X=8
Y=323.4
Shape=Rectangle 0,0,344,26,#RowPadRadius# | Fill Color #TrashPadColor# | StrokeWidth 0
MouseOverAction=[!SetVariable TrashPadColor "#HoverColor#"][!UpdateMeter MeterTrashPad][!Redraw]
MouseLeaveAction=[!SetVariable TrashPadColor "0,0,0,1"][!UpdateMeter MeterTrashPad][!Redraw]
LeftMouseUpAction=[!CommandMeasure MeasureTrash "OpenBin"]
