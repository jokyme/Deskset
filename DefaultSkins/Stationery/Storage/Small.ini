; Stationery · Storage, small (170 × 170): one disk's available space. Original work, MIT licensed.

[Rainmeter]
Update=1000
AccurateText=1
SkinWidth=170
SkinHeight=170
DynamicWindowSize=0
Group=Stationery
; the window's own look, once Deskset reads it (until then it is macOS's)
MacAppearance=#LookAppearance#
ContextTitle=#StorageMenuOpen#
ContextAction=#OpenAction#
ContextTitle2=---
ContextTitle3=#StorageMenuVolume##StorageSmallVolumeName#
ContextAction3=[!WriteKeyValue Variables StorageSmallVolume "[MeasureSmallNextName]" "#@#Variables.inc"][!WriteKeyValue Variables StorageSmallVolumeName "[MeasureSmallNextLabel]" "#@#Variables.inc"][!Refresh]
ContextTitle4=---
ContextTitle5=#MenuLookTitle#
ContextAction5=#MenuLookAction#
ContextTitle6=#MenuCardsTitle#
ContextAction6=#MenuCardsAction#

[Metadata]
Name=Storage
Author=Deskset
License=MIT
Version=1.0
Information=Stationery · How much space a disk has: the startup disk, or the one chosen in the menu. Click to open Storage settings.

[Variables]
@Include=#@#Storage/Settings.inc
@Include2=#@#Variables.inc
@Include3=#@#Suite/Tokens.inc
@Include4=#@#Suite/Styles.inc
@Include5=#@#Storage/Strings-#Language#.inc
@Include6=#@#Storage/Source-#StorageSource#.inc
@Include7=#@#Storage/Volumes.inc
CardW=170
CardH=170
OpenAction=["x-apple.systempreferences:com.apple.settings.Storage"]
; the volumes shown (0: the Small's one volume), whether the Trash is, and whether its row is hidden
StorageSlots=0
StorageShowsTrash=0
TrashRowHidden=1
; the card's sentence
StorageSentence=

; ---------------------------------------------------------------- the card
[MeterCard]
Meter=Shape
MeterStyle=sCard
ToolTipTitle=[MeasureSmallLabel]
ToolTipText=[MeasureSmallTip]
UpdateDivider=30
Group=Volumes

; ---------------------------------------------------------------- the volume
[MeterHeaderSymbol]
; internaldrive.fill (another volume: externaldrive.fill) 11 pt, natural 16 × 12, centred on the leading slot
Meter=Image
MeterStyle=sSymbolS
ImageName=sf:[MeasureSmallGlyph]
ImageTint=#StorageColor#
X=18
Y=17
W=16
H=12
DynamicVariables=1
UpdateDivider=10
Group=Volumes | SmallVolume

[MeterHeaderTitle]
; the volume's name
Meter=String
MeterStyle=sLabel | sHeaderTitle
MeasureName=MeasureSmallLabel
UpdateDivider=10
Group=Volumes | SmallVolume

[MeterHero]
; "118 GB" on the hero baseline (83), "-- GB" in Tertiary while loading
Meter=String
MeterStyle=sMetricXL | sUnit | sMissing
MeasureName=MeasureSmallAvailText
X=16
Y=(#HeroBaselineXL# - #Ascent40#)
W=138
ClipString=1
UpdateDivider=10
Group=Volumes | SmallVolume

[MeterCaption]
; "available of 995 GB" on baseline 101
Meter=String
MeterStyle=sCaption
MeasureName=MeasureSmallCaption
X=16
Y=(101 - #Ascent11#)
W=138
ClipString=1
UpdateDivider=10
Group=Volumes | SmallVolume

[MeterBar]
; the storage colour, red from 95 % used; the track takes the level's colour; no fill while loading
Meter=Shape
X=16
Y=129
Shape=Rectangle 0,0,138,5,2.5 | Fill Color #SmallColor#,#TrackAlpha# | StrokeWidth 0
Shape2=Rectangle 0,0,(([MeasureSmallUsed:] < 0) ? 0 : Max(5, 138 * [MeasureSmallUsed:] / 100)),5,2.5 | Fill Color #SmallColor# | StrokeWidth 0
DynamicVariables=1
UpdateDivider=10
Group=Volumes | SmallVolume

[MeterLegend]
; "88% used" on the last baseline, in Tertiary (CriticalTextColor from 95 %)
Meter=String
MeterStyle=sCaption
MeasureName=MeasureSmallLegend
FontColor=#SmallPctColor#
X=16
Y=(#LastBaseline# - #Ascent11#)
W=138
ClipString=1
DynamicVariables=1
UpdateDivider=10
Group=Volumes | SmallVolume

; ---------------------------------------------------------------- the volume is not connected: a Notice, whose link (and
; the whole card) goes back to the startup disk
[MeterNoticeHit]
Meter=Image
MeterStyle=sHit
X=0
Y=0
W=170
H=170
LeftMouseUpAction=#SmallShowStartup#
ToolTipTitle=#StorageSmallVolumeName#
ToolTipText=#StorageTipNotConnected#
Hidden=1
UpdateDivider=-1
Group=Notice

[MeterNoticeSymbol]
; externaldrive 20 pt, natural 29 × 20, centred on (85, 48)
Meter=Image
MeterStyle=sNoticeSymbol
ImageName=sf:externaldrive
X=70.5
Y=38
W=29
H=20
Hidden=1
UpdateDivider=-1
Group=Notice

[MeterNoticeTitle]
; the volume's name, as it was when it was chosen
Meter=String
MeterStyle=sBodyStrong | sNoticeTitleSmall
Text=#StorageSmallVolumeName#
Hidden=1
UpdateDivider=-1
Group=Notice

[MeterNoticeBody]
Meter=String
MeterStyle=sCaption | sNoticeBodySmall
Text=#StorageNotConnected#
Hidden=1
UpdateDivider=-1
Group=Notice

[MeterNoticeAction]
; "Show Macintosh HD"
Meter=String
MeterStyle=sLabel | sNoticeActionSmall
MeasureName=MeasureSlot1Label
Text=#StorageShow#
LeftMouseUpAction=#SmallShowStartup#
Hidden=1
UpdateDivider=10
Group=Notice
