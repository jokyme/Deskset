; Stationery · Storage, medium (360 × 170): the startup disk and the first other volume (or the Trash).
; Original work, MIT licensed.

[Rainmeter]
Update=1000
AccurateText=1
SkinWidth=360
SkinHeight=170
DynamicWindowSize=0
Group=Stationery
; the window's own look, once Deskset reads it (until then it is macOS's)
MacAppearance=#LookAppearance#
ContextTitle=#StorageMenuOpen#
ContextAction=#OpenAction#
ContextTitle2=---
ContextTitle3=#StorageMenuEmptyTrash#
ContextAction3=[!CommandMeasure MeasureTrash "EmptyBin"]
ContextTitle4=---
ContextTitle5=#MenuLookTitle#
ContextAction5=#MenuLookAction#
ContextTitle6=#MenuCardsTitle#
ContextAction6=#MenuCardsAction#
ContextTitle7=#MenuLanguageTitle#
ContextAction7=#MenuLanguageAction#

[Metadata]
Name=Storage
Author=Deskset
License=MIT
Version=1.0
Information=Stationery · How much space your disks have: the startup disk and any disk you connect. Small: one disk. Medium: two. Large: four and the Trash. "Empty Trash…" asks once to control Finder.

[Variables]
@Include=#@#Storage/Settings.inc
@Include2=#@#Variables.inc
@Include3=#@#Suite/Tokens.inc
@Include4=#@#Suite/Styles.inc
@Include5=#@#Storage/Strings-#Language#.inc
@Include6=#@#Storage/Source-#StorageSource#.inc
@Include7=#@#Storage/Volumes.inc
CardW=360
CardH=170
OpenAction=["x-apple.systempreferences:com.apple.settings.Storage"]
; the volumes shown (0: the Small's one volume), whether the Trash is, and whether its row is hidden
StorageSlots=2
StorageShowsTrash=1
TrashRowHidden=1
; the card's sentence
StorageSentence=[MeasureSlot1Sentence][MeasureSlot2Sentence][MeasureMoreSentence]

; ---------------------------------------------------------------- the card and the header
[MeterCard]
Meter=Shape
MeterStyle=sCard
ToolTipTitle=#StorageTitle#
ToolTipText=[MeasureSentence]
UpdateDivider=30
Group=Volumes

[MeterHeaderSymbol]
; internaldrive.fill 11 pt, natural 16 × 12, centred on the leading slot (26, 23)
Meter=Image
MeterStyle=sSymbolS
ImageName=sf:internaldrive.fill
ImageTint=#StorageColor#
X=18
Y=17
W=16
H=12
UpdateDivider=-1

[MeterHeaderTitle]
Meter=String
MeterStyle=sLabel | sHeaderTitle
W=240
Text=#StorageTitle#
UpdateDivider=-1

[MeterHeaderTrailing]
; "+2 more": the volumes the card has no room for
Meter=String
MeterStyle=sCaption | sHeaderTrailing
MeasureName=MeasureMoreText
UpdateDivider=-1
Group=Volumes

; ---------------------------------------------------------------- volume 1: name on baseline 59
[MeterSlot1Pad]
; the block's hover pad and hit area: a click opens the volume in Finder. It has no pressed state: a
; LeftMouseDownAction would stop the card from being dragged by its volumes
Meter=Shape
Shape=Rectangle 8,42,344,55,#RowPadRadius# | Fill Color #Slot1PadColor# | StrokeWidth 0
MouseOverAction=[!SetVariable Slot1Hover 1][!SetVariable Slot1PadColor "#HoverColor#"][!UpdateMeter MeterSlot1Pad][!Redraw]
MouseLeaveAction=[!SetVariable Slot1Hover 0][!SetVariable Slot1PadColor "0,0,0,1"][!UpdateMeter MeterSlot1Pad][!Redraw]
LeftMouseUpAction=["/"]
ToolTipTitle=[MeasureSlot1Label]
ToolTipText=[MeasureSlot1Tip]
DynamicVariables=1
UpdateDivider=10
Group=Volumes

[MeterSlot1Glyph]
; internaldrive 13 pt, natural 19 × 14, centred on the leading slot (26, 59 − 4.6)
Meter=Image
MeterStyle=sSymbolM
ImageName=sf:internaldrive
ImageTint=#Slot1Color#
X=16.5
Y=47.4
W=19
H=14
DynamicVariables=1
UpdateDivider=10
Group=Volumes

[MeterSlot1Name]
Meter=String
MeterStyle=sBodyStrong
MeasureName=MeasureSlot1Label
X=41
Y=(59 - #Ascent13#)
W=257
ClipString=1
UpdateDivider=10
Group=Volumes

[MeterSlot1Percent]
; ink, CriticalTextColor from 95 %, "--%" in Tertiary while loading
Meter=String
MeterStyle=sValue | sMissing
MeasureName=MeasureSlot1PctText
FontColor=#Slot1PctColor#
StringAlign=Right
X=344
Y=(59 - #Ascent13#)
DynamicVariables=1
UpdateDivider=10
Group=Volumes

[MeterSlot1Bar]
; the track takes the level's colour too, so a nearly full bar never ends in an orange stub; no fill while loading
Meter=Shape
X=16
Y=66.5
Shape=Rectangle 0,0,328,5,2.5 | Fill Color #Slot1Color#,#TrackAlpha# | StrokeWidth 0
Shape2=Rectangle 0,0,(([MeasureSlot1Used:] < 0) ? 0 : Max(5, 328 * [MeasureSlot1Used:] / 100)),5,2.5 | Fill Color #Slot1Color# | StrokeWidth 0
DynamicVariables=1
UpdateDivider=10
Group=Volumes

[MeterSlot1Caption]
; "118 GB available of 995 GB" on baseline 87
Meter=String
MeterStyle=sCaption
MeasureName=MeasureSlot1Caption
X=16
Y=(87 - #Ascent11#)
W=290
ClipString=1
UpdateDivider=10
Group=Volumes

; ---------------------------------------------------------------- volume 2: name on baseline 123
[MeterSlot2Pad]
; the block's hover pad and hit area: a click opens the volume in Finder. It has no pressed state: a
; LeftMouseDownAction would stop the card from being dragged by its volumes
Meter=Shape
Shape=Rectangle 8,106,344,55,#RowPadRadius# | Fill Color #Slot2PadColor# | StrokeWidth 0
MouseOverAction=[!SetVariable Slot2Hover 1][!SetVariable Slot2PadColor "#HoverColor#"][!UpdateMeter MeterSlot2Pad][!UpdateMeterGroup Eject2][!Redraw]
MouseLeaveAction=[!SetVariable Slot2Hover 0][!SetVariable Slot2PadColor "0,0,0,1"][!HideMeter MeterSlot2EjectPad][!UpdateMeter MeterSlot2Pad][!UpdateMeterGroup Eject2][!Redraw]
LeftMouseUpAction=["[MeasureSlot2Path]"]
ToolTipTitle=[MeasureSlot2Label]
ToolTipText=[MeasureSlot2Tip]
DynamicVariables=1
UpdateDivider=10
Group=Volumes | Slot2

[MeterSlot2Glyph]
; externaldrive 13 pt, natural 19 × 14, centred on the leading slot (26, 123 − 4.6)
Meter=Image
MeterStyle=sSymbolM
ImageName=sf:externaldrive
ImageTint=#Slot2Color#
X=16.5
Y=111.4
W=19
H=14
DynamicVariables=1
UpdateDivider=10
Group=Volumes | Slot2

[MeterSlot2Name]
Meter=String
MeterStyle=sBodyStrong
MeasureName=MeasureSlot2Label
X=41
Y=(123 - #Ascent13#)
W=257
ClipString=1
UpdateDivider=10
Group=Volumes | Slot2

[MeterSlot2Percent]
; ink, CriticalTextColor from 95 %, "--%" in Tertiary while loading
Meter=String
MeterStyle=sValue | sMissing
MeasureName=MeasureSlot2PctText
FontColor=#Slot2PctColor#
StringAlign=Right
X=344
Y=(123 - #Ascent13#)
DynamicVariables=1
UpdateDivider=10
Group=Volumes | Slot2

[MeterSlot2Bar]
; the track takes the level's colour too, so a nearly full bar never ends in an orange stub; no fill while loading
Meter=Shape
X=16
Y=130.5
Shape=Rectangle 0,0,328,5,2.5 | Fill Color #Slot2Color#,#TrackAlpha# | StrokeWidth 0
Shape2=Rectangle 0,0,(([MeasureSlot2Used:] < 0) ? 0 : Max(5, 328 * [MeasureSlot2Used:] / 100)),5,2.5 | Fill Color #Slot2Color# | StrokeWidth 0
DynamicVariables=1
UpdateDivider=10
Group=Volumes | Slot2

[MeterSlot2Caption]
; "118 GB available of 995 GB" on baseline 151
Meter=String
MeterStyle=sCaption
MeasureName=MeasureSlot2Caption
X=16
Y=(151 - #Ascent11#)
W=290
ClipString=1
UpdateDivider=10
Group=Volumes | Slot2

[MeterSlot2EjectPad]
; the eject button's disc, while the pointer is on the button
Meter=Shape
Shape=Ellipse 329,147.1,12 | Fill Color #Slot2EjectFill# | StrokeWidth 0
Hidden=1
DynamicVariables=1
UpdateDivider=-1
Group=Volumes | Eject2

[MeterSlot2Eject]
; Finder's eject button, at the end of the caption line while the pointer is on the volume: eject.fill 11 pt,
; natural 14 × 13, centred on the disc (329, 147.1); the padding makes its 28 × 28 hit box, x 315–343
Meter=Image
MeterStyle=sSymbolS
ImageName=sf:eject.fill
ImageTint=#SecondaryTextColor#
X=315
Y=133.1
W=14
H=13
Padding=7,7.5,7,7.5
SolidColor=0,0,0,1
Hidden=(1 - #Slot2Hover# * #Slot2Ejectable#)
MouseOverAction=[!ShowMeter MeterSlot2EjectPad][!Redraw]
MouseLeaveAction=[!HideMeter MeterSlot2EjectPad][!SetVariable Slot2EjectFill "#HoverColor#"][!UpdateMeter MeterSlot2EjectPad][!Redraw]
LeftMouseDownAction=[!SetVariable Slot2EjectFill "#PressedColor#"][!UpdateMeter MeterSlot2EjectPad][!Redraw]
LeftMouseUpAction=[!SetVariable Slot2EjectFill "#HoverColor#"][!UpdateMeter MeterSlot2EjectPad][!Redraw][!UpdateMeasure MeasureEject2][!CommandMeasure MeasureEject2 "Run"]
ToolTipText=#StorageEjectBefore#[MeasureSlot2Label]#StorageEjectAfter#
DynamicVariables=1
UpdateDivider=-1
Group=Volumes | Eject2

; ---------------------------------------------------------------- the Trash, in the second volume's place when the
; startup disk is alone: its items on baseline 151

[MeterSeparator]
Meter=Shape
X=16
Y=126.75
Shape=Rectangle 0,0,328,0.5 | Fill Color #SeparatorColor# | StrokeWidth 0
Hidden=#TrashRowHidden#
DynamicVariables=1
UpdateDivider=-1
Group=Trash

[MeterTrashPad]
; the row's hover pad and hit area: a click opens the Trash ("Empty Trash…" is in the menu). No pressed state,
; so the card still drags from here
Meter=Shape
X=8
Y=133.4
Shape=Rectangle 0,0,344,26,#RowPadRadius# | Fill Color #TrashPadColor# | StrokeWidth 0
MouseOverAction=[!SetVariable TrashPadColor "#HoverColor#"][!UpdateMeter MeterTrashPad][!Redraw]
MouseLeaveAction=[!SetVariable TrashPadColor "0,0,0,1"][!UpdateMeter MeterTrashPad][!Redraw]
LeftMouseUpAction=[!CommandMeasure MeasureTrash "OpenBin"]
ToolTipTitle=#StorageTrash#
ToolTipText=[MeasureTrashTip]
Hidden=#TrashRowHidden#
DynamicVariables=1
UpdateDivider=10
Group=Trash

[MeterTrashGlyph]
; trash 13 pt, natural 15 × 17
Meter=Image
MeterStyle=sSymbolM
ImageName=sf:trash
ImageTint=#SecondaryTextColor#
X=18.5
Y=137.9
W=15
H=17
Hidden=#TrashRowHidden#
DynamicVariables=1
UpdateDivider=-1
Group=Trash

[MeterTrashLabel]
Meter=String
MeterStyle=sBody
X=41
Y=(151 - #Ascent13#)
Text=#StorageTrash#
Hidden=#TrashRowHidden#
DynamicVariables=1
UpdateDivider=-1
Group=Trash

[MeterTrashCount]
; "12 items" ("--" in Tertiary until the first count)
Meter=String
MeterStyle=sValue | sUnit | sMissing
MeasureName=MeasureTrashText
StringAlign=Right
X=344
Y=(151 - #Ascent13#)
Hidden=((#TrashRowHidden# = 1) || ((#TrashReady# = 1) && ([MeasureTrash:] = 0)))
DynamicVariables=1
UpdateDivider=10
Group=Trash

[MeterTrashEmpty]
; "Empty"
Meter=String
MeterStyle=sBody
FontColor=#TertiaryTextColor#
StringAlign=Right
X=344
Y=(151 - #Ascent13#)
Text=#StorageTrashEmpty#
Hidden=((#TrashRowHidden# = 1) || (#TrashReady# = 0) || ([MeasureTrash:] > 0))
DynamicVariables=1
UpdateDivider=10
Group=Trash
