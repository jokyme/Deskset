; Stationery · Studio VU, medium (360 × 170): a stereo pair of analog VU meters. The needles swing with whatever the Mac
; is playing; under them sit the track, the time and the transport. While there is sound (or a track plays) the meters'
; lamps are on: warm ivory faces in the Light look, backlit amber in the Dark. After 3 s of quiet with nothing playing
; the lamps go down, the needles fall to the rest pin and the row says "Not Playing". Original work, MIT licensed.
;
; The faces are 164 × 98 at (12, 12) and (184, 12), corner 14 (the card's 26 less the 12 inset); everything on the
; right face is at x + 172. The needles' pivots are 22 below the faces, at (94, 132) and (266, 132). The scale is
; linear in amplitude, as a VU movement is: mark angle = −44° + 88° × (10^(dB/20) − 0.1) / 1.31254, clockwise from 12
; o'clock about the pivot (−20 VU at −44°, 0 VU at +16.34°, +3 at +44°); the needle rests on a pin at −48°.
;
; Until Deskset skips the redraw of a skin whose meters did not change, the skin runs at 33 ms only while it is lit
; and at 1 s while the lamps are down: going from one to the other it writes StudioLive in its own [Variables] and
; refreshes (Update and DefaultUpdateDivider follow it).

[Rainmeter]
Update=#StudioUpdateNow#
DefaultUpdateDivider=#StudioDividerNow#
AccurateText=1
SkinWidth=360
SkinHeight=170
DynamicWindowSize=0
Group=Stationery
; the window's own look, once Deskset reads it (until then it is macOS's)
MacAppearance=#LookAppearance#
ContextTitle=#MenuOpenPlayerTitle#
ContextAction=#OpenAction#
ContextTitle2=---
ContextTitle3=[#StudioMenuFace[#StudioFace]]
ContextAction3=[!WriteKeyValue Variables StudioFace [#StudioFaceNext[#StudioFace]] "#@#Variables.inc"][!Refresh]
ContextTitle4=[#StudioMenuSens[#StudioSens]]
ContextAction4=[!WriteKeyValue Variables StudioSens [#StudioSensNext[#StudioSens]] "#@#Variables.inc"][!Refresh]
ContextTitle5=[#StudioMenuSpeed[#StudioSpeed]]
ContextAction5=[!WriteKeyValue Variables StudioSpeed [#StudioSpeedNext[#StudioSpeed]] "#@#Variables.inc"][!Refresh]
ContextTitle6=[#StudioMenuPeak[#StudioPeak]]
ContextAction6=[!WriteKeyValue Variables StudioPeak [#StudioPeakNext[#StudioPeak]] "#@#Variables.inc"][!Refresh]
ContextTitle7=#MenuPlayerTitle#
ContextAction7=#MenuPlayerAction#
ContextTitle8=---
ContextTitle9=#MenuLookTitle#
ContextAction9=#MenuLookAction#
ContextTitle10=#MenuCardsTitle#
ContextAction10=#MenuCardsAction#

[Metadata]
Name=Studio VU
Author=Deskset
License=MIT
Version=1.0
Information=Stationery · A stereo pair of VU meters that swing with whatever your Mac plays, with the track from Music or Spotify under them. The meters show all of the Mac's sound, so they also move for videos and browsers while the row shows what Music or Spotify plays. They need permission to record system audio (on macOS 13 to 14.1, screen recording), and while the widget is on the desktop macOS shows its purple recording indicator. If you refuse, the needles rest; the lamps still light while Music or Spotify plays.

[Variables]
@Include=#@#Variables.inc
@Include2=#@#Suite/Tokens.inc
@Include3=#@#Suite/Styles.inc
@Include4=#@#Collection/Player.inc
@Include5=#@#StudioVU/Faces.inc
CardW=360
CardH=170
OpenAction=[!CommandMeasure MeasurePlayer "OpenPlayer"]
PlayPauseAction=[!CommandMeasure MeasurePlayer "PlayPause"][!UpdateMeasureGroup Player][!UpdateMeterGroup Row][!Redraw]
; ---------------------------------------------------------------- lit (1) or lamps down (0); the skin writes this line
StudioLive=1
StudioUpdate1=33
StudioUpdate0=1000
StudioUpdateNow=[#StudioUpdate[#StudioLive]]
; lit: text and players once a second (30 × 33 ms), the audio and needles every tick; down: everything once a second
StudioDivider1=30
StudioDivider0=1
StudioDividerNow=[#StudioDivider[#StudioLive]]
; the quiet counter's step: every half second while lit, every second while down
StudioLampDivider1=15
StudioLampDivider0=1
StudioLampDivider=[#StudioLampDivider[#StudioLive]]
; ---------------------------------------------------------------- the face (Ivory or Amber), by the setting and the look
StudioFaceAutoLight=Ivory
StudioFaceAutoDark=Amber
StudioFaceIvoryLight=Ivory
StudioFaceIvoryDark=Ivory
StudioFaceAmberLight=Amber
StudioFaceAmberDark=Amber
Face=[#StudioFace[#StudioFace][#LookTheme]]
PlateLit1=[#[#Face]PlateLit1]
PlateLit2=[#[#Face]PlateLit2]
PlateLit3=[#[#Face]PlateLit3]
PlateIdle1=[#[#Face]PlateIdle1]
PlateIdle2=[#[#Face]PlateIdle2]
PlateIdle3=[#[#Face]PlateIdle3]
FaceVeil=[#[#Face]FaceVeil]
LipTop=[#[#Face]LipTop]
LipClear=[#[#Face]LipClear]
SheenTop=[#[#Face]SheenTop]
Bezel=[#[#Face]Bezel]
FaceInk=[#[#Face]FaceInk]
ScaleRed=[#[#Face]ScaleRed]
ChanInk=[#[#Face]ChanInk]
PeakInk=[#[#Face]PeakInk]
NeedleShadow=[#[#Face]NeedleShadow]
CapTop=[#[#Face]CapTop]
CapBottom=[#[#Face]CapBottom]
CapRim=[#[#Face]CapRim]
CapHighlight=[#[#Face]CapHighlight]
VUInk=[#[#Face]VUInk]
LedOff=[#[#Face]LedOff]
; ---------------------------------------------------------------- the settings' values and the menu's next values
StudioFaceNextAuto=Ivory
StudioFaceNextIvory=Amber
StudioFaceNextAmber=Auto
; the linear RMS level that reads 0 VU: −12 dBFS (streaming with loudness normalisation hovers around 0 VU and kisses the
; red on peaks), −18 (quiet or classical recordings), −8 (loud masters)
ZeroRefNormal=0.2512
ZeroRefHigh=0.1259
ZeroRefLow=0.3981
ZeroRef=[#ZeroRef[#StudioSens]]
StudioSensNextNormal=High
StudioSensNextHigh=Low
StudioSensNextLow=Normal
; the needle's time constant (ms): about 300 ms to 99 % (the VU standard), or about 750 ms
NeedleTimeVU=77
NeedleTimeSlow=190
NeedleTime=[#NeedleTime[#StudioSpeed]]
StudioSpeedNextVU=Slow
StudioSpeedNextSlow=VU
; the PEAK lamp's threshold (linear peak)
PeakRef1=0.891
PeakRef3=0.708
PeakRef6=0.501
PeakRef=[#PeakRef[#StudioPeak]]
StudioPeakNext1=3
StudioPeakNext3=6
StudioPeakNext6=1
; the last cover's file (empty: the tile with its note)
CoverPath=

; ================================================================ styles

[sFace]
; a face's shapes: face-local coordinates (the meter at the face's corner)
Y=12
UpdateDivider=-1

[sNumeral]
; the scale's numerals, 8.5 pt dial print (every value is in the faces' tooltips)
FontFace=#FontNumber#
FontSize=6.375
FontWeight=600
FontColor=#FaceInk#
StringAlign=CenterCenter
AntiAlias=1
UpdateDivider=-1

[sNeedle]
; a Roundline from the cap's edge (r 42) to r 90.5; rest pin −48° (StartAngle 222°), travel 92°
StartAngle=3.8746
RotationAngle=1.6057
LineStart=42
LineLength=90.5
Solid=0
AntiAlias=1
UpdateDivider=1
Group=Needles

[sSidePad]
Hidden=1
UpdateDivider=-1

[sSideButton]
; backward.fill / forward.fill, 13 pt semibold (natural 20 × 13) in a 30 × 30 slot
MacSymbolSize=13
MacSymbolWeight=Semibold
ImageTint=#TextColor#
PreserveAspectRatio=1
W=20
H=13
Padding=5,8.5,5,8.5
SolidColor=0,0,0,1
Group=Skip | Row

; ================================================================ the audio (every tick while lit)

[MeasureAudio]
; the Mac's output. VU ballistics: Deskset's follower is one-pole on the mean square, so 99 % of a step in amplitude
; takes about 3.9 time constants (77 ms: about 300 ms)
Measure=Plugin
Plugin=AudioLevel
Port=Output
RMSAttack=#NeedleTime#
RMSDecay=#NeedleTime#
PeakAttack=0
PeakDecay=1000
UpdateDivider=1
Group=Audio


[MeasureRMSL]
Measure=Plugin
Plugin=AudioLevel
Parent=MeasureAudio
Type=RMS
Channel=L
UpdateDivider=1
Group=Audio

[MeasurePeakL]
Measure=Plugin
Plugin=AudioLevel
Parent=MeasureAudio
Type=Peak
Channel=L
UpdateDivider=1
Group=Audio


[MeasureRMSR]
Measure=Plugin
Plugin=AudioLevel
Parent=MeasureAudio
Type=RMS
Channel=R
UpdateDivider=1
Group=Audio

[MeasurePeakR]
Measure=Plugin
Plugin=AudioLevel
Parent=MeasureAudio
Type=Peak
Channel=R
UpdateDivider=1
Group=Audio


[MeasureZeroRef]
Measure=Calc
Formula=#ZeroRef#
UpdateDivider=-1

[MeasurePeakRef]
Measure=Calc
Formula=#PeakRef#
UpdateDivider=-1


[MeasureNeedleL]
; the VU fraction (−20 VU → 0, 0 VU → 0.686, +3 → 1), with a 4° rest zone left of −20: silence falls onto the pin
Measure=Calc
Formula=Clamp((4 + 88 * (MeasureRMSL / MeasureZeroRef - 0.1) / 1.31254) / 92, 0, 1)
MinValue=0
MaxValue=1
UpdateDivider=1
Group=Audio

[MeasurePeakHoldL]
; about a second (30 ticks) after each peak at or above the threshold
Measure=Calc
Formula=(MeasurePeakL >= MeasurePeakRef) ? 30 : Max(MeasurePeakHoldL - 1, 0)
UpdateDivider=1
Group=Audio
IfCondition=MeasurePeakHoldL > 0
IfTrueAction=[!ShowMeter MeterLedOnL][!Redraw]
IfFalseAction=[!HideMeter MeterLedOnL][!Redraw]

[MeasureVUL]
; the faces' tooltips: VU and peak dBFS (Log is base 10)
Measure=Calc
Formula=20 * Log(Max(MeasureRMSL, 0.00001) / MeasureZeroRef)

[MeasurePeakDbL]
Measure=Calc
Formula=20 * Log(Max(MeasurePeakL, 0.00001))


[MeasureNeedleR]
; the VU fraction (−20 VU → 0, 0 VU → 0.686, +3 → 1), with a 4° rest zone left of −20: silence falls onto the pin
Measure=Calc
Formula=Clamp((4 + 88 * (MeasureRMSR / MeasureZeroRef - 0.1) / 1.31254) / 92, 0, 1)
MinValue=0
MaxValue=1
UpdateDivider=1
Group=Audio

[MeasurePeakHoldR]
; about a second (30 ticks) after each peak at or above the threshold
Measure=Calc
Formula=(MeasurePeakR >= MeasurePeakRef) ? 30 : Max(MeasurePeakHoldR - 1, 0)
UpdateDivider=1
Group=Audio
IfCondition=MeasurePeakHoldR > 0
IfTrueAction=[!ShowMeter MeterLedOnR][!Redraw]
IfFalseAction=[!HideMeter MeterLedOnR][!Redraw]

[MeasureVUR]
; the faces' tooltips: VU and peak dBFS (Log is base 10)
Measure=Calc
Formula=20 * Log(Max(MeasureRMSR, 0.00001) / MeasureZeroRef)

[MeasurePeakDbR]
Measure=Calc
Formula=20 * Log(Max(MeasurePeakR, 0.00001))


; ================================================================ now playing (once a second)

[MeasurePlayer]
; the title; empty: no track ("Not Playing" and the player's name)
Measure=Plugin
Plugin=NowPlaying
PlayerName=#Player#
PlayerType=Title
DisableLeadingZero=1
Group=Player
IfMatch=^$
IfMatchAction=[!SetOption MeterTitle Text "#StudioNotPlaying#"][!SetOption MeterTitle FontColor "#SecondaryTextColor#"][!SetOption MeterArtist Text "#PlayerDisplayName#"][!SetOption MeterArtist FontColor "#TertiaryTextColor#"][!HideMeter MeterTime][!SetOptionGroup Skip ImageTint "#FaintColor#"][!SetOption MeterPlayPause ImageTint "#SecondaryTextColor#"][!UpdateMeterGroup Row][!Redraw]
IfNotMatchAction=[!SetOption MeterTitle Text "%1"][!SetOption MeterTitle FontColor "#TextColor#"][!SetOption MeterArtist Text "%1"][!SetOption MeterArtist FontColor "#SecondaryTextColor#"][!ShowMeter MeterTime][!SetOptionGroup Skip ImageTint "#TextColor#"][!SetOption MeterPlayPause ImageTint "#TextColor#"][!UpdateMeterGroup Row][!Redraw]

[MeasureArtist]
Measure=Plugin
Plugin=NowPlaying
PlayerName=[MeasurePlayer]
PlayerType=Artist
Group=Player

[MeasureCover]
Measure=Plugin
Plugin=NowPlaying
PlayerName=[MeasurePlayer]
PlayerType=Cover
Group=Player
IfMatch=^$
IfMatchAction=[!SetVariable CoverPath ""][!HideMeter MeterCover][!ShowMeter MeterCoverGlyph][!Redraw]
IfNotMatchAction=[!SetVariable CoverPath "[MeasureCover]"][!ShowMeter MeterCover][!HideMeter MeterCoverGlyph][!UpdateMeter MeterCover][!Redraw]

[MeasurePosition]
Measure=Plugin
Plugin=NowPlaying
PlayerName=[MeasurePlayer]
PlayerType=Position
Group=Player

[MeasureDuration]
Measure=Plugin
Plugin=NowPlaying
PlayerName=[MeasurePlayer]
PlayerType=Duration
Group=Player

[MeasureState]
; 0 stopped, 1 playing, 2 paused
Measure=Plugin
Plugin=NowPlaying
PlayerName=[MeasurePlayer]
PlayerType=State
Group=Player
IfCondition=MeasureState = 1
IfTrueAction=[!SetOption MeterPlayPause ImageName "sf:pause.fill"][!SetOption MeterPlayPause ToolTipText "#StudioTipPause#"][!UpdateMeter MeterPlayPause][!Redraw]
IfFalseAction=[!SetOption MeterPlayPause ImageName "sf:play.fill"][!SetOption MeterPlayPause ToolTipText "#StudioTipPlay#"][!UpdateMeter MeterPlayPause][!Redraw]

[MeasureStatus]
; 1 while the player app runs; playback commands never launch a closed player, so play opens it instead
Measure=Plugin
Plugin=NowPlaying
PlayerName=[MeasurePlayer]
PlayerType=Status
Group=Player
IfCondition=MeasureStatus = 0
IfTrueAction=[!SetOption MeterPlayPause LeftMouseUpAction """[!CommandMeasure MeasurePlayer "OpenPlayer"]"""]
IfFalseAction=[!SetOption MeterPlayPause LeftMouseUpAction """#PlayPauseAction#"""]

[MeasureLamp]
; the quiet counter (half seconds while lit, seconds while down): the L and R levels summing to less than 0.003
; (about −50 dBFS) with nothing playing. After 3 s of quiet the lamps go down; sound or a playing track lights them
Measure=Calc
Formula=(((MeasureRMSL + MeasureRMSR) > 0.003) || (MeasureState = 1)) ? 0 : Min(MeasureLamp + 1, 100)
UpdateDivider=#StudioLampDivider#
IfCondition=(#StudioLive# = 1) && (MeasureLamp >= 6)
IfTrueAction=[!WriteKeyValue Variables StudioLive 0][!Refresh]
IfCondition2=(#StudioLive# = 0) && (MeasureLamp = 0)
IfTrueAction2=[!WriteKeyValue Variables StudioLive 1][!Refresh]

