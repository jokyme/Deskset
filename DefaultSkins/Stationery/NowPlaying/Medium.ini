; Stationery · Now Playing, medium (360 × 170): the cover beside the player's name, the track, a bar to jump along
; and the full transport. Original work, MIT licensed.

[Rainmeter]
Update=1000
AccurateText=1
SkinWidth=360
SkinHeight=170
DynamicWindowSize=0
Group=Stationery
; the window's own look, once Deskset reads it (until then it is macOS's)
MacAppearance=#LookAppearance#
ContextTitle=#NowPlayingOpen#
ContextAction=[!CommandMeasure MeasurePlayer "OpenPlayer"]
ContextTitle2=---
ContextTitle3=#MenuPlayerTitle#
ContextAction3=#MenuPlayerAction#
ContextTitle4=[#NowPlayingMenuBackground[#NowPlayingBackground]]
ContextAction4=[!WriteKeyValue Variables NowPlayingBackground [#BackgroundNext[#NowPlayingBackground]] "#@#Variables.inc"][!Refresh]
ContextTitle5=---
ContextTitle6=#MenuLookTitle#
ContextAction6=#MenuLookAction#
ContextTitle7=#MenuCardsTitle#
ContextAction7=#MenuCardsAction#

[Metadata]
Name=Now Playing
Author=Deskset
License=MIT
Version=1.0
Information=Stationery · What Music or Spotify is playing, with play, pause and skip. Scroll to change the player's volume; click the bar to jump. macOS asks once for permission (Automation) when the widget first sees Music or Spotify running. Other apps, such as web browsers, can't be shown.

[Variables]
@Include=#@#Variables.inc
@Include2=#@#Suite/Tokens.inc
@Include3=#@#Suite/Styles.inc
@Include4=#@#Media/Media.inc
CardW=360
CardH=170
OpenAction=[!CommandMeasure MeasurePlayer "OpenPlayer"]
; last: the artwork background, included by MeasureCover, overrides the look's ink
@Include5=#@#NowPlaying/Player.inc

[MeasureTransport]
; nothing playing: Previous and Next take no action, and show no pad (their click is caught, not passed to the card)
Measure=Calc
Formula=MeasureMode
IfCondition=MeasureTransport = 0
IfTrueAction=[!DisableMouseAction MeterPrev "LeftMouseDownAction|LeftMouseUpAction|MouseOverAction"][!DisableMouseAction MeterNext "LeftMouseDownAction|LeftMouseUpAction|MouseOverAction"][!HideMeter MeterPrevPad][!HideMeter MeterNextPad]
IfFalseAction=[!EnableMouseAction MeterPrev "LeftMouseDownAction|LeftMouseUpAction|MouseOverAction"][!EnableMouseAction MeterNext "LeftMouseDownAction|LeftMouseUpAction|MouseOverAction"]

; ---------------------------------------------------------------- meters
[MeterCard]
Meter=Shape
MeterStyle=sCard
; the artwork background's shade (clear with Background: Glass)
Shape2=Rectangle 0,0,#CardW#,#CardH#,#CardRadius# | Fill LinearGradient ArtShadeFill | StrokeWidth 0
ArtShadeFill=270 | 0,0,0,#ArtShadeTop# ; 0.0 | 0,0,0,#ArtShadeBottom# ; 1.0
; scrolling sets the player's volume in steps of 5 and shows it for 1.5 s; the steps add up here, so a fast scroll
; loses none between the player's once-a-second answers
MouseScrollUpAction=[!SetVariable VolumeTarget "(Clamp((#VolumeRow# = 1 ? #VolumeTarget# : [MeasureVolume:]) + 5, 0, 100))"][!SetVariable VolumeRow "(([MeasureMode:] = 1) || ([MeasureMode:] = 2))"][!CommandMeasure MeasurePlayer "SetVolume [#VolumeTarget]"][!UpdateMeterGroup Progress][!Redraw][!CommandMeasure MeasureVolumeTimer "Stop 1"][!CommandMeasure MeasureVolumeTimer "Execute 1"]
MouseScrollDownAction=[!SetVariable VolumeTarget "(Clamp((#VolumeRow# = 1 ? #VolumeTarget# : [MeasureVolume:]) - 5, 0, 100))"][!SetVariable VolumeRow "(([MeasureMode:] = 1) || ([MeasureMode:] = 2))"][!CommandMeasure MeasurePlayer "SetVolume [#VolumeTarget]"][!UpdateMeterGroup Progress][!Redraw][!CommandMeasure MeasureVolumeTimer "Stop 1"][!CommandMeasure MeasureVolumeTimer "Execute 1"]
ToolTipTitle=[#TipTitle[&MeasureView:0]]
ToolTipText=[#NowPlayingTip[&MeasureView:0]]
; the sentence follows the time; the card's paths stay cached
UpdateDivider=1

[MeterNoticeHit]
; access refused: the whole card opens the privacy pane (the Notice's action)
Meter=Shape
Shape=Rectangle 0,0,#CardW#,#CardH#,#CardRadius# | Fill Color 0,0,0,1 | StrokeWidth 0
LeftMouseUpAction=["x-apple.systempreferences:com.apple.preference.security?Privacy_Automation"]
Hidden=([MeasureMode:] <> 3)
DynamicVariables=1
UpdateDivider=-1
Group=State

[MeterArtTile]
; the cover's placeholder, always under it (r 10: concentric with the card at the 16 inset)
Meter=Shape
Shape=Rectangle 16,16,138,138,#InnerRadius# | Fill Color #ControlFillColor# | StrokeWidth 0
UpdateDivider=-1

[MeterArtNote]
; 40 pt, natural 34 × 45, centred on the tile (85, 85)
Meter=Image
ImageName=sf:music.note
MacSymbolSize=40
MacSymbolWeight=Regular
MacSymbolRendering=Hierarchical
ImageTint=#TertiaryTextColor#
X=68
Y=62.5
W=34
H=45
UpdateDivider=-1

[MeterArt]
; the cover, filled and cropped, in full colour in every look
Meter=Image
MeterStyle=sArtwork
MeasureName=MeasureCover
MaskImageName=#@#Suite/Masks/Art138.png
X=16
Y=16
W=138
H=138
Hidden=(([MeasureMode:] <> 1) && ([MeasureMode:] <> 2))
DynamicVariables=1
Group=State | Player

; ---------------------------------------------------------------- the header, in the text column (x 170 → 344)
[MeterHeaderGlyph]
; the pink note shows only when the player has no icon (Spotify not installed); natural 10 × 14 on (180, 23)
Meter=Image
MeterStyle=sSymbolS
ImageName=sf:music.note
ImageTint=#MediaColor#
X=175
Y=16
W=10
H=14
UpdateDivider=-1

[MeterHeaderIcon]
; the app icon of the player shown (or preferred, when nothing plays), in its own colours: 18 × 18 on (180, 23)
Meter=Image
ImageName=[MeasureIcon#PlayerNow#]
PreserveAspectRatio=1
X=171
Y=14
W=18
H=18
DynamicVariables=1
Group=Player

[MeterHeaderTitle]
; "Music"
Meter=String
MeterStyle=sLabel
Text=[MeasurePlayerName]
X=195
Y=16
W=149
ClipString=1
DynamicVariables=1
Group=Player

; ---------------------------------------------------------------- the track
[MeterTitle]
; "Gymnopédie No. 1" on baseline 64, or "Not Playing"
Meter=String
MeterStyle=sTitle
Text=[#TitleText[&MeasureMode:0]]
FontColor=#InkRGB#,([MeasureMode:] = 0 ? #Alpha2# : #Alpha1#)
X=170
Y=(64 - #Ascent15#)
W=174
H=19
ClipString=1
Hidden=(([MeasureMode:] = 3) || ([MeasureMode:] = 4))
DynamicVariables=1
Group=State | Player

[MeterArtist]
; "Erik Satie" on baseline 85, up to two lines (100.31), as the idle line
Meter=String
MeterStyle=sBody
Text=[#ArtistText[&MeasureMode:0]]
FontColor=#InkRGB#,([MeasureMode:] = 0 ? #Alpha3# : #Alpha2#)
X=170
Y=(85 - #Ascent13#)
W=174
H=34
ClipString=2
Hidden=(([MeasureMode:] = 3) || ([MeasureMode:] = 4))
DynamicVariables=1
Group=State | Player

[MeterBar]
; the time, y 106 → 111, in ink (a faint track, secondary fill; primary under the pointer); after a scroll, the volume
Meter=Shape
Shape=Rectangle 170,106,174,5,2.5 | Fill Color #FaintColor# | StrokeWidth 0
Shape2=Rectangle 170,106,(Max(5, 174 * (#VolumeRow# = 1 ? #VolumeTarget# : [MeasureProgress:]) / 100)),5,2.5 | Fill Color #InkRGB#,(#BarHover# = 1 ? #Alpha1# : #Alpha2#) | StrokeWidth 0
Hidden=((#VolumeRow# = 0) && ([MeasureView:] <> 1) && ([MeasureView:] <> 2))
DynamicVariables=1
Group=Progress

[MeterSeek]
; the bar's hit area (174 × 17, no side padding, so $MouseX:%$ is the share of the track): a click jumps there
Meter=Image
MeterStyle=sHit
X=170
Y=100
W=174
H=17
MouseOverAction=[!SetVariable BarHover 1][!UpdateMeter MeterBar][!Redraw]
MouseLeaveAction=[!SetVariable BarHover 0][!UpdateMeter MeterBar][!Redraw]
LeftMouseUpAction=[!CommandMeasure MeasurePlayer "SetPosition $MouseX:%$"][!UpdateMeasureGroup Player][!UpdateMeterGroup Progress][!Redraw]
ToolTipText=#NowPlayingSeekTip#
Hidden=((#VolumeRow# = 1) || (([MeasureView:] <> 1) && ([MeasureView:] <> 2)))
DynamicVariables=1
Group=Progress

[MeterElapsed]
; "1:21" (or "Live") on baseline 125
Meter=String
MeterStyle=sCaptionNum
Text=[#ElapsedText[&MeasureView:0]]
X=170
Y=(125 - #Ascent11#)
Hidden=((#VolumeRow# = 1) || (([MeasureView:] <> 1) && ([MeasureView:] <> 2) && ([MeasureView:] <> 5)))
DynamicVariables=1
Group=Progress

[MeterRemaining]
; "−1:52"
Meter=String
MeterStyle=sCaptionNum
MeasureName=MeasureRemaining
Text=−%1
StringAlign=Right
X=344
Y=(125 - #Ascent11#)
Hidden=((#VolumeRow# = 1) || (([MeasureView:] <> 1) && ([MeasureView:] <> 2)))
DynamicVariables=1
Group=Progress

[MeterVolumeLabel]
; "Music volume" and "40%", for 1.5 s after a scroll
Meter=String
MeterStyle=sCaption
Text=#NowPlayingVolume#
FontColor=#TertiaryTextColor#
X=170
Y=(125 - #Ascent11#)
W=130
ClipString=1
Hidden=(#VolumeRow# = 0)
DynamicVariables=1
Group=Progress

[MeterVolumeValue]
Meter=String
MeterStyle=sCaptionNum
Text=#VolumeTarget#%
StringAlign=Right
X=344
Y=(125 - #Ascent11#)
Hidden=(#VolumeRow# = 0)
DynamicVariables=1
Group=Progress

; ---------------------------------------------------------------- the transport: the full set, centred in the text column
[MeterPrevPad]
Meter=Shape
Shape=Ellipse 205,143,15 | Fill Color #HoverColor# | StrokeWidth 0
Hidden=1
UpdateDivider=-1

[MeterPrev]
; 16 pt (26 × 16 at 192, 135) in a 30 × 30 hit box (x 190 → 220, y 128 → 158); faint while nothing plays
Meter=Image
MeterStyle=sHit
ImageName=sf:backward.fill
MacSymbolSize=16
MacSymbolWeight=Semibold
ImageTint=#InkRGB#,([MeasureMode:] = 0 ? #Alpha4# : #Alpha1#)
X=190
Y=128
W=26
H=16
Padding=2,7,2,7
MouseOverAction=[!ShowMeter MeterPrevPad][!Redraw]
MouseLeaveAction=[!HideMeter MeterPrevPad][!Redraw]
LeftMouseDownAction=[!SetOption MeterPrevPad Shape "Ellipse 205,143,15 | Fill Color #PressedColor# | StrokeWidth 0"][!UpdateMeter MeterPrevPad][!Redraw]
LeftMouseUpAction=[!SetOption MeterPrevPad Shape "Ellipse 205,143,15 | Fill Color #HoverColor# | StrokeWidth 0"][!UpdateMeter MeterPrevPad][!CommandMeasure MeasurePlayer "Previous"][!UpdateMeasureGroup Player][!UpdateMeterGroup Player][!Redraw]
ToolTipText=#NowPlayingPrevious#
Hidden=(([MeasureMode:] = 3) || ([MeasureMode:] = 4))
DynamicVariables=1
UpdateDivider=-1
Group=State

[MeterPlayPad]
Meter=Shape
Shape=Ellipse 257,143,18 | Fill Color #HoverColor# | StrokeWidth 0
Hidden=1
UpdateDivider=-1

[MeterPlay]
; 22 pt play or pause in a 21 × 24 box at (246.5, 131) that fits both, in a 36 × 36 hit box (x 239 → 275, y 125 → 161).
; Nothing playing: it opens the player, in secondary ink
Meter=Image
MeterStyle=sHit
ImageName=sf:[#PlayGlyph[&MeasureMode:0]]
MacSymbolSize=22
MacSymbolWeight=Semibold
ImageTint=#InkRGB#,([MeasureMode:] = 0 ? #Alpha2# : #Alpha1#)
X=239
Y=125
W=21
H=24
Padding=7.5,6,7.5,6
MouseOverAction=[!ShowMeter MeterPlayPad][!Redraw]
MouseLeaveAction=[!HideMeter MeterPlayPad][!Redraw]
LeftMouseDownAction=[!SetOption MeterPlayPad Shape "Ellipse 257,143,18 | Fill Color #PressedColor# | StrokeWidth 0"][!UpdateMeter MeterPlayPad][!Redraw]
LeftMouseUpAction=[!SetOption MeterPlayPad Shape "Ellipse 257,143,18 | Fill Color #HoverColor# | StrokeWidth 0"][!UpdateMeter MeterPlayPad][!CommandMeasure MeasurePlayer "[#PlayCommand[&MeasureMode:0]]"][!UpdateMeasureGroup Player][!UpdateMeterGroup Player][!Redraw]
ToolTipText=[#PlayTip[&MeasureMode:0]]
Hidden=(([MeasureMode:] = 3) || ([MeasureMode:] = 4))
DynamicVariables=1
UpdateDivider=-1
Group=State | Player

[MeterNextPad]
Meter=Shape
Shape=Ellipse 309,143,15 | Fill Color #HoverColor# | StrokeWidth 0
Hidden=1
UpdateDivider=-1

[MeterNext]
; 16 pt (26 × 16 at 296, 135) in a 30 × 30 hit box (x 294 → 324, y 128 → 158); faint while nothing plays
Meter=Image
MeterStyle=sHit
ImageName=sf:forward.fill
MacSymbolSize=16
MacSymbolWeight=Semibold
ImageTint=#InkRGB#,([MeasureMode:] = 0 ? #Alpha4# : #Alpha1#)
X=294
Y=128
W=26
H=16
Padding=2,7,2,7
MouseOverAction=[!ShowMeter MeterNextPad][!Redraw]
MouseLeaveAction=[!HideMeter MeterNextPad][!Redraw]
LeftMouseDownAction=[!SetOption MeterNextPad Shape "Ellipse 309,143,15 | Fill Color #PressedColor# | StrokeWidth 0"][!UpdateMeter MeterNextPad][!Redraw]
LeftMouseUpAction=[!SetOption MeterNextPad Shape "Ellipse 309,143,15 | Fill Color #HoverColor# | StrokeWidth 0"][!UpdateMeter MeterNextPad][!CommandMeasure MeasurePlayer "Next"][!UpdateMeasureGroup Player][!UpdateMeterGroup Player][!Redraw]
ToolTipText=#NowPlayingNext#
Hidden=(([MeasureMode:] = 3) || ([MeasureMode:] = 4))
DynamicVariables=1
UpdateDivider=-1
Group=State

; ---------------------------------------------------------------- access refused (the Notice, in the text column)
[MeterNoticeSymbol]
Meter=Image
MeterStyle=sNoticeSymbol
ImageName=sf:hand.raised.fill
; natural 25 × 24, from y 40
X=170
Y=40
W=25
H=24
Hidden=([MeasureMode:] <> 3)
DynamicVariables=1
UpdateDivider=-1
Group=State

[MeterNoticeTitle]
Meter=String
MeterStyle=sBodyStrong | sNoticeTitle
Text=#NowPlayingAllowAccess#
X=170
W=174
Hidden=([MeasureMode:] <> 3)
DynamicVariables=1
UpdateDivider=-1
Group=State

[MeterNoticeBody]
; two lines from baseline 103
Meter=String
MeterStyle=sCaption | sNoticeBody
Text=#NowPlayingAllowBody#
X=170
W=174
H=26
Hidden=([MeasureMode:] <> 3)
DynamicVariables=1
UpdateDivider=-1
Group=State | Player

[MeterNoticeAction]
; the card under it takes the click too
Meter=String
MeterStyle=sLabel | sNoticeAction
Text=#StrOpenPrivacySettings#
X=170
Hidden=([MeasureMode:] <> 3)
DynamicVariables=1
UpdateDivider=-1
Group=State
