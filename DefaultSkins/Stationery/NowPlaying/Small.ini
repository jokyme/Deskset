; Stationery · Now Playing, small (170 × 170): the cover, the track, play and pause, and how far it has got.
; Original work, MIT licensed.

[Rainmeter]
Update=1000
AccurateText=1
SkinWidth=170
SkinHeight=170
DynamicWindowSize=0
; the suite, and the suite settings it shows (a setting refreshes only its own group)
Group=Stationery | StationeryMedia
; the window's own look, once Deskset reads it (until then it is macOS's)
MacAppearance=#LookAppearance#
; the pointer on the card shows Next beside play
MouseOverAction=[!SetVariable CardHover 1][!UpdateMeterGroup Hover][!Redraw]
MouseLeaveAction=[!SetVariable CardHover 0][!HideMeter MeterNextPad][!UpdateMeterGroup Hover][!Redraw]
ContextTitle=#NowPlayingOpen#
ContextAction=[!CommandMeasure MeasurePlayer "OpenPlayer"]
ContextTitle2=---
ContextTitle3=#MenuPlayerTitle#
ContextAction3=#MenuPlayerAction#
ContextTitle4=[#NowPlayingMenuBackground[#NowPlayingBackground]]
ContextAction4=[!WriteKeyValue Variables NowPlayingBackground [#BackgroundNext[#NowPlayingBackground]] "#@#Variables.inc"][!Refresh]
ContextTitle5=---
ContextTitle6=#MenuLookTitle#
ContextAction6=#MenuLookAction#
ContextTitle7=#MenuCardsTitle#
ContextAction7=#MenuCardsAction#
ContextTitle8=#MenuLanguageTitle#
ContextAction8=#MenuLanguageAction#

[Metadata]
Name=Now Playing
Author=Deskset
License=MIT
Version=1.0
Information=Stationery · What Music or Spotify is playing, with play, pause and skip. Scroll to change the player's volume. macOS asks once for permission (Automation) when the widget first sees Music or Spotify running. Other apps, such as web browsers, can't be shown.

[Variables]
@Include=#@#Variables.inc
@Include2=#@#Suite/Tokens.inc
@Include3=#@#Suite/Styles.inc
@Include4=#@#Media/Media.inc
CardW=170
CardH=170
OpenAction=[!CommandMeasure MeasurePlayer "OpenPlayer"]
; last: the artwork background, included by MeasureCover, overrides the look's ink
@Include5=#@#NowPlaying/Player.inc

; ---------------------------------------------------------------- meters
[MeterCard]
Meter=Shape
MeterStyle=sCard
; the artwork background's shade (clear with Background: Glass)
Shape2=Rectangle 0,0,#CardW#,#CardH#,#CardRadius# | Fill LinearGradient ArtShadeFill | StrokeWidth 0
ArtShadeFill=270 | 0,0,0,#ArtShadeTop# ; 0.0 | 0,0,0,#ArtShadeBottom# ; 1.0
; scrolling sets the player's volume in steps of 5 and shows it for 1.5 s; the steps add up here, so a fast scroll
; loses none between the player's once-a-second answers
MouseScrollUpAction=[!SetVariable VolumeTarget "(Clamp((#VolumeRow# = 1 ? #VolumeTarget# : [MeasureVolume:]) + 5, 0, 100))"][!SetVariable VolumeRow "(([MeasureMode:] = 1) || ([MeasureMode:] = 2))"][!CommandMeasure MeasurePlayer "SetVolume [#VolumeTarget]"][!UpdateMeterGroup Progress][!Redraw][!CommandMeasure MeasureVolumeTimer "Stop 1"][!CommandMeasure MeasureVolumeTimer "Execute 1"]
MouseScrollDownAction=[!SetVariable VolumeTarget "(Clamp((#VolumeRow# = 1 ? #VolumeTarget# : [MeasureVolume:]) - 5, 0, 100))"][!SetVariable VolumeRow "(([MeasureMode:] = 1) || ([MeasureMode:] = 2))"][!CommandMeasure MeasurePlayer "SetVolume [#VolumeTarget]"][!UpdateMeterGroup Progress][!Redraw][!CommandMeasure MeasureVolumeTimer "Stop 1"][!CommandMeasure MeasureVolumeTimer "Execute 1"]
ToolTipTitle=[#TipTitle[&MeasureView:0]]
ToolTipText=[#NowPlayingTip[&MeasureView:0]]
; the sentence follows the time; the card's paths stay cached
UpdateDivider=1

[MeterNoticeHit]
; access refused: the whole card opens the privacy pane (the Notice's action)
Meter=Shape
Shape=Rectangle 0,0,#CardW#,#CardH#,#CardRadius# | Fill Color 0,0,0,1 | StrokeWidth 0
LeftMouseUpAction=["#AutomationPane#"]
Hidden=([MeasureMode:] <> 3)
DynamicVariables=1
UpdateDivider=-1
Group=State

[MeterArtTile]
; the cover's placeholder, always under it (r 10: concentric with the card at the 16 inset)
Meter=Shape
Shape=Rectangle 16,16,64,64,#InnerRadius# | Fill Color #ControlFillColor# | StrokeWidth 0
Hidden=([MeasureMode:] = 3)
DynamicVariables=1
UpdateDivider=-1
Group=State

[MeterArtNote]
; 24 pt, natural 21 × 27, centred on the tile (48, 48)
Meter=Image
ImageName=sf:music.note
MacSymbolSize=24
MacSymbolWeight=Regular
MacSymbolRendering=Hierarchical
ImageTint=#TertiaryTextColor#
X=37.5
Y=34.5
W=21
H=27
Hidden=([MeasureMode:] = 3)
DynamicVariables=1
UpdateDivider=-1
Group=State

[MeterArt]
; the cover, filled and cropped, in full colour in every look
Meter=Image
MeterStyle=sArtwork
MeasureName=MeasureCover
MaskImageName=#@#Suite/Masks/Art64.png
X=16
Y=16
W=64
H=64
Hidden=(([MeasureMode:] <> 1) && ([MeasureMode:] <> 2))
DynamicVariables=1
Group=State | Player

[MeterBadgeGlyph]
; the player's badge: the pink note shows only when the player has no icon (Spotify not installed)
Meter=Image
MeterStyle=sSymbolS
ImageName=sf:music.note
ImageTint=#MediaColor#
; natural 10 × 14, centred on (146, 23)
X=141
Y=16
W=10
H=14
Hidden=([MeasureMode:] = 3)
DynamicVariables=1
UpdateDivider=-1
Group=State

[MeterBadge]
; the app icon of the player shown (or preferred, when nothing plays), in its own colours: 18 × 18, its body 14.5
Meter=Image
ImageName=[MeasureIcon#PlayerNow#]
PreserveAspectRatio=1
X=137
Y=14
W=18
H=18
ToolTipText=[MeasurePlayerName]
Hidden=([MeasureMode:] = 3)
DynamicVariables=1
Group=State | Player

[MeterPlayPad]
Meter=Shape
Shape=Ellipse 113,48,18 | Fill Color #HoverColor# | StrokeWidth 0
Hidden=1
UpdateDivider=-1

[MeterPlay]
; the compact set's 17 pt play or pause in a 16 × 18 box at (105, 39) that fits both; X and Y are the padded hit
; box's corner (x 95 → 129, y 30 → 66). Nothing playing: it opens the player, in secondary ink
Meter=Image
MeterStyle=sHit
ImageName=sf:[#PlayGlyph[&MeasureMode:0]]
MacSymbolSize=17
MacSymbolWeight=Semibold
ImageTint=#InkRGB#,([MeasureMode:] = 0 ? #Alpha2# : #Alpha1#)
X=95
Y=30
W=16
H=18
Padding=10,9,8,9
MouseOverAction=[!ShowMeter MeterPlayPad][!Redraw]
MouseLeaveAction=[!HideMeter MeterPlayPad][!Redraw]
LeftMouseDownAction=[!SetOption MeterPlayPad Shape "Ellipse 113,48,18 | Fill Color #PressedColor# | StrokeWidth 0"][!UpdateMeter MeterPlayPad][!Redraw]
LeftMouseUpAction=[!SetOption MeterPlayPad Shape "Ellipse 113,48,18 | Fill Color #HoverColor# | StrokeWidth 0"][!UpdateMeter MeterPlayPad][!CommandMeasure MeasurePlayer "[#PlayCommand[&MeasureMode:0]]"][!UpdateMeasureGroup Player][!UpdateMeterGroup Player][!Redraw]
ToolTipText=[#PlayTip[&MeasureMode:0]]
Hidden=(([MeasureMode:] = 3) || ([MeasureMode:] = 4))
DynamicVariables=1
UpdateDivider=-1
Group=State | Player

[MeterNextPad]
Meter=Shape
Shape=Ellipse 144,48,15 | Fill Color #HoverColor# | StrokeWidth 0
Hidden=1
UpdateDivider=-1

[MeterNext]
; Next, only while the pointer is on the card and a track plays or waits paused: 13 pt (20 × 13 at 134, 41.5) in
; a 30 × 30 hit box (x 129 → 159, y 33 → 63)
Meter=Image
MeterStyle=sHit
ImageName=sf:forward.fill
MacSymbolSize=13
MacSymbolWeight=Semibold
ImageTint=#TextColor#
X=129
Y=33
W=20
H=13
Padding=5,8.5,5,8.5
MouseOverAction=[!ShowMeter MeterNextPad][!Redraw]
MouseLeaveAction=[!HideMeter MeterNextPad][!Redraw]
LeftMouseDownAction=[!SetOption MeterNextPad Shape "Ellipse 144,48,15 | Fill Color #PressedColor# | StrokeWidth 0"][!UpdateMeter MeterNextPad][!Redraw]
LeftMouseUpAction=[!SetOption MeterNextPad Shape "Ellipse 144,48,15 | Fill Color #HoverColor# | StrokeWidth 0"][!UpdateMeter MeterNextPad][!CommandMeasure MeasurePlayer "Next"][!UpdateMeasureGroup Player][!UpdateMeterGroup Player][!Redraw]
ToolTipText=#NowPlayingNext#
Hidden=((#CardHover# = 0) || ([MeasureMode:] < 1) || ([MeasureMode:] > 2))
DynamicVariables=1
UpdateDivider=-1
Group=State | Hover

[MeterTitle]
; "Gymnopédie No. 1" on baseline 104, or "Not Playing"
Meter=String
MeterStyle=sBodyStrong
Text=[#TitleText[&MeasureMode:0]]
FontColor=#InkRGB#,([MeasureMode:] = 0 ? #Alpha2# : #Alpha1#)
X=16
Y=(104 - #Ascent13#)
W=138
H=17
ClipString=1
Hidden=(([MeasureMode:] = 3) || ([MeasureMode:] = 4))
DynamicVariables=1
Group=State | Player

[MeterArtist]
; "Erik Satie" on baseline 119 (one line), or the idle line on two (119, 131.96: the bar is hidden then)
Meter=String
MeterStyle=sCaption
Text=[#ArtistText[&MeasureMode:0]]
FontColor=#InkRGB#,([MeasureMode:] = 0 ? #Alpha3# : #Alpha2#)
X=16
Y=(119 - #Ascent11#)
W=138
H=([MeasureMode:] = 0 ? 29 : 15)
ClipString=([MeasureMode:] = 0 ? 2 : 1)
Hidden=(([MeasureMode:] = 3) || ([MeasureMode:] = 4))
DynamicVariables=1
Group=State | Player

[MeterBar]
; the time, y 131 → 136, in ink (a faint track, secondary fill); after a scroll it shows the volume
Meter=Shape
Shape=Rectangle 16,131,138,5,2.5 | Fill Color #FaintColor# | StrokeWidth 0
Shape2=Rectangle 16,131,(Max(5, 138 * (#VolumeRow# = 1 ? #VolumeTarget# : [MeasureProgress:]) / 100)),5,2.5 | Fill Color #SecondaryTextColor# | StrokeWidth 0
Hidden=((#VolumeRow# = 0) && ([MeasureView:] <> 1) && ([MeasureView:] <> 2))
DynamicVariables=1
Group=Progress

[MeterElapsed]
; "1:21" (or "Live") on the last baseline
Meter=String
MeterStyle=sCaptionNum
Text=[#ElapsedText[&MeasureView:0]]
X=16
Y=(#LastBaseline# - #Ascent11#)
Hidden=((#VolumeRow# = 1) || (([MeasureView:] <> 1) && ([MeasureView:] <> 2) && ([MeasureView:] <> 5)))
DynamicVariables=1
Group=Progress

[MeterRemaining]
; "−1:52"
Meter=String
MeterStyle=sCaptionNum
MeasureName=MeasureRemaining
Text=−%1
StringAlign=Right
X=154
Y=(#LastBaseline# - #Ascent11#)
Hidden=((#VolumeRow# = 1) || (([MeasureView:] <> 1) && ([MeasureView:] <> 2)))
DynamicVariables=1
Group=Progress

[MeterVolumeLabel]
; "Music volume" and "40%", for 1.5 s after a scroll
Meter=String
MeterStyle=sCaption
Text=#NowPlayingVolume#
FontColor=#TertiaryTextColor#
X=16
Y=(#LastBaseline# - #Ascent11#)
W=96
ClipString=1
Hidden=(#VolumeRow# = 0)
DynamicVariables=1
Group=Progress

[MeterVolumeValue]
Meter=String
MeterStyle=sCaptionNum
Text=#VolumeTarget#%
StringAlign=Right
X=154
Y=(#LastBaseline# - #Ascent11#)
Hidden=(#VolumeRow# = 0)
DynamicVariables=1
Group=Progress

; ---------------------------------------------------------------- access refused (the Notice fills the card)
[MeterNoticeSymbol]
Meter=Image
MeterStyle=sNoticeSymbol
ImageName=sf:hand.raised.fill
; natural 25 × 24, centred on (85, 48)
X=72.5
Y=36
W=25
H=24
Hidden=([MeasureMode:] <> 3)
DynamicVariables=1
UpdateDivider=-1
Group=State

[MeterNoticeTitle]
Meter=String
MeterStyle=sBodyStrong | sNoticeTitleSmall
Text=#NowPlayingAllowAccess#
Hidden=([MeasureMode:] <> 3)
DynamicVariables=1
UpdateDivider=-1
Group=State

[MeterNoticeBody]
; three lines from baseline 99
Meter=String
MeterStyle=sCaption | sNoticeBodySmall
Text=#NowPlayingAllowBody#
Hidden=([MeasureMode:] <> 3)
DynamicVariables=1
UpdateDivider=-1
Group=State | Player

[MeterNoticeAction]
; the card under it takes the click too
Meter=String
MeterStyle=sLabel | sNoticeActionSmall
Text=#StrOpenPrivacySettings#
Hidden=([MeasureMode:] <> 3)
DynamicVariables=1
UpdateDivider=-1
Group=State
