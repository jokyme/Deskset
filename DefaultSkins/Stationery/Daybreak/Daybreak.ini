; Stationery · Daybreak (450 × 262, no card): a lock-screen clock for the desktop. The date sits over large rounded
; digits; under them runs a 24-hour ruler exactly as wide as the numbers. Night hours are dotted; daylight is a
; sky-coloured band from civil dawn to civil dusk (violet twilight, rose sunrise, golden hours, plain day), bright for
; the part of the day that is over and faint for the rest. The sun marks now, and the moon takes its place at night.
; In twilight and the golden hours the base of the digits takes the colour of the sky. Original work, MIT licensed.
;
; The ink is the suite's frameless ink (Suite/Ink.inc); the sky and the ruler's own colours per ink are in
; @Resources/Daybreak/Inks.inc. The ruler: 16 pt per hour, x 33 → 417 (384 pt = 24 h), on y 197.

[Rainmeter]
Update=1000
DefaultUpdateDivider=-1
AccurateText=1
DynamicWindowSize=0
SkinWidth=450
SkinHeight=262
Group=Stationery
ContextTitle=#DaybreakMenuOpen#
ContextAction=["/System/Applications/Clock.app"]
ContextTitle2=---
ContextTitle3=[#DaybreakMenuTint[#DaybreakSkyTint]]
ContextAction3=[!WriteKeyValue Variables DaybreakSkyTint "(1 - #DaybreakSkyTint#)" "#@#Variables.inc"][!Refresh]
ContextTitle4=[#DaybreakMenuCity[#PlaceState]]
ContextAction4=[!CommandMeasure MeasureCityInput "ExecuteBatch 1"]
ContextTitle5=#MenuClockTitle#
ContextAction5=#MenuClockAction#
ContextTitle6=---
ContextTitle7=#MenuInkTitle#
ContextAction7=#MenuInkAction#
ContextTitle8=#MenuLanguageTitle#
ContextAction8=#MenuLanguageAction#

[Metadata]
Name=Daybreak
Author=Deskset
License=MIT
Version=1.0
Information=Stationery · A lock-screen clock with a 24-hour daylight ruler, straight on the wallpaper: the night dotted, the day a band in the colours of the sky, the sun (or the moon) at the time it is now. Sunrise and sunset are worked out on your Mac for the suite's place. The ink turns white or dark to suit the wallpaper (right-click to choose it).

[Variables]
@Include=#@#Variables.inc
@Include2=#@#Suite/Tokens.inc
@Include3=#@#Suite/Styles.inc
@Include4=#@#Suite/Ink.inc
@Include5=#@#Daybreak/Inks.inc
InkChangeAction=[!UpdateMeasure MeasureDaybreakInk]
; the sun times are in the Mac's own time zone, as the ruler's "now" is
SunTimeZone=Local
; ---------------------------------------------------------------- state (the skin sets these)
; 0 while the place is looked up (at most 2 s), 1 with a place, 2 without one
PlaceState=0
; 0 night, 1 civil twilight, 2 golden hour, 3 day; the digits' tint follows it unless DaybreakSkyTint is off
Phase=3
TintPhase=3
SunA=1
MoonA=0
; plain day, or golden light all day when the sun never climbs 6°
DayKey=Day
NextKey=Sunset
NextPrefix=
PolarText=
; the city field covers the label row
CityFieldX=145
CityFieldY=208
CityFieldW=160

; ================================================================ styles

[sDayText]
; the date (and the countdown in its place): 21 pt SF Pro Semibold, the piece's display size; digits rounded
FontFace=#FontText#
FontWeight=600
FontSize=15.75
FontColor=#InkRGB#,#InkA2#
AntiAlias=1
StringAlign=CenterTop
X=225
Y=22
W=450
H=36
InlineSetting=#InkShadowText#
InlineSetting2=Face | #FontNumber#
InlinePattern2=#DigitRun#
InlineSetting3=Typography | tnum
InlinePattern3=#DigitRun#
DynamicVariables=1

[sDaySymbol]
; sunrise.fill / sunset.fill at 13 pt semibold, as the labels beside them
MacSymbolSize=13
MacSymbolWeight=Semibold
Y=213
DynamicVariables=1
Group=Events
Hidden=1

[sDaySymbolUnder]
; the copy one point under the symbol (a drop edge, or the letterpress edge)
MacSymbolRendering=Monochrome
ImageTint=#HaloRGB#,[#[#InkKey]AUnderSym]
Y=214

[sDaySymbolInk]
MacSymbolRendering=[#[#InkKey]SymMode]
ImageTint=#InkRGB#

[sDayLabel]
; "07:10": sValue (13 pt SF Pro Rounded Semibold) in the ink's secondary alpha, with the text shadow
FontColor=#InkRGB#,#InkA2#
InlineSetting7=#InkShadowText#
StringAlign=CenterCenter
Y=220
W=84
H=26
DynamicVariables=1
Group=Events
Hidden=1

; ================================================================ the ink

[MeasureDaybreakInk]
; the suite's ink as the key of this piece's own colours (W white, D dark)
Measure=Calc
Formula=MeasureInkDark
UpdateDivider=-1
IfCondition=MeasureDaybreakInk = 1
IfTrueAction=[!SetVariable InkKey D][!UpdateMeter *][!Redraw]
IfFalseAction=[!SetVariable InkKey W][!UpdateMeter *][!Redraw]

; ================================================================ time

[MeasureNow]
; seconds since 1601 on the Mac's clock, so Frac(value / 86400) is the time of day
Measure=Time
TimeStamp=#TestNow#
UpdateDivider=1

[MeasureMinute]
; the skin draws once a minute: the clock, and the sun's step along the ruler (1 pt every 3¾ minutes)
Measure=Calc
Formula=Floor(MeasureNow / 60)
UpdateDivider=1
OnChangeAction=[!UpdateMeasureGroup Day][!UpdateMeter *][!Redraw]

[MeasureClock]
; "10:09", or "10:09" in 12-hour time too: lock-screen style, without AM or PM
Measure=Time
TimeStamp=#TestNow#
Format=[#TimeFormat[#Hours]]
Group=Day

[MeasureDate]
; "Saturday, September 26"
Measure=Time
TimeStamp=#TestNow#
Format=#DateFormatLong#
FormatLocale=#Locale#
Group=Day

[MeasureDateFull]
Measure=Time
TimeStamp=#TestNow#
Format=#DateFormatFull#
FormatLocale=#Locale#
Group=Day

; ================================================================ the sun and the moon, worked out on the Mac

[MeasurePlace]
; the suite's place (by default the city of the Mac's time zone); it runs every second only to notice the place
; arriving (cheap), and the sun values follow it
Measure=Plugin
Plugin=MacSun
Location=#Location#
TimeZone=#SunTimeZone#
Type=Place
UpdateDivider=1
IfMatch=.
IfMatchAction=[!SetVariable PlaceState 1][!UpdateMeasureGroup Day][!UpdateMeter *][!Redraw]

[MeasurePlaceMenu]
; the place's name for the menu title (titles stop at 30 characters)
Measure=String
String=[MeasurePlace]
RegExpSubstitute=1
Substitute="^(.{21}).+$":"\1…"
DynamicVariables=1
UpdateDivider=5

[MeasureLoadTimer]
; still no place after 2 s: the widget shows the state without one (not earlier, so nothing flickers at load)
Measure=Calc
Formula=Min(MeasureLoadTimer + 1, 3)
UpdateDivider=1
IfCondition=(MeasureLoadTimer = 2) && (#PlaceState# = 0)
IfTrueAction=[!SetVariable PlaceState 2][!UpdateMeasureGroup Day][!UpdateMeter *][!Redraw]
DynamicVariables=1

[MeasureSunrise]
; "07:10" (the labels), without AM or PM in 12-hour time; the number is 0 when the sun does not rise
Measure=Plugin
Plugin=MacSun
Parent=MeasurePlace
Type=Sunrise
Format=[#TimeFormat[#Hours]]
NoEventText=
Group=Day

[MeasureSunset]
Measure=Plugin
Plugin=MacSun
Parent=MeasurePlace
Type=Sunset
Format=[#TimeFormat[#Hours]]
NoEventText=
Group=Day

[MeasureSunriseTip]
; "7:10 AM" or "07:10", for the tooltip
Measure=Plugin
Plugin=MacSun
Parent=MeasurePlace
Type=Sunrise
Format=[#CaptionTime[#Hours]]
FormatLocale=#Locale#
NoEventText=--
Group=Day

[MeasureSunsetTip]
Measure=Plugin
Plugin=MacSun
Parent=MeasurePlace
Type=Sunset
Format=[#CaptionTime[#Hours]]
FormatLocale=#Locale#
NoEventText=--
Group=Day

[MeasureCivilDawn]
Measure=Plugin
Plugin=MacSun
Parent=MeasurePlace
Type=CivilDawn
Group=Day

[MeasureCivilDusk]
Measure=Plugin
Plugin=MacSun
Parent=MeasurePlace
Type=CivilDusk
Group=Day

[MeasureGoldenEnd]
Measure=Plugin
Plugin=MacSun
Parent=MeasurePlace
Type=GoldenHourMorningEnd
Group=Day

[MeasureGoldenStartTip]
; the evening's golden hour, for the tooltip
Measure=Plugin
Plugin=MacSun
Parent=MeasurePlace
Type=GoldenHourEveningStart
Format=[#CaptionTime[#Hours]]
FormatLocale=#Locale#
NoEventText=--
Group=Day

[MeasureNoon]
Measure=Plugin
Plugin=MacSun
Parent=MeasurePlace
Type=SolarNoon
Group=Day

[MeasureDayLength]
; seconds of daylight; MacSun's own string ("11:56") reads as a time of day, so the text is built below
Measure=Plugin
Plugin=MacSun
Parent=MeasurePlace
Type=DayLength
Group=Day

[MeasureSunState]
; 0 the sun rises and sets, 1 midnight sun, 2 polar night. Without a place every sun value is 0: dots only, and the
; label row asks for a city
Measure=Plugin
Plugin=MacSun
Parent=MeasurePlace
Type=SunState
Group=Day
DynamicVariables=1
IfCondition=#PlaceState# = 2
IfTrueAction=[!SetVariable PolarText "#DaybreakNeedPlace#"][!HideMeterGroup Events][!ShowMeter MeterPolar]
IfCondition2=(#PlaceState# = 1) && (MeasureSunState = 0)
IfTrueAction2=[!SetVariable PolarText ""][!ShowMeterGroup Events][!HideMeter MeterPolar]
IfCondition3=(#PlaceState# = 1) && (MeasureSunState = 1)
IfTrueAction3=[!SetVariable PolarText "#StrMidnightSun#"][!HideMeterGroup Events][!ShowMeter MeterPolar]
IfCondition4=(#PlaceState# = 1) && (MeasureSunState = 2)
IfTrueAction4=[!SetVariable PolarText "#StrPolarNight#"][!HideMeterGroup Events][!ShowMeter MeterPolar]

[MeasureDaylight]
; the sun by day, the moon at night; without a place, the sun from 06:00 to 18:00
Measure=Plugin
Plugin=MacSun
Parent=MeasurePlace
Type=IsDaylight
Group=Day
IfCondition=(MeasureDaylight = 1) || ((MeasureNoon = 0) && (fNow > 0.25) && (fNow < 0.75))
IfTrueAction=[!SetVariable SunA 1][!SetVariable MoonA 0]
IfFalseAction=[!SetVariable SunA 0][!SetVariable MoonA 1]

[MeasureMoonIllum]
Measure=Plugin
Plugin=MacSun
Parent=MeasurePlace
Type=MoonIllumination
Group=Day

[MeasureMoonPhase]
Measure=Plugin
Plugin=MacSun
Parent=MeasurePlace
Type=MoonPhase
Group=Day

; ================================================================ fractions of the day (0 = 00:00, 1 = 24:00)
; Time and MacSun values are local wall-clock seconds since 1601, so Frac(v / 86400) is the time of day. A missing
; event is 0: polar day stretches the band over the whole ruler, polar night collapses it at noon.

[fNow]
Measure=Calc
Formula=Frac(MeasureNow / 86400)
Group=Day

[fNoon]
Measure=Calc
Formula=(MeasureNoon = 0) ? 0.5 : Frac(MeasureNoon / 86400)
Group=Day

[fRise]
Measure=Calc
Formula=(MeasureSunrise = 0) ? ((MeasureSunState = 1) ? 0 : fNoon) : Frac(MeasureSunrise / 86400)
Group=Day

[fSet]
Measure=Calc
Formula=(MeasureSunset = 0) ? ((MeasureSunState = 1) ? 1 : fNoon) : ((Frac(MeasureSunset / 86400) < fRise) ? 1 : Frac(MeasureSunset / 86400))
Group=Day

[fCD]
; civil twilight all night (summer, high latitudes): the band runs from edge to edge
Measure=Calc
Formula=(MeasureNoon = 0) ? fNoon : ((MeasureCivilDawn = 0) ? ((MeasureSunState = 2) ? fNoon : 0) : ((Frac(MeasureCivilDawn / 86400) > fRise) ? 0 : Frac(MeasureCivilDawn / 86400)))
Group=Day

[fCK]
Measure=Calc
Formula=(MeasureNoon = 0) ? fNoon : ((MeasureCivilDusk = 0) ? ((MeasureSunState = 2) ? fNoon : 1) : ((Frac(MeasureCivilDusk / 86400) < fSet) ? 1 : Frac(MeasureCivilDusk / 86400)))
Group=Day

[fGE]
; the sun never climbs 6° above the horizon: golden light all day
Measure=Calc
Formula=(MeasureGoldenEnd = 0) ? fNoon : Frac(MeasureGoldenEnd / 86400)
Group=Day
IfCondition=(MeasureGoldenEnd = 0) && (MeasureSunState = 0)
IfTrueAction=[!SetVariable DayKey GS]
IfFalseAction=[!SetVariable DayKey Day]

[fGS]
Measure=Calc
Formula=(MeasureGoldenStartTip = 0) ? fNoon : Frac(MeasureGoldenStartTip / 86400)
Group=Day

[mPhase]
; 0 night, 1 civil twilight, 2 golden hour, 3 day
Measure=Calc
Formula=(MeasureNoon = 0) ? 3 : (((fNow < fCD) || (fNow > fCK)) ? 0 : (((fNow < fRise) || (fNow > fSet)) ? 1 : (((fNow < fGE) || (fNow > fGS)) ? 2 : 3)))
Group=Day
IfCondition=mPhase = 0
IfTrueAction=[!SetVariable Phase 0][!SetVariable TintPhase "(#DaybreakSkyTint# = 1 ? 0 : 3)"]
IfCondition2=mPhase = 1
IfTrueAction2=[!SetVariable Phase 1][!SetVariable TintPhase "(#DaybreakSkyTint# = 1 ? 1 : 3)"]
IfCondition3=mPhase = 2
IfTrueAction3=[!SetVariable Phase 2][!SetVariable TintPhase "(#DaybreakSkyTint# = 1 ? 2 : 3)"][!SetVariable NextPrefix "#DaybreakGoldenPrefix#"]
IfFalseAction3=[!SetVariable NextPrefix ""]
IfCondition4=mPhase = 3
IfTrueAction4=[!SetVariable Phase 3][!SetVariable TintPhase 3]

; ================================================================ ruler positions (skin points)

[xNow]
Measure=Calc
Formula=33 + 384 * fNow
Group=Day

[xCD]
Measure=Calc
Formula=33 + 384 * fCD
Group=Day

[xRise]
Measure=Calc
Formula=33 + 384 * fRise
Group=Day

[xGE]
Measure=Calc
Formula=33 + 384 * fGE
Group=Day

[xGS]
Measure=Calc
Formula=33 + 384 * fGS
Group=Day

[xSet]
Measure=Calc
Formula=33 + 384 * fSet
Group=Day

[xCK]
Measure=Calc
Formula=33 + 384 * fCK
Group=Day

[xDay1]
; plain day starts about 50 min after the morning's golden hour ends and ends about 45 min before the evening's
Measure=Calc
Formula=Min(xGE + 13.4, (xGE + xGS) / 2)
Group=Day

[xDay2]
Measure=Calc
Formula=Max(xGS - 11.5, (xGE + xGS) / 2)
Group=Day

[xGold]
Measure=Calc
Formula=(xGS + xSet) / 2
Group=Day

[xTwiM]
; violet twilight halfway between civil dawn and sunrise, and between sunset and civil dusk
Measure=Calc
Formula=(xCD + xRise) / 2
Group=Day

[xTwiE]
Measure=Calc
Formula=(xSet + xCK) / 2
Group=Day

; the band: the part that is over runs from civil dawn to now, the rest from now to civil dusk. A stroke gradient spans
; its line's own bounds (+2.5 pt of cap at each end), so each stop is mapped into its piece: (x − A + 2.5) / (B − A + 5)
[pA]
Measure=Calc
Formula=xCD
Group=Day

[pB]
Measure=Calc
Formula=Clamp(xNow, xCD, xCK)
Group=Day

[pA2]
Measure=Calc
Formula=pA - 2.5
Group=Day

[pW]
Measure=Calc
Formula=pB - pA + 5
Group=Day

[pOn]
Measure=Calc
Formula=(pB - pA > 0.5) ? 1 : 0
Group=Day

[qA]
Measure=Calc
Formula=pB
Group=Day

[qB]
Measure=Calc
Formula=xCK
Group=Day

[qA2]
Measure=Calc
Formula=qA - 2.5
Group=Day

[qW]
Measure=Calc
Formula=qB - qA + 5
Group=Day

[qOn]
Measure=Calc
Formula=(qB - qA > 0.5) ? 1 : 0
Group=Day

[bOn]
; the band, except in polar night (where civil twilight is one violet line)
Measure=Calc
Formula=(MeasureSunState = 2) ? 0 : 1
Group=Day

[tOn]
Measure=Calc
Formula=((MeasureSunState = 2) && (xCK - xCD > 0.5)) ? 1 : 0
Group=Day

; night dots: hours every 16 pt from x 33, half hours every 16 pt from x 41; they stop 6 pt short of the band
[mGap]
Measure=Calc
Formula=(xCK - xCD > 0.5) ? 6 : 0
Group=Day

[dMPe]
Measure=Calc
Formula=Min(xNow, xCD - mGap)
Group=Day

[dMFh]
Measure=Calc
Formula=33 + 16 * Ceil((xNow - 33) / 16 + 0.01)
Group=Day

[dMFm]
Measure=Calc
Formula=41 + 16 * Ceil((xNow - 41) / 16 + 0.01)
Group=Day

[dMFe]
Measure=Calc
Formula=xCD - mGap
Group=Day

[dEFe]
Measure=Calc
Formula=Max(xNow, xCK + mGap)
Group=Day

[dEPh]
Measure=Calc
Formula=33 + 16 * Floor((xNow - 33) / 16 - 0.01)
Group=Day

[dEPm]
Measure=Calc
Formula=41 + 16 * Floor((xNow - 41) / 16 - 0.01)
Group=Day

[dEPe]
Measure=Calc
Formula=xCK + mGap
Group=Day

; the sunrise and sunset labels: centred on their times, pushed apart to 84 pt between centres (a 24 pt gap) on a
; short day
[lMid]
Measure=Calc
Formula=(xRise + xSet) / 2
Group=Day

[lRise]
Measure=Calc
Formula=Clamp(Min(xRise, lMid - 42), 40, 368)
Group=Day

[lSet]
Measure=Calc
Formula=Clamp(Max(xSet, lMid + 42), 82, 410)
Group=Day

[mMoonD]
; the moon's phase: the shadow disc slides off the moon as it fills (waxing: lit on the right)
Measure=Calc
Formula=((MeasureMoonIllum > 99) ? 40 : 14 * MeasureMoonIllum / 100) * ((MeasureMoonPhase < 0.5) ? -1 : 1)
Group=Day

; ================================================================ the countdown and the tooltip

[mNextMin]
; minutes to the next sunrise or sunset
Measure=Calc
Formula=Round(((fNow < fRise) ? fRise - fNow : ((fNow < fSet) ? fSet - fNow : fRise + 1 - fNow)) * 1440)
Group=Day
IfCondition=(fNow >= fRise) && (fNow < fSet)
IfTrueAction=[!SetVariable NextKey Sunset]
IfFalseAction=[!SetVariable NextKey Sunrise]

[mNextH]
Measure=Calc
Formula=Floor(mNextMin / 60)
Group=Day

[mNextM]
Measure=Calc
Formula=mNextMin % 60
Group=Day

[MeasureNextText]
; "8 h 50 min", "27 min", "3 h"
Measure=String
String=[mNextH:0] #UnitHour# [mNextM:0] #UnitMinute#
RegExpSubstitute=1
Substitute="^0 #UnitHour# ":""," 0 #UnitMinute#$":""
DynamicVariables=1
Group=Day

[MeasureCountdown]
; "Sunset in 8 h 50 min", "Golden hour · Sunset in 27 min"
Measure=String
String=#NextPrefix#[#DaybreakNext[#NextKey]]
DynamicVariables=1
Group=Day

[mDayMin]
Measure=Calc
Formula=Round(MeasureDayLength / 60)
Group=Day

[mDayH]
Measure=Calc
Formula=Floor(mDayMin / 60)
Group=Day

[mDayM]
Measure=Calc
Formula=mDayMin % 60
Group=Day

[MeasureDayLengthText]
; "11 h 56 min" (never MacSun's "11:56", which reads as a time of day)
Measure=String
String=[mDayH:0] #UnitHour# [mDayM:0] #UnitMinute#
RegExpSubstitute=1
Substitute="^0 #UnitHour# ":""," 0 #UnitMinute#$":""
DynamicVariables=1
Group=Day

[MeasureTipState]
; the ruler's tooltip: 0 no place, 1 sunrise and sunset, 2 midnight sun, 3 polar night
Measure=Calc
Formula=(#PlaceState# = 2) ? 0 : ((MeasureSunState = 1) ? 2 : ((MeasureSunState = 2) ? 3 : 1))
DynamicVariables=1
Group=Day

; ================================================================ meters

[MeterScrim]
; white ink only: a soft shade behind the text, darkest in the middle, gone at the skin's edges
Meter=Shape
Shape=Ellipse 225,118,225,114 | Fill RadialGradient Scrim | StrokeWidth 0
Scrim=0,0 | 0,0,0,#InkScrimA# ; 0 | 0,0,0,(#InkScrimA# * 150 / 255) ; 0.55 | 0,0,0,0 ; 1
DynamicVariables=1

[MeterDate]
Meter=String
MeterStyle=sDayText
MeasureName=MeasureDate
LeftMouseUpAction=["/System/Applications/Calendar.app"]
ToolTipText=[MeasureDateFull]

[MeterCountdown]
; in place of the date while the pointer is over the ruler
Meter=String
MeterStyle=sDayText
MeasureName=MeasureCountdown
Hidden=1

[MeterClock]
; 152 pt SF Pro Rounded Semibold, 3 pt tighter between the digits; the base takes the sky's colour
Meter=String
MeasureName=MeasureClock
X=225
Y=23
W=450
H=200
StringAlign=CenterTop
FontFace=#FontNumber#
FontWeight=600
FontSize=114
FontColor=#InkRGB#,#InkA1#
InlineSetting=CharacterSpacing | -1.5 | -1.5
InlineSetting2=#InkShadowDisplay#
InlineSetting3=GradientColor | 270 | #InkRGB#,#InkA1# ; [#[#InkKey]G1] | [#[#InkKey]Tint[#TintPhase]] ; [#[#InkKey]G2]
AntiAlias=1
DynamicVariables=1
LeftMouseUpAction=["/System/Applications/Clock.app"]

[MeterRuler]
Meter=Shape
DynamicVariables=1
; ---- night dots: the copies underneath, then the dots (a zero width hides a run)
Shape=Line 33,(197 + [#[#InkKey]UnderY]),[dMPe:],(197 + [#[#InkKey]UnderY]) | StrokeWidth (([dMPe:] >= 33) ? 3 + [#[#InkKey]Grow] : 0) | Stroke Color #HaloRGB#,[#[#InkKey]AUnder] | StrokeDashes 0,(16 / (3 + [#[#InkKey]Grow])) | StrokeDashCap Round | StrokeStartCap Round | StrokeEndCap Round
Shape2=Line 41,(197 + [#[#InkKey]UnderY]),[dMPe:],(197 + [#[#InkKey]UnderY]) | StrokeWidth (([dMPe:] >= 41) ? 1.8 + [#[#InkKey]Grow] : 0) | Stroke Color #HaloRGB#,[#[#InkKey]AUnder] | StrokeDashes 0,(16 / (1.8 + [#[#InkKey]Grow])) | StrokeDashCap Round | StrokeStartCap Round | StrokeEndCap Round
Shape3=Line [dMFh:],(197 + [#[#InkKey]UnderY]),[dMFe:],(197 + [#[#InkKey]UnderY]) | StrokeWidth (([dMFe:] >= [dMFh:]) ? 3 + [#[#InkKey]Grow] : 0) | Stroke Color #HaloRGB#,[#[#InkKey]AUnderF] | StrokeDashes 0,(16 / (3 + [#[#InkKey]Grow])) | StrokeDashCap Round | StrokeStartCap Round | StrokeEndCap Round
Shape4=Line [dMFm:],(197 + [#[#InkKey]UnderY]),[dMFe:],(197 + [#[#InkKey]UnderY]) | StrokeWidth (([dMFe:] >= [dMFm:]) ? 1.8 + [#[#InkKey]Grow] : 0) | Stroke Color #HaloRGB#,[#[#InkKey]AUnderF] | StrokeDashes 0,(16 / (1.8 + [#[#InkKey]Grow])) | StrokeDashCap Round | StrokeStartCap Round | StrokeEndCap Round
Shape5=Line 417,(197 + [#[#InkKey]UnderY]),[dEFe:],(197 + [#[#InkKey]UnderY]) | StrokeWidth (([dEFe:] <= 417) ? 3 + [#[#InkKey]Grow] : 0) | Stroke Color #HaloRGB#,[#[#InkKey]AUnderF] | StrokeDashes 0,(16 / (3 + [#[#InkKey]Grow])) | StrokeDashCap Round | StrokeStartCap Round | StrokeEndCap Round
Shape6=Line 409,(197 + [#[#InkKey]UnderY]),[dEFe:],(197 + [#[#InkKey]UnderY]) | StrokeWidth (([dEFe:] <= 409) ? 1.8 + [#[#InkKey]Grow] : 0) | Stroke Color #HaloRGB#,[#[#InkKey]AUnderF] | StrokeDashes 0,(16 / (1.8 + [#[#InkKey]Grow])) | StrokeDashCap Round | StrokeStartCap Round | StrokeEndCap Round
Shape7=Line [dEPh:],(197 + [#[#InkKey]UnderY]),[dEPe:],(197 + [#[#InkKey]UnderY]) | StrokeWidth (([dEPh:] >= [dEPe:]) ? 3 + [#[#InkKey]Grow] : 0) | Stroke Color #HaloRGB#,[#[#InkKey]AUnder] | StrokeDashes 0,(16 / (3 + [#[#InkKey]Grow])) | StrokeDashCap Round | StrokeStartCap Round | StrokeEndCap Round
Shape8=Line [dEPm:],(197 + [#[#InkKey]UnderY]),[dEPe:],(197 + [#[#InkKey]UnderY]) | StrokeWidth (([dEPm:] >= [dEPe:]) ? 1.8 + [#[#InkKey]Grow] : 0) | Stroke Color #HaloRGB#,[#[#InkKey]AUnder] | StrokeDashes 0,(16 / (1.8 + [#[#InkKey]Grow])) | StrokeDashCap Round | StrokeStartCap Round | StrokeEndCap Round
Shape9=Line 33,197,[dMPe:],197 | StrokeWidth (([dMPe:] >= 33) ? 3 : 0) | Stroke Color #InkRGB#,[#[#InkKey]ADotPast] | StrokeDashes 0,(16 / 3) | StrokeDashCap Round | StrokeStartCap Round | StrokeEndCap Round
Shape10=Line 41,197,[dMPe:],197 | StrokeWidth (([dMPe:] >= 41) ? 1.8 : 0) | Stroke Color #InkRGB#,[#[#InkKey]ADotPast] | StrokeDashes 0,(16 / 1.8) | StrokeDashCap Round | StrokeStartCap Round | StrokeEndCap Round
Shape11=Line [dMFh:],197,[dMFe:],197 | StrokeWidth (([dMFe:] >= [dMFh:]) ? 3 : 0) | Stroke Color #InkRGB#,[#[#InkKey]ADotFuture] | StrokeDashes 0,(16 / 3) | StrokeDashCap Round | StrokeStartCap Round | StrokeEndCap Round
Shape12=Line [dMFm:],197,[dMFe:],197 | StrokeWidth (([dMFe:] >= [dMFm:]) ? 1.8 : 0) | Stroke Color #InkRGB#,[#[#InkKey]ADotFuture] | StrokeDashes 0,(16 / 1.8) | StrokeDashCap Round | StrokeStartCap Round | StrokeEndCap Round
Shape13=Line 417,197,[dEFe:],197 | StrokeWidth (([dEFe:] <= 417) ? 3 : 0) | Stroke Color #InkRGB#,[#[#InkKey]ADotFuture] | StrokeDashes 0,(16 / 3) | StrokeDashCap Round | StrokeStartCap Round | StrokeEndCap Round
Shape14=Line 409,197,[dEFe:],197 | StrokeWidth (([dEFe:] <= 409) ? 1.8 : 0) | Stroke Color #InkRGB#,[#[#InkKey]ADotFuture] | StrokeDashes 0,(16 / 1.8) | StrokeDashCap Round | StrokeStartCap Round | StrokeEndCap Round
Shape15=Line [dEPh:],197,[dEPe:],197 | StrokeWidth (([dEPh:] >= [dEPe:]) ? 3 : 0) | Stroke Color #InkRGB#,[#[#InkKey]ADotPast] | StrokeDashes 0,(16 / 3) | StrokeDashCap Round | StrokeStartCap Round | StrokeEndCap Round
Shape16=Line [dEPm:],197,[dEPe:],197 | StrokeWidth (([dEPm:] >= [dEPe:]) ? 1.8 : 0) | Stroke Color #InkRGB#,[#[#InkKey]ADotPast] | StrokeDashes 0,(16 / 1.8) | StrokeDashCap Round | StrokeStartCap Round | StrokeEndCap Round
; ---- the sky band: copies underneath, then the rest of the day (faint), then the part that is over (bright)
Shape17=Line [qA:],(197 + [#[#InkKey]UnderY]),[qB:],(197 + [#[#InkKey]UnderY]) | StrokeWidth ([bOn:] * [qOn:] * (5 + [#[#InkKey]Grow])) | Stroke LinearGradient UnderFuture | StrokeStartCap Round | StrokeEndCap Round
Shape18=Line [pA:],(197 + [#[#InkKey]UnderY]),[pB:],(197 + [#[#InkKey]UnderY]) | StrokeWidth ([bOn:] * [pOn:] * (5 + [#[#InkKey]Grow])) | Stroke LinearGradient UnderPast | StrokeStartCap Round | StrokeEndCap Round
Shape19=Line [qA:],197,[qB:],197 | StrokeWidth ([bOn:] * [qOn:] * 5) | Stroke LinearGradient SkyFuture | StrokeStartCap Round | StrokeEndCap Round
Shape20=Line [pA:],197,[pB:],197 | StrokeWidth ([bOn:] * [pOn:] * 5) | Stroke LinearGradient SkyPast | StrokeStartCap Round | StrokeEndCap Round
; ---- polar night: civil twilight as one violet line (copy, then line)
Shape21=Line [xCD:],(197 + [#[#InkKey]UnderY]),[xCK:],(197 + [#[#InkKey]UnderY]) | StrokeWidth ([tOn:] * (5 + [#[#InkKey]Grow])) | Stroke LinearGradient PolarUnder | StrokeStartCap Round | StrokeEndCap Round
Shape22=Line [xCD:],197,[xCK:],197 | StrokeWidth ([tOn:] * 5) | Stroke LinearGradient PolarTwi | StrokeStartCap Round | StrokeEndCap Round
; ---- the sun (hidden at night): glow, copy, ring, core
Shape23=Ellipse [xNow:],197,22 | Fill RadialGradient SunGlow | StrokeWidth 0
Shape24=Ellipse [xNow:],(197 + [#[#InkKey]UnderY]),10.6 | Fill Color #HaloRGB#,[#[#InkKey]AUnder] | StrokeWidth 0 | Scale #SunA#,#SunA#
Shape25=Ellipse [xNow:],197,10 | Fill Color #InkRGB#,(255 * #SunA#) | StrokeWidth 0
Shape26=Ellipse [xNow:],197,7.8 | Fill RadialGradient SunCore | StrokeWidth 0
; ---- the moon (hidden by day): glow, copy, its shadow (dark ink only), then the lit part (a disc minus the shadow
; disc), always the lighter tone
Shape27=Ellipse [xNow:],197,16 | Fill RadialGradient MoonGlow | StrokeWidth 0
Shape28=Ellipse [xNow:],(197 + [#[#InkKey]UnderY]),7.4 | Fill Color #HaloRGB#,[#[#InkKey]AUnder] | StrokeWidth 0 | Scale #MoonA#,#MoonA#
Shape29=Ellipse [xNow:],197,7.6 | Fill Color #InkRGB#,(#MoonA# * [#[#InkKey]AMoonShadow]) | StrokeWidth 0
Shape30=Ellipse [xNow:],197,7 | Fill RadialGradient MoonFill | StrokeWidth 0
Shape31=Ellipse ([xNow:] + [mMoonD:]),197,7 | StrokeWidth 0
Shape32=Combine Shape30 | Exclude Shape31
; gradients (positions may lie outside 0…1: they still shape the interpolation)
SkyPast=180 | [#[#InkKey]Twi],0 ; (([xCD:] - [pA2:]) / [pW:]) | [#[#InkKey]Twi],[#[#InkKey]ATwi] ; (([xTwiM:] - [pA2:]) / [pW:]) | [#[#InkKey]Rise],[#[#InkKey]APast] ; (([xRise:] - [pA2:]) / [pW:]) | [#[#InkKey]GE],[#[#InkKey]APast] ; (([xGE:] - [pA2:]) / [pW:]) | [#[#InkKey][#DayKey]],[#[#InkKey]APast] ; (([xDay1:] - [pA2:]) / [pW:]) | [#[#InkKey][#DayKey]],[#[#InkKey]APast] ; (([xDay2:] - [pA2:]) / [pW:]) | [#[#InkKey]GS],[#[#InkKey]APast] ; (([xGS:] - [pA2:]) / [pW:]) | [#[#InkKey]Gold],[#[#InkKey]APast] ; (([xGold:] - [pA2:]) / [pW:]) | [#[#InkKey]Set],[#[#InkKey]APast] ; (([xSet:] - [pA2:]) / [pW:]) | [#[#InkKey]Twi],[#[#InkKey]ATwi] ; (([xTwiE:] - [pA2:]) / [pW:]) | [#[#InkKey]Twi],0 ; (([xCK:] - [pA2:]) / [pW:])
SkyFuture=180 | [#[#InkKey]Twi],0 ; (([xCD:] - [qA2:]) / [qW:]) | [#[#InkKey]Twi],[#[#InkKey]ATwiF] ; (([xTwiM:] - [qA2:]) / [qW:]) | [#[#InkKey]Rise],[#[#InkKey]ARiseF] ; (([xRise:] - [qA2:]) / [qW:]) | [#[#InkKey]GE],[#[#InkKey]AGEF] ; (([xGE:] - [qA2:]) / [qW:]) | [#[#InkKey][#DayKey]],[#[#InkKey]ADayF] ; (([xDay1:] - [qA2:]) / [qW:]) | [#[#InkKey][#DayKey]],[#[#InkKey]ADayF] ; (([xDay2:] - [qA2:]) / [qW:]) | [#[#InkKey]GS],[#[#InkKey]AGSF] ; (([xGS:] - [qA2:]) / [qW:]) | [#[#InkKey]Gold],[#[#InkKey]AGoldF] ; (([xGold:] - [qA2:]) / [qW:]) | [#[#InkKey]Set],[#[#InkKey]ASetF] ; (([xSet:] - [qA2:]) / [qW:]) | [#[#InkKey]Twi],[#[#InkKey]ATwiF] ; (([xTwiE:] - [qA2:]) / [qW:]) | [#[#InkKey]Twi],0 ; (([xCK:] - [qA2:]) / [qW:])
UnderPast=180 | 0,0,0,0 ; (([xCD:] - [pA2:]) / [pW:]) | #HaloRGB#,[#[#InkKey]AUnder] ; (([xRise:] - [pA2:]) / [pW:]) | #HaloRGB#,[#[#InkKey]AUnder] ; (([xSet:] - [pA2:]) / [pW:]) | 0,0,0,0 ; (([xCK:] - [pA2:]) / [pW:])
UnderFuture=180 | 0,0,0,0 ; (([xCD:] - [qA2:]) / [qW:]) | #HaloRGB#,[#[#InkKey]AUnderF] ; (([xRise:] - [qA2:]) / [qW:]) | #HaloRGB#,[#[#InkKey]AUnderF] ; (([xSet:] - [qA2:]) / [qW:]) | 0,0,0,0 ; (([xCK:] - [qA2:]) / [qW:])
PolarTwi=180 | [#[#InkKey]Twi],0 ; 0 | [#[#InkKey]Twi],[#[#InkKey]ATwi] ; 0.5 | [#[#InkKey]Twi],0 ; 1
PolarUnder=180 | 0,0,0,0 ; 0 | #HaloRGB#,[#[#InkKey]AUnderF] ; 0.5 | 0,0,0,0 ; 1
SunGlow=0,0 | [#[#InkKey]SunGlow],(140 * #SunA#) ; 0 | [#[#InkKey]SunGlow],(50 * #SunA#) ; 0.55 | [#[#InkKey]SunGlow],0 ; 1
SunCore=-2,-2,0,0,9.5,9.5 | [#SunHi[#Phase]],(255 * #SunA#) ; 0 | [#SunLo[#Phase]],(255 * #SunA#) ; 1
MoonGlow=0,0 | [#[#InkKey]MoonGlow],(128 * #MoonA#) ; 0 | [#[#InkKey]MoonGlow],0 ; 1
MoonFill=-1.8,-1.8,0,0,8.5,8.5 | [#[#InkKey]MoonHi],(255 * #MoonA#) ; 0 | [#[#InkKey]MoonLo],(255 * #MoonA#) ; 1

; ---- sunrise and sunset (group Events; polar days and a missing place show MeterPolar instead)
[MeterRiseSymbolUnder]
Meter=Image
MeterStyle=sDaySymbol | sDaySymbolUnder
ImageName=sf:sunrise.fill
X=([lRise:] - 30)

[MeterRiseSymbol]
Meter=Image
MeterStyle=sDaySymbol | sDaySymbolInk
ImageName=sf:sunrise.fill
X=([lRise:] - 30)

[MeterRiseTime]
Meter=String
MeterStyle=sValue | sDayLabel
MeasureName=MeasureSunrise
X=([lRise:] + 12)

[MeterSetSymbolUnder]
Meter=Image
MeterStyle=sDaySymbol | sDaySymbolUnder
ImageName=sf:sunset.fill
X=([lSet:] - 30)

[MeterSetSymbol]
Meter=Image
MeterStyle=sDaySymbol | sDaySymbolInk
ImageName=sf:sunset.fill
X=([lSet:] - 30)

[MeterSetTime]
Meter=String
MeterStyle=sValue | sDayLabel
MeasureName=MeasureSunset
X=([lSet:] + 12)

[MeterPolar]
; "Midnight sun", "Polar night", or the request for a city: SF Pro in the labels' ink
Meter=String
MeterStyle=sValue | sDayLabel
FontFace=#FontText#
Group=
Text=#PolarText#
X=225
W=450

; ---- the pointer over the ruler: the countdown takes the date's place
[MeterRulerHit]
Meter=Image
X=25
Y=180
W=400
H=54
SolidColor=0,0,0,1
DynamicVariables=1
MouseOverAction=[!HideMeter MeterDate][!ShowMeter MeterCountdown][!Redraw]
MouseLeaveAction=[!ShowMeter MeterDate][!HideMeter MeterCountdown][!Redraw]
LeftMouseUpAction=["/System/Applications/Weather.app"]
ToolTipText=[#DaybreakTip[&MeasureTipState:0]]

; ================================================================ the city field

[MeasureCityInput]
; "City…" in the menu opens this field over the label row. Return writes the suite's Location (a city,
; "latitude,longitude", timezone or auto) and refreshes every Stationery widget; Escape cancels
Measure=Plugin
Plugin=InputText
X=#CityFieldX#
Y=#CityFieldY#
W=#CityFieldW#
H=24
SolidColor=#FieldColor#
FontColor=#TextColor#
FontFace=#FontText#
FontSize=9.75
DefaultValue=[MeasurePlace]
FocusDismiss=1
Command1=[!WriteKeyValue Variables Location "$UserInput$" "#@#Variables.inc"][!RefreshGroup Stationery]
DynamicVariables=1
UpdateDivider=-1
