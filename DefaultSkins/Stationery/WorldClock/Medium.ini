; the row; a click opens the field over it
Meter=Shape
Shape=Rectangle 8,39.4,344,20,#RowPadRadius# | Fill Color #ControlFillColor# | StrokeWidth 0
LeftMouseUpAction=[!CommandMeasure MeasureEdit "ExecuteBatch 1"]
