; Stationery · World Clock, medium (360 × 170): four dials, the first this Mac's own time, as Apple's World Clock widget.
; Original work, MIT licensed. The cities are kept outside the skins (Stationery.inc in Deskset's settings folder);
; right-click › Edit Cities… changes them. Each city is worked out on the Mac, including its daylight saving time.

[Rainmeter]
Update=1000
AccurateText=1
SkinWidth=360
SkinHeight=170
DynamicWindowSize=0
Group=Stationery
; the window's own look, once Deskset reads it (until then it is macOS's)
MacAppearance=#LookAppearance#
ContextTitle=#ClockMenuOpen#
ContextAction=#OpenAction#
ContextTitle2=---
ContextTitle3=#WorldClockMenuEdit#
ContextAction3=#EditEnter#
ContextTitle4=[#WorldClockMenuSeconds[#ShowWorldClockSeconds]]
ContextAction4=[!WriteKeyValue Variables ShowWorldClockSeconds "(1 - #ShowWorldClockSeconds#)" "#@#Variables.inc"][!Refresh]
ContextTitle5=#MenuClockTitle#
ContextAction5=#MenuClockAction#
ContextTitle6=---
ContextTitle7=#MenuLookTitle#
ContextAction7=#MenuLookAction#
ContextTitle8=#MenuCardsTitle#
ContextAction8=#MenuCardsAction#

[Metadata]
Name=World Clock
Author=Deskset
License=MIT
Version=1.0
Information=Stationery · Four clocks: this Mac's time and three cities, each dial white by day and dark by night there. Right-click › Edit Cities… to change them: type a city in any language. Everything is worked out on your Mac.

[Variables]
; This widget's own setting as it ships. Its right-click menu writes a new choice into Variables.inc, which the next
; line reads over this: the dials' seconds hands (1 on, 0 off)
ShowWorldClockSeconds=0
@Include=#@#Variables.inc
@Include2=#@#Suite/Tokens.inc
@Include3=#@#Suite/Styles.inc
; the cities as they ship; Stationery.inc (the next include) keeps the ones you choose. City1 is the medium size's first
; dial: Local is this Mac's own time zone
City1=Local
City2=London
City3=New York
City4=Tokyo
; set once the first run has checked that no default city is in this Mac's own zone (else Sydney takes its place)
WorldClockSeeded=0
@Include4=#StationeryFile#
@Include5=#@#WorldClock/Strings-#Language#.inc
@Include6=#@#WorldClock/Measures.inc
CardW=360
CardH=170
OpenAction=["/System/Applications/Clock.app"]
; Edit Cities…: the rows take the place of the clocks; nothing is saved until Done
EditEnter=[!SetVariable EditMode 1][!DisableMouseAction MeterCard LeftMouseUpAction][!EnableMeasureGroup Edit][!EnableMeasureGroup EditLookup][!UpdateMeasureGroup EditLookup][!UpdateMeasureGroup Edit][!UpdateMeterGroup CitiesFirst][!UpdateMeterGroup Cities][!UpdateMeterGroup EditFirst][!UpdateMeterGroup Edit][!Redraw]
EditDone=[!EnableMeasure MeasureSave1][!EnableMeasure MeasureSave2][!EnableMeasure MeasureSave3][!EnableMeasure MeasureSave4][!UpdateMeasure MeasureSave1][!UpdateMeasure MeasureSave2][!UpdateMeasure MeasureSave3][!UpdateMeasure MeasureSave4][!RefreshGroup Stationery]
; the dials: Ø 76, centres 82 apart on y 70. Their faces follow the city's daylight, not the look: white by day and
; dark by night in every look (a clock face is an object), like the Analog Clock's Day and Night face
DialY=70
FaceFill0=28,28,30,235
FaceFill1=255,255,255,235
FaceFill2=#ControlFillColor#
FaceTick0=255,255,255,180
FaceTick1=28,28,30,180
FaceTick2=#FaintColor#
FaceHand0=255,255,255,255
FaceHand1=28,28,30,255
FaceHand2=0,0,0,0
FaceWell0=255,255,255,31
FaceWell1=0,0,0,18
FaceWell2=0,0,0,0
FaceWindowInk0=255,255,255,180
FaceWindowInk1=28,28,30,180
FaceWindowInk2=0,0,0,0
Edit1Right0=
Edit1Right1=#WorldClockLocal# · [MeasureLocalTipTime]
Edit1Right2=[MeasureEdit1OffsetText] · [MeasureEdit1Time]
Edit1Right3=[MeasureEdit1OffsetText] · [MeasureEdit1Time]
Edit1Right4=[MeasureEdit1OffsetText] · [MeasureEdit1Time]
Edit1Right5=
Edit1Right6=
Edit1Right7=
Edit2Right0=
Edit2Right1=#WorldClockLocal# · [MeasureLocalTipTime]
Edit2Right2=[MeasureEdit2OffsetText] · [MeasureEdit2Time]
Edit2Right3=[MeasureEdit2OffsetText] · [MeasureEdit2Time]
Edit2Right4=[MeasureEdit2OffsetText] · [MeasureEdit2Time]
Edit2Right5=
Edit2Right6=
Edit2Right7=
Edit3Right0=
Edit3Right1=#WorldClockLocal# · [MeasureLocalTipTime]
Edit3Right2=[MeasureEdit3OffsetText] · [MeasureEdit3Time]
Edit3Right3=[MeasureEdit3OffsetText] · [MeasureEdit3Time]
Edit3Right4=[MeasureEdit3OffsetText] · [MeasureEdit3Time]
Edit3Right5=
Edit3Right6=
Edit3Right7=
Edit4Right0=
Edit4Right1=#WorldClockLocal# · [MeasureLocalTipTime]
Edit4Right2=[MeasureEdit4OffsetText] · [MeasureEdit4Time]
Edit4Right3=[MeasureEdit4OffsetText] · [MeasureEdit4Time]
Edit4Right4=[MeasureEdit4OffsetText] · [MeasureEdit4Time]
Edit4Right5=
Edit4Right6=
Edit4Right7=

[MeasureSecondAngle]
; the seconds hands (an option): every zone has the same seconds
Measure=Calc
Formula=Floor(MeasureLocalTime % 60) * 6
Disabled=(1 - #ShowWorldClockSeconds#)

[MeasureEdit]
; the field that opens over a row in Edit Cities… (square and opaque until Deskset's fields take the Mac's look). Return
; looks the name up and shows what it found; Escape changes nothing
Measure=Plugin
Plugin=InputText
X=36
W=(#CardW# - 50)
H=20
SolidColor=#FieldColor#
FontColor=#TextColor#
FontFace=#FontText#
FontSize=9.75
FocusDismiss=1
Command1=[!SetVariable EditCity1 """$UserInput$"""][!SetVariable EditChanged1 1][!SetVariable EditWait1 1][!UpdateMeasure MeasureEdit1IsLocal][!UpdateMeasureGroup EditLookup1][!UpdateMeasureGroup Edit][!UpdateMeterGroup EditFirst][!UpdateMeterGroup Edit][!Redraw][!Delay 400][!SetVariable EditWait1 0][!UpdateMeasureGroup Edit][!UpdateMeterGroup EditFirst][!UpdateMeterGroup Edit][!Redraw] Y=39.4 DefaultValue="[#EditCity1]"
Command2=[!SetVariable EditCity2 """$UserInput$"""][!SetVariable EditChanged2 1][!SetVariable EditWait2 1][!UpdateMeasureGroup EditLookup][!UpdateMeasureGroup Edit][!UpdateMeterGroup EditFirst][!UpdateMeterGroup Edit][!Redraw][!Delay 400][!SetVariable EditWait2 0][!UpdateMeasureGroup Edit][!UpdateMeterGroup EditFirst][!UpdateMeterGroup Edit][!Redraw] Y=63.4 DefaultValue="[#EditCity2]"
Command3=[!SetVariable EditCity3 """$UserInput$"""][!SetVariable EditChanged3 1][!SetVariable EditWait3 1][!UpdateMeasureGroup EditLookup][!UpdateMeasureGroup Edit][!UpdateMeterGroup EditFirst][!UpdateMeterGroup Edit][!Redraw][!Delay 400][!SetVariable EditWait3 0][!UpdateMeasureGroup Edit][!UpdateMeterGroup EditFirst][!UpdateMeterGroup Edit][!Redraw] Y=87.4 DefaultValue="[#EditCity3]"
Command4=[!SetVariable EditCity4 """$UserInput$"""][!SetVariable EditChanged4 1][!SetVariable EditWait4 1][!UpdateMeasureGroup EditLookup][!UpdateMeasureGroup Edit][!UpdateMeterGroup EditFirst][!UpdateMeterGroup Edit][!Redraw][!Delay 400][!SetVariable EditWait4 0][!UpdateMeasureGroup Edit][!UpdateMeterGroup EditFirst][!UpdateMeterGroup Edit][!Redraw] Y=111.4 DefaultValue="[#EditCity4]"

; ---------------------------------------------------------------- meters
[MeterCard]
Meter=Shape
MeterStyle=sCard
ToolTipTitle=#WorldClockTitle#
ToolTipText=[#City1Card[&MeasureCity1State:0]] · [#City2Card[&MeasureCity2State:0]] · [#City3Card[&MeasureCity3State:0]] · [#City4Card[&MeasureCity4State:0]]
Group=Cities
UpdateDivider=-1

; ---------------------------------------------------------------- dial 1 (this Mac's own zone, unless City1 is a city)
[MeterFace1]
; the face and 12 ticks (one dashed circle: 1.5 pt every 30°; the path starts at 3 o'clock)
Meter=Shape
Shape=Ellipse 57,#DialY#,38 | Fill Color [#FaceFill[&MeasureCity1Face:0]] | StrokeWidth 0
Shape2=Ellipse 57,#DialY#,34 | Fill Color 0,0,0,0 | StrokeWidth 4 | Stroke Color [#FaceTick[&MeasureCity1Face:0]] | StrokeDashes 0.375,4.0756 | StrokeDashOffset 0.1875
ToolTipTitle=[MeasureCity1Name]
ToolTipText=[#City1Tip[&MeasureCity1State:0]]
LeftMouseUpAction=#OpenAction#
Hidden=(#EditMode# = 1)
DynamicVariables=1
Group=Cities
UpdateDivider=-1

[MeterWindow1]
; the city's weekday in a window over the centre, when its date is not today's here
Meter=Shape
Shape=Rectangle 43,47.5,28,13,6.5 | Fill Color [#FaceWell[&MeasureCity1Face:0]] | StrokeWidth 0
Hidden=((#EditMode# = 1) || ([MeasureCity1State:] <> 1) || ([MeasureCity1SameDay:] = 1))
DynamicVariables=1
Group=Cities
UpdateDivider=-1

[MeterWindowText1]
Meter=String
MeterStyle=sMicro
MeasureName=MeasureCity1Weekday
FontColor=[#FaceWindowInk[&MeasureCity1Face:0]]
StringAlign=Center
X=57
Y=(57.17 - #Ascent9#)
Hidden=((#EditMode# = 1) || ([MeasureCity1State:] <> 1) || ([MeasureCity1SameDay:] = 1))
DynamicVariables=1
Group=Cities
UpdateDivider=-1

[MeterHands1]
; hour 3 × 18.24 and minute 2 × 25.08 (the suite's proportions at Ø 76), tails half their width; the centre dot
Meter=Shape
Shape=Rectangle 55.5,51.76,3,19.74,1.5 | Rotate [MeasureCity1HourAngle:],1.5,18.24 | Fill Color [#FaceHand[&MeasureCity1Face:0]] | StrokeWidth 0
Shape2=Rectangle 56,44.92,2,26.08,1 | Rotate [MeasureCity1MinuteAngle:],1,25.08 | Fill Color [#FaceHand[&MeasureCity1Face:0]] | StrokeWidth 0
Shape3=Ellipse 57,#DialY#,2.5 | Fill Color [#FaceHand[&MeasureCity1Face:0]] | StrokeWidth 0
Hidden=((#EditMode# = 1) || ((([MeasureCity1State:] = 1) || ([MeasureCity1State:] = 3)) = 0))
DynamicVariables=1
Group=Cities
UpdateDivider=-1

[MeterSeconds1]
; the seconds hand option: 1 × 30.4 and an orange centre
Meter=Shape
Shape=Rectangle 56.5,39.6,1,30.9,0.5 | Rotate [MeasureSecondAngle:],0.5,30.4 | Fill Color #ClockHandColor# | StrokeWidth 0
Shape2=Ellipse 57,#DialY#,2.5 | Fill Color #ClockHandColor# | StrokeWidth 0
Hidden=((#ShowWorldClockSeconds# = 0) || (#EditMode# = 1) || ((([MeasureCity1State:] = 1) || ([MeasureCity1State:] = 3)) = 0))
DynamicVariables=1

[MeterName1]
; a city in the first dial (City1 is not "Local")
Meter=String
MeterStyle=sBodyStrong
Text=[MeasureCity1Name]
StringAlign=Center
X=57
Y=(136 - #Ascent13#)
W=78
ClipString=1
Hidden=((#EditMode# = 1) || (#Dial1Local# = 1))
DynamicVariables=1
Group=Cities
UpdateDivider=-1

[MeterName1Width]
; the local name's natural width, for centring it with its glyph (drawn clear, never seen)
Meter=String
MeterStyle=sBodyStrong
Text=[MeasureHomeName]
FontColor=0,0,0,0
X=0
Y=0
DynamicVariables=1
Group=CitiesFirst
UpdateDivider=-1

[MeterLocalGlyph]
; this Mac's own zone: location.fill in the accent, centred with the name
Meter=Image
ImageName=sf:location.fill
MacSymbolSize=9
MacSymbolWeight=Semibold
ImageTint=#AccentColor#
PreserveAspectRatio=1
X=(57 - (15 + Min([MeterName1Width:W] + 1, 63)) / 2)
Y=(136 - #CapHeight13# / 2 - 6)
W=11
H=12
Hidden=((#EditMode# = 1) || (#Dial1Local# = 0))
DynamicVariables=1
Group=Cities
UpdateDivider=-1

[MeterName1Local]
; "Oslo", or "Local" without a place in this zone
Meter=String
MeterStyle=sBodyStrong
Text=[MeasureHomeName]
X=(57 - (15 + Min([MeterName1Width:W] + 1, 63)) / 2 + 15)
Y=(136 - #Ascent13#)
W=(Min([MeterName1Width:W] + 1, 63))
ClipString=1
Hidden=((#EditMode# = 1) || (#Dial1Local# = 0))
DynamicVariables=1
Group=Cities
UpdateDivider=-1

[MeterOffset1]
; "−1 h", "+3 h 30 min", "Local", "UTC+2", "--" or "Not found"
Meter=String
MeterStyle=sCaptionNum
Text=[#Offset1Text[&MeasureCity1State:0]]
StringAlign=Center
X=57
Y=(#LastBaseline# - #Ascent11#)
W=78
ClipString=1
Hidden=(#EditMode# = 1)
DynamicVariables=1
Group=Cities
UpdateDivider=-1

