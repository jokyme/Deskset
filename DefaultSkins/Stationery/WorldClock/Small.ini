Y=(54 - #Ascent13#)
W=(Min([MeterEditNameWidth2:W] + 1, #CardW# - 16 - [MeterEditRight2:W] - 6 - #SlotTextX#))
ClipString=1
Hidden=(#EditMode# = 0)
DynamicVariables=1
Group=Edit
UpdateDivider=-1

[MeterEditMatch2]
; what a new name matched (its time zone), or why it is not kept
