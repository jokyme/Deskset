; Stationery · World Clock, small (170 × 170): three cities, each a place and a time.
; Original work, MIT licensed. The cities are kept outside the skins (Stationery.inc in Deskset's settings folder);
; right-click › Edit Cities… changes them. Each city is worked out on the Mac, including its daylight saving time.

[Rainmeter]
Update=1000
AccurateText=1
SkinWidth=170
SkinHeight=170
DynamicWindowSize=0
Group=Stationery
; the window's own look, once Deskset reads it (until then it is macOS's)
MacAppearance=#LookAppearance#
ContextTitle=#ClockMenuOpen#
ContextAction=#OpenAction#
ContextTitle2=---
ContextTitle3=#WorldClockMenuEdit#
ContextAction3=#EditEnter#
ContextTitle4=#MenuClockTitle#
ContextAction4=#MenuClockAction#
ContextTitle5=---
ContextTitle6=#MenuLookTitle#
ContextAction6=#MenuLookAction#
ContextTitle7=#MenuCardsTitle#
ContextAction7=#MenuCardsAction#

[Metadata]
Name=World Clock
Author=Deskset
License=MIT
Version=1.0
Information=Stationery · The time in three cities, with their offsets from here and day or night there. Right-click › Edit Cities… to change them: type a city in any language. Everything is worked out on your Mac.

[Variables]
@Include=#@#Variables.inc
@Include2=#@#Suite/Tokens.inc
@Include3=#@#Suite/Styles.inc
; the cities as they ship; Stationery.inc (the next include) keeps the ones you choose. City1 is the medium size's first
; dial: Local is this Mac's own time zone
City1=Local
City2=London
City3=New York
City4=Tokyo
; set once the first run has checked that no default city is in this Mac's own zone (else Sydney takes its place)
WorldClockSeeded=0
@Include4=#StationeryFile#
@Include5=#@#WorldClock/Strings-#Language#.inc
@Include6=#@#WorldClock/Measures.inc
CardW=170
CardH=170
OpenAction=["/System/Applications/Clock.app"]
; Edit Cities…: the rows take the place of the clocks; nothing is saved until Done
EditEnter=[!SetVariable EditMode 1][!DisableMouseAction MeterCard LeftMouseUpAction][!EnableMeasureGroup Edit][!EnableMeasureGroup EditLookup][!UpdateMeasureGroup EditLookup][!UpdateMeasureGroup Edit][!UpdateMeterGroup CitiesFirst][!UpdateMeterGroup Cities][!UpdateMeterGroup EditFirst][!UpdateMeterGroup Edit][!Redraw]
EditDone=[!EnableMeasure MeasureSave1][!EnableMeasure MeasureSave2][!EnableMeasure MeasureSave3][!EnableMeasure MeasureSave4][!UpdateMeasure MeasureSave1][!UpdateMeasure MeasureSave2][!UpdateMeasure MeasureSave3][!UpdateMeasure MeasureSave4][!RefreshGroup Stationery]
Edit2Right0=
Edit2Right1=#WorldClockLocal#
Edit2Right2=[MeasureEdit2OffsetText]
Edit2Right3=[MeasureEdit2OffsetText]
Edit2Right4=[MeasureEdit2OffsetText]
Edit2Right5=
Edit2Right6=
Edit2Right7=
Edit3Right0=
Edit3Right1=#WorldClockLocal#
Edit3Right2=[MeasureEdit3OffsetText]
Edit3Right3=[MeasureEdit3OffsetText]
Edit3Right4=[MeasureEdit3OffsetText]
Edit3Right5=
Edit3Right6=
Edit3Right7=
Edit4Right0=
Edit4Right1=#WorldClockLocal#
Edit4Right2=[MeasureEdit4OffsetText]
Edit4Right3=[MeasureEdit4OffsetText]
Edit4Right4=[MeasureEdit4OffsetText]
Edit4Right5=
Edit4Right6=
Edit4Right7=

[MeasureEdit]
; the field that opens over a row in Edit Cities… (square and opaque until Deskset's fields take the Mac's look). Return
; looks the name up and shows what it found; Escape changes nothing
Measure=Plugin
Plugin=InputText
X=36
W=(#CardW# - 50)
H=20
SolidColor=#FieldColor#
FontColor=#TextColor#
FontFace=#FontText#
FontSize=9.75
FocusDismiss=1
Command2=[!SetVariable EditCity2 """$UserInput$"""][!SetVariable EditChanged2 1][!SetVariable EditWait2 1][!UpdateMeasureGroup EditLookup][!UpdateMeasureGroup Edit][!UpdateMeterGroup EditFirst][!UpdateMeterGroup Edit][!Redraw][!Delay 400][!SetVariable EditWait2 0][!UpdateMeasureGroup Edit][!UpdateMeterGroup EditFirst][!UpdateMeterGroup Edit][!Redraw] Y=39.4 DefaultValue="[#EditCity2]"
Command3=[!SetVariable EditCity3 """$UserInput$"""][!SetVariable EditChanged3 1][!SetVariable EditWait3 1][!UpdateMeasureGroup EditLookup][!UpdateMeasureGroup Edit][!UpdateMeterGroup EditFirst][!UpdateMeterGroup Edit][!Redraw][!Delay 400][!SetVariable EditWait3 0][!UpdateMeasureGroup Edit][!UpdateMeterGroup EditFirst][!UpdateMeterGroup Edit][!Redraw] Y=63.4 DefaultValue="[#EditCity3]"
Command4=[!SetVariable EditCity4 """$UserInput$"""][!SetVariable EditChanged4 1][!SetVariable EditWait4 1][!UpdateMeasureGroup EditLookup][!UpdateMeasureGroup Edit][!UpdateMeterGroup EditFirst][!UpdateMeterGroup Edit][!Redraw][!Delay 400][!SetVariable EditWait4 0][!UpdateMeasureGroup Edit][!UpdateMeterGroup EditFirst][!UpdateMeterGroup Edit][!Redraw] Y=87.4 DefaultValue="[#EditCity4]"

; ---------------------------------------------------------------- meters
[MeterCard]
Meter=Shape
MeterStyle=sCard
ToolTipTitle=#WorldClockTitle#
ToolTipText=[#City2Card[&MeasureCity2State:0]] · [#City3Card[&MeasureCity3State:0]] · [#City4Card[&MeasureCity4State:0]]
Group=Cities
UpdateDivider=-1

; ---------------------------------------------------------------- city 2: name and offset on the left, the time on the right
[MeterRow2]
; the row's hit area: the city's sentence as its tooltip; a click opens Clock
Meter=Shape
Shape=Rectangle 8,10,154,45,#RowPadRadius# | Fill Color 0,0,0,1 | StrokeWidth 0
ToolTipTitle=[MeasureCity2Name]
ToolTipText=[#City2Tip[&MeasureCity2State:0]]
LeftMouseUpAction=#OpenAction#
Hidden=(#EditMode# = 1)
DynamicVariables=1
Group=Cities
UpdateDivider=-1

[MeterTime2]
; 22 pt on the city's baseline; "--:--" in Tertiary until the city is found
Meter=String
MeterStyle=sMetricM
MeasureName=MeasureCity2Time
Text=[#TimeText[&MeasureCity2State:0]]
FontColor=[#TimeInk[&MeasureCity2State:0]]
StringAlign=Right
X=(#CardW# - 16)
Y=(34 - #Ascent22#)
Hidden=(#EditMode# = 1)
DynamicVariables=1
; updated before the rest (group CitiesFirst): the name's width reads this one's
Group=CitiesFirst
UpdateDivider=-1

[MeterName2]
; clipped 6 pt before the time (the tooltip has the whole name)
Meter=String
MeterStyle=sBodyStrong
Text=[MeasureCity2Name]
X=16
Y=(34 - #Ascent13#)
W=(#CardW# - 16 - [MeterTime2:W] - 22)
ClipString=1
Hidden=(#EditMode# = 1)
DynamicVariables=1
Group=Cities
UpdateDivider=-1

[MeterOffset2]
; "−1 h", "+5 h 30 min": digits Rounded, letters SF Pro
Meter=String
MeterStyle=sCaptionNum
Text=[#Offset2Text[&MeasureCity2State:0]]
X=16
Y=(49 - #Ascent11#)
Hidden=(#EditMode# = 1)
DynamicVariables=1
Group=Cities
UpdateDivider=-1

[MeterTag2]
; the weekday when the city's date is not today's here ("SUN"), then AM or PM in 12-hour time ("SUN AM")
Meter=String
MeterStyle=sMicro
MeasureName=MeasureCity2Weekday
MeasureName2=MeasureCity2AMPM
Text=[#TagDay[&MeasureCity2SameDay:0]][#WorldClockTagAMPM[#Hours]]
FontColor=#SecondaryTextColor#
StringAlign=Right
X=(#CardW# - 16 - 12 - 4)
Y=(49 - #Ascent9#)
; an empty text would show the weekday anyway (a String meter's default), so the tag hides instead
Hidden=((#EditMode# = 1) || ([MeasureCity2State:] <> 1) || (([MeasureCity2SameDay:] = 1) && (#Hours# = 24)))
DynamicVariables=1
Group=Cities
UpdateDivider=-1

[MeterDayGlyph2]
; day or night there, 9 pt in the caption's ink, centred on the caption line at the right edge
Meter=Image
ImageName=sf:[#DayGlyph[&MeasureCity2Day:0]]
MacSymbolSize=9
MacSymbolWeight=Semibold
ImageTint=#TertiaryTextColor#
PreserveAspectRatio=1
X=(#CardW# - 16 - 12)
Y=(49 - #CapHeight11# / 2 - 6)
W=12
H=12
Hidden=((#EditMode# = 1) || ([MeasureCity2State:] <> 1))
DynamicVariables=1
Group=Cities
UpdateDivider=-1

