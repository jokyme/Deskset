[MeterEditCancelHit]
; Cancel: the saved cities stay
Meter=Image
MeterStyle=sHit
X=8
Y=137
W=70
H=28
LeftMouseUpAction=[!Refresh]
Hidden=(#EditMode# = 0)
DynamicVariables=1
Group=Edit
UpdateDivider=-1

[MeterEditDoneHit]
; Done: every new city that was found is saved, and the World Clocks show them
Meter=Image
MeterStyle=sHit
X=(#CardW# - 78)
Y=137
W=70
H=28
LeftMouseUpAction=#EditDone#
Hidden=(#EditMode# = 0)
DynamicVariables=1
Group=Edit
UpdateDivider=-1

; ---------------------------------------------------------------- the small size shows neither this Mac's own zone nor the
; first city (the medium size's first dial), so it looks neither up
[MeasureHome]
Disabled=1

[MeasureCity1IsLocal]
Disabled=1
