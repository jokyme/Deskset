MeterStyle=sCaption
FontColor=#TertiaryTextColor#
Text=[#Edit2Match[&MeasureEdit2Kind:0]]
; (placed from the probe's width: a meter's own W formula is read back only after the redraw)
X=(#SlotTextX# + Min([MeterEditNameWidth2:W] + 1, #CardW# - 16 - [MeterEditRight2:W] - 6 - #SlotTextX#) + 6)
Y=(54 - #Ascent11#)
W=(Max(1, #CardW# - 16 - [MeterEditRight2:W] - 6 - #SlotTextX# - Min([MeterEditNameWidth2:W] + 1, #CardW# - 16 - [MeterEditRight2:W] - 6 - #SlotTextX#) - 6))
