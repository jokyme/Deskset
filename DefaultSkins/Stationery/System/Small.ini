; Stationery · System, small (170 × 170): the Mac's name and two rings, CPU and memory. Original work, MIT licensed.

[Rainmeter]
Update=1000
AccurateText=1
SkinWidth=170
SkinHeight=170
DynamicWindowSize=0
Group=Stationery
; the window's own look, once Deskset reads it (until then it is macOS's)
MacAppearance=#LookAppearance#
ContextTitle=#SystemMenuOpen#
ContextAction=#OpenAction#
ContextTitle2=---
ContextTitle3=#MenuLookTitle#
ContextAction3=#MenuLookAction#
ContextTitle4=#MenuCardsTitle#
ContextAction4=#MenuCardsAction#
ContextTitle5=#MenuLanguageTitle#
ContextAction5=#MenuLanguageAction#

[Metadata]
Name=System
Author=Deskset
License=MIT
Version=1.0
Information=Stationery · CPU and memory at a glance; the tooltip adds the disk, the GPU and the uptime. Click to open Activity Monitor. Needs no permission.

[Variables]
@Include=#@#System/Settings.inc
@Include2=#@#Variables.inc
@Include3=#@#Suite/Tokens.inc
@Include4=#@#Suite/Styles.inc
@Include5=#@#System/Strings-#Language#.inc
@Include6=#@#System/Source-#SystemSource#.inc
@Include7=#@#System/Measures.inc
CardW=170
CardH=170
OpenAction=["/System/Applications/Utilities/Activity Monitor.app"]

; ---------------------------------------------------------------- what stays: the card, the header and the labels
; The window keeps one picture of everything down to the rings and copies it under them at every update: a meter that
; does not change is drawn once, into that picture. So nothing here updates on its own: UpdateDivider=-1, or the bang
; of the measure whose change it shows.
[MeterCard]
Meter=Shape
MeterStyle=sCard
; the sentence carries live values: it is read when the tooltip opens (%1, the measure bound to the card), so the
; card itself never changes
MeasureName=MeasureSentence
ToolTipTitle=[MeasureComputerName]
ToolTipText=%1
UpdateDivider=-1

[MeterLaptopGlyph]
; laptopcomputer, natural 20 × 12, centred on the leading slot (26, 23)
Meter=Image
MeterStyle=sSymbolS
ImageName=sf:laptopcomputer
MacSymbolRendering=Hierarchical
ImageTint=#SecondaryTextColor#
X=16
Y=17
W=20
H=12
UpdateDivider=-1

[MeterDesktopGlyph]
; a Mac without a battery: desktopcomputer, natural 17 × 14
Meter=Image
MeterStyle=sSymbolS
ImageName=sf:desktopcomputer
MacSymbolRendering=Hierarchical
ImageTint=#SecondaryTextColor#
X=17.5
Y=16
W=17
H=14
Hidden=1
UpdateDivider=-1

[MeterName]
; the Mac's name; a long one ends in "…" (the tooltip has it, and the uptime)
Meter=String
MeterStyle=sLabel | sHeaderTitle
MeasureName=MeasureComputerName
UpdateDivider=-1

[MeterCPULabel]
Meter=String
MeterStyle=sLabelCaps
StringAlign=Center
X=50.5
Y=(#LastBaseline# - #Ascent11#)
Text=#SystemCPU#
UpdateDivider=-1

[MeterMemLabel]
Meter=String
MeterStyle=sLabelCaps
StringAlign=Center
X=119.5
Y=(#LastBaseline# - #Ascent11#)
Text=#SystemMemory#
UpdateDivider=-1

; ---------------------------------------------------------------- what changes: the rings, over that picture
; Drawn again at every update, each symbol over its ring (the ring's box catches the mouse). Every meter here updates
; every second, the memory's too, which changes every other second: a meter resting while the others change would
; need a picture of its own, drawn again whenever it changes.
; CPU (ring centre 50.5, 78)
[MeterCPURing]
; Ring M: box 60, radius 26.5, stroke 7; the arc from 12 o'clock, clockwise, hidden until the second reading
Meter=Shape
X=20.5
Y=48
Shape=Ellipse 30,30,26.5 | Fill Color 0,0,0,0 | StrokeWidth 7 | Stroke Color #CPUColor#,#TrackAlpha#
Shape2=Arc 30,3.5,(30 + 26.5 * Sin(Rad([MeasureCPUAngle:]))),(30 - 26.5 * Cos(Rad([MeasureCPUAngle:]))),26.5,26.5,0,0,[MeasureCPULarge:] | Fill Color 0,0,0,0 | StrokeWidth 7 | Stroke Color #CPUColor#,(255 * #CPUReady#) | StrokeStartCap Round | StrokeEndCap Round
; the whole ring's box shows its tooltip
SolidColor=0,0,0,1
ToolTipTitle=#SystemCPU#
ToolTipText=#SystemTipCPU#
DynamicVariables=1
UpdateDivider=1

[MeterCPUSymbol]
; cpu 17 pt, natural 22 × 21
Meter=Image
ImageName=sf:cpu
MacSymbolSize=17
MacSymbolWeight=Semibold
ImageTint=#CPUColor#
X=39.5
Y=67.5
W=22
H=21
UpdateDivider=1

[MeterCPUValue]
Meter=String
MeterStyle=sMetricS | sMissing
MeasureName=MeasureCPUText
StringAlign=Center
X=50.5
Y=(130 - #Ascent15#)
UpdateDivider=1

; memory (ring centre 119.5, 78)
[MeterMemRing]
Meter=Shape
X=89.5
Y=48
Shape=Ellipse 30,30,26.5 | Fill Color 0,0,0,0 | StrokeWidth 7 | Stroke Color #MemoryColor#,#TrackAlpha#
Shape2=Arc 30,3.5,(30 + 26.5 * Sin(Rad([MeasureMemAngle:]))),(30 - 26.5 * Cos(Rad([MeasureMemAngle:]))),26.5,26.5,0,0,[MeasureMemLarge:] | Fill Color 0,0,0,0 | StrokeWidth 7 | Stroke Color #MemoryColor# | StrokeStartCap Round | StrokeEndCap Round
SolidColor=0,0,0,1
ToolTipTitle=#SystemMemory#
ToolTipText=#SystemTipMemory#
DynamicVariables=1
UpdateDivider=1

[MeterMemSymbol]
; memorychip 17 pt, natural 22 × 18
Meter=Image
ImageName=sf:memorychip
MacSymbolSize=17
MacSymbolWeight=Semibold
ImageTint=#MemoryColor#
X=108.5
Y=69
W=22
H=18
UpdateDivider=1

[MeterMemValue]
; "20.4 GB", the unit in 11 pt
Meter=String
MeterStyle=sMetricS | sUnit | sMissing
MeasureName=MeasureMemText
StringAlign=Center
X=119.5
Y=(130 - #Ascent15#)
UpdateDivider=1
