; Stationery · System, medium (360 × 170): the Mac's name and uptime, and four rings: CPU, memory, disk and GPU (or
; swap). Original work, MIT licensed.

[Rainmeter]
Update=1000
AccurateText=1
SkinWidth=360
SkinHeight=170
DynamicWindowSize=0
Group=Stationery
; the window's own look, once Deskset reads it (until then it is macOS's)
MacAppearance=#LookAppearance#
ContextTitle=#SystemMenuOpen#
ContextAction=#OpenAction#
ContextTitle2=---
ContextTitle3=[#SystemMenuFourth[#SystemFourthRing]]
ContextAction3=[!WriteKeyValue Variables SystemFourthRing [#SystemFourthNext[#SystemFourthRing]] "#@#Variables.inc"][!Refresh]
ContextTitle4=---
ContextTitle5=#MenuLookTitle#
ContextAction5=#MenuLookAction#
ContextTitle6=#MenuCardsTitle#
ContextAction6=#MenuCardsAction#
ContextTitle7=#MenuLanguageTitle#
ContextAction7=#MenuLanguageAction#

[Metadata]
Name=System
Author=Deskset
License=MIT
Version=1.0
Information=Stationery · CPU, memory, disk and GPU at a glance. The Large adds CPU history or per-core load, and the busiest processes. Click to open Activity Monitor. Needs no permission.

[Variables]
@Include=#@#System/Settings.inc
@Include2=#@#Variables.inc
@Include3=#@#Suite/Tokens.inc
@Include4=#@#Suite/Styles.inc
@Include5=#@#System/Strings-#Language#.inc
@Include6=#@#System/Source-#SystemSource#.inc
@Include7=#@#System/Measures.inc
CardW=360
CardH=170
OpenAction=["/System/Applications/Utilities/Activity Monitor.app"]
SystemFourthNextGPU=Swap
SystemFourthNextSwap=GPU

; ---------------------------------------------------------------- the card and the header
[MeterCard]
Meter=Shape
MeterStyle=sCard
ToolTipTitle=[MeasureComputerName]
ToolTipText=[MeasureSentence]
; the sentence carries live values, so it is read every 5 s rather than every minute
UpdateDivider=5

[MeterLaptopGlyph]
; laptopcomputer, natural 20 × 12, centred on the leading slot (26, 23)
Meter=Image
MeterStyle=sSymbolS
ImageName=sf:laptopcomputer
MacSymbolRendering=Hierarchical
ImageTint=#SecondaryTextColor#
X=16
Y=17
W=20
H=12
UpdateDivider=-1

[MeterDesktopGlyph]
; a Mac without a battery: desktopcomputer, natural 17 × 14
Meter=Image
MeterStyle=sSymbolS
ImageName=sf:desktopcomputer
MacSymbolRendering=Hierarchical
ImageTint=#SecondaryTextColor#
X=17.5
Y=16
W=17
H=14
Hidden=1
UpdateDivider=-1

[MeterName]
; the Mac's name, leaving room for the uptime
Meter=String
MeterStyle=sLabel | sHeaderTitle
MeasureName=MeasureComputerName
W=(#CardW# - 57 - #UptimeReserve#)
UpdateDivider=-1

[MeterUptime]
; "Up 14 d 5 h"
Meter=String
MeterStyle=sCaption | sHeaderTrailing
MeasureName=MeasureUptimeText
Text=#SystemUp#
UpdateDivider=60

; ---------------------------------------------------------------- CPU (ring centre 57, 78)
[MeterCPURing]
; Ring M: box 60, radius 26.5, stroke 7; the arc from 12 o'clock, clockwise, hidden until the second reading
Meter=Shape
X=27
Y=48
Shape=Ellipse 30,30,26.5 | Fill Color 0,0,0,0 | StrokeWidth 7 | Stroke Color #CPUColor#,#TrackAlpha#
Shape2=Arc 30,3.5,(30 + 26.5 * Sin(Rad([MeasureCPUAngle:]))),(30 - 26.5 * Cos(Rad([MeasureCPUAngle:]))),26.5,26.5,0,0,[MeasureCPULarge:] | Fill Color 0,0,0,0 | StrokeWidth 7 | Stroke Color #CPUColor#,(255 * #CPUReady#) | StrokeStartCap Round | StrokeEndCap Round
; the whole ring's box shows its tooltip
SolidColor=0,0,0,1
ToolTipTitle=#SystemCPU#
ToolTipText=#SystemTipCPU#
DynamicVariables=1

[MeterCPUSymbol]
; cpu 17 pt, natural 22 × 21
Meter=Image
ImageName=sf:cpu
MacSymbolSize=17
MacSymbolWeight=Semibold
ImageTint=#CPUColor#
X=46
Y=67.5
W=22
H=21
UpdateDivider=-1

[MeterCPUValue]
Meter=String
MeterStyle=sMetricS | sMissing
MeasureName=MeasureCPUText
StringAlign=Center
X=57
Y=(130 - #Ascent15#)

[MeterCPULabel]
Meter=String
MeterStyle=sLabelCaps
StringAlign=Center
X=57
Y=(#LastBaseline# - #Ascent11#)
Text=#SystemCPU#
UpdateDivider=-1

; ---------------------------------------------------------------- memory (ring centre 139, 78)
[MeterMemRing]
Meter=Shape
X=109
Y=48
Shape=Ellipse 30,30,26.5 | Fill Color 0,0,0,0 | StrokeWidth 7 | Stroke Color #MemoryColor#,#TrackAlpha#
Shape2=Arc 30,3.5,(30 + 26.5 * Sin(Rad([MeasureMemAngle:]))),(30 - 26.5 * Cos(Rad([MeasureMemAngle:]))),26.5,26.5,0,0,[MeasureMemLarge:] | Fill Color 0,0,0,0 | StrokeWidth 7 | Stroke Color #MemoryColor# | StrokeStartCap Round | StrokeEndCap Round
SolidColor=0,0,0,1
ToolTipTitle=#SystemMemory#
ToolTipText=#SystemTipMemory#
DynamicVariables=1
UpdateDivider=2

[MeterMemSymbol]
; memorychip 17 pt, natural 22 × 18
Meter=Image
ImageName=sf:memorychip
MacSymbolSize=17
MacSymbolWeight=Semibold
ImageTint=#MemoryColor#
X=128
Y=69
W=22
H=18
UpdateDivider=-1

[MeterMemValue]
; "20.4 GB", the unit in 11 pt
Meter=String
MeterStyle=sMetricS | sUnit | sMissing
MeasureName=MeasureMemText
StringAlign=Center
X=139
Y=(130 - #Ascent15#)
UpdateDivider=2

[MeterMemLabel]
Meter=String
MeterStyle=sLabelCaps
StringAlign=Center
X=139
Y=(#LastBaseline# - #Ascent11#)
Text=#SystemMemory#
UpdateDivider=-1

; ---------------------------------------------------------------- disk (ring centre 221, 78)
[MeterDiskRing]
; the storage colour, red from 95 % used
Meter=Shape
X=191
Y=48
Shape=Ellipse 30,30,26.5 | Fill Color 0,0,0,0 | StrokeWidth 7 | Stroke Color #DiskColor#,#TrackAlpha#
Shape2=Arc 30,3.5,(30 + 26.5 * Sin(Rad([MeasureDiskAngle:]))),(30 - 26.5 * Cos(Rad([MeasureDiskAngle:]))),26.5,26.5,0,0,[MeasureDiskLarge:] | Fill Color 0,0,0,0 | StrokeWidth 7 | Stroke Color #DiskColor#,(([MeasureDiskUsedPct:] >= 0) * 255) | StrokeStartCap Round | StrokeEndCap Round
SolidColor=0,0,0,1
ToolTipTitle=[MeasureDiskName]
ToolTipText=[#SystemTipDisk[#DiskFull]]
DynamicVariables=1
UpdateDivider=5
Group=Disk

[MeterDiskSymbol]
; internaldrive 17 pt, natural 25 × 18
Meter=Image
ImageName=sf:internaldrive
MacSymbolSize=17
MacSymbolWeight=Semibold
ImageTint=#DiskColor#
X=208.5
Y=69
W=25
H=18
DynamicVariables=1
UpdateDivider=5
Group=Disk

[MeterDiskValue]
; "88%", in CriticalTextColor from 95 %
Meter=String
MeterStyle=sMetricS | sMissing
MeasureName=MeasureDiskText
FontColor=#DiskTextColor#
StringAlign=Center
X=221
Y=(130 - #Ascent15#)
DynamicVariables=1
UpdateDivider=5
Group=Disk

[MeterDiskLabel]
Meter=String
MeterStyle=sLabelCaps
StringAlign=Center
X=221
Y=(#LastBaseline# - #Ascent11#)
Text=#SystemDisk#
UpdateDivider=-1

; ---------------------------------------------------------------- the fourth ring (centre 303, 78): GPU …
[MeterGPURing]
Meter=Shape
X=273
Y=48
Shape=Ellipse 30,30,26.5 | Fill Color 0,0,0,0 | StrokeWidth 7 | Stroke Color #GPUColor#,#TrackAlpha#
Shape2=Arc 30,3.5,(30 + 26.5 * Sin(Rad([MeasureGPUAngle:]))),(30 - 26.5 * Cos(Rad([MeasureGPUAngle:]))),26.5,26.5,0,0,[MeasureGPULarge:] | Fill Color 0,0,0,0 | StrokeWidth 7 | Stroke Color #GPUColor#,(255 * #GPUReady#) | StrokeStartCap Round | StrokeEndCap Round
SolidColor=0,0,0,1
ToolTipTitle=#SystemGPU#
ToolTipText=#SystemTipGPU#
Hidden=#FourthSwap#
DynamicVariables=1
UpdateDivider=2
Group=RingGPU

[MeterGPUSymbol]
; cube.transparent 17 pt, natural 22 × 23
Meter=Image
ImageName=sf:cube.transparent
MacSymbolSize=17
MacSymbolWeight=Semibold
ImageTint=#GPUColor#
X=292
Y=66.5
W=22
H=23
Hidden=#FourthSwap#
UpdateDivider=-1
Group=RingGPU

[MeterGPUValue]
Meter=String
MeterStyle=sMetricS | sMissing
MeasureName=MeasureGPUText
StringAlign=Center
X=303
Y=(130 - #Ascent15#)
Hidden=#FourthSwap#
UpdateDivider=2
Group=RingGPU

[MeterGPULabel]
Meter=String
MeterStyle=sLabelCaps
StringAlign=Center
X=303
Y=(#LastBaseline# - #Ascent11#)
Text=#SystemGPU#
Hidden=#FourthSwap#
UpdateDivider=-1
Group=RingGPU

; ---------------------------------------------------------------- … or swap
[MeterSwapRing]
; swap in use against the Mac's memory
Meter=Shape
X=273
Y=48
Shape=Ellipse 30,30,26.5 | Fill Color 0,0,0,0 | StrokeWidth 7 | Stroke Color #SwapColor#,#TrackAlpha#
Shape2=Arc 30,3.5,(30 + 26.5 * Sin(Rad([MeasureSwapAngle:]))),(30 - 26.5 * Cos(Rad([MeasureSwapAngle:]))),26.5,26.5,0,0,[MeasureSwapLarge:] | Fill Color 0,0,0,0 | StrokeWidth 7 | Stroke Color #SwapColor# | StrokeStartCap Round | StrokeEndCap Round
SolidColor=0,0,0,1
ToolTipTitle=#SystemSwap#
ToolTipText=[#SystemTipSwap[#GPUMissing]]
Hidden=(1 - #FourthSwap#)
DynamicVariables=1
UpdateDivider=2
Group=RingSwap

[MeterSwapSymbol]
; rectangle.2.swap 17 pt, natural 28 × 24
Meter=Image
ImageName=sf:rectangle.2.swap
MacSymbolSize=17
MacSymbolWeight=Semibold
ImageTint=#SwapColor#
X=289
Y=66
W=28
H=24
Hidden=(1 - #FourthSwap#)
UpdateDivider=-1
Group=RingSwap

[MeterSwapValue]
; "1.2 GB", "684 MB"
Meter=String
MeterStyle=sMetricS | sUnit | sMissing
MeasureName=MeasureSwapText
StringAlign=Center
X=303
Y=(130 - #Ascent15#)
Hidden=(1 - #FourthSwap#)
UpdateDivider=2
Group=RingSwap

[MeterSwapLabel]
Meter=String
MeterStyle=sLabelCaps
StringAlign=Center
X=303
Y=(#LastBaseline# - #Ascent11#)
Text=#SystemSwap#
Hidden=(1 - #FourthSwap#)
UpdateDivider=-1
Group=RingSwap
