; Stationery · System, large (360 × 360): the Medium's rings, the CPU over the last 5 minutes (or every core's load)
; and the busiest processes. Original work, MIT licensed.

[Rainmeter]
Update=1000
AccurateText=1
SkinWidth=360
SkinHeight=360
DynamicWindowSize=0
Group=Stationery
; the window's own look, once Deskset reads it (until then it is macOS's)
MacAppearance=#LookAppearance#
ContextTitle=#SystemMenuOpen#
ContextAction=#OpenAction#
ContextTitle2=---
ContextTitle3=[#SystemMenuFourth[#SystemFourthRing]]
ContextAction3=[!WriteKeyValue Variables SystemFourthRing [#SystemFourthNext[#SystemFourthRing]] "#@#Variables.inc"][!Refresh]
ContextTitle4=[#SystemMenuCPU[#SystemCPUView]]
ContextAction4=[!WriteKeyValue Variables SystemCPUView [#SystemCPUNext[#SystemCPUView]] "#@#Variables.inc"][!Refresh]
ContextTitle5=[#SystemMenuSort[#SystemSortBy]]
ContextAction5=[!WriteKeyValue Variables SystemSortBy "(1 - #SystemSortBy#)" "#@#Variables.inc"][!SetVariable SystemSortBy "(1 - #SystemSortBy#)"][!UpdateMeasure MeasureSortBy]
ContextTitle6=---
ContextTitle7=#MenuLookTitle#
ContextAction7=#MenuLookAction#
ContextTitle8=#MenuCardsTitle#
ContextAction8=#MenuCardsAction#

[Metadata]
Name=System
Author=Deskset
License=MIT
Version=1.0
Information=Stationery · CPU, memory, disk and GPU at a glance, the CPU's last 5 minutes (or every core's load) and the busiest processes. Click to open Activity Monitor. Needs no permission.

[Variables]
@Include=#@#System/Settings.inc
@Include2=#@#Variables.inc
@Include3=#@#Suite/Tokens.inc
@Include4=#@#Suite/Styles.inc
@Include5=#@#System/Strings-#Language#.inc
@Include6=#@#System/Source-#SystemSource#.inc
@Include7=#@#System/Measures.inc
@Include8=#@#System/Processes-#SystemSource#.inc
@Include9=#@#System/CoreLoads-#SystemSource#.inc
@Include10=#@#System/Large.inc
CardW=360
CardH=360
OpenAction=["/System/Applications/Utilities/Activity Monitor.app"]
SystemFourthNextGPU=Swap
SystemFourthNextSwap=GPU
SystemCPUNextHistory=Cores
SystemCPUNextCores=History

; ---------------------------------------------------------------- the card and the header
[MeterCard]
Meter=Shape
MeterStyle=sCard
ToolTipTitle=[MeasureComputerName]
ToolTipText=[MeasureSentence]
; the sentence carries live values, so it is read every 5 s rather than every minute
UpdateDivider=5

[MeterLaptopGlyph]
; laptopcomputer, natural 20 × 12, centred on the leading slot (26, 23)
Meter=Image
MeterStyle=sSymbolS
ImageName=sf:laptopcomputer
MacSymbolRendering=Hierarchical
ImageTint=#SecondaryTextColor#
X=16
Y=17
W=20
H=12
UpdateDivider=-1

[MeterDesktopGlyph]
; a Mac without a battery: desktopcomputer, natural 17 × 14
Meter=Image
MeterStyle=sSymbolS
ImageName=sf:desktopcomputer
MacSymbolRendering=Hierarchical
ImageTint=#SecondaryTextColor#
X=17.5
Y=16
W=17
H=14
Hidden=1
UpdateDivider=-1

[MeterName]
; the Mac's name, leaving room for the uptime
Meter=String
MeterStyle=sLabel | sHeaderTitle
MeasureName=MeasureComputerName
W=(#CardW# - 57 - #UptimeReserve#)
UpdateDivider=-1

[MeterUptime]
; "Up 14 d 5 h"
Meter=String
MeterStyle=sCaption | sHeaderTrailing
MeasureName=MeasureUptimeText
Text=#SystemUp#
UpdateDivider=60

; ---------------------------------------------------------------- CPU (centre 57, 70)
; the rings are the Medium's, a little higher: centres on y 70, values on 122, labels on 140
[MeterCPURing]
Meter=Shape
X=27
Y=40
Shape=Ellipse 30,30,26.5 | Fill Color 0,0,0,0 | StrokeWidth 7 | Stroke Color #CPUColor#,#TrackAlpha#
Shape2=Arc 30,3.5,(30 + 26.5 * Sin(Rad([MeasureCPUAngle:]))),(30 - 26.5 * Cos(Rad([MeasureCPUAngle:]))),26.5,26.5,0,0,[MeasureCPULarge:] | Fill Color 0,0,0,0 | StrokeWidth 7 | Stroke Color #CPUColor#,(255 * #CPUReady#) | StrokeStartCap Round | StrokeEndCap Round
SolidColor=0,0,0,1
ToolTipTitle=#SystemCPU#
ToolTipText=[#SystemTipCPUCores[&MeasureCoreKinds:0]]
DynamicVariables=1

[MeterCPUSymbol]
Meter=Image
ImageName=sf:cpu
MacSymbolSize=17
MacSymbolWeight=Semibold
ImageTint=#CPUColor#
X=46
Y=59.5
W=22
H=21
UpdateDivider=-1

[MeterCPUValue]
Meter=String
MeterStyle=sMetricS | sMissing
MeasureName=MeasureCPUText
StringAlign=Center
X=57
Y=(122 - #Ascent15#)

[MeterCPULabel]
Meter=String
MeterStyle=sLabelCaps
StringAlign=Center
X=57
Y=(140 - #Ascent11#)
Text=#SystemCPU#
UpdateDivider=-1

; ---------------------------------------------------------------- memory (centre 139)
[MeterMemRing]
Meter=Shape
X=109
Y=40
Shape=Ellipse 30,30,26.5 | Fill Color 0,0,0,0 | StrokeWidth 7 | Stroke Color #MemoryColor#,#TrackAlpha#
Shape2=Arc 30,3.5,(30 + 26.5 * Sin(Rad([MeasureMemAngle:]))),(30 - 26.5 * Cos(Rad([MeasureMemAngle:]))),26.5,26.5,0,0,[MeasureMemLarge:] | Fill Color 0,0,0,0 | StrokeWidth 7 | Stroke Color #MemoryColor# | StrokeStartCap Round | StrokeEndCap Round
SolidColor=0,0,0,1
ToolTipTitle=#SystemMemory#
ToolTipText=#SystemTipMemory#
DynamicVariables=1
UpdateDivider=2

[MeterMemSymbol]
Meter=Image
ImageName=sf:memorychip
MacSymbolSize=17
MacSymbolWeight=Semibold
ImageTint=#MemoryColor#
X=128
Y=61
W=22
H=18
UpdateDivider=-1

[MeterMemValue]
Meter=String
MeterStyle=sMetricS | sUnit | sMissing
MeasureName=MeasureMemText
StringAlign=Center
X=139
Y=(122 - #Ascent15#)
UpdateDivider=2

[MeterMemLabel]
Meter=String
MeterStyle=sLabelCaps
StringAlign=Center
X=139
Y=(140 - #Ascent11#)
Text=#SystemMemory#
UpdateDivider=-1

; ---------------------------------------------------------------- disk (centre 221)
[MeterDiskRing]
Meter=Shape
X=191
Y=40
Shape=Ellipse 30,30,26.5 | Fill Color 0,0,0,0 | StrokeWidth 7 | Stroke Color #DiskColor#,#TrackAlpha#
Shape2=Arc 30,3.5,(30 + 26.5 * Sin(Rad([MeasureDiskAngle:]))),(30 - 26.5 * Cos(Rad([MeasureDiskAngle:]))),26.5,26.5,0,0,[MeasureDiskLarge:] | Fill Color 0,0,0,0 | StrokeWidth 7 | Stroke Color #DiskColor#,(([MeasureDiskUsedPct:] >= 0) * 255) | StrokeStartCap Round | StrokeEndCap Round
SolidColor=0,0,0,1
ToolTipTitle=[MeasureDiskName]
ToolTipText=[#SystemTipDisk[#DiskFull]]
DynamicVariables=1
UpdateDivider=5
Group=Disk

[MeterDiskSymbol]
Meter=Image
ImageName=sf:internaldrive
MacSymbolSize=17
MacSymbolWeight=Semibold
ImageTint=#DiskColor#
X=208.5
Y=61
W=25
H=18
DynamicVariables=1
UpdateDivider=5
Group=Disk

[MeterDiskValue]
Meter=String
MeterStyle=sMetricS | sMissing
MeasureName=MeasureDiskText
FontColor=#DiskTextColor#
StringAlign=Center
X=221
Y=(122 - #Ascent15#)
DynamicVariables=1
UpdateDivider=5
Group=Disk

[MeterDiskLabel]
Meter=String
MeterStyle=sLabelCaps
StringAlign=Center
X=221
Y=(140 - #Ascent11#)
Text=#SystemDisk#
UpdateDivider=-1

; ---------------------------------------------------------------- the fourth ring (centre 303): GPU …
[MeterGPURing]
Meter=Shape
X=273
Y=40
Shape=Ellipse 30,30,26.5 | Fill Color 0,0,0,0 | StrokeWidth 7 | Stroke Color #GPUColor#,#TrackAlpha#
Shape2=Arc 30,3.5,(30 + 26.5 * Sin(Rad([MeasureGPUAngle:]))),(30 - 26.5 * Cos(Rad([MeasureGPUAngle:]))),26.5,26.5,0,0,[MeasureGPULarge:] | Fill Color 0,0,0,0 | StrokeWidth 7 | Stroke Color #GPUColor#,(255 * #GPUReady#) | StrokeStartCap Round | StrokeEndCap Round
SolidColor=0,0,0,1
ToolTipTitle=#SystemGPU#
ToolTipText=#SystemTipGPU#
Hidden=#FourthSwap#
DynamicVariables=1
UpdateDivider=2
Group=RingGPU

[MeterGPUSymbol]
Meter=Image
ImageName=sf:cube.transparent
MacSymbolSize=17
MacSymbolWeight=Semibold
ImageTint=#GPUColor#
X=292
Y=58.5
W=22
H=23
Hidden=#FourthSwap#
UpdateDivider=-1
Group=RingGPU

[MeterGPUValue]
Meter=String
MeterStyle=sMetricS | sMissing
MeasureName=MeasureGPUText
StringAlign=Center
X=303
Y=(122 - #Ascent15#)
Hidden=#FourthSwap#
UpdateDivider=2
Group=RingGPU

[MeterGPULabel]
Meter=String
MeterStyle=sLabelCaps
StringAlign=Center
X=303
Y=(140 - #Ascent11#)
Text=#SystemGPU#
Hidden=#FourthSwap#
UpdateDivider=-1
Group=RingGPU

; ---------------------------------------------------------------- … or swap
[MeterSwapRing]
Meter=Shape
X=273
Y=40
Shape=Ellipse 30,30,26.5 | Fill Color 0,0,0,0 | StrokeWidth 7 | Stroke Color #SwapColor#,#TrackAlpha#
Shape2=Arc 30,3.5,(30 + 26.5 * Sin(Rad([MeasureSwapAngle:]))),(30 - 26.5 * Cos(Rad([MeasureSwapAngle:]))),26.5,26.5,0,0,[MeasureSwapLarge:] | Fill Color 0,0,0,0 | StrokeWidth 7 | Stroke Color #SwapColor# | StrokeStartCap Round | StrokeEndCap Round
SolidColor=0,0,0,1
ToolTipTitle=#SystemSwap#
ToolTipText=[#SystemTipSwap[#GPUMissing]]
Hidden=(1 - #FourthSwap#)
DynamicVariables=1
UpdateDivider=2
Group=RingSwap

[MeterSwapSymbol]
Meter=Image
ImageName=sf:rectangle.2.swap
MacSymbolSize=17
MacSymbolWeight=Semibold
ImageTint=#SwapColor#
X=289
Y=58
W=28
H=24
Hidden=(1 - #FourthSwap#)
UpdateDivider=-1
Group=RingSwap

[MeterSwapValue]
Meter=String
MeterStyle=sMetricS | sUnit | sMissing
MeasureName=MeasureSwapText
StringAlign=Center
X=303
Y=(122 - #Ascent15#)
Hidden=(1 - #FourthSwap#)
UpdateDivider=2
Group=RingSwap

[MeterSwapLabel]
Meter=String
MeterStyle=sLabelCaps
StringAlign=Center
X=303
Y=(140 - #Ascent11#)
Text=#SystemSwap#
Hidden=(1 - #FourthSwap#)
UpdateDivider=-1
Group=RingSwap

; ---------------------------------------------------------------- the middle band
[MeterSeparator]
Meter=Shape
X=16
Y=153.75
Shape=Rectangle 0,0,328,0.5 | Fill Color #SeparatorColor# | StrokeWidth 0
UpdateDivider=-1

; CPU: History (the default): the whole CPU, one sample a second over the card's width (328 s, "5 min")
[MeterHistoryTitle]
Meter=String
MeterStyle=sLabel
X=16
Y=(174 - #Ascent11#)
Text=#SystemCPUHistory#
Hidden=#CoresView#
UpdateDivider=-1

[MeterHistoryWindow]
Meter=String
MeterStyle=sCaption
FontColor=#TertiaryTextColor#
StringAlign=Right
X=344
Y=(174 - #Ascent11#)
Text=#SystemHistoryWindow#
Hidden=#CoresView#
UpdateDivider=-1

[MeterHistoryArea]
; 0–100 %, so the graph's height means load, like the ring; the area and the line read the same measure
Meter=Histogram
MeterStyle=sSparkArea
MeasureName=MeasureCPU
X=16
Y=182
W=328
H=34
PrimaryColor=#CPUColor#,51
AutoScale=0
Hidden=#CoresView#
ToolTipTitle=#SystemCPUHistory#
ToolTipText=#SystemTipHistory#
DynamicVariables=1

[MeterHistoryLine]
Meter=Line
MeterStyle=sSparkLine
MeasureName=MeasureCPU
X=16
Y=182
W=328
H=34
LineColor=#CPUColor#
AutoScale=0
Hidden=#CoresView#

; CPU: Cores: one level per core, performance cores first
[MeterPTitle]
Meter=String
MeterStyle=sLabel
X=16
Y=(174 - #Ascent11#)
Text=[#SystemCoresTitleP[&MeasureCoreKinds:0]]
Hidden=(#CoresView# = 0)
ToolTipText=[#SystemTipCoresP[&MeasureCoreKinds:0]][#SystemTipCoresShown[&MeasureCoresMany:0]]
DynamicVariables=1
UpdateDivider=5
Group=Cores

[MeterETitle]
Meter=String
MeterStyle=sLabel
StringAlign=Right
X=344
Y=(174 - #Ascent11#)
Text=#SystemCoresTitleE#
Hidden=((#CoresView# = 0) || (#ECores# = 0))
ToolTipText=#SystemTipCoresE#
DynamicVariables=1
UpdateDivider=5
Group=Cores
@Include=#@#System/Cores.inc

; ---------------------------------------------------------------- Top Processes
[MeterTopTitle]
Meter=String
MeterStyle=sLabel
X=16
Y=(245 - #Ascent11#)
Text=#SystemTopProcesses#
ToolTipTitle=#SystemTopProcesses#
ToolTipText=[#SystemTipTop[#SystemSortBy]]
DynamicVariables=1
UpdateDivider=5

[MeterSegTrack]
; CPU | Memory: the track and the selected segment's knob (no animation: the knob jumps)
Meter=Shape
X=224
Y=230.125
Shape=Rectangle 0,0,120,22,11 | Fill Color #ControlFillColor# | StrokeWidth 0
Shape2=Rectangle (2 + #SystemSortBy# * 58),2,58,18,9 | Fill Color #KnobColor# | StrokeWidth 0
DynamicVariables=1
UpdateDivider=-1
Group=Seg

[MeterSegCPU]
; each label is its own 58 × 28 hit box; its baseline is 227.125 + 7.245 + 10.635 = 245, the title's
Meter=String
MeterStyle=sLabel
StringAlign=Center
X=255
Y=227.125
W=58
H=20.755
Padding=0,7.245,0,0
SolidColor=0,0,0,1
FontColor=#InkRGB#,((#SystemSortBy# = 0) ? #Alpha1# : #Alpha2#)
Text=#SystemSortCPU#
ToolTipText=#SystemTipSortCPU#
LeftMouseUpAction=[!SetVariable SystemSortBy 0][!WriteKeyValue Variables SystemSortBy 0 "#@#Variables.inc"][!UpdateMeasure MeasureSortBy]
DynamicVariables=1
UpdateDivider=-1
Group=Seg

[MeterSegMem]
Meter=String
MeterStyle=sLabel
StringAlign=Center
X=313
Y=227.125
W=58
H=20.755
Padding=0,7.245,0,0
SolidColor=0,0,0,1
FontColor=#InkRGB#,((#SystemSortBy# = 1) ? #Alpha1# : #Alpha2#)
Text=#SystemSortMemory#
ToolTipText=#SystemTipSortMemory#
LeftMouseUpAction=[!SetVariable SystemSortBy 1][!WriteKeyValue Variables SystemSortBy 1 "#@#Variables.inc"][!UpdateMeasure MeasureSortBy]
DynamicVariables=1
UpdateDivider=-1
Group=Seg

; the rows: name on the left, value on the right, baselines 275, 297, 319 and 341. They are not controls: a click is
