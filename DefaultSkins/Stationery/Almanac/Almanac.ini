; Stationery · Almanac (411 × 148, no card): an editorial date masthead set straight on the wallpaper. A large serif
; day stands beside the weekday and the month; under them a rule is the year's progress (solid for the days gone, a
; disc for today, a dot for every week left, a stop at 31 December), and two lines of almanac data: the week, the day
; of the year, the days to New Year, sunrise and sunset. Original work, MIT licensed.
;
; The ink is the suite's frameless ink (Suite/Ink.inc): white on dark wallpapers, dark with a letterpress edge on
; light ones. Every length is written as n × Scale (the Size item), so the piece keeps its proportions at any size.

[Rainmeter]
Update=5000
DefaultUpdateDivider=-1
AccurateText=1
SkinWidth=(411 * #Scale#)
SkinHeight=(148 * #Scale#)
DynamicWindowSize=0
Group=Stationery
; a near-invisible background, so the whole rectangle drags
BackgroundMode=2
SolidColor=0,0,0,1
ContextTitle=#AlmanacMenuOpen#
ContextAction=["/System/Applications/Calendar.app"]
ContextTitle2=---
ContextTitle3=[#AlmanacMenuSize[#AlmanacSize]]
ContextAction3=[!WriteKeyValue Variables AlmanacSize [#AlmanacSizeNext[#AlmanacSize]] "#@#Variables.inc"][!Refresh]
ContextTitle4=[#AlmanacMenuSun[#AlmanacShowSun]]
ContextAction4=[!WriteKeyValue Variables AlmanacShowSun "(1 - #AlmanacShowSun#)" "#@#Variables.inc"][!Refresh]
ContextTitle5=#MenuClockTitle#
ContextAction5=#MenuClockAction#
ContextTitle6=---
ContextTitle7=#MenuInkTitle#
ContextAction7=#MenuInkAction#
ContextTitle8=#MenuLanguageTitle#
ContextAction8=#MenuLanguageAction#

[Metadata]
Name=Almanac
Author=Deskset
License=MIT
Version=1.0
Information=Stationery · The date as an almanac's masthead, straight on the wallpaper: the year's progress as a rule (one dot per week left), the week, the day of the year, the days to New Year, and sunrise and sunset worked out on your Mac for the suite's place. The ink turns white or dark to suit the wallpaper (right-click to choose it).

[Variables]
@Include=#@#Variables.inc
@Include2=#@#Suite/Tokens.inc
@Include3=#@#Suite/Styles.inc
@Include4=#@#Suite/Ink.inc
; the sample is taken every 5 s (Update=5000)
InkDivider=1
InkChangeAction=[!UpdateMeterGroup Almanac][!Redraw]
; Size
AlmanacScaleSmall=0.8
AlmanacScaleRegular=1
AlmanacScaleLarge=1.25
Scale=[#AlmanacScale[#AlmanacSize]]
AlmanacSizeNextRegular=Large
AlmanacSizeNextLarge=Small
AlmanacSizeNextSmall=Regular
; the hero day: %#d ("5"; right-aligned, so a one-digit day keeps the gap), or %d ("05") for a fixed width
DayFormat=%#d
; the ISO week, two digits ("39", "01")
WeekFormat=%V
; the disc for today (5.5 while the pointer is over the rule)
MarkerR=4.5
; the "to go" slot: the days to New Year, the year done while the pointer is over the rule, or the last day
ToGoText=#AlmanacToGoText#
; whether the second data line shows the sun (1) or the year and the weeks left (0), for the tooltip
AlmanacSunRow=1
; the days to New Year (Suite/DaysTo.inc: 97 on 26 September 2026)
DaysToDate=2027-01-01
DaysToYearly=1
DaysToSince=
@IncludeDaysTo=#@#Suite/DaysTo.inc

; ================================================================ styles

[sSerif]
; the masthead's words: New York 31 pt, the piece's own display size (a listed exception)
FontFace=#FontSerif#
FontSize=(23.25 * #Scale#)
FontWeight=400
FontColor=#InkRGB#,#InkA1#
AntiAlias=1
Padding=(8 * #Scale#),(8 * #Scale#),(8 * #Scale#),(8 * #Scale#)
W=(220 * #Scale#)
ClipString=1
InlineSetting=#InkShadowText#
DynamicVariables=1
UpdateDivider=-1
Group=Almanac

[sData]
; the data lines: sMono (10 pt SF Mono capitals, 1.2 pt apart) in the ink's secondary alpha, with the text shadow
FontSize=(7.5 * #Scale#)
FontColor=#InkRGB#,#InkA2#
Padding=(5 * #Scale#),(5 * #Scale#),(5 * #Scale#),(5 * #Scale#)
InlineSetting=CharacterSpacing | 0 | (1.2 * #Scale#)
InlineSetting7=#InkShadowText#
DynamicVariables=1
UpdateDivider=-1
Group=Almanac

; ================================================================ date

[MeasureDay]
Measure=Time
TimeStamp=#TestNow#
Format=#DayFormat#
Group=Day

[MeasureWeekday]
Measure=Time
TimeStamp=#TestNow#
Format=%A
FormatLocale=#Locale#
Group=Day

[MeasureMonth]
Measure=Time
TimeStamp=#TestNow#
Format=%B
FormatLocale=#Locale#
Group=Day

[MeasureDateFull]
Measure=Time
TimeStamp=#TestNow#
Format=#DateFormatFull#
FormatLocale=#Locale#
Group=Day

[MeasureWeek]
Measure=Time
TimeStamp=#TestNow#
Format=#WeekFormat#
Group=Day

[MeasureWeekNumber]
; the week without its leading zero, for the tooltip
Measure=Time
TimeStamp=#TestNow#
Format=%V
RegExpSubstitute=1
Substitute="^0":""
Group=Day

[MeasureDayOfYearText]
; "269", or "005" in January (almanac style)
Measure=Time
TimeStamp=#TestNow#
Format=%j
Group=Day

[MeasureDayOfYearNumber]
Measure=Time
TimeStamp=#TestNow#
Format=%#j
Group=Day

[MeasureYear]
Measure=Time
TimeStamp=#TestNow#
Format=%Y
Group=Day

[MeasureDaysInYear]
; 365, plus one in a leap year (divisible by 4, not by 100 unless by 400)
Measure=Calc
Formula=365 + (Frac([MeasureYear] / 4) = 0) - (Frac([MeasureYear] / 100) = 0) + (Frac([MeasureYear] / 400) = 0)
DynamicVariables=1
Group=Day

[MeasureYearProgress]
Measure=Calc
Formula=[MeasureDayOfYearNumber] / MeasureDaysInYear
DynamicVariables=1
Group=Day

[MeasureMarkerX]
; today on the rule (rule-local x, from 8 to 228)
Measure=Calc
Formula=(8 + Round(220 * MeasureYearProgress)) * #Scale#
Group=Day

[MeasureToGo]
; the days to New Year (the shared count); the last day of the year says so. The actions run on every update, so
; leaving the rule puts the text back by updating this measure
Measure=Calc
Formula=MeasureDaysTo
Group=Day
IfCondition=MeasureToGo = 1
IfTrueAction=[!SetVariable ToGoText "#AlmanacLastDay#"]
IfFalseAction=[!SetVariable ToGoText "#AlmanacToGoText#"]
IfConditionMode=1

[MeasureWeeksLeft]
Measure=Calc
Formula=Floor((MeasureDaysInYear - [MeasureDayOfYearNumber]) / 7)
DynamicVariables=1
Group=Day

; ---------------------------------------------------------------- sunrise and sunset, worked out on the Mac
[MeasureSunrise]
; for the suite's place (by default the city of the Mac's time zone); "--:--" when the sun does not rise, empty
; without a place. In 12-hour time the data line leaves AM and PM out ("SUNRISE 7:10  SUNSET 7:04": the labels say
; which is which, and with them the line would not fit 220 pt); the tooltip has them
Measure=Plugin
Plugin=MacSun
Location=#Location#
Type=Sunrise
Format=[#TimeFormat[#Hours]]
FormatLocale=#Locale#
NoEventText=--:--
UnavailableText=
UpdateDivider=12
Group=Day

[MeasureSunset]
Measure=Plugin
Plugin=MacSun
Parent=MeasureSunrise
Type=Sunset
Format=[#TimeFormat[#Hours]]
FormatLocale=#Locale#
NoEventText=--:--
UnavailableText=
UpdateDivider=12
Group=Day

[MeasureSunriseTip]
; "7:10 AM" or "07:10", for the tooltip
Measure=Plugin
Plugin=MacSun
Parent=MeasureSunrise
Type=Sunrise
Format=[#CaptionTime[#Hours]]
FormatLocale=#Locale#
NoEventText=--:--
UnavailableText=
UpdateDivider=12
Group=Day

[MeasureSunsetTip]
Measure=Plugin
Plugin=MacSun
Parent=MeasureSunrise
Type=Sunset
Format=[#CaptionTime[#Hours]]
FormatLocale=#Locale#
NoEventText=--:--
UnavailableText=
UpdateDivider=12
Group=Day

[MeasureRow2]
; the second data line shows the year and the weeks left when the sun is hidden or there is no place
Measure=String
String=#AlmanacShowSun#|[MeasureSunrise]
DynamicVariables=1
UpdateDivider=12
Group=Day
IfMatch=^0\||\|$
IfMatchAction=[!SetOption MeterSunrise MeasureName MeasureYear][!SetOption MeterSunrise Text "#AlmanacYearText#"][!SetOption MeterSunset MeasureName MeasureWeeksLeft][!SetOption MeterSunset Text "#AlmanacWeeksLeftText#"][!SetVariable AlmanacSunRow 0][!UpdateMeterGroup Almanac][!Redraw]
IfNotMatchAction=[!SetOption MeterSunrise MeasureName MeasureSunrise][!SetOption MeterSunrise Text "#AlmanacSunriseText#"][!SetOption MeterSunset MeasureName MeasureSunset][!SetOption MeterSunset Text "#AlmanacSunsetText#"][!SetVariable AlmanacSunRow 1][!UpdateMeterGroup Almanac][!Redraw]

[MeasureDayNow]
; the day's key (2026269): its number changes once a day, also after a wake from sleep; checked once a minute
Measure=Time
TimeStamp=#TestNow#
Format=%Y%j
UpdateDivider=12
OnChangeAction=[!UpdateMeasureGroup DaysTo][!UpdateMeasureGroup Day][!UpdateMeterGroup Almanac][!Redraw]

; ================================================================ masthead

[MeterDay]
; "26" in New York at 158.5 pt, right-aligned so the column never moves; its top meets the top of "Saturday," and its
; baseline is the last data line's (129.28)
Meter=String
MeasureName=MeasureDay
FontFace=#FontSerif#
FontSize=(118.875 * #Scale#)
FontWeight=400
FontColor=#InkRGB#,#InkA1#
AntiAlias=1
StringAlign=Right
X=(172.26 * #Scale#)
Y=(-39.63 * #Scale#)
Padding=(18 * #Scale#),(18 * #Scale#),(18 * #Scale#),(18 * #Scale#)
InlineSetting=#InkShadowDisplay#
InlineSetting2=CharacterSpacing | 0 | (-6 * #Scale#)
DynamicVariables=1
UpdateDivider=-1
Group=Almanac
LeftMouseUpAction=["/System/Applications/Calendar.app"]
ToolTipText=#AlmanacTipDay#[#AlmanacTipSun[#AlmanacSunRow]]

[MeterWeekday]
; "Saturday," in New York italic, baseline 38.28
Meter=String
MeterStyle=sSerif
MeasureName=MeasureWeekday
Text=%1#AlmanacWeekdaySuffix#
StringStyle=Italic
X=(167 * #Scale#)
Y=(0.76 * #Scale#)
LeftMouseUpAction=["/System/Applications/Calendar.app"]
ToolTipText=[MeasureDateFull]

[MeterMonth]
; "September", baseline 72.28
Meter=String
MeterStyle=sSerif
MeasureName=MeasureMonth
X=(167 * #Scale#)
Y=(34.76 * #Scale#)
LeftMouseUpAction=["/System/Applications/Calendar.app"]
ToolTipText=[MeasureDateFull]

; ================================================================ the year's progress

[MeterRule]
; the rule runs along local y 8 from x 8 to 228 (skin 175 → 395). The halos (shapes cannot cast shadows) are drawn
; first, then the ink. Dashes are in stroke widths, so each layer divides the week's pitch (220 × 7 / days in the
; year) by its own width and every halo dot sits under its ink dot
Meter=Shape
X=(167 * #Scale#)
Y=(85.28 * #Scale#)
Shape=Line (8 * #Scale#),(8 * #Scale#),[MeasureMarkerX],(8 * #Scale#) | StrokeWidth (7 * #Scale#) | Stroke Color #HaloRGB#,#HaloOuterA# | StrokeStartCap Round | StrokeEndCap Round
Shape2=Line (8 * #Scale#),(8 * #Scale#),[MeasureMarkerX],(8 * #Scale#) | StrokeWidth (4.4 * #Scale#) | Stroke Color #HaloRGB#,#HaloInnerA# | StrokeStartCap Round | StrokeEndCap Round
Shape3=Line [MeasureMarkerX],(8 * #Scale#),(228 * #Scale#),(8 * #Scale#) | StrokeWidth (6.6 * #Scale#) | StrokeDashes 0,(1540 / [MeasureDaysInYear] / 6.6) | StrokeDashCap Round | Stroke Color #HaloRGB#,#HaloOuterA#
Shape4=Line [MeasureMarkerX],(8 * #Scale#),(228 * #Scale#),(8 * #Scale#) | StrokeWidth (4 * #Scale#) | StrokeDashes 0,(1540 / [MeasureDaysInYear] / 4) | StrokeDashCap Round | Stroke Color #HaloRGB#,#HaloInnerA#
Shape5=Line (228 * #Scale#),(4.5 * #Scale#),(228 * #Scale#),(11.5 * #Scale#) | StrokeWidth (6.2 * #Scale#) | Stroke Color #HaloRGB#,#HaloOuterA# | StrokeStartCap Round | StrokeEndCap Round
Shape6=Line (228 * #Scale#),(4.5 * #Scale#),(228 * #Scale#),(11.5 * #Scale#) | StrokeWidth (3.6 * #Scale#) | Stroke Color #HaloRGB#,#HaloInnerA# | StrokeStartCap Round | StrokeEndCap Round
Shape7=Ellipse [MeasureMarkerX],(8 * #Scale#),((#MarkerR# + 2.5) * #Scale#) | Fill Color #HaloRGB#,#HaloOuterA# | StrokeWidth 0
Shape8=Ellipse [MeasureMarkerX],(8 * #Scale#),((#MarkerR# + 1.2) * #Scale#) | Fill Color #HaloRGB#,#HaloInnerA# | StrokeWidth 0
Shape9=Line [MeasureMarkerX],(8 * #Scale#),(228 * #Scale#),(8 * #Scale#) | StrokeWidth (1.6 * #Scale#) | StrokeDashes 0,(1540 / [MeasureDaysInYear] / 1.6) | StrokeDashCap Round | Stroke Color #InkRGB#,#InkA2#
Shape10=Line (8 * #Scale#),(8 * #Scale#),[MeasureMarkerX],(8 * #Scale#) | StrokeWidth (2 * #Scale#) | Stroke Color #InkRGB#,#InkA1# | StrokeStartCap Round | StrokeEndCap Round
Shape11=Line (228 * #Scale#),(4.5 * #Scale#),(228 * #Scale#),(11.5 * #Scale#) | StrokeWidth (1.2 * #Scale#) | Stroke Color #InkRGB#,#InkA2# | StrokeStartCap Round | StrokeEndCap Round
Shape12=Ellipse [MeasureMarkerX],(8 * #Scale#),(#MarkerR# * #Scale#) | Fill Color #InkRGB#,#InkA1# | StrokeWidth 0
DynamicVariables=1
UpdateDivider=-1
Group=Almanac

; ================================================================ data lines

[MeterWeek]
; "WEEK 39", baseline 111.28
Meter=String
MeterStyle=sMono | sData
MeasureName=MeasureWeek
Text=#AlmanacWeekText#
X=(170 * #Scale#)
Y=(96.612 * #Scale#)

[MeterDayOfYear]
; "DAY 269", centred on the rule
Meter=String
MeterStyle=sMono | sData
MeasureName=MeasureDayOfYearText
Text=#AlmanacDayText#
StringAlign=Center
X=(285 * #Scale#)
Y=(96.612 * #Scale#)

[MeterToGo]
; "97 TO GO" in full ink with its figure bold, right under the dots it counts; "73% DONE" while the pointer is over
; the rule, "LAST DAY" on 31 December. Right-aligned on the stop: the 1.2 after the last letter is made up
Meter=String
MeterStyle=sMono | sData
MeasureName=MeasureDaysTo
Text=#ToGoText#
FontColor=#InkRGB#,#InkA1#
StringAlign=Right
X=(401.2 * #Scale#)
Y=(96.612 * #Scale#)
InlineSetting8=Weight | 700
InlinePattern8=\d+%?|#AlmanacLastDay#

[MeterSunrise]
; "SUNRISE 07:10" (or "YEAR 2026"), baseline 129.28
Meter=String
MeterStyle=sMono | sData
MeasureName=MeasureSunrise
Text=#AlmanacSunriseText#
X=(170 * #Scale#)
Y=(114.612 * #Scale#)
LeftMouseUpAction=["/System/Applications/Weather.app"]

[MeterSunset]
; "SUNSET 19:06" (or "13 WEEKS LEFT")
Meter=String
MeterStyle=sMono | sData
MeasureName=MeasureSunset
Text=#AlmanacSunsetText#
StringAlign=Right
X=(401.2 * #Scale#)
Y=(114.612 * #Scale#)
LeftMouseUpAction=["/System/Applications/Weather.app"]

; ================================================================ the pointer over the rule

[MeterProgressHit]
; over the rule and the first data line: the disc grows and the slot says how much of the year is done
Meter=Image
X=(167 * #Scale#)
Y=(84 * #Scale#)
W=(236 * #Scale#)
H=(34 * #Scale#)
SolidColor=0,0,0,1
MouseOverAction=[!SetVariable ToGoText "#AlmanacDoneText#"][!SetVariable MarkerR 5.5][!UpdateMeter MeterToGo][!UpdateMeter MeterRule][!Redraw]
MouseLeaveAction=[!SetVariable MarkerR 4.5][!UpdateMeasure MeasureToGo][!UpdateMeter MeterToGo][!UpdateMeter MeterRule][!Redraw]
ToolTipTitle=[MeasureYear]
ToolTipText=#AlmanacTipProgress#
DynamicVariables=1
UpdateDivider=-1
