; Stationery · Turntable, large (360 × 360): Now Playing as a record deck. The label is the album's cover, the record is
; pressed in the cover's own colour, and the tonearm is the progress bar: it creeps from the outer groove toward the
; label as the song plays. Paused, the arm lifts in place; with nothing playing it swings back to its rest and the last
; cover fades like an old paper label. A click on the grooves drops the needle there. Original work, MIT licensed.
;
; The record's centre is (150, 150), the tonearm's pivot (312, 66). The deck's materials are its own
; (@Resources/Turntable/Theme-*.inc); its card, type, colours and controls are the suite's.

[Rainmeter]
Update=1000
DefaultUpdateDivider=1
AccurateText=1
SkinWidth=360
SkinHeight=360
DynamicWindowSize=0
Group=Stationery
; the window's own look, once Deskset reads it (until then it is macOS's)
MacAppearance=#LookAppearance#
ContextTitle=#MenuOpenPlayerTitle#
ContextAction=#OpenAction#
ContextTitle2=---
ContextTitle3=[#TurntableMenuVinyl[#TurntableVinyl]]
ContextAction3=[!WriteKeyValue Variables TurntableVinyl "(1 - #TurntableVinyl#)" "#@#Variables.inc"][!Refresh]
ContextTitle4=[#TurntableMenuRest[#TurntableRest]]
ContextAction4=[!WriteKeyValue Variables TurntableRest [#TurntableRestNext[#TurntableRest]] "#@#Variables.inc"][!Refresh]
ContextTitle5=[#TurntableMenuSeek[#TurntableSeek]]
ContextAction5=[!WriteKeyValue Variables TurntableSeek "(1 - #TurntableSeek#)" "#@#Variables.inc"][!Refresh]
ContextTitle6=#MenuPlayerTitle#
ContextAction6=#MenuPlayerAction#
ContextTitle7=---
ContextTitle8=#MenuLookTitle#
ContextAction8=#MenuLookAction#
ContextTitle9=#MenuCardsTitle#
ContextAction9=#MenuCardsAction#
ContextTitle10=#MenuLanguageTitle#
ContextAction10=#MenuLanguageAction#

[Metadata]
Name=Turntable
Author=Deskset
License=MIT
Version=1.0
Information=Stationery · What Music or Spotify is playing, as a record deck: the cover is the label, the record takes the cover's colour and the tonearm shows how far the song has played. Click the label to play or pause, click a groove to play from there. The first time a player is open, macOS asks once to let Deskset see what it plays.

[Variables]
@Include=#@#Variables.inc
@Include2=#@#Suite/Tokens.inc
@Include3=#@#Suite/Styles.inc
@Include4=#@#Media/Media.inc
@Include5=#@#Turntable/Theme-#LookTheme#.inc
CardW=360
CardH=360
OpenAction=[!CommandMeasure MeasurePlayer "OpenPlayer"]
PlayPauseAction=[!CommandMeasure MeasurePlayer "PlayPause"][!UpdateMeasureGroup Player][!UpdateMeasureGroup Arm][!UpdateMeter *][!Redraw]
; how long a paused deck stays lifted before the arm goes to its rest (seconds; -1 never)
TurntableRestAfter1Min=60
TurntableRestAfter5Min=300
TurntableRestAfterNever=-1
RestAfter=[#TurntableRestAfter[#TurntableRest]]
TurntableRestNext1Min=5Min
TurntableRestNext5Min=Never
TurntableRestNextNever=1Min
; the same in both looks
SpindleShadow=0,0,0,64
SpindleA=250,250,250
SpindleB=148,148,148
PivotRing=0,0,0,46
Grip=0,0,0,71
TubeEdge=0,0,0,56
Head=38,38,38
Cart=77,77,77
CapDot=224,224,224
HoverScrim=0,0,0,107
SeekRing=255,255,255,140
VinylBlack=28,28,30
; the record's colour: the cover's (Chameleon, set below), or classic black. Meters read the variable named by
; VinylVar ([#[#VinylVar]]), so the cover's colour follows while the skin runs
VinylCover=#VinylBlack#
VinylVar0=VinylBlack
VinylVar1=VinylCover
VinylVar=[#VinylVar[#TurntableVinyl]]
; ---------------------------------------------------------------- state (the deck sets these)
LiftX=2.5
LiftY=3.5
ArmShadowA=71
LabelAlpha=140
LampColor=#TertiaryTextColor#
TitleColor=#SecondaryTextColor#
SideTint=#TextColor#
PlayGlyph=sf:play.fill
; the play button's frame (its left edge, Padding included): pause at 270, play 1.5 further right (its optical
; centre on the disc at 288,322)
PlayX=271.5
PlayTip=#TurntableTipPlay#
PX=0
PY=0
; the last cover's file (empty: the blank paper label)
CoverPath=

; ================================================================ styles

[sDeck]
; the deck's gradients (named options of the shapes that use them)
PlatterGrad=225 | #PlatterA# ; 0.15 | #PlatterB# ; 0.85
SpindleGrad=225 | #SpindleA# ; 0.08 | #SpindleB# ; 0.92
RestGrad=237.5 | #RestA# ; 0 | #RestB# ; 1
PivotGrad=225 | #PivotA# ; 0.14 | #PivotB# ; 0.86
WeightGrad=180 | #Weight1# ; 0 | #Weight2# ; 0.5 | #Weight3# ; 1
TubeGrad=180 | #Tube1# ; 0 | #Tube2# ; 0.38 | #Tube3# ; 1
HeadPath=307.94,242.04 | LineTo 298.20,266.15 | LineTo 309.32,270.65 | LineTo 319.06,246.54 | ClosePath 1
CartPath=304.17,257.78 | LineTo 300.80,266.12 | LineTo 307.47,268.82 | LineTo 310.84,260.47 | ClosePath 1
LiftPath=314.19,258.59 | LineTo 310.07,268.79 | LineTo 312.48,269.77 | LineTo 316.60,259.57 | ClosePath 1

[sSidePad]
; the hover pad behind a side control (compact transport: a pad only on hover)
Hidden=1
UpdateDivider=-1

[sSideButton]
; backward.fill / forward.fill at 13 pt semibold (natural 20 × 13) in a 30 × 30 slot
MacSymbolSize=13
MacSymbolWeight=Semibold
ImageTint=#SideTint#
PreserveAspectRatio=1
W=20
H=13
Padding=5,8.5,5,8.5
SolidColor=0,0,0,1
DynamicVariables=1

; ================================================================ now playing (the whole family shows one player)

[MeasurePlayer]
; the title; a track appearing keeps its title and artist as the last played
Measure=Plugin
Plugin=NowPlaying
PlayerName=#Player#
PlayerType=Title
DisableLeadingZero=1
Group=Player
IfMatch=^$
IfNotMatchAction=[!UpdateMeasure MeasureLastTitle][!UpdateMeasure MeasureLastArtist]
; a new track drops the old cover at once: the paper label shows until the new one arrives
TrackChangeAction=[!UpdateMeasure MeasureLastCover]

[MeasureArtist]
Measure=Plugin
Plugin=NowPlaying
PlayerName=[MeasurePlayer]
PlayerType=Artist
Group=Player

[MeasureCover]
Measure=Plugin
Plugin=NowPlaying
PlayerName=[MeasurePlayer]
PlayerType=Cover
Group=Player
IfMatch=^$
IfNotMatchAction=[!UpdateMeasure MeasureLastCover]

[MeasurePosition]
; "1:21" (numbers in seconds)
Measure=Plugin
Plugin=NowPlaying
PlayerName=[MeasurePlayer]
PlayerType=Position
Group=Player

[MeasureDuration]
Measure=Plugin
Plugin=NowPlaying
PlayerName=[MeasurePlayer]
PlayerType=Duration
Group=Player

[MeasureProgress]
; 0–100 (0 without a duration: a stream keeps the arm on the outer groove)
Measure=Plugin
Plugin=NowPlaying
PlayerName=[MeasurePlayer]
PlayerType=Progress
Group=Player

[MeasureState]
; 0 stopped, 1 playing, 2 paused
Measure=Plugin
Plugin=NowPlaying
PlayerName=[MeasurePlayer]
PlayerType=State
Group=Player

[MeasureStatus]
; 1 while the player app runs; playback commands never launch a closed player, so play opens it instead
Measure=Plugin
Plugin=NowPlaying
PlayerName=[MeasurePlayer]
PlayerType=Status
Group=Player
IfCondition=MeasureStatus = 0
IfTrueAction=[!SetOption MeterPlay LeftMouseUpAction """[!CommandMeasure MeasurePlayer "OpenPlayer"]"""][!SetOption MeterLabelHit LeftMouseUpAction """[!CommandMeasure MeasurePlayer "OpenPlayer"]"""][!SetOption MeterRecordHit LeftMouseUpAction """[!CommandMeasure MeasurePlayer "OpenPlayer"]"""]
IfFalseAction=[!SetOption MeterPlay LeftMouseUpAction """#PlayPauseAction#"""][!SetOption MeterLabelHit LeftMouseUpAction """#PlayPauseAction#"""][!SetOption MeterRecordHit LeftMouseUpAction """#PlayPauseAction#"""]

; ---------------------------------------------------------------- the last track (kept after the player stops or quits)
; These change only when the actions above update them, so the idle deck keeps the last title, artist and cover. No
; bang ever carries the title's text (titles may contain quotes).

[MeasureLastTitle]
; empty until something has played (first run): "Not Playing", and the idle line asks for music
Measure=String
String=[MeasurePlayer]
RegExpSubstitute=1
Substitute="^$":"#NowPlayingNotPlaying#"
DynamicVariables=1
UpdateDivider=-1
IfMatch=^#NowPlayingNotPlaying#$
IfMatchAction=[!SetOption MeterIdleLine Text "#NowPlayingIdleLine#"][!SetVariable SideTint "#FaintColor#"][!UpdateMeter *][!Redraw]
IfNotMatchAction=[!SetOption MeterIdleLine Text "#NowPlayingNotPlaying#"][!SetVariable SideTint "#TextColor#"][!UpdateMeter *][!Redraw]

[MeasureLastArtist]
Measure=String
String=[MeasureArtist]
DynamicVariables=1
UpdateDivider=-1

[MeasureLastCover]
; the cover is the label; without one the blank paper label shows (♪, Side A)
Measure=String
String=[MeasureCover]
DynamicVariables=1
UpdateDivider=-1
IfMatch=^$
IfMatchAction=[!SetVariable CoverPath ""][!ShowMeterGroup Blank][!UpdateMeter MeterLabel][!Redraw]
IfNotMatchAction=[!SetVariable CoverPath "[MeasureLastCover]"][!HideMeterGroup Blank][!UpdateMeter MeterLabel][!Redraw]

; ---------------------------------------------------------------- the record's colour, from the cover
[MeasureCoverColors]
; Chameleon reads the cover in the background (at most every 2 s, only when its file changes); no cover gives the
; fallback, classic near-black vinyl
Measure=Plugin
Plugin=Chameleon
Type=File
Path=#CoverPath#
Format=Dec
FallbackBG1=1C1C1E
DynamicVariables=1

[MeasureVinyl]
; very light covers give light vinyl, as coloured pressings are; the grooves read on white and on black
Measure=Plugin
Plugin=Chameleon
Parent=MeasureCoverColors
Color=Background1
Format=Dec
IfMatch=^\d
IfMatchAction=[!SetVariable VinylCover "[MeasureVinyl]"]
IfMatchMode=1
OnChangeAction=[!UpdateMeter MeterRecord][!UpdateMeter MeterLabelRing][!Redraw]

; ---------------------------------------------------------------- the deck's state
[MeasurePausedFor]
; seconds paused (the measure updates once a second)
Measure=Calc
Formula=(MeasureState = 2) ? Min(MeasurePausedFor + 1, 100000) : 0

[MeasureDeck]
; 1 playing (the needle down), 2 paused (the arm lifted over its groove), 0 at rest (stopped, no player, or paused
; too long)
Measure=Calc
Formula=(MeasureState = 1) ? 1 : (((MeasureState = 2) && ((#RestAfter# < 0) || (MeasurePausedFor < #RestAfter#))) ? 2 : 0)
IfCondition=MeasureDeck = 1
IfTrueAction=[!SetVariable LiftX 4][!SetVariable LiftY 6][!SetVariable ArmShadowA 71][!SetVariable LabelAlpha 255][!SetVariable LampColor "#Red#"][!ShowMeter MeterLampGlow][!SetVariable TitleColor "#TextColor#"][!ShowMeterGroup Track][!HideMeterGroup Idle][!SetVariable PlayGlyph "sf:pause.fill"][!SetVariable PlayX 270][!SetVariable PlayTip "#TurntableTipPause#"][!UpdateMeasureGroup Arm][!UpdateMeter *][!Redraw]
IfCondition2=MeasureDeck = 2
IfTrueAction2=[!SetVariable LiftX 9][!SetVariable LiftY 13][!SetVariable ArmShadowA 41][!SetVariable LabelAlpha 255][!SetVariable LampColor "#TertiaryTextColor#"][!HideMeter MeterLampGlow][!SetVariable TitleColor "#TextColor#"][!ShowMeterGroup Track][!HideMeterGroup Idle][!SetVariable PlayGlyph "sf:play.fill"][!SetVariable PlayX 271.5][!SetVariable PlayTip "#TurntableTipPlay#"][!UpdateMeasureGroup Arm][!UpdateMeter *][!Redraw]
IfCondition3=MeasureDeck = 0
IfTrueAction3=[!SetVariable LiftX 2.5][!SetVariable LiftY 3.5][!SetVariable ArmShadowA 71][!SetVariable LabelAlpha 140][!SetVariable LampColor "#TertiaryTextColor#"][!HideMeter MeterLampGlow][!SetVariable TitleColor "#SecondaryTextColor#"][!HideMeterGroup Track][!ShowMeterGroup Idle][!SetVariable PlayGlyph "sf:play.fill"][!SetVariable PlayX 271.5][!SetVariable PlayTip "#TurntableTipPlay#"][!UpdateMeasureGroup Arm][!UpdateMeter *][!Redraw]

; ---------------------------------------------------------------- the tonearm (after the deck's state)
; The groove for the progress p is r = 121 − 61·p (outer r 121, inner r 60). The arm turns clockwise about the pivot P
; by θ = 60.6487 − Deg(Acos((72822.9086 − r²) / 72556.5395)) (the law of cosines: the stylus sits 198.8037 from P, the
; record's centre 182.4829); at rest θ = 0. The matrix turns the meter about P: a = cos θ, b = sin θ, c = −sin θ,
; d = cos θ, tx = 312 − 312 cos θ + 66 sin θ, ty = 66 − 312 sin θ − 66 cos θ.

[MeasureGroove]
Measure=Calc
Formula=121 - 61 * Clamp(MeasureProgress, 0, 100) / 100
Group=Arm

[MeasureArmAngle]
Measure=Calc
Formula=(MeasureDeck = 0) ? 0 : (60.6487 - Deg(Acos((72822.9086 - MeasureGroove * MeasureGroove) / 72556.5395)))
Group=Arm

[MeasureArmCos]
Measure=Calc
Formula=Cos(Rad(MeasureArmAngle))
Group=Arm

[MeasureArmSin]
Measure=Calc
Formula=Sin(Rad(MeasureArmAngle))
Group=Arm

[MeasureArmNegSin]
Measure=Calc
Formula=-MeasureArmSin
Group=Arm

[MeasureArmTX]
Measure=Calc
Formula=312 - 312 * MeasureArmCos + 66 * MeasureArmSin
Group=Arm

[MeasureArmTY]
Measure=Calc
Formula=66 - 312 * MeasureArmSin - 66 * MeasureArmCos
Group=Arm

[MeasureShadowTX]
; the shadow is the same outline moved by (LiftX, LiftY): longer and lighter when the arm is lifted
Measure=Calc
Formula=MeasureArmTX + #LiftX#
DynamicVariables=1
Group=Arm

[MeasureShadowTY]
Measure=Calc
Formula=MeasureArmTY + #LiftY#
DynamicVariables=1
Group=Arm

; ---------------------------------------------------------------- dropping the needle
[MeasurePointer]
; follows the pointer only while it is over the grooves (Deskset's Mouse plugin listens inside the skin only)
Measure=Plugin
Plugin=Mouse
Disabled=1
UpdateRate=50
MouseMoveAction=[!SetVariable PX $MouseX$][!SetVariable PY $MouseY$][!UpdateMeasure MeasureSeekR][!UpdateMeasure MeasureSeek][!UpdateMeasure MeasureSeekMin][!UpdateMeasure MeasureSeekSec][!UpdateMeter MeterSeekRing][!UpdateMeter MeterGrooveHit][!Redraw]

[MeasureSeekR]
; the groove under the pointer
Measure=Calc
Formula=Clamp(Sqrt((#PX# - 150) ** 2 + (#PY# - 150) ** 2), 60, 121)
DynamicVariables=1
UpdateDivider=-1

[MeasureSeek]
; the share of the track under the pointer, in percent
Measure=Calc
Formula=(121 - MeasureSeekR) / 61 * 100
UpdateDivider=-1

[MeasureSeekMin]
Measure=Calc
Formula=Floor(MeasureSeek / 100 * MeasureDuration / 60)
UpdateDivider=-1

[MeasureSeekSec]
Measure=Calc
Formula=Floor((MeasureSeek / 100 * MeasureDuration) % 60)
RegExpSubstitute=1
Substitute="^(\d)$":"0\1"
UpdateDivider=-1

[MeasureCanSeek]
; a groove click seeks while the deck plays or pauses a track with a length, unless seeking is off
Measure=Calc
Formula=(#TurntableSeek# = 1) && (MeasureDeck <> 0) && (MeasureDuration > 0)
IfCondition=MeasureCanSeek = 1
IfTrueAction=[!ShowMeter MeterGrooveHit]
IfFalseAction=[!HideMeter MeterGrooveHit][!HideMeter MeterSeekRing][!DisableMeasure MeasurePointer]

; ================================================================ the card

[MeterCard]
Meter=Shape
MeterStyle=sCard
ToolTipText=#TurntableTipTrack#
UpdateDivider=-1

; ================================================================ the deck

[MeterArmBoard]
; one keyhole plate: the pivot's disc runs into a stem down to y 282; the arm rests on it
Meter=Shape
Shape=Ellipse 312,66,27 | Fill Color #BoardFill# | StrokeWidth 0.5 | Stroke Color #BoardEdge#
Shape2=Rectangle 297,66,30,216,15 | StrokeWidth 0
Shape3=Combine Shape | Union Shape2
UpdateDivider=-1

[MeterPlatter]
; the platter's metal lit from the top left; 192 strobe dots of 1.7 pt every 4.2935 pt (an exact fit on r 131.2); its
; hairline; the ring under the record's edge
Meter=Shape
MeterStyle=sDeck
Shape=Ellipse 150,150,134 | Fill LinearGradient PlatterGrad | StrokeWidth 0
Shape2=Ellipse 150,150,131.2 | Fill Color 0,0,0,0 | StrokeWidth 3.2 | Stroke Color #Strobe# | StrokeDashes 0.53125,0.81047 | StrokeDashCap Flat
Shape3=Ellipse 150,150,133.6 | Fill Color 0,0,0,0 | StrokeWidth 0.8 | Stroke Color #PlatterEdge#
Shape4=Ellipse 150,150,128.2 | Fill Color #RecordShadow# | StrokeWidth 0
UpdateDivider=-1

[MeterRecord]
; the record in its colour, and the blank paper label that always sits under the cover
Meter=Shape
Shape=Ellipse 150,150,126.5 | Fill Color [#[#VinylVar]] | StrokeWidth 0
Shape2=Ellipse 150,150,48 | Fill Color #Paper# | StrokeWidth 0
DynamicVariables=1
UpdateDivider=-1

[MeterLabelNote]
; the blank label's ♪ (shown only without a cover)
Meter=Image
ImageName=sf:music.note
MacSymbolSize=22
MacSymbolWeight=Medium
ImageTint=#TertiaryTextColor#
PreserveAspectRatio=1
X=142
Y=118
W=16
H=24
Group=Blank
UpdateDivider=-1

[MeterLabelSide]
; label print, 6.5 pt (instrument print: decoration)
Meter=String
Text=#TurntableSideA#
StringCase=Upper
FontFace=#FontText#
FontSize=4.875
FontWeight=700
FontColor=#TertiaryTextColor#
StringAlign=CenterCenter
AntiAlias=1
X=150
Y=174
InlineSetting=CharacterSpacing | 1.6 | 1.6
Group=Blank
UpdateDivider=-1

[MeterLabel]
; the cover is the label, filled and cropped; faded at rest. No cover: nothing drawn, the paper shows
Meter=Image
ImageName=#CoverPath#
X=102
Y=102
W=96
H=96
PreserveAspectRatio=2
ImageAlpha=#LabelAlpha#
DynamicVariables=1

[MeterLabelRing]
; an annulus r 48 → 68 in the record's colour rounds the square cover (whose corners reach r 67.9) at any crop; the
; grooves run over it
Meter=Shape
Shape=Ellipse 150,150,68 | Fill Color [#[#VinylVar]] | StrokeWidth 0
Shape2=Ellipse 150,150,48 | StrokeWidth 0
Shape3=Combine Shape | Exclude Shape2
DynamicVariables=1
UpdateDivider=-1

[MeterVinyl]
; the grooves, run-out, track gaps, edge and a static sheen, in black and white alpha over any record colour
; (512 px drawn at 256 pt: sharp at 2x); transparent inside r 47.5, so the cover is never painted over
Meter=Image
ImageName=#@#Images/Vinyl.png
X=22
Y=22
W=256
H=256
UpdateDivider=-1

[MeterSpindle]
Meter=Shape
MeterStyle=sDeck
Shape=Ellipse 150,150,4.2 | Fill Color #SpindleShadow# | StrokeWidth 0
Shape2=Ellipse 150,150,3.6 | Fill LinearGradient SpindleGrad | StrokeWidth 0
UpdateDivider=-1

[MeterSeekRing]
; the groove a click would drop the needle on
Meter=Shape
Shape=Ellipse 150,150,[MeasureSeekR:] | Fill Color 0,0,0,0 | StrokeWidth 1 | Stroke Color #SeekRing# | StrokeDashes 2,3
Hidden=1
DynamicVariables=1
UpdateDivider=-1

[MeterLabelHover]
; over the label: a dark scrim with the play or pause glyph
Meter=Shape
Shape=Ellipse 150,150,22 | Fill Color #HoverScrim# | StrokeWidth 0
Hidden=1
Group=LabelHover
UpdateDivider=-1

[MeterLabelHoverGlyph]
Meter=Image
ImageName=#PlayGlyph#
MacSymbolSize=17
MacSymbolWeight=Semibold
ImageTint=255,255,255
PreserveAspectRatio=1
X=(#PlayX# - 128)
Y=141
W=16
H=18
Hidden=1
DynamicVariables=1
Group=LabelHover

; ================================================================ the tonearm

[MeterArmRest]
Meter=Shape
MeterStyle=sDeck
Shape=Rectangle 306,223.5,14,22,4 | Fill Color #RestShadow# | StrokeWidth 0
Shape2=Rectangle 305,222,14,22,4 | Fill LinearGradient RestGrad | StrokeWidth 0
Shape3=Rectangle 308.6,222,6.8,9,3 | Fill Color #Notch# | StrokeWidth 0
UpdateDivider=-1

[MeterPivotBase]
Meter=Shape
MeterStyle=sDeck
Shape=Ellipse 312,66,22.5 | Fill Color #PivotShadow# | StrokeWidth 0
Shape2=Ellipse 312,66,21 | Fill LinearGradient PivotGrad | StrokeWidth 0
Shape3=Ellipse 312,66,13 | Fill Color 0,0,0,0 | StrokeWidth 1 | Stroke Color #PivotRing#
UpdateDivider=-1

[MeterArmShadow]
; a drawn shadow: the weight, tube and headshell outlines moved by (LiftX, LiftY)
Meter=Shape
MeterStyle=sDeck
Shape=Rectangle 302,20,20,22,4 | Fill Color 0,0,0,#ArmShadowA# | StrokeWidth 0
Shape2=Rectangle 309.6,42,4.8,207,2.4 | StrokeWidth 0
Shape3=Path HeadPath | StrokeWidth 0
Shape4=Combine Shape | Union Shape2 | Union Shape3
TransformationMatrix=[MeasureArmCos:];[MeasureArmSin:];[MeasureArmNegSin:];[MeasureArmCos:];[MeasureShadowTX:];[MeasureShadowTY:]
DynamicVariables=1
Group=Arm

[MeterArm]
; drawn at rest (straight down from the pivot) and turned by the matrix; the gradients turn with it, so the tube's
; highlight always runs along the tube
Meter=Shape
MeterStyle=sDeck
; the counterweight and its grip lines
Shape=Rectangle 302,20,20,22,4 | Fill LinearGradient WeightGrad | StrokeWidth 0
Shape2=Line 303,27,321,27 | StrokeWidth 0.6 | Stroke Color #Grip#
Shape3=Line 303,31,321,31 | StrokeWidth 0.6 | Stroke Color #Grip#
Shape4=Line 303,35,321,35 | StrokeWidth 0.6 | Stroke Color #Grip#
; the tube, 24 pt behind the pivot to the headshell's joint (312, 248)
Shape5=Rectangle 309.6,42,4.8,207,2.4 | Fill LinearGradient TubeGrad | StrokeWidth 0.5 | Stroke Color #TubeEdge#
; the headshell, turned 22° toward the spindle; the cartridge; the finger lift
Shape6=Path HeadPath | Fill Color #Head# | StrokeWidth 0
Shape7=Path CartPath | Fill Color #Cart# | StrokeWidth 0
Shape8=Path LiftPath | Fill Color #Lift# | StrokeWidth 0
TransformationMatrix=[MeasureArmCos:];[MeasureArmSin:];[MeasureArmNegSin:];[MeasureArmCos:];[MeasureArmTX:];[MeasureArmTY:]
DynamicVariables=1
Group=Arm

[MeterPivotCap]
; round, so it needs no turning and covers the tube's root at any angle
Meter=Shape
Shape=Ellipse 312,66,7 | Fill Color #Cap# | StrokeWidth 0
Shape2=Ellipse 312,66,2.4 | Fill Color #CapDot# | StrokeWidth 0
UpdateDivider=-1

; ================================================================ text and controls

[MeterLampGlow]
; the strobe lamp: red while playing
Meter=Shape
Shape=Ellipse 19.5,292,5.5 | Fill Color #Red#,61 | StrokeWidth 0
Hidden=1
UpdateDivider=-1

[MeterLamp]
Meter=Shape
Shape=Ellipse 19.5,292,2.75 | Fill Color #LampColor# | StrokeWidth 0
DynamicVariables=1

[MeterSpeed]
; "33⅓ RPM", the text block's eyebrow (sMicro), centred on the lamp's line (y 292)
Meter=String
MeterStyle=sMicro
Text=#TurntableSpeed#
X=27
Y=(292 + #CapHeight9# / 2 - #Ascent9#)
UpdateDivider=-1

[MeterTitle]
; the last title (sTitle), on baseline 317.3; clipped with "…" (the tooltip has it in full)
Meter=String
MeterStyle=sTitle
MeasureName=MeasureLastTitle
FontColor=#TitleColor#
X=16
Y=(317.3 - #Ascent15#)
W=208
ClipString=1
DynamicVariables=1

[MeterArtist]
; the artist (sBody), at most 140 wide; the time follows it on the same baseline, 335.6
Meter=String
MeterStyle=sBody
MeasureName=MeasureLastArtist
X=16
Y=(335.6 - #Ascent13#)
ClipString=2
ClipStringW=140
ClipStringH=16
Group=Track

[MeterTime]
; "1:21 / 3:13" (the compact row's form: elapsed / total)
Meter=String
MeterStyle=sCaptionNum
MeasureName=MeasurePosition
MeasureName2=MeasureDuration
Text=%1 / %2
X=5R
Y=(335.6 - #Ascent11#)
Group=Track

[MeterIdleLine]
; at rest, "Not Playing"; on the first run "Play something in Music or Spotify"
Meter=String
MeterStyle=sCaption
FontColor=#TertiaryTextColor#
Text=#NowPlayingNotPlaying#
X=16
Y=(335.6 - #Ascent11#)
W=208
ClipString=1
Hidden=1
Group=Idle

[MeterPrevPad]
Meter=Shape
MeterStyle=sSidePad
Shape=Ellipse 247,322,15 | Fill Color #HoverColor# | StrokeWidth 0

[MeterPlayDisc]
; the deck's one solid button
Meter=Shape
Shape=Ellipse 288,322,18 | Fill Color #InkSolid# | StrokeWidth 0
UpdateDivider=-1

[MeterNextPad]
Meter=Shape
MeterStyle=sSidePad
Shape=Ellipse 329,322,15 | Fill Color #HoverColor# | StrokeWidth 0

[MeterPrev]
Meter=Image
MeterStyle=sSideButton
ImageName=sf:backward.fill
X=232
Y=307
MouseOverAction=[!ShowMeter MeterPrevPad][!Redraw]
MouseLeaveAction=[!HideMeter MeterPrevPad][!Redraw]
LeftMouseDownAction=[!SetOption MeterPrevPad Shape "Ellipse 247,322,15 | Fill Color #PressedColor# | StrokeWidth 0"][!UpdateMeter MeterPrevPad][!Redraw]
LeftMouseUpAction=[!SetOption MeterPrevPad Shape "Ellipse 247,322,15 | Fill Color #HoverColor# | StrokeWidth 0"][!UpdateMeter MeterPrevPad][!CommandMeasure MeasurePlayer "Previous"][!UpdateMeasureGroup Player][!UpdateMeasureGroup Arm][!UpdateMeter *][!Redraw]
ToolTipText=#TurntableTipPrevious#

[MeterPlay]
; play / pause, 17 pt semibold in a 16 × 18 box (both glyphs fit, so nothing shifts) and a 36 × 36 slot
Meter=Image
ImageName=#PlayGlyph#
MacSymbolSize=17
MacSymbolWeight=Semibold
ImageTint=#InkOnSolid#
PreserveAspectRatio=1
X=#PlayX#
Y=304
W=16
H=18
Padding=10,9,10,9
SolidColor=0,0,0,1
LeftMouseUpAction=#PlayPauseAction#
ToolTipText=#PlayTip#
DynamicVariables=1

[MeterNext]
Meter=Image
MeterStyle=sSideButton
ImageName=sf:forward.fill
X=314
Y=307
MouseOverAction=[!ShowMeter MeterNextPad][!Redraw]
MouseLeaveAction=[!HideMeter MeterNextPad][!Redraw]
LeftMouseDownAction=[!SetOption MeterNextPad Shape "Ellipse 329,322,15 | Fill Color #PressedColor# | StrokeWidth 0"][!UpdateMeter MeterNextPad][!Redraw]
LeftMouseUpAction=[!SetOption MeterNextPad Shape "Ellipse 329,322,15 | Fill Color #HoverColor# | StrokeWidth 0"][!UpdateMeter MeterNextPad][!CommandMeasure MeasurePlayer "Next"][!UpdateMeasureGroup Player][!UpdateMeasureGroup Arm][!UpdateMeter *][!Redraw]
ToolTipText=#TurntableTipNext#

; ================================================================ hit areas (on top, invisible)

[MeterTextHit]
; the title and artist bring the player forward; the tooltip has them in full
Meter=Shape
Shape=Rectangle 10,280,216,62 | Fill Color 0,0,0,1 | StrokeWidth 0
LeftMouseUpAction=[!CommandMeasure MeasurePlayer "OpenPlayer"]
ToolTipText=#TurntableTipTrack#
DynamicVariables=1

[MeterRecordHit]
; the record outside the grooves (and every record click when seeking is off, or at rest): play or pause
Meter=Shape
Shape=Ellipse 150,150,126.5 | Fill Color 0,0,0,1 | StrokeWidth 0
LeftMouseUpAction=#PlayPauseAction#
UpdateDivider=-1

[MeterGrooveHit]
; drop the needle: a click seeks where it lands (its own position is taken first, so a click without a move works)
Meter=Shape
Shape=Ellipse 150,150,124 | Fill Color 0,0,0,1 | StrokeWidth 0
Shape2=Ellipse 150,150,50 | StrokeWidth 0
Shape3=Combine Shape | Exclude Shape2
MouseOverAction=[!EnableMeasure MeasurePointer][!ShowMeter MeterSeekRing][!Redraw]
MouseLeaveAction=[!DisableMeasure MeasurePointer][!HideMeter MeterSeekRing][!Redraw]
LeftMouseUpAction=[!SetVariable PX $MouseX$][!SetVariable PY $MouseY$][!UpdateMeasure MeasureSeekR][!UpdateMeasure MeasureSeek][!CommandMeasure MeasurePlayer "SetPosition [MeasureSeek:0]"][!UpdateMeasureGroup Player][!UpdateMeasureGroup Arm][!UpdateMeterGroup Arm][!Redraw]
ToolTipText=#TurntableTipSeek#
Hidden=1
DynamicVariables=1

[MeterLabelHit]
; the label: play or pause, with the scrim and glyph while the pointer is over it
Meter=Shape
Shape=Ellipse 150,150,48 | Fill Color 0,0,0,1 | StrokeWidth 0
MouseOverAction=[!ShowMeterGroup LabelHover][!Redraw]
MouseLeaveAction=[!HideMeterGroup LabelHover][!Redraw]
LeftMouseUpAction=#PlayPauseAction#
ToolTipText=#PlayTip#
DynamicVariables=1
