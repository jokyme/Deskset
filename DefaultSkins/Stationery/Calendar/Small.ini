Hidden=(6 > [MeasureRows])
DynamicVariables=1
Group=Grid
UpdateDivider=-1

; ---------------------------------------------------------------- the dates
; date N sits in cell (the 1st's column + N − 1), counted along the rows; other months' days stay blank
[sDate]
StringAlign=Center
FontColor=#TextColor#
DynamicVariables=1
Group=Grid
UpdateDivider=-1

[MeterDate1]
Meter=String
MeterStyle=sCaptionNum | sDate
Text=1
X=(#GridX# + #Pitch# * (([MeasureFirstCol] + 0) % 7 + #DayCol0# + 0.5))
Y=(#GridBaseline# + #RowPitch# * Floor(([MeasureFirstCol] + 0) / 7) - #Ascent11#)

[MeterDate2]
Meter=String
MeterStyle=sCaptionNum | sDate
Text=2
