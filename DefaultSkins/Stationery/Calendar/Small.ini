; ---------------------------------------------------------------- today: a red disc (Ø 19) behind today's number
[MeterTodayDisc]
Meter=Shape
Shape=Ellipse #TodayDiscR#,#TodayDiscR#,#TodayDiscR# | Fill Color #CalendarColor# | StrokeWidth 0
X=(#GridX# + #Pitch# * ([MeasureTodayCell] % 7 + #DayCol0# + 0.5) - #TodayDiscR#)
Y=(#GridBaseline# + #RowPitch# * Floor([MeasureTodayCell] / 7) - #CapHeight11# / 2 - #TodayDiscR#)
Hidden=(#MonthOffset# <> 0)
ToolTipTitle=#CalendarToday#
ToolTipText=[MeasureDateFull]
DynamicVariables=1
Group=Grid
UpdateDivider=-1

[MeterTodayNumber]
Meter=String
MeterStyle=sCaptionNum | sDate
MeasureName=MeasureTodayD
FontWeight=700
FontColor=#InverseTextColor#
X=(#GridX# + #Pitch# * ([MeasureTodayCell] % 7 + #DayCol0# + 0.5))
Y=(#GridBaseline# + #RowPitch# * Floor([MeasureTodayCell] / 7) - #Ascent11#)
Hidden=(#MonthOffset# <> 0)
