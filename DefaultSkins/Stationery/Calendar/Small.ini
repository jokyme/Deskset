; Stationery · Calendar, small (170 × 170): this month at a glance.
; Original work, MIT licensed. Scroll to change month (down goes forward, as in Calendar); the calendar turns back to
; today by itself two minutes after the pointer leaves, and at the day change.

[Rainmeter]
Update=1000
AccurateText=1
SkinWidth=170
SkinHeight=170
DynamicWindowSize=0
Group=Stationery
; the window's own look, once Deskset reads it (until then it is macOS's)
MacAppearance=#LookAppearance#
; the card keeps the arrow, like Apple's widgets; only the Today link shows a hand
MouseActionCursor=0
; a scroll also proves the pointer is over the card (the skin may have loaded under it, with no enter event).
; [#MonthOffset] is read when the action runs; #MonthOffset# would keep its value from the load
MouseScrollDownAction=[!SetVariable MonthOffset "(Clamp([#MonthOffset] + 1, -1200, 1200))"][!SetVariable MouseInside 1][!EnableMeasure MeasureBrowseIdle][!UpdateMeasureGroup Month][!UpdateMeterGroup Grid][!Redraw]
MouseScrollUpAction=[!SetVariable MonthOffset "(Clamp([#MonthOffset] - 1, -1200, 1200))"][!SetVariable MouseInside 1][!EnableMeasure MeasureBrowseIdle][!UpdateMeasureGroup Month][!UpdateMeterGroup Grid][!Redraw]
MouseOverAction=[!SetVariable MouseInside 1]
MouseLeaveAction=[!SetVariable MouseInside 0][!SetVariable LastTouch [MeasureDayKey:Timestamp]]
ContextTitle=#CalendarMenuOpen#
ContextAction=#OpenAction#
ContextTitle2=---
ContextTitle3=#MenuWeekStartTitle#
ContextAction3=#MenuWeekStartAction#
ContextTitle4=---
ContextTitle5=#MenuLookTitle#
ContextAction5=#MenuLookAction#
ContextTitle6=#MenuCardsTitle#
ContextAction6=#MenuCardsAction#
ContextTitle7=#MenuLanguageTitle#
ContextAction7=#MenuLanguageAction#

[Metadata]
Name=Calendar
Author=Deskset
License=MIT
Version=1.0
Information=Stationery · This month at a glance. Scroll to change month; the calendar returns to today on its own. Right-click for the first day of the week.

[Variables]
@Include=#@#Variables.inc
@Include2=#@#Suite/Tokens.inc
@Include3=#@#Suite/Styles.inc
@Include4=#@#Calendar/Strings-#Language#.inc
@Include5=#@#Calendar/Measures.inc
CardW=170
CardH=170
OpenAction=["/System/Applications/Calendar.app"]
; the grid: the content box, 7 columns 19.71 apart
GridX=#Pad#
GridW=138
Pitch=(138 / 7)
DayCol0=0
; the month's eyebrow: "SEPTEMBER", or "JAN 2027" in another year; 90 wide beside the Today link
MonthW=138
MonthBrowseW=90
; rows: baselines 66 + 17 × row (the sixth on the last baseline, 151); the initials on 48
GridBaseline=66
RowPitch=17
InitialBaseline=48
TodayDiscR=9.5

[MeasureMonthLabel]
; the month shown; its year only when it is not this year's
Measure=Time
TimeStamp=[MeasureShownY]-[MeasureShownM]-1
TimeStampFormat=%Y-%m-%d
Format=[#CalendarMonthFormat[&MeasureOtherYear:0]]
FormatLocale=#Locale#
DynamicVariables=1
Group=Month
UpdateDivider=-1

; ---------------------------------------------------------------- meters
[MeterCard]
Meter=Shape
MeterStyle=sCard
ToolTipTitle=[MeasureDateFull]
ToolTipText=#CalendarSentence#
Group=Grid
UpdateDivider=-1

; ---------------------------------------------------------------- the month
[MeterMonth]
; the month's eyebrow, in the Calendar's red; narrower while the Today link shows
Meter=String
MeterStyle=sEyebrow
MeasureName=MeasureMonthLabel
FontColor=#CalendarTextColor#
X=#GridX#
Y=16
W=((#MonthOffset# = 0) ? #MonthW# : #MonthBrowseW#)
ClipString=1
DynamicVariables=1
Group=Grid
UpdateDivider=-1

[MeterTodayLink]
; another month is shown: a link back to today at the top right
Meter=String
MeterStyle=sEyebrow
Text=#CalendarToday#
FontColor=#AccentTextColor#
StringAlign=Right
X=(#CardW# - 16)
Y=16
Hidden=(#MonthOffset# = 0)
DynamicVariables=1
Group=Grid
UpdateDivider=-1

[MeterTodayHit]
; the link's hit box (58 × 28); the pointer becomes a hand over it. No pad: it is a text link
Meter=Shape
Shape=Rectangle 0,0,58,28 | Fill Color 0,0,0,1 | StrokeWidth 0
X=(#CardW# - 66)
Y=8
Hidden=(#MonthOffset# = 0)
LeftMouseUpAction=#BackToToday#
MouseActionCursor=1
ToolTipText=#CalendarGoToToday#
DynamicVariables=1
Group=Grid
UpdateDivider=-1

; ---------------------------------------------------------------- weekday initials (9 pt), in the week's order
[MeterInitial1]
Meter=String
MeterStyle=sMicro
MeasureName=MeasureInitial1
StringAlign=Center
X=(#GridX# + #Pitch# * (0 + #DayCol0# + 0.5))
Y=(#InitialBaseline# - #Ascent9#)
UpdateDivider=-1

[MeterInitial2]
Meter=String
MeterStyle=sMicro
MeasureName=MeasureInitial2
StringAlign=Center
X=(#GridX# + #Pitch# * (1 + #DayCol0# + 0.5))
Y=(#InitialBaseline# - #Ascent9#)
UpdateDivider=-1

[MeterInitial3]
Meter=String
MeterStyle=sMicro
MeasureName=MeasureInitial3
StringAlign=Center
X=(#GridX# + #Pitch# * (2 + #DayCol0# + 0.5))
Y=(#InitialBaseline# - #Ascent9#)
UpdateDivider=-1

[MeterInitial4]
Meter=String
MeterStyle=sMicro
MeasureName=MeasureInitial4
StringAlign=Center
X=(#GridX# + #Pitch# * (3 + #DayCol0# + 0.5))
Y=(#InitialBaseline# - #Ascent9#)
UpdateDivider=-1

[MeterInitial5]
Meter=String
MeterStyle=sMicro
MeasureName=MeasureInitial5
StringAlign=Center
X=(#GridX# + #Pitch# * (4 + #DayCol0# + 0.5))
Y=(#InitialBaseline# - #Ascent9#)
UpdateDivider=-1

[MeterInitial6]
Meter=String
MeterStyle=sMicro
MeasureName=MeasureInitial6
StringAlign=Center
X=(#GridX# + #Pitch# * (5 + #DayCol0# + 0.5))
Y=(#InitialBaseline# - #Ascent9#)
UpdateDivider=-1

[MeterInitial7]
Meter=String
MeterStyle=sMicro
MeasureName=MeasureInitial7
StringAlign=Center
X=(#GridX# + #Pitch# * (6 + #DayCol0# + 0.5))
Y=(#InitialBaseline# - #Ascent9#)
UpdateDivider=-1

; ---------------------------------------------------------------- the rows
; invisible hit boxes that give each row's week ("Week 39") as its tooltip and open Calendar
[MeterRow1]
Meter=String
MeasureName=MeasureWeekRow1
FontColor=0,0,0,0
SolidColor=0,0,0,1
X=#GridX#
Y=(#GridBaseline# + #RowPitch# * 0 - 12.5)
W=#GridW#
H=#RowPitch#
ToolTipText=#CalendarWeekText#
LeftMouseUpAction=#OpenAction#
Hidden=(1 > [MeasureRows])
DynamicVariables=1
Group=Grid
UpdateDivider=-1

[MeterRow2]
Meter=String
MeasureName=MeasureWeekRow2
FontColor=0,0,0,0
SolidColor=0,0,0,1
X=#GridX#
Y=(#GridBaseline# + #RowPitch# * 1 - 12.5)
W=#GridW#
H=#RowPitch#
ToolTipText=#CalendarWeekText#
