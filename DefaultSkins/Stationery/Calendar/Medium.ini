; ---------------------------------------------------------------- week numbers (the Week Numbers option): ISO weeks in a first column
[MeterWeek1]
Meter=String
MeterStyle=sMicroNum
MeasureName=MeasureWeekRow1
StringAlign=Center
X=(#GridX# + #Pitch# / 2)
Y=(#GridBaseline# + #RowPitch# * 0 - #Ascent9#)
Hidden=((#CalendarShowWeekNumbers# = 0) || (1 > [MeasureRows]))
