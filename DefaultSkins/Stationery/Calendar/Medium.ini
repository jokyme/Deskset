; Stationery · Calendar, medium (360 × 170): today on the left, the month on the right, as Apple's calendar widget.
; Original work, MIT licensed. Scroll to change month (down goes forward, as in Calendar); the calendar turns back to
; today by itself two minutes after the pointer leaves, and at the day change.

[Rainmeter]
Update=1000
AccurateText=1
SkinWidth=360
SkinHeight=170
DynamicWindowSize=0
Group=Stationery
; the window's own look, once Deskset reads it (until then it is macOS's)
MacAppearance=#LookAppearance#
; the card keeps the arrow, like Apple's widgets; only the Today link shows a hand
MouseActionCursor=0
; a scroll also proves the pointer is over the card (the skin may have loaded under it, with no enter event).
; [#MonthOffset] is read when the action runs; #MonthOffset# would keep its value from the load
MouseScrollDownAction=[!SetVariable MonthOffset "(Clamp([#MonthOffset] + 1, -1200, 1200))"][!SetVariable MouseInside 1][!EnableMeasure MeasureBrowseIdle][!UpdateMeasureGroup Month][!UpdateMeterGroup Grid][!Redraw]
MouseScrollUpAction=[!SetVariable MonthOffset "(Clamp([#MonthOffset] - 1, -1200, 1200))"][!SetVariable MouseInside 1][!EnableMeasure MeasureBrowseIdle][!UpdateMeasureGroup Month][!UpdateMeterGroup Grid][!Redraw]
MouseOverAction=[!SetVariable MouseInside 1]
MouseLeaveAction=[!SetVariable MouseInside 0][!SetVariable LastTouch [MeasureDayKey:Timestamp]]
ContextTitle=#CalendarMenuOpen#
ContextAction=#OpenAction#
ContextTitle2=---
ContextTitle3=#MenuWeekStartTitle#
ContextAction3=#MenuWeekStartAction#
ContextTitle4=[#CalendarMenuWeekNumbers[#CalendarShowWeekNumbers]]
ContextAction4=[!WriteKeyValue Variables CalendarShowWeekNumbers "(1 - #CalendarShowWeekNumbers#)" "#@#Variables.inc"][!Refresh]
ContextTitle5=[#CalendarMenuMoon[#CalendarShowMoon]]
ContextAction5=[!WriteKeyValue Variables CalendarShowMoon "(1 - #CalendarShowMoon#)" "#@#Variables.inc"][!Refresh]
ContextTitle6=---
ContextTitle7=#MenuLookTitle#
ContextAction7=#MenuLookAction#
ContextTitle8=#MenuCardsTitle#
ContextAction8=#MenuCardsAction#

[Metadata]
Name=Calendar
Author=Deskset
License=MIT
Version=1.0
Information=Stationery · Today and this month at a glance: the weekday, the day, the week and the moon beside the month. Scroll to change month; the calendar returns to today on its own. Right-click for the first day of the week, week numbers and the moon.

[Variables]
; This widget's own settings as they ship. Its right-click menu writes a new choice into Variables.inc, which the next
; line reads over these.
; week numbers in a column at the left (1) or not (0), and the moon under the day (1) or not (0)
CalendarShowWeekNumbers=0
CalendarShowMoon=1
@Include=#@#Variables.inc
@Include2=#@#Suite/Tokens.inc
@Include3=#@#Suite/Styles.inc
@Include4=#@#Calendar/Strings-#Language#.inc
@Include5=#@#Calendar/Measures.inc
CardW=360
CardH=170
OpenAction=["/System/Applications/Calendar.app"]
; the grid: x 176 → 344, 7 columns 24 apart, or 8 columns 21 apart with the week numbers first
GridX=#DetailX#
GridW=168
Pitch=(24 - 3 * #CalendarShowWeekNumbers#)
DayCol0=#CalendarShowWeekNumbers#
; the month's eyebrow: "SEPTEMBER 2026"; 120 wide beside the Today link
MonthW=168
MonthBrowseW=120
; rows: baselines 66 + 17 × row (the sixth on the last baseline, 151); the initials on 48
GridBaseline=66
RowPitch=17
InitialBaseline=48
TodayDiscR=9.5

[MeasureMonthLabel]
; the month shown, with its year
Measure=Time
TimeStamp=[MeasureShownY]-[MeasureShownM]-1
TimeStampFormat=%Y-%m-%d
Format=#CalendarMonthYearFormat#
FormatLocale=#Locale#
DynamicVariables=1
Group=Month
UpdateDivider=-1

; ---------------------------------------------------------------- meters
[MeterCard]
Meter=Shape
MeterStyle=sCard
ToolTipTitle=[MeasureDateFull]
ToolTipText=#CalendarSentence#
Group=Grid
UpdateDivider=-1

; ---------------------------------------------------------------- the left column: today, in the clock's structure
[MeterWeekday]
; "SATURDAY", in the Calendar's red
Meter=String
MeterStyle=sEyebrow
MeasureName=MeasureWeekday
FontColor=#CalendarTextColor#
X=16
Y=16
W=138
ClipString=1
Group=Grid
UpdateDivider=-1

[MeterDay]
; "26", 46 pt on baseline 94
Meter=String
MeterStyle=sHero
MeasureName=MeasureTodayD
X=16
Y=(#HeroBaseline# - #Ascent46#)
Group=Grid
UpdateDivider=-1

[MeterWeekNow]
; "Week 39" on baseline 117 (the day of the year is in the card's sentence)
Meter=String
MeterStyle=sSubhead
MeasureName=MeasureWeekNow
Text=#CalendarWeekText#
X=16
Y=(117 - #Ascent15#)
W=138
ClipString=1
Group=Grid
UpdateDivider=-1

[MeterMoonSymbol]
; the moon on the last baseline: the phase by its eighth, with the look's suffix (".inverse" in Light), so the lit
; part is always the lighter tone
Meter=Image
MeterStyle=sSymbolS
ImageName=sf:[#MoonSymbol[&MeasureMoonEighth:0]]#MoonSuffix#
MacSymbolRendering=Hierarchical
ImageTint=#TertiaryTextColor#
X=(#SlotCenterX# - 7)
Y=(#LastBaseline# - #CapHeight11# / 2 - 7)
W=14
H=14
Hidden=(#CalendarShowMoon# = 0)
DynamicVariables=1
Group=Moon
UpdateDivider=-1

[MeterMoonText]
; "Full Moon"
Meter=String
MeterStyle=sCaption
FontColor=#TertiaryTextColor#
Text=[#Moon[&MeasureMoonEighth:0]]
X=#SlotTextX#
Y=(#LastBaseline# - #Ascent11#)
W=113
ClipString=1
Hidden=(#CalendarShowMoon# = 0)
DynamicVariables=1
Group=Moon
UpdateDivider=-1

; ---------------------------------------------------------------- the month
[MeterMonth]
; the month's eyebrow, in the Calendar's red; narrower while the Today link shows
Meter=String
MeterStyle=sEyebrow
MeasureName=MeasureMonthLabel
FontColor=#CalendarTextColor#
X=#GridX#
Y=16
W=((#MonthOffset# = 0) ? #MonthW# : #MonthBrowseW#)
ClipString=1
DynamicVariables=1
Group=Grid
UpdateDivider=-1

[MeterTodayLink]
; another month is shown: a link back to today at the top right
Meter=String
MeterStyle=sEyebrow
Text=#CalendarToday#
FontColor=#AccentTextColor#
StringAlign=Right
X=(#CardW# - 16)
Y=16
Hidden=(#MonthOffset# = 0)
DynamicVariables=1
Group=Grid
UpdateDivider=-1

[MeterTodayHit]
; the link's hit box (58 × 28); the pointer becomes a hand over it. No pad: it is a text link
Meter=Shape
Shape=Rectangle 0,0,58,28 | Fill Color 0,0,0,1 | StrokeWidth 0
X=(#CardW# - 66)
Y=8
Hidden=(#MonthOffset# = 0)
LeftMouseUpAction=#BackToToday#
MouseActionCursor=1
ToolTipText=#CalendarGoToToday#
DynamicVariables=1
Group=Grid
UpdateDivider=-1

; ---------------------------------------------------------------- weekday initials (9 pt), in the week's order
[MeterInitial1]
Meter=String
MeterStyle=sMicro
MeasureName=MeasureInitial1
StringAlign=Center
X=(#GridX# + #Pitch# * (0 + #DayCol0# + 0.5))
Y=(#InitialBaseline# - #Ascent9#)
UpdateDivider=-1

[MeterInitial2]
Meter=String
MeterStyle=sMicro
MeasureName=MeasureInitial2
StringAlign=Center
X=(#GridX# + #Pitch# * (1 + #DayCol0# + 0.5))
Y=(#InitialBaseline# - #Ascent9#)
UpdateDivider=-1

[MeterInitial3]
Meter=String
MeterStyle=sMicro
MeasureName=MeasureInitial3
StringAlign=Center
X=(#GridX# + #Pitch# * (2 + #DayCol0# + 0.5))
Y=(#InitialBaseline# - #Ascent9#)
UpdateDivider=-1

[MeterInitial4]
Meter=String
MeterStyle=sMicro
MeasureName=MeasureInitial4
StringAlign=Center
X=(#GridX# + #Pitch# * (3 + #DayCol0# + 0.5))
Y=(#InitialBaseline# - #Ascent9#)
