Group=Grid
UpdateDivider=-1

; ---------------------------------------------------------------- the rows: invisible hit boxes that give each row's week
; ("Week 39") and open Calendar
[MeterRow1]
Meter=String
MeasureName=MeasureWeekRow1
FontColor=0,0,0,0
SolidColor=0,0,0,1
X=#GridX#
Y=(#GridBaseline# + #RowPitch# * 0 - 12.5)
W=#GridW#
H=#RowPitch#
