X=(#GridX# + #Pitch# * (([MeasureFirstCol] + 0) % 7 + #DayCol0# + 0.5))
Y=(#GridBaseline# + #RowPitch# * Floor(([MeasureFirstCol] + 0) / 7) - #Ascent11#)

