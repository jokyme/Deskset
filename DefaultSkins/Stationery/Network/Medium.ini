; Stationery · Network, medium (360 × 170): the Small, and a detail column: what the Mac has received and sent since
; startup, the Wi-Fi signal or the Ethernet link speed, and the IP address (or the router's latency, or the public IP).
; Original work, MIT licensed. The parts both sizes share are in @Resources/Network.

[Rainmeter]
Update=1000
AccurateText=1
SkinWidth=360
SkinHeight=170
DynamicWindowSize=0
Group=Stationery
; the window's own look, once Deskset reads it (until then it is macOS's)
MacAppearance=#LookAppearance#
ContextTitle=#NetworkMenuOpen#
ContextAction=#OpenAction#
ContextTitle2=#NetworkMenuSettings#
ContextAction2=["x-apple.systempreferences:com.apple.Network-Settings.extension"]
ContextTitle3=---
; NetUnit is a suite setting, but only this widget reads it: refreshing this widget is enough
ContextTitle4=[#NetworkMenuSpeed[#NetUnit]]
ContextAction4=[!WriteKeyValue Variables NetUnit [#NetUnitNext[#NetUnit]] "#@#Variables.inc"][!Refresh]
; On asks macOS for Location Services the first time (macOS shows a Wi-Fi network's name only with it)
ContextTitle5=[#NetworkMenuWiFiName[#ShowWiFiName]]
ContextAction5=[!WriteKeyValue Variables ShowWiFiName [#Toggle[#ShowWiFiName]] "#@#Variables.inc"][!Refresh]
; IP Address → Router Latency → Public IP → …
ContextTitle6=[#NetworkMenuBottom[#NetworkBottomRow]]
ContextAction6=[!WriteKeyValue Variables NetworkBottomRow [#BottomRowNext[#NetworkBottomRow]] "#@#Variables.inc"][!Refresh]
ContextTitle7=---
ContextTitle8=#MenuLookTitle#
ContextAction8=#MenuLookAction#
ContextTitle9=#MenuCardsTitle#
ContextAction9=#MenuCardsAction#

[Metadata]
Name=Network
Author=Deskset
License=MIT
Version=1.0
Information=Stationery · Download and upload speed, with a two-minute graph. Medium adds totals since startup, Wi-Fi signal or Ethernet link speed, and the IP address. No permission is asked unless you turn on Show Wi-Fi Name (Location) or Router Latency (pings your router; on macOS 15 and later macOS may ask for Local Network access). Public IP asks api.ipify.org once every 30 minutes.

[Variables]
; the network's own settings first, so the values the menus wrote into Variables.inc win
@IncludeDefaults=#@#Network/Settings.inc
@Include=#@#Variables.inc
@Include2=#@#Suite/Tokens.inc
@Include3=#@#Suite/Styles.inc
@Include4=#@#Network/Strings-#Language#.inc
CardW=360
CardH=170
; the header's title stops here (41 → 264, clear of "Since startup")
TitleW=223
OpenAction=["/System/Applications/Utilities/Activity Monitor.app"]
@Include5=#@#Network/Measures.inc
; the last row, by NetworkBottomRow (IP, Router or Public): only the chosen file's measures exist
@Include6=#@#Network/Bottom-#NetworkBottomRow#.inc

; ---------------------------------------------------------------- meters
[MeterCard]
; the tooltip carries the live rates, so it updates every second (its shape never changes, so it stays cached)
Meter=Shape
MeterStyle=sCard
ToolTipTitle=[MeasureHeaderTitle]
ToolTipText=[MeasureSentence]
@IncludeLeft=#@#Network/Left.inc

; ---------------------------------------------------------------- the detail column (x 176 → 344)
; Rows of 13 pt: the symbol centred on (186, baseline − 4.6), the label at 201, the value right-aligned at 344. Rows 1
; and 2 share the rates' baselines (56, 89), so each line reads across; rows 3 and 4 end on the last baseline (151).
; Each value comes before its label, so the label clips 8 pt before it.
[MeterSinceStartup]
; what the totals under it count from
Meter=String
MeterStyle=sCaption | sHeaderTrailing
Text=#NetworkSinceStartup#
UpdateDivider=-1

[MeterRow1Symbol]
Meter=Image
MeterStyle=sSymbolM
ImageName=sf:arrow.down.circle
ImageTint=#DownloadColor#
X=178
Y=(56 - #CapHeight13# / 2 - 8)
W=16
H=16
UpdateDivider=-1

[MeterRow1Value]
; "12.4 GB"
Meter=String
MeterStyle=sValue | sUnit | sMissing
MeasureName=MeasureReceivedText
StringAlign=Right
X=344
Y=(56 - #Ascent13#)
UpdateDivider=5

[MeterRow1Label]
Meter=String
MeterStyle=sBody
Text=#NetworkReceived#
X=201
Y=(56 - #Ascent13#)
W=([MeterRow1Value:X] - 209)
ClipString=1
DynamicVariables=1
UpdateDivider=5

[MeterRow2Symbol]
Meter=Image
MeterStyle=sSymbolM
ImageName=sf:arrow.up.circle
ImageTint=#UploadColor#
X=178
Y=(89 - #CapHeight13# / 2 - 8)
W=16
H=16
UpdateDivider=-1

[MeterRow2Value]
; "1.1 GB"
Meter=String
MeterStyle=sValue | sUnit | sMissing
MeasureName=MeasureSentText
StringAlign=Right
X=344
Y=(89 - #Ascent13#)
UpdateDivider=5

[MeterRow2Label]
Meter=String
MeterStyle=sBody
Text=#NetworkSent#
X=201
Y=(89 - #Ascent13#)
W=([MeterRow2Value:X] - 209)
ClipString=1
DynamicVariables=1
UpdateDivider=5

[MeterRow3Symbol]
; wifi, point.3.connected.trianglepath.dotted (wired) or wifi.slash (not connected); 18 wide
Meter=Image
MeterStyle=sSymbolM
ImageName=sf:[#LinkSymbol[&MeasureLinkKind:]]
ImageTint=#SecondaryTextColor#
X=177
Y=(125 - #CapHeight13# / 2 - [#LinkSymbolH[&MeasureLinkKind:]] / 2)
W=18
H=[#LinkSymbolH[&MeasureLinkKind:]]
DynamicVariables=1
UpdateDivider=5
Group=Link

[MeterRow3Value]
; "80%" (the Wi-Fi signal), "1 Gbit/s" (the link speed) or "--"
Meter=String
MeterStyle=sValue | sUnit | sMissing
Text=[#LinkValue[&MeasureLinkKind:]]
StringAlign=Right
X=344
Y=(125 - #Ascent13#)
DynamicVariables=1
UpdateDivider=5
Group=Link

[MeterRow3Label]
; "Wi-Fi 6 signal", "Link speed", "Not connected"
Meter=String
MeterStyle=sBody
Text=[#LinkLabel[&MeasureLinkKind:]]
X=201
Y=(125 - #Ascent13#)
W=([MeterRow3Value:X] - 209)
ClipString=1
DynamicVariables=1
UpdateDivider=5
Group=Link

[MeterRow4Symbol]
; rectangle.connected.to.line.below (IP), wifi.router (router) or globe (public IP), at its natural size
Meter=Image
MeterStyle=sSymbolM
ImageName=sf:#BottomSymbol#
ImageTint=#SecondaryTextColor#
X=(#DetailSlotCenterX# - #BottomSymbolW# / 2)
Y=(151 - #CapHeight13# / 2 - #BottomSymbolH# / 2)
W=#BottomSymbolW#
H=#BottomSymbolH#
UpdateDivider=-1

[MeterRow4Value]
; "192.168.1.20", "3 ms", "185.199.108.153" or "--"
Meter=String
MeterStyle=sValue | sUnit | sMissing
MeasureName=#BottomMeasure#
StringAlign=Right
X=344
Y=(151 - #Ascent13#)
UpdateDivider=5

[MeterRow4Label]
Meter=String
MeterStyle=sBody
Text=#BottomLabel#
X=201
Y=(151 - #Ascent13#)
W=([MeterRow4Value:X] - 209)
ClipString=1
DynamicVariables=1
UpdateDivider=5
