; Stationery · Temperature, medium (360 × 170): the Small's CPU temperature and thermal state with the GPU and SSD
; temperatures, and a detail column: an 11-minute CPU history, the fans with their speed bar, and power. Original work,
; MIT licensed. The parts both sizes share are in @Resources/Temperature.

[Rainmeter]
; every reading here changes at most every 2 s, so the skin wakes every 2 s
Update=2000
AccurateText=1
SkinWidth=360
SkinHeight=170
DynamicWindowSize=0
; the suite, and the suite settings it shows (a setting refreshes only its own group)
Group=Stationery | StationeryTemp
; the window's own look, once Deskset reads it (until then it is macOS's)
MacAppearance=#LookAppearance#
ContextTitle=#TemperatureMenuOpen#
ContextAction=#OpenAction#
ContextTitle2=---
ContextTitle3=#MenuTempTitle#
ContextAction3=#MenuTempAction#
ContextTitle4=---
ContextTitle5=#MenuLookTitle#
ContextAction5=#MenuLookAction#
ContextTitle6=#MenuCardsTitle#
ContextAction6=#MenuCardsAction#
ContextTitle7=#MenuLanguageTitle#
ContextAction7=#MenuLanguageAction#

[Metadata]
Name=Temperature
Author=Deskset
License=MIT
Version=1.0
Information=Stationery · How hot the Mac is, and whether macOS is slowing it down to cool it: CPU temperature and thermal state, fans and power (Medium: GPU and SSD temperatures and an 11-minute CPU history). No permission needed. Click to open Activity Monitor.

[Variables]
@Include=#@#Variables.inc
@Include2=#@#Suite/Tokens.inc
@Include3=#@#Suite/Styles.inc
@Include4=#@#Temperature/Strings-#Language#.inc
@Include5=#@#Temperature/Rows.inc
@Include6=#@#Temperature/Measures.inc
CardW=360
CardH=170
OpenAction=["/System/Applications/Utilities/Activity Monitor.app"]
; the left column's rows (Temperature/Left.inc)
SlotA=LeftA
SlotB=LeftB
SlotRows=LeftRows

; ---------------------------------------------------------------- meters
[MeterCard]
; the tooltip carries every reading, the sizes' hidden ones too, so it updates with them
Meter=Shape
MeterStyle=sCard
ToolTipTitle=[MeasureComputerName]
ToolTipText=[MeasureTip]
Group=Readings
@IncludeTop=#@#Temperature/Top.inc
@IncludeLeft=#@#Temperature/Left.inc
@IncludeRight=#@#Temperature/Right.inc

[MeterHeaderTrailing]
; the chart's window: "CPU · 11 min"
Meter=String
MeterStyle=sCaption | sHeaderTrailing
MeasureName=MeasureChartMinutes
Text=#TemperatureChartLabel#
Hidden=([&MeasureNotice:] = 1)
DynamicVariables=1
UpdateDivider=-1
Group=Rows

[MeterChartArea]
; the CPU temperature, one sample every ChartDivider updates (4 s), on the fixed 30–110 °C range: an area under a
; 1.5 pt line, both bound to MeasureCPU so they agree. Its bottom edge is on the thermal state's baseline, 101
Meter=Histogram
MeasureName=MeasureCPU
X=176
Y=40
W=168
H=61
PrimaryColor=#TemperatureColor#,51
AntiAlias=1
Hidden=([&MeasureNotice:] = 1)
DynamicVariables=1
UpdateDivider=#ChartDivider#

[MeterChartLine]
Meter=Line
MeasureName=MeasureCPU
X=176
Y=40
W=168
H=61
LineCount=1
LineColor=#TemperatureColor#
LineWidth=1.5
AntiAlias=1
Hidden=([&MeasureNotice:] = 1)
DynamicVariables=1
UpdateDivider=#ChartDivider#

; ---------------------------------------------------------------- the notice: no readings (left-aligned under the header)
[MeterNoticeSymbol]
; 20 pt at its natural size (16 × 25), from y 40
Meter=Image
MeterStyle=sNoticeSymbol
ImageName=sf:thermometer.medium
X=16
Y=40
W=16
H=25
Hidden=([&MeasureNotice:] = 0)
DynamicVariables=1
UpdateDivider=-1
Group=Rows

[MeterNoticeTitle]
Meter=String
MeterStyle=sBodyStrong | sNoticeTitle
Text=#TemperatureNoReadings#
Hidden=([&MeasureNotice:] = 0)
DynamicVariables=1
UpdateDivider=-1
Group=Rows

[MeterNoticeBody]
Meter=String
MeterStyle=sCaption | sNoticeBody
Text=#TemperatureNoReadingsBody#
Hidden=([&MeasureNotice:] = 0)
DynamicVariables=1
UpdateDivider=-1
Group=Rows

[MeterNoticeState]
; "Thermal state: normal" on the last baseline, once Deskset reads the thermal state
Meter=String
MeterStyle=sCaption
Text=#TemperatureNoReadingsState#
X=16
Y=(#LastBaseline# - #Ascent11#)
W=328
ClipString=1
FontColor=#TertiaryTextColor#
Hidden=(([&MeasureNotice:] = 0) || (#ThermalKnown# = 0))
DynamicVariables=1
UpdateDivider=-1
Group=Rows | Thermal
