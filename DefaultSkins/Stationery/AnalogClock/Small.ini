; Stationery · Analog Clock, small (170 × 170): a watch face, white by day and dark by night. Original work, MIT
; licensed.
; Draw order: the card (glass and veil), the face, ticks, numerals, the date window, the hands, the cap, the seconds
; hand. The dial's centre is (85, 85) and its sizes are fractions of Ø 138, the card's content box, shared with the
; World Clock's dials so both read as the work of one watchmaker.

[Rainmeter]
Update=1000
AccurateText=1
SkinWidth=170
SkinHeight=170
DynamicWindowSize=0
Group=Stationery
; the window's own look, once Deskset reads it (until then it is macOS's)
MacAppearance=#LookAppearance#
ContextTitle=#ClockMenuOpen#
ContextAction=#OpenAction#
ContextTitle2=---
ContextTitle3=[#AnalogMenuFace[#AnalogFace]]
ContextAction3=[!WriteKeyValue Variables AnalogFace [#AnalogFaceNext[#AnalogFace]] "#@#Variables.inc"][!Refresh]
ContextTitle4=[#AnalogMenuNumerals[#AnalogNumerals]]
ContextAction4=[!WriteKeyValue Variables AnalogNumerals [#AnalogNumeralsNext[#AnalogNumerals]] "#@#Variables.inc"][!Refresh]
ContextTitle5=[#AnalogMenuSeconds[#ShowAnalogSeconds]]
ContextAction5=[!WriteKeyValue Variables ShowAnalogSeconds "(1 - #ShowAnalogSeconds#)" "#@#Variables.inc"][!Refresh]
ContextTitle6=[#AnalogMenuDate[#ShowAnalogDate]]
ContextAction6=[!WriteKeyValue Variables ShowAnalogDate "(1 - #ShowAnalogDate#)" "#@#Variables.inc"][!Refresh]
ContextTitle7=---
ContextTitle8=#MenuLookTitle#
ContextAction8=#MenuLookAction#
ContextTitle9=#MenuCardsTitle#
ContextAction9=#MenuCardsAction#

[Metadata]
Name=Analog Clock
Author=Deskset
License=MIT
Version=1.0
Information=Stationery · An analog clock. Its Day and Night face is white by day and dark by night, like the World Clock's dials: it follows sunrise and sunset in your city, or 07:00 to 19:00 without one. Right-click for the Glass face, numerals or ticks, the seconds hand and the date window.

[Variables]
; this widget's settings (AnalogFace, AnalogNumerals, ShowAnalogSeconds, ShowAnalogDate) are in Variables.inc, where
; its right-click menu writes them
@Include=#@#Variables.inc
@Include2=#@#Suite/Tokens.inc
@Include3=#@#Suite/Styles.inc
@Include4=#@#AnalogClock/Strings-#Language#.inc
CardW=170
CardH=170
OpenAction=["/System/Applications/Clock.app"]

; the face in use, set by MeasureFaceMode: 1 day, 0 night, 2 glass
FaceMode=1
; a clock face is an object: the day face stays white in the Dark look too, and both faces keep their colours in
; every look. The Glass face is a disc on the card in the look's ink. Secondary ink is 70 % of the hands' ink on
; both faces (180), as Secondary is to the text on glass.
FaceFill1=255,255,255,235
FaceFill0=28,28,30,235
FaceFill2=[#DialFill[#LookTheme]]
; the Glass face's disc: a written value, not the card's veil, which "Cards: Solid" makes near-opaque
DialFillLight=0,0,0,18
DialFillDark=28,28,30,90
FaceInk1=28,28,30
FaceInk0=255,255,255
FaceInk2=#InkRGB#
FacePrimary1=255
FacePrimary0=255
FacePrimary2=#Alpha1#
FaceSecondary1=180
FaceSecondary0=180
FaceSecondary2=#Alpha2#
; the date window's weekday, in the text-safe accent (the family's colour for a weekday outside the Calendar, as in
; the Chronograph's window): its Light value on the white day face, its Dark value on the night face, the look's
; on the Glass face
FaceAccent1=0,76,160
FaceAccent0=145,198,255
FaceAccent2=#AccentTextColor#
FaceWell1=0,0,0,18
FaceWell0=255,255,255,31
; on the Glass face the date is print, without a window
FaceWell2=0,0,0,0
; the Glass face is chosen, or forced by the Clear look (its clear glass has no white face)
FaceGlassDayNight=0
FaceGlassGlass=1
ClearGlassRegular=0
ClearGlassClear=1
; Numerals → what shows (1 = hidden)
HideMajorAll=0
HideMajorQuarters=0
HideMajorTicks=1
HideMinorAll=0
HideMinorQuarters=1
HideMinorTicks=1
HideHourTicksAll=1
HideHourTicksQuarters=0
HideHourTicksTicks=1
HideTicksAll=1
HideTicksQuarters=1
HideTicksTicks=0
; the menu's cycles
AnalogFaceNextDayNight=Glass
AnalogFaceNextGlass=DayNight
AnalogNumeralsNextAll=Quarters
AnalogNumeralsNextQuarters=Ticks
AnalogNumeralsNextTicks=All
; the place's sun drives the face (1) or not (0), and its name for the tooltip's title
SunKnown=0
TipPlace=

; ---------------------------------------------------------------- time and angles
[MeasureTime]
; no Format: the number is the Mac's wall-clock time in seconds since 1601
Measure=Time
TimeStamp=#TestNow#

[MeasureMinute]
; changes once a minute: the minute's work
Measure=Calc
Formula=Floor(MeasureTime / 60)
OnChangeAction=[!UpdateMeasureGroup Minute][!UpdateMeterGroup Minute][!Redraw]

[MeasureHourAngle]
; every second with the seconds hand, else only on the minute
Measure=Calc
Formula=(MeasureTime % 43200) / 120
UpdateDivider=(#ShowAnalogSeconds# = 1 ? 1 : -1)
Group=Minute

[MeasureMinuteAngle]
Measure=Calc
Formula=(MeasureTime % 3600) / 10
UpdateDivider=(#ShowAnalogSeconds# = 1 ? 1 : -1)
Group=Minute

[MeasureSecondAngle]
Measure=Calc
Formula=Floor(MeasureTime % 60) * 6
Disabled=(1 - #ShowAnalogSeconds#)

; ---------------------------------------------------------------- the face: day, night or glass
[MeasureSunPlace]
; the suite's place (by default the city of the Mac's time zone); worked out on the Mac, never the network
Measure=Plugin
Plugin=MacSun
Location=#Location#
Type=Place
UpdateDivider=-1
Group=Minute

[MeasureSunZone]
; the place's offset from UTC now, in hours; "--" without a place
Measure=Plugin
Plugin=MacSun
Parent=MeasureSunPlace
Type=TimeZone
UnavailableText=--
IfMatch=^--$
IfMatchAction=[!SetVariable SunKnown 0]
IfNotMatchAction=[!SetVariable SunKnown 1]
UpdateDivider=-1
Group=Minute

[MeasureIsDaylight]
; 1 while the sun is up at the place
Measure=Plugin
Plugin=MacSun
Parent=MeasureSunPlace
Type=IsDaylight
UpdateDivider=-1
Group=Minute

[MeasureLocalZone]
; the Mac's offset from UTC now, in hours (the coordinate is only there because MacSun needs one; TimeZone=Local
; makes the zone the Mac's)
Measure=Plugin
Plugin=MacSun
Location=0,0
TimeZone=Local
Type=TimeZone
UpdateDivider=-1
Group=Minute

[MeasureSunUsable]
; 1 when there is a place and it keeps the Mac's time; a place in another zone would put its sunset on these hands
Measure=Calc
Formula=#SunKnown# * (Abs(MeasureSunZone - MeasureLocalZone) < 0.1)
IfCondition=MeasureSunUsable = 1
IfTrueAction=[!SetVariable TipPlace "[MeasureSunPlace]"]
IfFalseAction=[!SetVariable TipPlace ""]
DynamicVariables=1
UpdateDivider=-1
Group=Minute

[MeasureHourOfDay]
Measure=Calc
Formula=Floor((MeasureTime % 86400) / 3600)
UpdateDivider=-1
Group=Minute

[MeasureFaceMode]
; 2 glass (chosen, or the Clear look); else 1 by day and 0 by night: the sun at the place, or 07:00 to 19:00
Measure=Calc
Formula=([#FaceGlass[#AnalogFace]] + [#ClearGlass[#Glass]]) > 0 ? 2 : (MeasureSunUsable = 1 ? MeasureIsDaylight : ((MeasureHourOfDay >= 7) && (MeasureHourOfDay < 19)))
IfCondition=MeasureFaceMode = 1
IfTrueAction=[!SetVariable FaceMode 1][!UpdateMeterGroup Face][!Redraw]
IfCondition2=MeasureFaceMode = 0
IfTrueAction2=[!SetVariable FaceMode 0][!UpdateMeterGroup Face][!Redraw]
IfCondition3=MeasureFaceMode = 2
IfTrueAction3=[!SetVariable FaceMode 2][!UpdateMeterGroup Face][!Redraw]
UpdateDivider=-1
Group=Minute

; ---------------------------------------------------------------- the date window and the card's sentence
[MeasureDateWindow]
Measure=Time
TimeStamp=#TestNow#
Format=#AnalogDateWindowFormat#
FormatLocale=#Locale#
UpdateDivider=-1
Group=Minute

[MeasureTipTime]
; "10:09" or "10:09 AM"
Measure=Time
TimeStamp=#TestNow#
Format=[#CaptionTime[#Hours]]
FormatLocale=#Locale#
UpdateDivider=-1
Group=Minute

[MeasureTipDate]
Measure=Time
TimeStamp=#TestNow#
Format=#DateFormatFull#
FormatLocale=#Locale#
UpdateDivider=-1
Group=Minute

[MeasureTipZone]
; the zone's name in the Mac's language ("Central European Summer Time")
Measure=Time
TimeStamp=#TestNow#
Format=%Z
UpdateDivider=-1
Group=Minute

[MeasureTipOffset]
; "+0200" → "UTC+2", "+0530" → "UTC+5:30", "-0330" → "UTC−3:30", "+0000" → "UTC"
Measure=Time
TimeStamp=#TestNow#
Format=%z
RegExpSubstitute=1
Substitute="^\+0000$":"UTC","^([+-])0?(\d{1,2})00$":"UTC\1\2","^([+-])0?(\d{1,2})(\d\d)$":"UTC\1\2:\3","-":"−"
UpdateDivider=-1
Group=Minute

; ---------------------------------------------------------------- meters
[MeterCard]
Meter=Shape
MeterStyle=sCard
ToolTipTitle=#TipPlace#
ToolTipText=#AnalogTip#
Group=Minute
UpdateDivider=-1

[MeterFace]
; Ø 146, 12 in from every edge of the card
Meter=Shape
Shape=Ellipse 85,85,73 | Fill Color [#FaceFill[#FaceMode]] | StrokeWidth 0
DynamicVariables=1
UpdateDivider=-1
Group=Face

[MeterHourTicks]
; Numerals: Quarters. Ticks 2 wide on 1, 2, 4, 5, 7, 8, 10 and 11 (r 50.5 → 57.5): one dashed circle whose pattern
; (a tick, 30°, a tick, 60°) repeats every quarter; the path starts at 3 o'clock
Meter=Shape
Shape=Ellipse 85,85,54 | Fill Color 0,0,0,0 | StrokeWidth 7 | Stroke Color [#FaceInk[#FaceMode]],[#FaceSecondary[#FaceMode]] | StrokeDashes 0.285714,3.753476,0.285714,7.792667 | StrokeDashOffset 8.221238
Hidden=[#HideHourTicks[#AnalogNumerals]]
DynamicVariables=1
UpdateDivider=-1
Group=Face

[MeterTicks]
; Numerals: Ticks. 12 hour ticks 1.6 wide (r 56 → 61), and 4 quarter ticks 2.6 wide (r 52 → 61) over them
Meter=Shape
Shape=Ellipse 85,85,58.5 | Fill Color 0,0,0,0 | StrokeWidth 5 | Stroke Color [#FaceInk[#FaceMode]],[#FaceSecondary[#FaceMode]] | StrokeDashes 0.32,5.806106 | StrokeDashOffset 0.16
Shape2=Ellipse 85,85,56.5 | Fill Color 0,0,0,0 | StrokeWidth 9 | Stroke Color [#FaceInk[#FaceMode]],[#FacePrimary[#FaceMode]] | StrokeDashes 0.288889,9.572221 | StrokeDashOffset 0.144444
Hidden=[#HideTicks[#AnalogNumerals]]
DynamicVariables=1
UpdateDivider=-1
Group=Face

[sNumeralMajor]
; 12, 3, 6 and 9 in the hands' ink. The dial's numerals never change, so they take proportional figures, which keep
; "10" and "11" clear of the minute hand
InlineSetting=Typography | pnum
StringAlign=Center
FontColor=[#FaceInk[#FaceMode]],[#FacePrimary[#FaceMode]]
Hidden=[#HideMajor[#AnalogNumerals]]
DynamicVariables=1
UpdateDivider=-1
Group=Face

[sNumeralMinor]
InlineSetting=Typography | pnum
StringAlign=Center
FontColor=[#FaceInk[#FaceMode]],[#FaceSecondary[#FaceMode]]
Hidden=[#HideMinor[#AnalogNumerals]]
DynamicVariables=1
UpdateDivider=-1
Group=Face

; 13 pt, centred on r 54 (10 on r 55.5 and 11 on r 55, optical nudges away from the minute hand); by cap height:
; Y = centre + 4.58 − 12.57
[MeterNumeral12]
Meter=String
MeterStyle=sValue | sNumeralMajor
X=85
Y=23.01
Text=12

[MeterNumeral1]
Meter=String
MeterStyle=sValue | sNumeralMinor
X=112
Y=30.25
Text=1

[MeterNumeral2]
Meter=String
MeterStyle=sValue | sNumeralMinor
X=131.77
Y=50.01
Text=2

[MeterNumeral3]
Meter=String
MeterStyle=sValue | sNumeralMajor
X=139
Y=77.01
Text=3

[MeterNumeral4]
Meter=String
MeterStyle=sValue | sNumeralMinor
X=131.77
Y=104.01
Text=4

[MeterNumeral5]
Meter=String
MeterStyle=sValue | sNumeralMinor
X=112
Y=123.78
Text=5

[MeterNumeral6]
Meter=String
MeterStyle=sValue | sNumeralMajor
X=85
Y=131.01
Text=6

[MeterNumeral7]
Meter=String
MeterStyle=sValue | sNumeralMinor
X=58
Y=123.78
Text=7

[MeterNumeral8]
Meter=String
MeterStyle=sValue | sNumeralMinor
X=38.23
Y=104.01
Text=8

[MeterNumeral9]
Meter=String
MeterStyle=sValue | sNumeralMajor
X=31
Y=77.01
Text=9

[MeterNumeral10]
Meter=String
MeterStyle=sValue | sNumeralMinor
X=36.94
Y=49.26
Text=10

[MeterNumeral11]
Meter=String
MeterStyle=sValue | sNumeralMinor
X=57.5
Y=29.38
Text=11

[MeterDateWell]
; the window under 12: 50 × 15, centred on (85, 56); none on the Glass face, where the date is print
Meter=Shape
Shape=Rectangle 60,48.5,50,15,7.5 | Fill Color [#FaceWell[#FaceMode]] | StrokeWidth 0
Hidden=(1 - #ShowAnalogDate#)
DynamicVariables=1
UpdateDivider=-1
Group=Face

[MeterDate]
; "SAT 26": dial print (9 pt; the tooltip has the date), the weekday in the text-safe accent and the day in the
; face's primary ink; centred in the window (baseline 59.17)
Meter=String
MeterStyle=sMicro
MeasureName=MeasureDateWindow
StringAlign=Center
X=85
Y=50.47
W=44
ClipString=1
FontColor=[#FaceAccent[#FaceMode]]
InlineSetting7=Color | [#FaceInk[#FaceMode]],[#FacePrimary[#FaceMode]]
InlinePattern7=#DigitRun#
Hidden=(1 - #ShowAnalogDate#)
DynamicVariables=1
UpdateDivider=-1
Group=Minute | Face

[MeterHands]
; hour 4.5 × 33.1 and minute 3 × 45.5, tails half their width, turning about the dial's centre
Meter=Shape
Shape=Rectangle 82.75,51.9,4.5,35.35,2.25 | Rotate [MeasureHourAngle:],2.25,33.1 | Fill Color [#FaceInk[#FaceMode]],[#FacePrimary[#FaceMode]] | StrokeWidth 0
Shape2=Rectangle 83.5,39.5,3,47,1.5 | Rotate [MeasureMinuteAngle:],1.5,45.5 | Fill Color [#FaceInk[#FaceMode]],[#FacePrimary[#FaceMode]] | StrokeWidth 0
DynamicVariables=1
UpdateDivider=(#ShowAnalogSeconds# = 1 ? 1 : -1)
Group=Minute | Face

[MeterCap]
; without the seconds hand the cap is the hands' ink
Meter=Shape
Shape=Ellipse 85,85,3 | Fill Color [#FaceInk[#FaceMode]],[#FacePrimary[#FaceMode]] | StrokeWidth 0
Hidden=#ShowAnalogSeconds#
DynamicVariables=1
UpdateDivider=-1
Group=Face

[MeterSecondHand]
; 1.2 × 55.2 and the centre dot, in the clock hands' orange
Meter=Shape
Shape=Rectangle 84.4,29.8,1.2,55.8,0.6 | Rotate [MeasureSecondAngle:],0.6,55.2 | Fill Color #ClockHandColor# | StrokeWidth 0
Shape2=Ellipse 85,85,3 | Fill Color #ClockHandColor# | StrokeWidth 0
Hidden=(1 - #ShowAnalogSeconds#)
DynamicVariables=1
