; Stationery · To Do, medium (360 × 170): a to-do list that stays on this Mac. It shows the six newest open items in
; two columns, filled column by column, and New Item. Original work, MIT licensed.
;
; The list is kept in Stationery.inc, in Deskset's settings folder, so updates of the widgets never touch it. The
; measures are in @Resources/ToDo/List.inc and the rows in Rows.inc, the same for every size; this file places them.

[Rainmeter]
; nothing here changes with time: the skin updates once, then only when it is used
Update=-1
AccurateText=1
SkinWidth=360
SkinHeight=170
DynamicWindowSize=0
Group=Stationery
; the window's own look, once Deskset reads it (until then it is macOS's)
MacAppearance=#LookAppearance#
; the arrow over the card and the circles, like Apple's widgets; the text rows and New Item set their own
MouseActionCursor=0
OnRefreshAction=[!CommandMeasure MeasureStationeryFile "Run"]
; scrolling moves the window a row (a column in the Medium); leaving the card brings the list back to the top.
; While an edit box is open the list stays put
MouseScrollDownAction=[!SetVariable Offset "([#Editing] + [#Adding] > 0 ? [#Offset] : Min([#Offset] + #ScrollStep#, MeasureMaxOffset))"][!UpdateMeasure MeasureRelayoutIfIdle]
MouseScrollUpAction=[!SetVariable Offset "([#Editing] + [#Adding] > 0 ? [#Offset] : Max([#Offset] - #ScrollStep#, 0))"][!UpdateMeasure MeasureRelayoutIfIdle]
MouseLeaveAction=[!SetVariable Offset "([#Editing] + [#Adding] > 0 ? [#Offset] : 0)"][!SetVariable PadShown 0][!UpdateMeter MeterCheckPad][!Redraw][!UpdateMeasure MeasureRelayoutIfIdle]
ContextTitle=[#ToDoMenuCompleted[#ToDoShowCompleted]]
ContextAction=[!SetVariable ToDoShowCompleted "(1 - [#ToDoShowCompleted])"][!WriteKeyValue Variables ToDoShowCompleted [#ToDoShowCompleted] "#@#Variables.inc"][!SetVariable Offset 0]#Relayout#
ContextTitle2=#ToDoMenuClear#
ContextAction2=[!SetVariable Clearing 1][!UpdateMeasureGroup List][!SetVariable Clearing 0]#Relayout#
ContextTitle3=#ToDoMenuEditAsText#
ContextAction3=["#CONFIGEDITOR#" "#StationeryFile#"]
ContextTitle4=---
ContextTitle5=#MenuLookTitle#
ContextAction5=#MenuLookAction#
ContextTitle6=#MenuCardsTitle#
ContextAction6=#MenuCardsAction#

[Metadata]
Name=To Do
Author=Deskset
License=MIT
Version=1.0
Information=Stationery · A short to-do list that stays on this Mac, in Deskset's settings folder (Stationery.inc); it does not sync with Reminders or iCloud. Click a circle to check an item off. Click an item to edit it; clear its text to delete it. New Item adds one at the top. The list holds 12 items; when there is no room, a new item replaces the oldest completed one. Scroll, or click "+N more", to see the items that do not fit.

[Variables]
; this widget's menu choice (Completed Items: Hidden 0, Shown 1): the menu writes it into Variables.inc, which is
; read next and wins
ToDoShowCompleted=0
@Include=#@#Variables.inc
@Include2=#@#Suite/Tokens.inc
@Include3=#@#Suite/Styles.inc
@Include4=#@#ToDo/Strings-#Language#.inc
@Include5=#@#ToDo/Defaults.inc
@Include6=#StationeryFile#
@Include7=#@#ToDo/List.inc
CardW=360
CardH=170
; the size: rows shown, rows per column, their pitch; the text and edit pad widths (first and second column); a
; row's hit box below its line; a circle's hit padding above and below; rows per scroll step; the add row's
; baseline and the add box's width
Cap=6
Rows=3
Pitch=31
TextW=127
TextW2=143
PadW=164
PadW2=184
RowPadBottom=7
CheckPadV=6.5
ScrollStep=3
AddBaseline=151
AddFieldW=311

[MeterCard]
; a tool: the card itself does nothing on click; its tooltip is the widget's sentence
Meter=Shape
MeterStyle=sCard
ToolTipTitle=#ToDoTitle#
ToolTipText=#ToDoTipCard#
UpdateDivider=-1
Group=Items

[MeterHeaderSymbol]
; checklist, 11 pt semibold in the accent colour (a tool without a data colour), natural 16 × 14, centred on the
; leading slot (26, 23)
Meter=Image
MeterStyle=sSymbolS
ImageName=sf:checklist
ImageTint=#AccentColor#
X=(#SlotCenterX# - 8)
Y=(#BandCenterY# - 7)
W=16
H=14
UpdateDivider=-1

[MeterHeaderTitle]
; "To Do", clipped before the count
Meter=String
MeterStyle=sLabel | sHeaderTitle
Text=#ToDoTitle#
W=243
UpdateDivider=-1

[MeterHeaderTrailing]
; "8 left"; nothing when nothing is open
Meter=String
MeterStyle=sCaption | sHeaderTrailing
Text=#ToDoLeft#
Hidden=([&MeasureOpen:0] = 0)
DynamicVariables=1
UpdateDivider=-1
Group=Items

[MeterEmpty]
; "Nothing to do", or "All done" when only completed (hidden) items are left; centred on baseline 89
Meter=String
MeterStyle=sBody
Text=[#ToDoEmpty[&MeasureEmptyKind:0]]
StringAlign=Center
X=(#CardW# / 2)
Y=(89 - #Ascent13#)
Hidden=([&MeasureEmptyKind:0] = 0)
DynamicVariables=1
UpdateDivider=-1
Group=Items

[MeterEditPad]
; under the row being edited (circle included), or the add row while adding: 26 tall, radius 8, from x 8 (168 in the
; Medium's second column)
Meter=Shape
Shape=Rectangle 0,0,(#Adding# ? (#CardW# - 16) : ([&MeasureRow[#EditSlot]:0] >= #Rows# ? #PadW2# : #PadW#)),26,8 | Fill Color #EditPadColor# | StrokeWidth 0
X=(#Adding# ? 8 : ([&MeasureRow[#EditSlot]:0] >= #Rows# ? 168 : 8))
Y=(#Adding# ? (#AddBaseline# - 17.6) : (58 + #Pitch# * ([&MeasureRow[#EditSlot]:0] % #Rows#) - 17.6))
Hidden=((#Editing# = 0) && (#Adding# = 0))
DynamicVariables=1
UpdateDivider=-1
Group=Items

[MeterCheckPad]
; the disc under the circle the pointer is on (one for all slots): HoverColor, PressedColor while pressed; centred on
; the circle (its hit box's X + 15, Y + CheckPadV + 8.5)
Meter=Shape
Shape=Ellipse 13,13,13 | Fill Color [#PadFill[#PadPressed]] | StrokeWidth 0
X=([MeterCheck[#HoverSlot]:X] + 2)
Y=([MeterCheck[#HoverSlot]:Y] + #CheckPadV# - 4.5)
Hidden=(#PadShown# = 0)
DynamicVariables=1
UpdateDivider=-1
Group=Items

[Rows]
; the twelve rows (two columns of three rows, at a pitch of 31) are drawn here
@Include=#@#ToDo/Rows.inc

[MeterAddPad]
; New Item under the pointer
Meter=Shape
Shape=Rectangle 0,0,94,26,8 | Fill Color #HoverColor# | StrokeWidth 0
X=10
Y=(#AddBaseline# - 17.6)
Hidden=1
UpdateDivider=-1

[MeterAddSymbol]
; plus, 13 pt semibold (14 × 13), centred on (26, the add row's baseline − 4.6); faint when the list is full
Meter=Image
MeterStyle=sSymbolM
ImageName=sf:plus
ImageTint=[#AddTint[&MeasureFull:0]]
X=(#SlotCenterX# - 7)
Y=(#AddBaseline# - 4.6 - 6.5)
W=14
H=13
DynamicVariables=1
UpdateDivider=-1
Group=Items

[MeterAddLabel]
; "New Item", a row-level action in the row's type; its hit box runs from x 10 (the plus) to the label's end + 4 and
; stops before "+N more"
Meter=String
MeterStyle=sBody
Text=#ToDoNewItem#
FontColor=#AccentTextColor#
X=10
Y=(#AddBaseline# - 8 - #Ascent13#)
Padding=31,8,4,7
SolidColor=0,0,0,1
Hidden=((#Adding# = 1) || ([&MeasureFull:0] = 1))
MouseActionCursor=1
ToolTipText=#ToDoTipAdd#
MouseOverAction=[!ShowMeter MeterAddPad][!Redraw]
MouseLeaveAction=[!HideMeter MeterAddPad][!Redraw]
LeftMouseUpAction=[!HideMeter MeterAddPad][!SetVariable EditSlot [&MeasureFree:0]][!SetVariable Adding 1][!UpdateMeterGroup Items][!Redraw][!CommandMeasure MeasureInput "ExecuteBatch 2"]
DynamicVariables=1
UpdateDivider=-1
Group=Items

[MeterFullLabel]
; 12 open items: "List Full" in Tertiary instead of New Item
Meter=String
MeterStyle=sBody
Text=#ToDoListFull#
FontColor=#TertiaryTextColor#
X=#SlotTextX#
Y=(#AddBaseline# - #Ascent13#)
Hidden=([&MeasureFull:0] = 0)
ToolTipText=#ToDoTipFull#
DynamicVariables=1
UpdateDivider=-1
Group=Items

[MeterMorePad]
; "+N more" under the pointer
Meter=Shape
Shape=Rectangle 0,0,[MeterMore:W],20,8 | Fill Color #HoverColor# | StrokeWidth 0
X=[MeterMore:X]
Y=(#AddBaseline# - 13.9)
Hidden=1
DynamicVariables=1
UpdateDivider=-1

[MeterMore]
; "+5 more": open items the window does not show; a click shows the next page, and at the end the top again. The
; text ends at the card's padding (its hit box reaches 4 beyond)
Meter=String
MeterStyle=sCaption
Text=#ToDoMore#
FontColor=#TertiaryTextColor#
StringAlign=Right
X=(#CardW# - 12)
Y=(#AddBaseline# - 8 - #Ascent11#)
Padding=4,8,4,8
SolidColor=0,0,0,1
Hidden=(([&MeasureMore:0] = 0) || (#Adding# = 1))
ToolTipText=[#ToDoTipMore[&MeasureAtEnd:0]]
MouseOverAction=[!UpdateMeter MeterMorePad][!ShowMeter MeterMorePad][!Redraw]
MouseLeaveAction=[!HideMeter MeterMorePad][!Redraw]
LeftMouseUpAction=[!SetVariable Offset "([#Offset] >= MeasureMaxOffset ? 0 : Min([#Offset] + #Cap#, MeasureMaxOffset))"]#Relayout#
DynamicVariables=1
UpdateDivider=-1
Group=Items
