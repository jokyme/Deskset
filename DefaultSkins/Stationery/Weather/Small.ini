; Stationery · Weather, small (170 × 170): the temperature, the condition and today's high and low for one place.
; Original work, MIT licensed. The parts every size shares are in @Resources/Weather.

[Rainmeter]
Update=1000
; weather changes slowly: everything updates once a minute, and at once when MacWeather has news (FinishAction)
DefaultUpdateDivider=60
AccurateText=1
SkinWidth=170
SkinHeight=170
DynamicWindowSize=0
Group=Stationery
; the window's own look, once Deskset reads it (until then it is macOS's)
MacAppearance=#LookAppearance#
ContextTitle=#WeatherMenuOpen#
ContextAction=#OpenAction#
ContextTitle2=---
ContextTitle3=#WeatherMenuLocation#
ContextAction3=#WxOpenCityField#
; with Location=auto, MeasureLocationKind turns this into "Stop Using My Location" (back to LastCity)
ContextTitle4=#WeatherMenuUseMyLocation#
ContextAction4=[!WriteKeyValue Variables LastCity "#Location#" "#@#Variables.inc"][!WriteKeyValue Variables Location auto "#@#Variables.inc"][!WriteKeyValue Variables LocationConfirmed 1 "#@#Variables.inc"][!RefreshGroup Stationery]
ContextTitle5=#MenuTempTitle#
ContextAction5=#MenuTempAction#
ContextTitle6=#WeatherMenuRefresh#
ContextAction6=[!CommandMeasure MeasureWx "Refresh"]
ContextTitle7=---
ContextTitle8=#MenuLookTitle#
ContextAction8=#MenuLookAction#
ContextTitle9=#MenuCardsTitle#
ContextAction9=#MenuCardsAction#
ContextTitle10=#MenuLanguageTitle#
ContextAction10=#MenuLanguageAction#

[Metadata]
Name=Weather
Author=Deskset
License=MIT
Version=1.0
Information=Stationery · The weather for one place: now, the next six hours and (Large) six days. Pick a city, or use this Mac's location. Based on data from MET Norway (CC BY 4.0).

[Variables]
; the weather's own settings first, so the values the menus wrote into Variables.inc win
@IncludeDefaults=#@#Weather/Settings.inc
@Include=#@#Variables.inc
@Include2=#@#Suite/Tokens.inc
@Include3=#@#Suite/Styles.inc
@Include4=#@#Weather/Strings-#Language#.inc
@Include5=#@#Weather/Vars.inc
@Include6=#@#Weather/Core.inc
CardW=170
CardH=170
OpenAction=["/System/Applications/Weather.app"]

; ---------------------------------------------------------------- meters
[MeterCard]
Meter=Shape
MeterStyle=sCard
ToolTipTitle=[MeasureWxPlace]
ToolTipText=[MeasureWxTip]
Group=Weather
@IncludeHeader=#@#Weather/Header.inc
@IncludeLeft=#@#Weather/Left.inc

[MeterCredit]
; the data credit on the attribution strip (baseline 161), centred; it opens MET Norway's page. The padding above
; makes it an easy target without moving the text; below and at the sides the target stops inside the card's corners
Meter=String
MeterStyle=sFineprint | sCreditSmall
Text=#WeatherCredit#
Y=(#CardH# - 18 - #Ascent9#)
Padding=0,9,0,3
SolidColor=0,0,0,1
LeftMouseUpAction=["[MeasureWxAttributionURL]"]
ToolTipText=#WeatherCreditTip#
Hidden=([MeasureWxMode:] = 2)
DynamicVariables=1
Group=Weather

[MeterPromptS]
; first run: "Not your city? Change…" on the high/low line (the Small's header has no room). It comes after the credit,
; so where their targets overlap, between the two lines, the click goes to the city field
Meter=String
MeterStyle=sCaption
Text=#WeatherNotYourCity# #WeatherChange#
InlineSetting7=Color | #AccentTextColor#
InlinePattern7=#WeatherChange#
X=16
Y=(145 - #Ascent11# - 7)
W=138
Padding=0,7,0,7
ClipString=1
SolidColor=0,0,0,1
LeftMouseUpAction=#WxOpenCityField#
ToolTipText=#WeatherPromptTip#
Hidden=([MeasureWxPrompt:] = 0)
DynamicVariables=1
Group=Weather

; ---------------------------------------------------------------- the notice: a centred column (no header)
[MeterNoticeHitCity]
; the whole card is the notice's action: one invisible target per kind of action, in the card's shape, so the
; space beyond its round corners stays the desktop's
Meter=Shape
Shape=Rectangle 0,0,#CardW#,#CardH#,#CardRadius# | Fill Color 0,0,0,1 | StrokeWidth 0
LeftMouseUpAction=#WxOpenCityField#
Hidden=([MeasureWxNoticeKind:] <> 1)
DynamicVariables=1
Group=Weather

[MeterNoticeHitPrivacy]
Meter=Shape
Shape=Rectangle 0,0,#CardW#,#CardH#,#CardRadius# | Fill Color 0,0,0,1 | StrokeWidth 0
LeftMouseUpAction=#WxOpenPrivacySettings#
Hidden=([MeasureWxNoticeKind:] <> 2)
DynamicVariables=1
Group=Weather

[MeterNoticeSymbol]
; 20 pt at its natural size, centred on (85, 48)
Meter=Image
MeterStyle=sNoticeSymbol
ImageName=sf:[#WxNoticeSymbol[&MeasureWxStatus:]]
X=(85 - [#WxNoticeSymbolW[&MeasureWxStatus:]] / 2)
Y=(48 - [#WxNoticeSymbolH[&MeasureWxStatus:]] / 2)
W=[#WxNoticeSymbolW[&MeasureWxStatus:]]
H=[#WxNoticeSymbolH[&MeasureWxStatus:]]
Hidden=([MeasureWxMode:] <> 2)
DynamicVariables=1
Group=Weather

[MeterNoticeTitle]
Meter=String
MeterStyle=sBodyStrong | sNoticeTitleSmall
Text=[#WeatherNoticeTitle[&MeasureWxStatus:]]
Hidden=([MeasureWxMode:] <> 2)
DynamicVariables=1
Group=Weather

[MeterNoticeBody]
Meter=String
MeterStyle=sCaption | sNoticeBodySmall
Text=[#WeatherNoticeBody[&MeasureWxStatus:]]
Hidden=([MeasureWxMode:] <> 2)
DynamicVariables=1
Group=Weather

[MeterNoticeAction]
Meter=String
MeterStyle=sLabel | sNoticeActionSmall
Text=[#WeatherNoticeAction[&MeasureWxStatus:]]
Hidden=([MeasureWxMode:] <> 2)
DynamicVariables=1
Group=Weather
