; Stationery · Launcher, medium (360 × 170): eight items in a 4 × 2 grid with their labels. Original work, MIT
; licensed.
;
; The items are kept in Stationery.inc, in Deskset's settings folder (defaults in @Resources/Launcher/Defaults.inc).
; Each item's measures are in @Resources/Launcher/Item<k>.inc; clicks and menus go through one dispatcher
; (MeasureAct, in Actions.inc).

[Rainmeter]
Update=1000
AccurateText=1
SkinWidth=360
SkinHeight=170
DynamicWindowSize=0
Group=Stationery
; the window's own look, once Deskset reads it (until then it is macOS's)
MacAppearance=#LookAppearance#
; Stationery.inc again if it was deleted since Deskset started
OnRefreshAction=[!CommandMeasure MeasureStationeryFile "Run"]
; the card's menu while MenuKind is the card's kind; a tile's own menu while its right-click runs !SkinCustomMenu
ContextTitle=[#LaunchMenu1_[#MenuKind]]
ContextAction=[!SetVariable FiredCell #MenuCell#][!SetVariable FiredKind #MenuKind#][!SetVariable FiredAct 1][!SetVariable Fired 1][!UpdateMeasure MeasureAct][!SetVariable Fired 0]
ContextTitle2=[#LaunchMenu2_[#MenuKind]]
ContextAction2=[!SetVariable FiredCell #MenuCell#][!SetVariable FiredKind #MenuKind#][!SetVariable FiredAct 2][!SetVariable Fired 1][!UpdateMeasure MeasureAct][!SetVariable Fired 0]
ContextTitle3=[#LaunchMenu3_[#MenuKind]]
ContextAction3=[!SetVariable FiredCell #MenuCell#][!SetVariable FiredKind #MenuKind#][!SetVariable FiredAct 3][!SetVariable Fired 1][!UpdateMeasure MeasureAct][!SetVariable Fired 0]
ContextTitle4=[#LaunchMenu4_[#MenuKind]]
ContextAction4=[!SetVariable FiredCell #MenuCell#][!SetVariable FiredKind #MenuKind#][!SetVariable FiredAct 4][!SetVariable Fired 1][!UpdateMeasure MeasureAct][!SetVariable Fired 0]
ContextTitle5=[#LaunchMenu5_[#MenuKind]]
ContextAction5=[!SetVariable FiredCell #MenuCell#][!SetVariable FiredKind #MenuKind#][!SetVariable FiredAct 5][!SetVariable Fired 1][!UpdateMeasure MeasureAct][!SetVariable Fired 0]
ContextTitle6=[#LaunchMenu6_[#MenuKind]]
ContextAction6=[!SetVariable FiredCell #MenuCell#][!SetVariable FiredKind #MenuKind#][!SetVariable FiredAct 6][!SetVariable Fired 1][!UpdateMeasure MeasureAct][!SetVariable Fired 0]

[Metadata]
Name=Launcher
Author=Deskset
License=MIT
Version=1.0
Information=Stationery · The Mac things you reach for, on the desktop: apps, folders, files, links, shortcuts and the Trash. Right-click a tile to change, rename or remove it; Edit Items as Text… in the card's menu opens the list. Lock Screen and Do Not Disturb are shortcuts in the Shortcuts app. "Empty Trash…" asks once to control Finder.

[Variables]
; this widget's menu choice (Labels: On 1, Off 0): the menu writes it into Variables.inc, which is read next
; and wins
LaunchShowLabels=1
@Include=#@#Variables.inc
@Include2=#@#Suite/Tokens.inc
@Include3=#@#Suite/Styles.inc
@Include4=#@#Launcher/Strings-#Language#.inc
@Include5=#@#Launcher/Tiles.inc
@Include6=#@#Launcher/Defaults.inc
@Include7=#StationeryFile#
; each item's measures, in cell order, then the shared ones
@Include8=#@#Launcher/Item1.inc
@Include9=#@#Launcher/Item2.inc
@Include10=#@#Launcher/Item3.inc
@Include11=#@#Launcher/Item4.inc
@Include12=#@#Launcher/Item5.inc
@Include13=#@#Launcher/Item6.inc
@Include14=#@#Launcher/Item7.inc
@Include15=#@#Launcher/Item8.inc
@Include16=#@#Launcher/Actions.inc
CardW=360
CardH=170
; the card's kind in the dispatcher and the menus (8 Small, 9 Medium); the menu's cell (0: the card)
CardKind=9
MenuKind=9
MenuCell=0
Launch0Kind=9
; the edit field: its width, the last cell of the first row, the two rows' Y
EditW=328
EditRowSplit=4
EditY1=(#LaunchShowLabels# ? 59.6 : 38.5)
EditY2=(#LaunchShowLabels# ? 128.6 : 107.5)

[MeterCard]
; a tool: the card itself opens nothing (its items do)
Meter=Shape
MeterStyle=sCard
UpdateDivider=-1

[MeterCell1Pad]
; the cell: its hit box (alpha 1 at rest), the hover pad, the tooltip, the click, the tile's own menu (a missing
; item gets kind 5's), and drops once Deskset takes them (a 2 pt accent ring while a drag is over it). No press
; state: Deskset starts no window drag where a LeftMouseDownAction is set, and the tiles cover most of the card
Meter=Shape
Shape=Rectangle (#LaunchShowLabels# ? 18 : 27),(#LaunchShowLabels# ? 17.5 : 20.5),(#LaunchShowLabels# ? 78 : 60),(#LaunchShowLabels# ? 66 : 60),14 | Fill Color #Cell1PadColor# | StrokeWidth 0
Shape2=Rectangle (#LaunchShowLabels# ? 19 : 28),(#LaunchShowLabels# ? 18.5 : 21.5),(#LaunchShowLabels# ? 76 : 58),(#LaunchShowLabels# ? 64 : 58),13 | Fill Color 0,0,0,0 | StrokeWidth (#Cell1Drop# * 2) | Stroke Color #AccentColor#
ToolTipTitle=[MeasureLaunch1Label]
ToolTipText=[MeasureLaunch1Tip]
MouseOverAction=[!SetVariable Cell1PadColor "#HoverColor#"][!SetVariable Cell1Hover 1][!UpdateMeterGroup Cell1][!Redraw]
MouseLeaveAction=[!SetVariable Cell1PadColor "0,0,0,1"][!SetVariable Cell1Hover 0][!UpdateMeterGroup Cell1][!Redraw]
LeftMouseUpAction=[!SetVariable FiredCell 1][!SetVariable FiredKind [#Launch1Kind]][!SetVariable FiredAct 1][!SetVariable Fired 1][!UpdateMeasure MeasureAct][!SetVariable Fired 0]
RightMouseUpAction=[!SetVariable MenuKind "([#Launch1Missing] ? 5 : [#Launch1Kind])"][!SetVariable MenuCell 1][!SkinCustomMenu][!SetVariable MenuKind #CardKind#][!SetVariable MenuCell 0]
MacDragEnterAction=[!SetVariable Cell1Drop 1][!SetVariable Cell1PadColor "#HoverColor#"][!UpdateMeterGroup Cell1][!Redraw]
MacDragExitAction=[!SetVariable Cell1Drop 0][!SetVariable Cell1PadColor "0,0,0,1"][!UpdateMeterGroup Cell1][!Redraw]
MacDropAction=[!SetVariable Cell1Drop 0][!SetVariable Cell1PadColor "0,0,0,1"][!SetVariable DropItem "$DroppedPath$"][!SetVariable FiredCell 1][!SetVariable FiredKind [#Launch1Kind]][!SetVariable FiredAct 7][!SetVariable Fired 1][!UpdateMeasure MeasureAct][!SetVariable Fired 0]
DynamicVariables=1
UpdateDivider=-1
Group=Cell1 | Cells

[MeterCell1Icon]
; an app, folder or file (or a symbolic link or Finder alias to one): its Finder icon, in colour in every look
Meter=Image
ImageName=[MeasureLaunch1Icon]
X=(#LaunchShowLabels# ? 37 : 33)
Y=(#LaunchShowLabels# ? 22 : 26.5)
W=(#LaunchShowLabels# ? 40 : 48)
H=(#LaunchShowLabels# ? 40 : 48)
Hidden=((#Launch1Kind# <> 1) || (#Launch1Missing# = 1))
DynamicVariables=1
UpdateDivider=-1
Group=Cell1

[MeterCell1Trash]
; the Trash, empty or full
Meter=Image
ImageName=#TrashIcon#
X=(#LaunchShowLabels# ? 37 : 33)
Y=(#LaunchShowLabels# ? 22 : 26.5)
W=(#LaunchShowLabels# ? 40 : 48)
H=(#LaunchShowLabels# ? 40 : 48)
Hidden=(#Launch1Kind# <> 3)
DynamicVariables=1
UpdateDivider=-1
Group=Cell1 | Trash

[MeterCell1Tile]
; a link or a shortcut: a tile the size of an app icon's body (80.47 % of the icon box, corners 22.5 % of its
; side). TileFill is an option of this meter, so it follows the item's colour ([Variables] would fix it at load)
Meter=Shape
Shape=Rectangle (#LaunchShowLabels# ? 40.91 : 37.69),(#LaunchShowLabels# ? 25.91 : 31.19),(#LaunchShowLabels# ? 32.19 : 38.62),(#LaunchShowLabels# ? 32.19 : 38.62),(#LaunchShowLabels# ? 7.24 : 8.69) | Fill LinearGradient TileFill | StrokeWidth 0
TileFill=270 | [#Tile[#LaunchColorEff1]Top] ; 0.0 | [#Tile[#LaunchColorEff1]Bottom] ; 1.0
Hidden=(((#Launch1Kind# <> 2) && (#Launch1Kind# <> 4)) || (#Launch1Missing# = 1))
DynamicVariables=1
UpdateDivider=-1
Group=Cell1

[MeterCell1Glyph]
; the tile's white symbol, semibold
Meter=Image
ImageName=sf:[MeasureLaunch1Symbol]
MacSymbolSize=(#LaunchShowLabels# ? 17 : 20)
MacSymbolWeight=Semibold
ImageTint=255,255,255
PreserveAspectRatio=1
X=(#LaunchShowLabels# ? 46 : 44)
Y=(#LaunchShowLabels# ? 31 : 37.5)
W=(#LaunchShowLabels# ? 22 : 26)
H=(#LaunchShowLabels# ? 22 : 26)
Hidden=(((#Launch1Kind# <> 2) && (#Launch1Kind# <> 4)) || (#Launch1Missing# = 1))
DynamicVariables=1
UpdateDivider=-1
Group=Cell1

[MeterCell1Missing]
; an item that is not there (or not an item): a dashed app in Tertiary; its tooltip says what was not found
Meter=Image
ImageName=sf:questionmark.app.dashed
MacSymbolSize=(#LaunchShowLabels# ? 28 : 34)
MacSymbolWeight=Regular
ImageTint=#TertiaryTextColor#
X=(#LaunchShowLabels# ? 40.5 : 37.5)
Y=(#LaunchShowLabels# ? 27 : 32.5)
W=(#LaunchShowLabels# ? 33 : 39)
H=(#LaunchShowLabels# ? 30 : 36)
Hidden=(#Launch1Missing# = 0)
DynamicVariables=1
UpdateDivider=-1
Group=Cell1

[MeterCell1Empty]
; an empty cell: a dashed tile outline and a plus, Tertiary (Secondary under the pointer)
Meter=Shape
Shape=Rectangle (#LaunchShowLabels# ? 41.66 : 38.44),(#LaunchShowLabels# ? 26.66 : 31.94),(#LaunchShowLabels# ? 30.69 : 37.12),(#LaunchShowLabels# ? 30.69 : 37.12),(#LaunchShowLabels# ? 6.49 : 7.94) | Fill Color 0,0,0,0 | StrokeWidth 1.5 | Stroke Color #InkRGB#,(#Cell1Hover# ? #Alpha2# : #Alpha3#) | StrokeDashes 2,2
Hidden=(#Launch1Kind# <> 0)
DynamicVariables=1
UpdateDivider=-1
Group=Cell1

[MeterCell1Plus]
Meter=Image
ImageName=sf:plus
MacSymbolSize=(#LaunchShowLabels# ? 13 : 15)
MacSymbolWeight=Semibold
ImageTint=#InkRGB#,(#Cell1Hover# ? #Alpha2# : #Alpha3#)
X=(#LaunchShowLabels# ? 50 : 48.5)
Y=(#LaunchShowLabels# ? 35.5 : 42.5)
W=(#LaunchShowLabels# ? 14 : 17)
H=(#LaunchShowLabels# ? 13 : 16)
Hidden=(#Launch1Kind# <> 0)
DynamicVariables=1
UpdateDivider=-1
Group=Cell1

[MeterCell1Label]
; the label, centred under the icon on the cell's baseline (cell + 60), clipped at 80 ("Do Not Disturb" is 79.6);
; Tertiary when the item is missing
Meter=String
MeterStyle=sCaption
MeasureName=MeasureLaunch1Label
X=57
Y=(76 - #Ascent11#)
W=80
StringAlign=Center
ClipString=1
