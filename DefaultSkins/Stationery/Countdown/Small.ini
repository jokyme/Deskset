; Stationery · Countdown, small (170 × 170): the days to a date that matters, New Year until you choose your own.
; Original work, MIT licensed.
;
; Nothing here changes faster than the date: the skin wakes once a minute and redraws when the day changes. The day
; count is the suite's shared one (@Resources/Suite/DaysTo.inc), so every widget that counts days agrees. The event is
; saved in Stationery.inc (Deskset's settings folder).

[Rainmeter]
Update=60000
AccurateText=1
SkinWidth=170
SkinHeight=170
DynamicWindowSize=0
Group=Stationery
; the window's own look, once Deskset reads it (until then it is macOS's)
MacAppearance=#LookAppearance#
; Stationery.inc again if it was deleted since Deskset started; then the date line picks the longest date that fits,
; once the probes are laid out
OnRefreshAction=[!CommandMeasure MeasureStationeryFile "Run"]#Redo#
ContextTitle=#CountdownMenuEdit#
ContextAction=[!CommandMeasure MeasureEdit "ExecuteBatch 1-2"]
ContextTitle2=[#CountdownMenuRepeat[#CountdownYearly]]
ContextAction2=[!WriteKeyValue Variables CountdownYearly "(1 - #CountdownYearly#)" "#StationeryFile#"][!WriteKeyValue Variables CountdownDate "[MeasureEventDate]" "#StationeryFile#"][!WriteKeyValue Variables CountdownSince "[MeasureTodayISO]" "#StationeryFile#"][!Refresh]
ContextTitle3=---
ContextTitle4=#MenuLookTitle#
ContextAction4=#MenuLookAction#
ContextTitle5=#MenuCardsTitle#
ContextAction5=#MenuCardsAction#
ContextTitle6=#MenuLanguageTitle#
ContextAction6=#MenuLanguageAction#

[Metadata]
Name=Countdown
Author=Deskset
License=MIT
Version=1.0
Information=Stationery · Days to a date that matters: New Year until you choose your own event. Right-click › Edit Event… to set a name and a date (like 2027-01-01); birthdays and anniversaries can repeat every year, and a date that has passed counts up. No permission needed.

[Variables]
@Include=#@#Variables.inc
@Include2=#@#Suite/Tokens.inc
@Include3=#@#Suite/Styles.inc
@Include4=#@#Countdown/Strings-#Language#.inc
; the event: these defaults (New Year, every year), then Stationery.inc, which Edit Event… writes
CountdownName=#CountdownNewYear#
CountdownDate=2000-01-01
CountdownYearly=1
CountdownSince=2000-01-01
@Include5=#StationeryFile#
CardW=170
CardH=170
; the shared day count's inputs
DaysToDate=#CountdownDate#
DaysToYearly=#CountdownYearly#
DaysToSince=#CountdownSince#
PendingName=
PendingDate=
PendingEdits=0
; the probes first, then the fit, then the card
Redo=[!UpdateMeterGroup Probe][!UpdateMeasureGroup DateFit][!UpdateMeterGroup Face][!Redraw]
; the hero by kind: 0 today · 1 tomorrow · 2 later · 3 yesterday · 4 two or more days ago · 5 the date cannot be read.
; A past event counts up: "3 days" over "Since September 23" (the date line)
HeroText0=#CountdownToday#
HeroText1=%1#CountdownDay#
HeroText2=%1#CountdownDays#
HeroText3=%1#CountdownDay#
HeroText4=%1#CountdownDays#
HeroText5=--#CountdownDays#
Footer1=#CountdownOfYear#
Footer0=#CountdownOfWait#
@Include6=#@#Suite/DaysTo.inc

; ---------------------------------------------------------------- measures

[MeasureStationeryFile]
; Deskset makes Stationery.inc at every launch, and !WriteKeyValue writes only into a file that exists: this makes it
; again (empty) if it was deleted since
Measure=Plugin
Plugin=RunCommand
Parameter=test -e "#StationeryFile#" || : > "#StationeryFile#"
UpdateDivider=-1

[MeasureEventName]
; the name as a measure's value, so brackets in it are never read as section variables
Measure=String
String=#CountdownName#
UpdateDivider=-1

[MeasureDaysKind]
; 0 today · 1 tomorrow · 2 later · 3 yesterday · 4 two or more days ago · 5 the date cannot be read
Measure=Calc
Formula=(MeasureDTValid = 0) ? 5 : ((MeasureDaysTo = 0) ? 0 : ((MeasureDaysTo = 1) ? 1 : ((MeasureDaysTo > 1) ? 2 : ((MeasureDaysTo = -1) ? 3 : 4))))
Group=DaysTo

[MeasureDaysAbs]
; the hero's number: at most four digits, written without a group separator ("1,193 days" would be 142 wide, more than
; the 138 of the card)
Measure=Calc
Formula=Abs(MeasureDaysTo)
Group=DaysTo

[MeasureTargetStamp]
; the event's midnight on the Mac's clock, for the date texts
Measure=Calc
Formula=MeasureDTTarget * 86400
Group=DaysTo

[MeasureDateFull]
Measure=Time
TimeStamp=[MeasureTargetStamp:]
Format=#DateFormatFull#
FormatLocale=#Locale#
DynamicVariables=1
Group=DaysTo

[MeasureDateLong]
Measure=Time
TimeStamp=[MeasureTargetStamp:]
Format=#DateFormatLong#
FormatLocale=#Locale#
DynamicVariables=1
Group=DaysTo

[MeasureDateShort]
Measure=Time
TimeStamp=[MeasureTargetStamp:]
Format=#DateFormat#
FormatLocale=#Locale#
DynamicVariables=1
Group=DaysTo

[MeasureDateISO]
; the event's next date as YYYY-MM-DD
Measure=Time
TimeStamp=[MeasureTargetStamp:]
Format=%Y-%m-%d
DynamicVariables=1
Group=DaysTo

[MeasureTodayISO]
; today as YYYY-MM-DD: when a one-off wait starts
Measure=Time
TimeStamp=#TestNow#
Format=%Y-%m-%d
Group=DaysTo

[MeasureEventDate]
; the date Edit Event… starts from and "Repeat" writes: the event's next date (so New Year made a one-off counts to the
; coming 1 January), or the date as written when it cannot be read, so it can be corrected
Measure=String
String=[MeasureDaysKind:0]␟[MeasureDateISO]␟#CountdownDate#
RegExpSubstitute=1
Substitute="^5␟[^␟]*␟(.*)$":"\1","^\d␟([^␟]*)␟.*$":"\1"
DynamicVariables=1
Group=DaysTo

[MeasureLineFull]
; the date line's candidates: the three suite dates, with "Since …" once the day has passed
Measure=String
String=[MeasureDaysKind:0]|[MeasureDateFull]
RegExpSubstitute=1
Substitute="^[34]\|(.*)$":"#CountdownSinceRe#","^\d\|(.*)$":"\1"
DynamicVariables=1
Group=DaysTo

[MeasureLineLong]
Measure=String
String=[MeasureDaysKind:0]|[MeasureDateLong]
RegExpSubstitute=1
Substitute="^[34]\|(.*)$":"#CountdownSinceRe#","^\d\|(.*)$":"\1"
DynamicVariables=1
Group=DaysTo

[MeasureLineShort]
Measure=String
String=[MeasureDaysKind:0]|[MeasureDateShort]
RegExpSubstitute=1
Substitute="^[34]\|(.*)$":"#CountdownSinceRe#","^\d\|(.*)$":"\1"
DynamicVariables=1
Group=DaysTo

[MeasureDateFit]
; 1 the full line fits the 138 pt line · 2 the long one fits · 3 neither (the short one always does)
Measure=Calc
Formula=([MeterProbeFull:W] <= 138) ? 1 : (([MeterProbeLong:W] <= 138) ? 2 : 3)
DynamicVariables=1
UpdateDivider=-1
Group=DateFit

[MeasureDateChoice]
; the fit, or 4 for tomorrow ("Tomorrow, September 27") and 5 for a date that cannot be read
Measure=Calc
Formula=(MeasureDaysKind = 5) ? 5 : ((MeasureDaysKind = 1) ? 4 : MeasureDateFit)
UpdateDivider=-1
Group=DateFit

[MeasureDateLine]
Measure=String
String=[MeasureDateChoice:0]|[MeasureLineFull]|[MeasureLineLong]|[MeasureLineShort]|[MeasureDateShort]
RegExpSubstitute=1
Substitute="^1\|([^|]*)\|.*$":"\1","^2\|[^|]*\|([^|]*)\|.*$":"\1","^3\|[^|]*\|[^|]*\|([^|]*)\|.*$":"\1","^4\|.*\|([^|]*)$":"#CountdownTomorrowDateRe#","^5\|.*$":"#CountdownBadDate#"
DynamicVariables=1
UpdateDivider=-1
Group=DateFit

[MeasurePendingDate]
; Edit Event…: the typed date, read as YYYY-MM-DD (0 when it cannot be read; "2027-3-7" works too)
Measure=Time
TimeStamp=#PendingDate#
TimeStampFormat=%Y-%m-%d
DynamicVariables=1
UpdateDivider=-1
Group=Pending

[MeasurePendingISO]
; before MeasurePendingOK, whose action writes it (a group updates in file order)
Measure=Time
TimeStamp=[MeasurePendingDate:]
Format=%Y-%m-%d
DynamicVariables=1
UpdateDivider=-1
Group=Pending

[MeasurePendingOK]
; a readable date within 9,999 days saves the event ([#PendingName] is resolved after the bang is split into its
; arguments, so quotes in a name are safe); anything else opens the date field again with the text as typed
Measure=Calc
Formula=((MeasurePendingDate > 0) && (Abs(Floor(MeasurePendingDate / 86400) - MeasureDTToday) <= 9999)) ? 1 : 0
DynamicVariables=1
UpdateDivider=-1
Group=Pending
IfConditionMode=1
IfCondition=(MeasurePendingOK = 1) && (#PendingEdits# > 0)
IfTrueAction=[!WriteKeyValue Variables CountdownName "[#PendingName]" "#StationeryFile#"][!WriteKeyValue Variables CountdownDate "[MeasurePendingISO]" "#StationeryFile#"][!WriteKeyValue Variables CountdownSince "[MeasureTodayISO]" "#StationeryFile#"][!Refresh]
IfCondition2=(MeasurePendingOK = 0) && (#PendingEdits# > 0)
IfTrueAction2=[!SetVariable PendingEdits 0][!CommandMeasure MeasureEdit "ExecuteBatch 3"]

[MeasureEdit]
; Edit Event…: the name over the header title, then the date over the date line; Escape on either cancels both. The
; fill is opaque: today's input box fades its text with its fill's alpha
Measure=Plugin
Plugin=InputText
FontFace=#FontText#
FontSize=8.25
FontColor=#InkRGB#
SolidColor=#FieldColor#
FocusDismiss=1
Command1=[!SetVariable PendingName "$UserInput$"] X=38 Y=15 W=118 H=17 DefaultValue="[MeasureEventName]"
Command2=[!SetVariable PendingDate "$UserInput$"][!SetVariable PendingEdits 1][!UpdateMeasureGroup Pending] X=13 Y=89 W=144 H=17 DefaultValue="[MeasureEventDate]"
Command3=[!SetVariable PendingDate "$UserInput$"][!SetVariable PendingEdits 1][!UpdateMeasureGroup Pending] X=13 Y=89 W=144 H=17 DefaultValue="[#PendingDate]"

[MeasureTip]
; the card's sentence, from "kind␟name␟full date␟days␟percent␟yearly" (␟ keeps any | in a name from splitting it)
Measure=String
String=[MeasureDaysKind:0]␟[MeasureEventName]␟[MeasureDateFull]␟[MeasureDaysAbs:0]␟[MeasureDaysPercent:0]␟#CountdownYearly#
RegExpSubstitute=1
Substitute="^0␟([^␟]*)␟([^␟]*)␟.*$":"#CountdownTipToday#","^1␟([^␟]*)␟([^␟]*)␟.*$":"#CountdownTipTomorrow#","^2␟([^␟]*)␟([^␟]*)␟(\d+)␟(\d+)␟1$":"#CountdownTipLaterYear#","^2␟([^␟]*)␟([^␟]*)␟(\d+)␟(\d+)␟0$":"#CountdownTipLaterWait#","^3␟([^␟]*)␟([^␟]*)␟.*$":"#CountdownTipYesterday#","^4␟([^␟]*)␟([^␟]*)␟(\d+)␟.*$":"#CountdownTipAgo#","^5␟([^␟]*)␟.*$":"#CountdownTipBad#"
DynamicVariables=1
Group=DaysTo

[MeasureDayWatch]
; last of the measures, so every date text is already the new day's when the day changes
Measure=Calc
Formula=MeasureDTToday
OnChangeAction=#Redo#

; ---------------------------------------------------------------- meters

[MeterCard]
; a tool: the card itself does nothing on click
Meter=Shape
MeterStyle=sCard
ToolTipTitle=[MeasureEventName]
ToolTipText=[MeasureTip]
UpdateDivider=-1
Group=Face

[MeterProbeFull]
; probes: invisible, above the card; their W is the width of each date in the date line's style
Meter=String
MeterStyle=sCaption
MeasureName=MeasureLineFull
FontColor=0,0,0,0
X=0
Y=-40
UpdateDivider=-1
Group=Probe

[MeterProbeLong]
Meter=String
MeterStyle=sCaption
MeasureName=MeasureLineLong
FontColor=0,0,0,0
X=0
Y=-40
UpdateDivider=-1
Group=Probe

[MeterHeaderSymbol]
; hourglass, 11 pt semibold in the timer colour (natural 10 × 13), centred on the leading slot (26, 23)
Meter=Image
MeterStyle=sSymbolS
ImageName=sf:hourglass
ImageTint=#TimerColor#
X=(#SlotCenterX# - 5)
Y=(#BandCenterY# - 6.5)
W=10
H=13
UpdateDivider=-1

[MeterHeaderTitle]
; the event's name ("New Year"), clipped at the card's padding
Meter=String
MeterStyle=sLabel | sHeaderTitle
MeasureName=MeasureEventName
UpdateDivider=-1

[MeterHero]
; 40 pt on baseline 83: "97" + " days" (the unit kit), "--" in Tertiary when the date cannot be read. "Today" is a
; word, not a unit: slots 8–9 give it back the hero's size and colour (the unit kit also takes a word at the start)
Meter=String
MeterStyle=sMetricXL | sUnit | sMissing
MeasureName=MeasureDaysAbs
Text=[#HeroText[&MeasureDaysKind:0]]
X=16
Y=(#HeroBaselineXL# - #Ascent40#)
W=138
ClipString=1
InlineSetting8=Size | 30
InlinePattern8=^(\p{L}+)$
InlineSetting9=Color | #TextColor#
InlinePattern9=^(\p{L}+)$
DynamicVariables=1
UpdateDivider=-1
Group=Face

[MeterDate]
; baseline 101: "Friday, January 1, 2027", or the longest suite date that fits; "Tomorrow, …"; "Since …"
Meter=String
MeterStyle=sCaption
MeasureName=MeasureDateLine
X=16
Y=(101 - #Ascent11#)
W=138
ClipString=1
DynamicVariables=1
UpdateDivider=-1
Group=Face

[MeterBar]
; y 129 → 134 in the timer colour: how much of the wait (or of the year) is behind us; hidden once the day has passed
Meter=Shape
X=16
Y=129
Shape=Rectangle 0,0,138,5,2.5 | Fill Color #TimerColor#,#TrackAlpha# | StrokeWidth 0
Shape2=Rectangle 0,0,(Max(5, 138 * [MeasureDaysPercent:] / 100)),5,2.5 | Fill Color #TimerColor# | StrokeWidth 0
Hidden=([MeasureDaysKind:] >= 3)
DynamicVariables=1
UpdateDivider=-1
Group=Face

[MeterFooter]
; the last baseline, 151: "73% of the year" (yearly) or "20% of the wait" (one-off); hidden once the day has passed
Meter=String
MeterStyle=sCaption
MeasureName=MeasureDaysPercent
Text=[#Footer[#CountdownYearly]]
FontColor=#TertiaryTextColor#
X=16
Y=(#LastBaseline# - #Ascent11#)
W=138
ClipString=1
Hidden=([MeasureDaysKind:] >= 3)
DynamicVariables=1
UpdateDivider=-1
Group=Face
