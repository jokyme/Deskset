; Deskset's first desktop: the default widgets a new user starts with, and where. Original work, MIT licensed.
;
; Deskset reads this file once, on the very first launch. Each section is a config, loaded in the order written:
; File is its .ini; X and Y are its top-left corner, in points from the top-left corner of the main display's visible
; area (below the menu bar), so the layout fits every screen. The Stationery widgets sit on a 190-point grid: a card
; is 170 wide or 360 wide, with 20 between cards and 20 from the screen's corner.

[Stationery\Clock]
File=Small.ini
X=20
Y=20

[Stationery\Calendar]
File=Small.ini
X=210
Y=20

[Stationery\Weather]
File=Medium.ini
X=20
Y=210
