; Deskset example skin — original work, MIT licensed.
; CPU load with a short history graph, memory and swap usage, and the time since the Mac started.
[Rainmeter]
Update=1000
AccurateText=1
Group=Deskset
MouseOverAction=#HoverOn#
MouseLeaveAction=#HoverOff#
ContextTitle=Open Activity Monitor
ContextAction=["/System/Applications/Utilities/Activity Monitor.app"]
ContextTitle2=#ThemeMenuTitle#
ContextAction2=#ThemeMenuAction#

[Metadata]
Name=System
Author=Deskset
Information=CPU load with a history graph, memory and swap usage, and uptime. Click the title to open Activity Monitor.
Version=2.0
License=MIT

[Variables]
@Include=#@#Variables.inc
@Include2=#@#Styles.inc
PanelHeight=196
GraphHeight=40

; ---------------------------------------------------------------- measures

[MeasureCPU]
Measure=CPU
Processor=0
AverageSize=2

[MeasureRAM]
Measure=PhysicalMemory

[MeasureRAMTotal]
Measure=PhysicalMemory
Total=1

; SwapMemory is RAM plus the swap files (like Windows' RAM + page file), so the swap itself is the difference.
[MeasureVirtual]
Measure=SwapMemory

[MeasureVirtualTotal]
Measure=SwapMemory
Total=1

[MeasureSwapTotal]
Measure=Calc
Formula=Max(MeasureVirtualTotal - MeasureRAMTotal, 0)
IfCondition=MeasureSwapTotal = 0
IfTrueAction=[!SetOption MeterSwapValue Text "Not in use"]
IfFalseAction=[!SetOption MeterSwapValue Text "%1B / %2B"]

; macOS grows the swap files as needed, so the range of the swap bar follows the current total.
[MeasureSwap]
Measure=Calc
Formula=Clamp(MeasureVirtual - MeasureRAM, 0, MeasureSwapTotal)
MinValue=0
MaxValue=[MeasureSwapTotal:]
DynamicVariables=1

[MeasureUptime]
Measure=Uptime
Format="%4!i!d %3!i!h %2!i!m"
; Drop "0d " during the first day.
RegExpSubstitute=1
Substitute="^0d ":""

; ---------------------------------------------------------------- meters

[MeterBackground]
Meter=Shape
MeterStyle=StylePanel

; The title opens Activity Monitor and lights up under the pointer.
[MeterTitle]
Meter=String
MeterStyle=StyleText | StyleTitle | StyleLink
Text=System
ToolTipText=Open Activity Monitor
LeftMouseUpAction=["/System/Applications/Utilities/Activity Monitor.app"]

[MeterUptime]
Meter=String
MeterStyle=StyleText | StyleValueRight
MeasureName=MeasureUptime
Y=2r
FontSize=9
FontColor=#SubtleColor#
Text=Up %1

; ---- CPU

[MeterCPULabel]
Meter=String
MeterStyle=StyleText | StyleLabel
X=#Padding#
Y=48
Text=CPU

[MeterCPUValue]
Meter=String
MeterStyle=StyleText | StyleValueRight | StyleDigits
MeasureName=MeasureCPU
Y=-5r
FontSize=11
FontWeight=600
NumOfDecimals=0
Text=%1%

; Filled area (Histogram) with a line on top (Line). Both use the CPU range 0–100, so they match.
[MeterCPUFill]
Meter=Histogram
MeasureName=MeasureCPU
X=#Padding#
Y=66
W=#ContentWidth#
H=#GraphHeight#
PrimaryColor=#CPUFill#
AntiAlias=1

[MeterCPUGraph]
Meter=Line
MeasureName=MeasureCPU
X=0r
Y=0r
W=#ContentWidth#
H=#GraphHeight#
LineColor=#CPUColor#
LineWidth=1.5
HorizontalLines=1
HorizontalLineColor=#GridColor#
AntiAlias=1

; ---- Memory

[MeterRAMLabel]
Meter=String
MeterStyle=StyleText | StyleLabel
X=#Padding#
Y=122
Text=Memory

[MeterRAMValue]
Meter=String
MeterStyle=StyleText | StyleValueRight | StyleDigits
MeasureName=MeasureRAM
MeasureName2=MeasureRAMTotal
Y=-2r
FontSize=9
AutoScale=1
NumOfDecimals=1
Text=%1B / %2B
InlineSetting2=Color | #SubtleColor#
InlinePattern2= / .*$

[MeterRAMBar]
Meter=Shape
MeterStyle=StyleTrack
Y=140
Shape2=Rectangle 0,0,(Max(#TrackHeight#, #ContentWidth# * [MeasureRAM:%] / 100)),#TrackHeight#,(#TrackHeight# / 2) | Fill LinearGradient RAMFill | StrokeWidth 0
RAMFill=180 | #MemoryColor# ; 0.0 | #MemoryColor2# ; 1.0

; ---- Swap

[MeterSwapLabel]
Meter=String
MeterStyle=StyleText | StyleLabel
X=#Padding#
Y=158
Text=Swap

[MeterSwapValue]
Meter=String
MeterStyle=StyleText | StyleValueRight | StyleDigits
MeasureName=MeasureSwap
MeasureName2=MeasureSwapTotal
Y=-2r
FontSize=9
AutoScale=1
NumOfDecimals=1
Text=%1B / %2B
InlineSetting2=Color | #SubtleColor#
InlinePattern2= / .*$

; Nothing is drawn while no swap is used (a zero-width bar).
[MeterSwapBar]
Meter=Shape
MeterStyle=StyleTrack
Y=176
Shape2=Rectangle 0,0,([MeasureSwap:%] > 0 ? Max(#TrackHeight#, #ContentWidth# * [MeasureSwap:%] / 100) : 0),#TrackHeight#,(#TrackHeight# / 2) | Fill LinearGradient SwapFill | StrokeWidth 0
SwapFill=180 | #SwapColor# ; 0.0 | #SwapColor2# ; 1.0
