; ---------------------------------------------------------------- styles

[StyleHead]
Y=#GridY#
FontSize=8
FontWeight=600
FontColor=#SubtleColor#
StringAlign=CenterCenter
StringCase=Upper

[StyleCell]
FontSize=10
StringAlign=CenterCenter

; Month arrows: a chevron with an invisible hit area; they light up under the pointer.
[StyleArrow]
Y=16
W=20
H=20
SolidColor=0,0,0,1
Shape=Path Chevron | Fill Color 0,0,0,0 | StrokeWidth 1.8 | Stroke Color #SubtleColor# | StrokeStartCap Round | StrokeEndCap Round | StrokeLineJoin Round
DynamicVariables=1

; ---------------------------------------------------------------- meters

[MeterBackground]
Meter=Shape
MeterStyle=StylePanel

[MeterTitle]
Meter=String
MeterStyle=StyleText | StyleTitle | StyleLink
MeasureName=MeasureTitle
ToolTipText=Back to today
LeftMouseUpAction=[!SetVariable MonthOffset 0][!Update]

[MeterPrevious]
Meter=Shape
MeterStyle=StyleArrow
X=(#PanelWidth# - #Padding# - 44)
Chevron=12,5 | LineTo 7,10 | LineTo 12,15
ToolTipText=Previous month
LeftMouseUpAction=[!SetVariable MonthOffset "(#MonthOffset# - 1)"][!Update]
MouseOverAction=[!SetOption MeterPrevious Shape "Path Chevron | Fill Color 0,0,0,0 | StrokeWidth 1.8 | Stroke Color #AccentColor# | StrokeStartCap Round | StrokeEndCap Round | StrokeLineJoin Round"][!UpdateMeter MeterPrevious][!Redraw]
MouseLeaveAction=[!SetOption MeterPrevious Shape ""][!UpdateMeter MeterPrevious][!Redraw]

[MeterNext]
Meter=Shape
MeterStyle=StyleArrow
X=(#PanelWidth# - #Padding# - 18)
Chevron=8,5 | LineTo 13,10 | LineTo 8,15
ToolTipText=Next month
LeftMouseUpAction=[!SetVariable MonthOffset "(#MonthOffset# + 1)"][!Update]
MouseOverAction=[!SetOption MeterNext Shape "Path Chevron | Fill Color 0,0,0,0 | StrokeWidth 1.8 | Stroke Color #AccentColor# | StrokeStartCap Round | StrokeEndCap Round | StrokeLineJoin Round"][!UpdateMeter MeterNext][!Redraw]
MouseLeaveAction=[!SetOption MeterNext Shape ""][!UpdateMeter MeterNext][!Redraw]


[MeterHead0]
Meter=String
MeterStyle=StyleText | StyleHead
MeasureName=MeasureHead0
X=(#Padding# + #CellW# * 0.5)

