; Circle behind today's date, and the date itself on top.
[MeterTodayCircle]
Meter=Shape
X=(#Padding# + #CellW# * ([MeasureTodayCell:] % 7 + 0.5) - 11)
Y=(#GridY# + #CellH# * (Floor([MeasureTodayCell:] / 7) + 1) - 11)
Shape=Ellipse 11,11,11 | Fill Color #AccentColor# | StrokeWidth 0
DynamicVariables=1
Group=Today

[MeterToday]
Meter=String
MeterStyle=StyleText | StyleDigits | StyleCell
MeasureName=MeasureToday
X=11r
Y=11r
FontWeight=600
FontColor=255,255,255,255
NumOfDecimals=0
Group=Today


