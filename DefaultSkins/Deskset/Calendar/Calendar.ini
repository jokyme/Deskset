; Deskset example skin — original work, MIT licensed.
; Month calendar built from Calc, Time and String meters only. The arrows page through the months; click the
; month name to come back to today. The first day of the week is WeekStart in @Resources/Variables.inc.
[Rainmeter]
Update=10000
AccurateText=1
Group=Deskset
MouseOverAction=#HoverOn#
MouseLeaveAction=#HoverOff#
ContextTitle=#WeekMenuTitle#
ContextAction=[!WriteKeyValue Variables WeekStart "(1 - #WeekStart#)" "#@#Variables.inc"][!Refresh]
ContextTitle2=Open Calendar
ContextAction2=["/System/Applications/Calendar.app"]
ContextTitle3=#ThemeMenuTitle#
ContextAction3=#ThemeMenuAction#

[Metadata]
Name=Calendar
Author=Deskset
Information=Month view with today highlighted. Use the arrows to see other months and click the month name to return. Right-click to start the week on Sunday or Monday.
Version=1.0
License=MIT

[Variables]
@Include=#@#Variables.inc
@Include2=#@#Styles.inc
PanelHeight=232
; Grid: 7 columns across the content width, 6 rows.
GridY=64
CellW=(#ContentWidth# / 7)
CellH=24
; Months away from the current one (changed by the arrows).
MonthOffset=0
WeekMenuTitle0=Start Week on Monday
WeekMenuTitle1=Start Week on Sunday
WeekMenuTitle=[#WeekMenuTitle[#WeekStart]]
; The weekday names come from the first week of a year that starts on the first day of the week:
; 1 January 2023 was a Sunday, 1 January 2024 a Monday.
HeadYear0=2023
HeadYear1=2024
HeadYear=[#HeadYear[#WeekStart]]

; ---------------------------------------------------------------- today

; No leading zero: MeterToday shows this measure's text, which must match the other cells ("4", not "04").
[MeasureToday]
Measure=Time
Format=%#d

[MeasureThisMonth]
Measure=Time
Format=%m

[MeasureThisYear]
Measure=Time
Format=%Y

; ---------------------------------------------------------------- the month shown

; Months since January of this year, then split into year and month (1-12). Floor keeps negative offsets right.
[MeasureMonthIndex]
Measure=Calc
Formula=MeasureThisMonth - 1 + #MonthOffset#
DynamicVariables=1

[MeasureYear]
Measure=Calc
Formula=MeasureThisYear + Floor(MeasureMonthIndex / 12)

[MeasureMonth]
Measure=Calc
Formula=MeasureMonthIndex - 12 * Floor(MeasureMonthIndex / 12) + 1

[MeasureLeapYear]
Measure=Calc
Formula=(((MeasureYear % 4) = 0) && ((MeasureYear % 100) <> 0)) || ((MeasureYear % 400) = 0)

; 31 days for January, March, May, July, August, October and December; 30 for the others; February 28 or 29.
[MeasureDays]
Measure=Calc
Formula=MeasureMonth = 2 ? 28 + MeasureLeapYear : 30 + ((MeasureMonth + Floor(MeasureMonth / 8)) % 2)

; Weekday of the 1st (0 = Sunday) with Zeller's congruence, which counts January and February as months 13
; and 14 of the previous year.
[MeasureZMonth]
Measure=Calc
Formula=MeasureMonth < 3 ? MeasureMonth + 12 : MeasureMonth

[MeasureZYear]
Measure=Calc
Formula=MeasureMonth < 3 ? MeasureYear - 1 : MeasureYear

[MeasureFirstWeekday]
Measure=Calc
Formula=(Floor(13 * (MeasureZMonth + 1) / 5) + (MeasureZYear % 100) + Floor((MeasureZYear % 100) / 4) + Floor(MeasureZYear / 400) + 5 * Floor(MeasureZYear / 100) + 7) % 7

; Column of the 1st, and the day number of the first cell (0 or less: the cell is empty).
[MeasureStart]
Measure=Calc
Formula=(MeasureFirstWeekday - #WeekStart# + 7) % 7

[MeasureFirst]
Measure=Calc
Formula=1 - MeasureStart

; Today's day number while this month is shown, else 0. Its cell stays empty: MeterToday draws it.
[MeasureTodayShown]
Measure=Calc
Formula=#MonthOffset# = 0 ? MeasureToday : 0
DynamicVariables=1
IfCondition=MeasureTodayShown > 0
IfTrueAction=[!ShowMeterGroup Today]
IfFalseAction=[!HideMeterGroup Today]

; Cell of today: 0 = top left.
[MeasureTodayCell]
Measure=Calc
Formula=MeasureStart + MeasureToday - 1

[MeasureTitle]
Measure=Time
TimeStamp=[MeasureYear:]-[MeasureMonth:]-1
TimeStampFormat=%Y-%m-%d
Format=#MonthFormat#
FormatLocale=#Locale#
DynamicVariables=1

; ---------------------------------------------------------------- weekday names

[MeasureHead0]
Measure=Time
TimeStamp=#HeadYear#-01-1
TimeStampFormat=%Y-%m-%d
Format=%a
FormatLocale=#Locale#

