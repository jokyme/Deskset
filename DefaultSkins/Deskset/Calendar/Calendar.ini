; ---------------------------------------------------------------- days
; Cell N shows day (MeasureFirst + N) when that day is in the month and is not today, else nothing:
; each comparison is 1 or 0, so the product is the day or 0, and Substitute blanks the 0.

[MeasureCell0]
Measure=Calc
Formula=(MeasureFirst + 0) * ((MeasureFirst + 0) >= 1) * ((MeasureFirst + 0) <= MeasureDays) * ((MeasureFirst + 0) <> MeasureTodayShown)
RegExpSubstitute=1
Substitute="^0$":""

