; Deskset example skin — original work, MIT licensed.
; Download and upload speed, a two-line history graph and the traffic since the Mac started.
[Rainmeter]
Update=1000
AccurateText=1
Group=Deskset
MouseOverAction=#HoverOn#
MouseLeaveAction=#HoverOff#
ContextTitle=Open Network Settings
ContextAction=["x-apple.systempreferences:com.apple.Network-Settings.extension"]
ContextTitle2=Open Activity Monitor
ContextAction2=["/System/Applications/Utilities/Activity Monitor.app"]
ContextTitle3=#ThemeMenuTitle#
ContextAction3=#ThemeMenuAction#

[Metadata]
Name=Network
Author=Deskset
Information=Download and upload speed of the active network connection with a history graph, plus the traffic since startup. To measure another connection, set Interface in [Variables] (0 = all, or a name such as en0).
Version=2.0
License=MIT

[Variables]
@Include=#@#Variables.inc
@Include2=#@#Styles.inc
PanelHeight=188
Column2=(#Padding# + #ContentWidth# / 2 + 8)
GraphHeight=56
; Best = the active connection, 0 = all connections, or an interface name such as en0.
Interface=Best

; ---------------------------------------------------------------- measures

[MeasureIn]
Measure=NetIn
Interface=#Interface#

[MeasureOut]
Measure=NetOut
Interface=#Interface#

[MeasureInTotal]
Measure=NetIn
Interface=#Interface#
Cumulative=1

[MeasureOutTotal]
Measure=NetOut
Interface=#Interface#
Cumulative=1

; ---------------------------------------------------------------- styles

[StyleRate]
FontSize=15
FontWeight=500
AutoScale=1
NumOfDecimals=1
Text=%1B/s

[StyleTotal]
Y=0R
FontSize=9
FontColor=#SubtleColor#
AutoScale=1
NumOfDecimals=1
Text=%1B total

; ---------------------------------------------------------------- meters

[MeterBackground]
Meter=Shape
MeterStyle=StylePanel

; The title opens the Network settings.
[MeterTitle]
Meter=String
MeterStyle=StyleText | StyleTitle | StyleLink
Text=Network
ToolTipText=Open Network Settings
LeftMouseUpAction=["x-apple.systempreferences:com.apple.Network-Settings.extension"]

; ---- download on the left, upload on the right: rate now and total since startup

[MeterInDot]
Meter=Shape
X=#Padding#
Y=51
Shape=Ellipse 3,3,3 | Fill Color #DownColor# | StrokeWidth 0

[MeterInLabel]
Meter=String
MeterStyle=StyleText | StyleLabel
X=6R
Y=-4r
Text=Download

[MeterInValue]
Meter=String
MeterStyle=StyleText | StyleDigits | StyleRate
MeasureName=MeasureIn
X=#Padding#
Y=62

[MeterInTotal]
Meter=String
MeterStyle=StyleText | StyleDigits | StyleTotal
MeasureName=MeasureInTotal
X=#Padding#

[MeterOutDot]
Meter=Shape
X=#Column2#
Y=51
Shape=Ellipse 3,3,3 | Fill Color #UpColor# | StrokeWidth 0

[MeterOutLabel]
Meter=String
MeterStyle=StyleText | StyleLabel
X=6R
Y=-4r
Text=Upload

[MeterOutValue]
Meter=String
MeterStyle=StyleText | StyleDigits | StyleRate
MeasureName=MeasureOut
X=#Column2#
Y=62

[MeterOutTotal]
Meter=String
MeterStyle=StyleText | StyleDigits | StyleTotal
MeasureName=MeasureOutTotal
X=#Column2#

; ---- history: a filled area (Histogram) under two lines (Line). Both scale automatically to the largest value
; shown, so they match. Where upload is above download, the area between them is filled in the upload color.

[MeterGraphFill]
Meter=Histogram
MeasureName=MeasureIn
MeasureName2=MeasureOut
X=#Padding#
Y=114
W=#ContentWidth#
H=#GraphHeight#
AutoScale=1
PrimaryColor=#DownFill#
SecondaryColor=#UpFill#
BothColor=#DownFill#
AntiAlias=1

; Upload is line 1 and download line 2, so the download line is drawn on top.
[MeterGraph]
Meter=Line
MeasureName=MeasureOut
MeasureName2=MeasureIn
X=0r
Y=0r
W=#ContentWidth#
H=#GraphHeight#
LineCount=2
LineColor=#UpColor#
LineColor2=#DownColor#
LineWidth=1.5
AutoScale=1
HorizontalLines=1
HorizontalLineColor=#GridColor#
AntiAlias=1
