; Deskset example skin — original work, MIT licensed.
; Battery charge and state (charging, time left) from the PowerPlugin measure. On a Mac without a battery
; the gauge is hidden and the skin just says so.
[Rainmeter]
Update=2000
AccurateText=1
Group=Deskset
MouseOverAction=#HoverOn#
MouseLeaveAction=#HoverOff#
ContextTitle=Open Battery Settings
ContextAction=["x-apple.systempreferences:com.apple.Battery-Settings.extension"]
ContextTitle2=#ThemeMenuTitle#
ContextAction2=#ThemeMenuAction#

[Metadata]
Name=Battery
Author=Deskset
Information=Battery charge with its state: charging, fully charged, or the time left on battery. Turns amber below 20 % and red below 10 %. Desktop Macs without a battery show a short note instead.
Version=1.0
License=MIT

[Variables]
@Include=#@#Variables.inc
@Include2=#@#Styles.inc
PanelHeight=96
; Battery gauge geometry (the cap sits to the right of the body).
GaugeWidth=150
GaugeHeight=28
; Set by MeasureLevel.
GaugeColor=#BatteryColor#

; ---------------------------------------------------------------- measures

[MeasurePercent]
Measure=Plugin
Plugin=PowerPlugin
PowerState=Percent

; 0 no battery, 1 charging, 2 critical, 3 low, 4 above low.
[MeasureStatus]
Measure=Plugin
Plugin=PowerPlugin
PowerState=Status

; 1 on the power adapter, 0 on battery.
[MeasureACLine]
Measure=Plugin
Plugin=PowerPlugin
PowerState=ACLine

; Seconds of battery time left (-1 while unknown or on the adapter); the text is formatted like a Time measure.
[MeasureLifetime]
Measure=Plugin
Plugin=PowerPlugin
PowerState=Lifetime
Format=%#H:%M

; One number for the state shown under the title; Substitute turns it into words.
; 0 no battery, 1 charging, 2 fully charged, 3 not charging, 4 on battery (time known), 5 on battery.
[MeasureState]
Measure=Calc
Formula=MeasureStatus = 0 ? 0 : (MeasureStatus = 1 ? 1 : (MeasureACLine = 1 ? (MeasurePercent >= 99 ? 2 : 3) : (MeasureLifetime >= 0 ? 4 : 5)))
RegExpSubstitute=1
Substitute="^0$":"Power adapter","^1$":"Charging","^2$":"Fully charged","^3$":"Not charging","^[45]$":"On battery"
IfCondition=MeasureState = 0
IfTrueAction=[!HideMeterGroup Gauge][!ShowMeter MeterNoBattery]
IfFalseAction=[!ShowMeterGroup Gauge][!HideMeter MeterNoBattery]
IfCondition2=MeasureState = 1
IfTrueAction2=[!ShowMeter MeterBolt]
IfFalseAction2=[!HideMeter MeterBolt]
IfCondition3=MeasureState = 4
IfTrueAction3=[!SetOption MeterStatus Text "%2 left"]
IfFalseAction3=[!SetOption MeterStatus Text "%1"]

; Gauge color: red below 10 %, amber below 20 % (not while charging), green otherwise.
[MeasureLevel]
Measure=Calc
Formula=MeasureStatus = 1 ? 2 : (MeasurePercent < 10 ? 0 : (MeasurePercent < 20 ? 1 : 2))
IfCondition=MeasureLevel = 0
IfTrueAction=[!SetVariable GaugeColor "#CriticalColor#"]
IfCondition2=MeasureLevel = 1
IfTrueAction2=[!SetVariable GaugeColor "#LowColor#"]
IfCondition3=MeasureLevel = 2
IfTrueAction3=[!SetVariable GaugeColor "#BatteryColor#"]

; ---------------------------------------------------------------- meters

[MeterBackground]
Meter=Shape
MeterStyle=StylePanel

; The title opens the Battery settings.
[MeterTitle]
Meter=String
MeterStyle=StyleText | StyleTitle | StyleLink
Text=Battery
ToolTipText=Open Battery Settings
LeftMouseUpAction=["x-apple.systempreferences:com.apple.Battery-Settings.extension"]

[MeterStatus]
Meter=String
MeterStyle=StyleText | StyleValueRight | StyleDigits
MeasureName=MeasureState
MeasureName2=MeasureLifetime
Y=2r
FontSize=9
FontColor=#SubtleColor#
Text=%1

; The gauge: an outlined body with a small cap, filled according to the charge.
[MeterGauge]
Meter=Shape
X=#Padding#
Y=46
Shape=Rectangle 0.75,0.75,(#GaugeWidth# - 1.5),(#GaugeHeight# - 1.5),8 | Fill Color 0,0,0,0 | StrokeWidth 1.5 | Stroke Color #FaintColor#
Shape2=Rectangle (#GaugeWidth# + 2),(#GaugeHeight# / 2 - 5),3,10,1.5 | Fill Color #FaintColor# | StrokeWidth 0
Shape3=Rectangle 4,4,(Max(6, (#GaugeWidth# - 8) * [MeasurePercent:] / 100)),(#GaugeHeight# - 8),5 | Fill Color #GaugeColor# | StrokeWidth 0
DynamicVariables=1
Group=Gauge

; Lightning bolt over the gauge while charging.
[MeterBolt]
Meter=Shape
X=(#Padding# + #GaugeWidth# / 2 - 7)
Y=(46 + #GaugeHeight# / 2 - 10)
Shape=Path Bolt | Fill Color #TextColor# | StrokeWidth 1.5 | Stroke Color #PanelBottom# | StrokeLineJoin Round
Bolt=8,0 | LineTo 1,11 | LineTo 6.5,11 | LineTo 5,20 | LineTo 13,8 | LineTo 7.5,8 | LineTo 9.5,0 | ClosePath 1
Hidden=1

[MeterPercent]
Meter=String
MeterStyle=StyleText | StyleDigits
MeasureName=MeasurePercent
X=(#PanelWidth# - #Padding#)
Y=(46 + #GaugeHeight# / 2)
StringAlign=RightCenter
FontSize=16
FontWeight=600
NumOfDecimals=0
Text=%1%
Group=Gauge

[MeterNoBattery]
Meter=String
MeterStyle=StyleText
X=#Padding#
Y=(46 + #GaugeHeight# / 2)
StringAlign=LeftCenter
FontSize=10
FontColor=#SubtleColor#
Text=This Mac has no battery.
Hidden=1
