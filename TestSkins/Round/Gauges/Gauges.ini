; Original Deskset test skin: Roundline and Rotator options with fixed values (deterministic renders).
; Cells, left to right, top to bottom:
;   1 solid pies (clockwise and counter-clockwise)   2 ring sector progress   3 gauge with a tinted Rotator needle
;   4 ControlLength / ControlStart / ControlAngle=0   5 Rotator spinning around the image center (Calc counter)
;   6 image options on Rotators: ImageFlip, ImageCrop, ImageRotate, ColorMatrix, no W/H (center at X,Y)
[Rainmeter]
Update=1000
AccurateText=1
BackgroundMode=2
SolidColor=24,26,32,255

[Metadata]
Name=Round Gauges
Author=Deskset
Information=Regression fixture for Roundline and Rotator meters.
Version=1.0
License=MIT

[Variables]
Track=60,64,76,255
Blue=90,180,255,255
Orange=255,160,60,255
Green=110,210,140,255
Text=170,176,190,255

; ---------------------------------------------------------------- measures

[Measure30]
Measure=Calc
Formula=30
MaxValue=100

[Measure20]
Measure=Calc
Formula=0.2

[Measure65]
Measure=Calc
Formula=65
MaxValue=100

[Measure40]
Measure=Calc
Formula=40
MaxValue=100

[Measure50]
Measure=Calc
Formula=50
MaxValue=100

; 30 degrees more on every update.
[MeasureSpin]
Measure=Calc
Formula=(MeasureSpin + 30) % 360
MaxValue=360

; ---------------------------------------------------------------- styles

[StyleCell1]
X=10
Y=10
W=100
H=100
AntiAlias=1

[StyleCell2]
X=130
Y=10
W=100
H=100
AntiAlias=1

[StyleCell3]
X=250
Y=10
W=100
H=100
AntiAlias=1

[StyleCell4]
X=10
Y=140
W=100
H=100
AntiAlias=1

[StyleLabel]
FontFace=Helvetica Neue
FontSize=9
FontColor=#Text#
StringAlign=Center
AntiAlias=1

; ---------------------------------------------------------------- 1: solid pies

[PieTrack]
Meter=Roundline
MeterStyle=StyleCell1
Solid=1
LineLength=46
LineColor=#Track#

[PieClockwise]
Meter=Roundline
MeterStyle=StyleCell1
MeasureName=Measure30
Solid=1
StartAngle=4.7124
RotationAngle=6.2832
LineLength=46
LineColor=#Blue#

[PieCounterClockwise]
Meter=Roundline
MeterStyle=StyleCell1
MeasureName=Measure20
Solid=1
StartAngle=4.7124
RotationAngle=-6.2832
LineLength=40
LineColor=#Orange#

[Label1]
Meter=String
MeterStyle=StyleLabel
X=60
Y=114
Text=pie 30% / -20%

; ---------------------------------------------------------------- 2: ring sector

[RingTrack]
Meter=Roundline
MeterStyle=StyleCell2
Solid=1
LineStart=36
LineLength=46
LineColor=#Track#

[RingValue]
Meter=Roundline
MeterStyle=StyleCell2
MeasureName=Measure65
Solid=1
StartAngle=4.7124
LineStart=36
LineLength=46
LineColor=#Green#

[Label2]
Meter=String
MeterStyle=StyleLabel
X=180
Y=114
Text=ring 65%

; ---------------------------------------------------------------- 3: gauge

; 270 degree track from the lower left (135 deg) clockwise to the lower right.
[GaugeTrack]
Meter=Roundline
MeterStyle=StyleCell3
Solid=1
StartAngle=(PI * 3 / 4)
RotationAngle=(PI * 3 / 2)
LineStart=40
LineLength=46
LineColor=#Track#

[GaugeValue]
Meter=Roundline
MeterStyle=StyleCell3
MeasureName=Measure40
Solid=1
StartAngle=(PI * 3 / 4)
RotationAngle=(PI * 3 / 2)
LineStart=40
LineLength=46
LineColor=#Orange#

[GaugeNeedle]
Meter=Rotator
MeterStyle=StyleCell3
MeasureName=Measure40
ImageName=#CURRENTPATH#Images\Needle.png
ImageTint=255,200,80
OffsetX=8
OffsetY=5
StartAngle=(PI * 3 / 4)
RotationAngle=(PI * 3 / 2)

[Label3]
Meter=String
MeterStyle=StyleLabel
X=300
Y=114
Text=gauge 40%

; ---------------------------------------------------------------- 4: ControlLength / ControlStart / ControlAngle=0

; Grows from LineLength 10 to 10+30 with the value: 50% = radius 25.
[GrowingDisc]
Meter=Roundline
MeterStyle=StyleCell4
MeasureName=Measure50
Solid=1
ControlAngle=0
ControlLength=1
LineLength=10
LengthShift=30
LineColor=#Track#

; Angle 50% (6 o'clock), length 20 + 30 * 50% = 35.
[LengthLine]
Meter=Roundline
MeterStyle=StyleCell4
MeasureName=Measure50
StartAngle=4.7124
LineLength=20
ControlLength=1
LengthShift=30
LineWidth=3
LineColor=#Blue#

; Fixed at 3 o'clock; starts at 30 + (-20 * 50%) = 20, ends at 45.
[StartLine]
Meter=Roundline
MeterStyle=StyleCell4
MeasureName=Measure50
ControlAngle=0
ControlStart=1
LineStart=30
StartShift=-20
LineLength=45
LineWidth=3
LineColor=#Green#

; Fixed at 9 o'clock, no ControlStart: 30 to 45.
[PlainLine]
Meter=Roundline
MeterStyle=StyleCell4
ControlAngle=0
StartAngle=(PI)
LineStart=30
LineLength=45
LineWidth=3
LineColor=#Orange#

[Label4]
Meter=String
MeterStyle=StyleLabel
X=60
Y=244
Text=control length/start

; ---------------------------------------------------------------- 5: rotate around the image center

[Spinner]
Meter=Rotator
MeasureName=MeasureSpin
X=128
Y=140
W=64
H=64
ImageName=#CURRENTPATH#Images\Gear
OffsetX=32
OffsetY=32

; Meshing gear turning the other way (negative RotationAngle). The image keeps its 64x64 pixel size: W/H only
; place the center of rotation. Greyscale + ImageTint recolor it, ImageFlip mirrors it first.
[SpinnerGreen]
Meter=Rotator
MeasureName=MeasureSpin
X=187
Y=189
W=32
H=32
ImageName=#CURRENTPATH#Images\Gear.png
Greyscale=1
ImageTint=120,220,140
ImageFlip=Horizontal
OffsetX=32
OffsetY=32
StartAngle=(PI / 8)
RotationAngle=(-2 * PI)

[Label5]
Meter=String
MeterStyle=StyleLabel
X=180
Y=244
Text=spin (Calc counter)

; ---------------------------------------------------------------- 6: image options, no W/H

; No W/H: the center of rotation is X,Y itself. Offsets pick the arrow's tail.
[ArrowPlain]
Meter=Rotator
X=262
Y=155
ImageName=#CURRENTPATH#Images\Arrow.png
OffsetX=0
OffsetY=10

[ArrowFlipV]
Meter=Rotator
X=262
Y=180
ImageName=#CURRENTPATH#Images\Arrow.png
ImageFlip=Vertical
OffsetX=0
OffsetY=10

; Right half of the arrow (origin 2 = top right), turned 90 degrees clockwise by StartAngle.
[ArrowCrop]
Meter=Rotator
X=325
Y=150
ImageName=#CURRENTPATH#Images\Arrow.png
ImageCrop=-20,0,20,20,2
OffsetX=10
OffsetY=0
StartAngle=(PI / 2)

; ImageRotate=180 is applied to the image first; the rotator then adds nothing (no measure, default 2*PI).
[ArrowRotate]
Meter=Rotator
X=302
Y=205
ImageName=#CURRENTPATH#Images\Arrow.png
ImageRotate=180
OffsetX=40
OffsetY=10

; ColorMatrix swaps red and blue.
[ArrowMatrix]
Meter=Rotator
X=262
Y=225
ImageName=#CURRENTPATH#Images\Arrow.png
ColorMatrix1=0;0;1;0;0
ColorMatrix2=0;1;0;0;0
ColorMatrix3=1;0;0;0;0
OffsetX=0
OffsetY=10

[Label6]
Meter=String
MeterStyle=StyleLabel
X=300
Y=244
Text=image options

[Border]
Meter=Image
X=0
Y=260
W=360
H=1
SolidColor=0,0,0,0
