; Original Deskset test skin: Roundline / Rotator edge cases from the manual (review fixture, fixed values).
; Cells, left to right, top to bottom:
;   1 no W/H: center at X,Y, the parts outside the skin window are cut off (Roundline and Rotator notes)
;   2 the "Rotate an Image Around its Center" tip: W = H = the image diagonal, OffsetX/Y = half the image
;   3 opacity: ImageAlpha (drawn with the opacity, the image is not re-processed per alpha value)
;   4 opacity: ImageTint alpha, Greyscale + ImageAlpha
;   5 AntiAlias=0 vs AntiAlias=1
;   6 sweeps of 2*PI and more: RotationAngle=(4*PI) at 75% and 6.283 at 100% are full rings / discs
;   7 negative LineLength / LineStart on a line: the line crosses to the other side of the center
;   8 ValueRemainder on a negative value wraps forward: -15 with ValueRemainder=60 is 75%
[Rainmeter]
Update=1000
AccurateText=1
BackgroundMode=2
SolidColor=24,26,32,255

[Metadata]
Name=Round Edges
Author=Deskset
Information=Regression fixture for Roundline and Rotator edge cases.
Version=1.0
License=MIT

[Variables]
Track=60,64,76,255
Blue=90,180,255,255
Orange=255,160,60,255
Green=110,210,140,255
Text=170,176,190,255
ImageW=80
ImageH=40

; ---------------------------------------------------------------- measures

[Measure30Degrees]
Measure=Calc
Formula=30
MaxValue=360

[Measure75]
Measure=Calc
Formula=75
MaxValue=100

[Measure100]
Measure=Calc
Formula=100
MaxValue=100

[MeasureMinus15]
Measure=Calc
Formula=-15

; ---------------------------------------------------------------- styles

[StyleLabel]
FontFace=Helvetica Neue
FontSize=9
FontColor=#Text#
StringAlign=Center
AntiAlias=1

[StyleAntiAlias]
X=10
Y=140
W=100
H=100

[StyleSweeps]
X=130
Y=140
W=100
H=100
AntiAlias=1

[StyleNegative]
X=250
Y=140
W=100
H=100
AntiAlias=1

[StyleRemainder]
X=370
Y=140
W=100
H=100
AntiAlias=1

; ---------------------------------------------------------------- 1: no W/H

; Center at the skin's top-left corner: only a quarter of the disc is inside the window.
[CornerDisc]
Meter=Roundline
X=0
Y=0
Solid=1
LineLength=40
LineColor=#Track#
AntiAlias=1

; Center of rotation at (60,0), the image's center on it: the upper half is outside the window.
[EdgeRect]
Meter=Rotator
X=60
Y=0
ImageName=#CURRENTPATH#Images\Rect.png
OffsetX=(#ImageW# / 2)
OffsetY=(#ImageH# / 2)
StartAngle=0
RotationAngle=0

[Label1]
Meter=String
MeterStyle=StyleLabel
X=60
Y=114
Text=no W/H: cut off

; ---------------------------------------------------------------- 2: rotate around the image center (manual tip)

[TipRect]
Meter=Rotator
MeasureName=Measure30Degrees
X=135
Y=15
W=(SQRT(#ImageW# ** 2 + #ImageH# ** 2))
H=(SQRT(#ImageW# ** 2 + #ImageH# ** 2))
ImageName=#CURRENTPATH#Images\Rect.png
OffsetX=(#ImageW# / 2)
OffsetY=(#ImageH# / 2)
SolidColor=255,255,255,20

[Label2]
Meter=String
MeterStyle=StyleLabel
X=180
Y=114
Text=tip: 30 deg

; ---------------------------------------------------------------- 3: opacity

[FadeFull]
Meter=Rotator
X=260
Y=8
ImageName=#CURRENTPATH#Images\Rect.png
RotationAngle=0

[FadeHalf]
Meter=Rotator
X=260
Y=58
ImageName=#CURRENTPATH#Images\Rect.png
RotationAngle=0
ImageAlpha=(255 / 2)

[Label3]
Meter=String
MeterStyle=StyleLabel
X=300
Y=114
Text=alpha 255 / 127

; ---------------------------------------------------------------- 4: opacity from ImageTint, Greyscale

[FadeTint]
Meter=Rotator
X=380
Y=8
ImageName=#CURRENTPATH#Images\Rect.png
RotationAngle=0
ImageTint=255,255,255,64

[FadeGrey]
Meter=Rotator
X=380
Y=58
ImageName=#CURRENTPATH#Images\Rect.png
RotationAngle=0
Greyscale=1
ImageAlpha=160

[Label4]
Meter=String
MeterStyle=StyleLabel
X=420
Y=114
Text=tint / grey + alpha

; ---------------------------------------------------------------- 5: AntiAlias

[LineAliased]
Meter=Roundline
MeterStyle=StyleAntiAlias
StartAngle=(Rad(210))
RotationAngle=0
LineStart=8
LineLength=46
LineWidth=6
LineColor=#Orange#
AntiAlias=0

[LineSmooth]
Meter=Roundline
MeterStyle=StyleAntiAlias
StartAngle=(Rad(330))
RotationAngle=0
LineStart=8
LineLength=46
LineWidth=6
LineColor=#Blue#
AntiAlias=1

[RingAliased]
Meter=Roundline
MeterStyle=StyleAntiAlias
MeasureName=Measure75
Solid=1
StartAngle=(Rad(90))
RotationAngle=(Rad(-180))
LineStart=20
LineLength=30
LineColor=#Green#
AntiAlias=0

[Label5]
Meter=String
MeterStyle=StyleLabel
X=60
Y=244
Text=AntiAlias 0 / 1

; ---------------------------------------------------------------- 6: sweeps of 2*PI and more

; 75% of 4*PI = 3*PI: more than a full turn, so a full ring.
[RingTwoTurns]
Meter=Roundline
MeterStyle=StyleSweeps
MeasureName=Measure75
Solid=1
StartAngle=(Rad(270))
RotationAngle=(4 * PI)
LineStart=38
LineLength=48
LineColor=#Green#

; 100% of 6.283 (a hair under 2*PI, as in the manual's example): a full disc.
[DiscFull]
Meter=Roundline
MeterStyle=StyleSweeps
MeasureName=Measure100
Solid=1
StartAngle=4.712
RotationAngle=6.283
LineLength=30
LineColor=#Blue#

[Label6]
Meter=String
MeterStyle=StyleLabel
X=180
Y=244
Text=sweeps >= 2 PI

; ---------------------------------------------------------------- 7: negative lengths

[Hub]
Meter=Roundline
MeterStyle=StyleNegative
Solid=1
LineLength=4
LineColor=#Text#

; Angle 0 (right) with LineLength=-40: the line points left.
[NegativeLength]
Meter=Roundline
MeterStyle=StyleNegative
RotationAngle=0
LineLength=-40
LineWidth=3
LineColor=#Orange#

; Angle PI/2 (down), LineStart=-20: from 20 above the center to 40 below it.
[NegativeStart]
Meter=Roundline
MeterStyle=StyleNegative
StartAngle=(PI / 2)
RotationAngle=0
LineStart=-20
LineLength=40
LineWidth=3
LineColor=#Blue#

[Label7]
Meter=String
MeterStyle=StyleLabel
X=300
Y=244
Text=negative lengths

; ---------------------------------------------------------------- 8: ValueRemainder on a negative value

[PieTrack]
Meter=Roundline
MeterStyle=StyleRemainder
Solid=1
LineLength=46
LineColor=#Track#

[PieRemainder]
Meter=Roundline
MeterStyle=StyleRemainder
MeasureName=MeasureMinus15
Solid=1
StartAngle=(Rad(270))
RotationAngle=(Rad(360))
ValueRemainder=60
LineLength=46
LineColor=#Orange#

[Label8]
Meter=String
MeterStyle=StyleLabel
X=420
Y=244
Text=-15 mod 60 = 75%

[Border]
Meter=Image
X=0
Y=260
W=480
H=1
SolidColor=0,0,0,0
