; Nocturne: a dark system panel written the way many Windows skins are (a Windows font, a HWiNFO sensor, buttons that
; start Windows programs), for the Skin Studio's checks and screens. Original work, part of Deskset's test fixtures;
; the author and licence in [Metadata] are fictional, so the Studio has something to show.

[Rainmeter]
Update=1000
AccurateText=1
ContextTitle=Open the Styles
ContextAction=["#@#Styles.inc"]

[Metadata]
Name=Nocturne
Author=Mira
Version=2.1
License=CC BY-NC-SA 4.0
Information=CPU, GPU, memory and network on a dark panel, with three launch buttons.

[Variables]
@Include=#@#Variables.inc
@Include2=#@#Styles.inc

; ---------------------------------------------------------------- measures

[MeasureTime]
Measure=Time
Format=#ClockFormat#

[MeasureCPU]
Measure=CPU
Processor=0

[MeasureCPUTemp]
; A HWiNFO sensor: the plugin only runs on Windows.
Measure=Plugin
Plugin=HWiNFO
HWiNFOSensorId=#SensorId#
HWiNFOSensorInstance=0x0
HWiNFOEntryId=#CPUTempEntry#
HWiNFOType=CurrentValue
MinValue=0
MaxValue=100

[MeasureCPUTempC]
Measure=Calc
Formula=MeasureCPUTemp

[MeasureGPUUsage]
Measure=Plugin
Plugin=UsageMonitor
Alias=GPU

[MeasureGPU]
; the usage monitor's own value is the name of what it watches: the number comes through a Calc
Measure=Calc
Formula=MeasureGPUUsage
MinValue=0
MaxValue=100

[MeasureGPUTemp]
Measure=Plugin
Plugin=HWiNFO
HWiNFOSensorId=#SensorId#
HWiNFOSensorInstance=0x0
HWiNFOEntryId=#GPUTempEntry#
HWiNFOType=CurrentValue
MinValue=0
MaxValue=100

[MeasureGPUTempC]
Measure=Calc
Formula=MeasureGPUTemp

[MeasureRAM]
Measure=PhysicalMemory

[MeasureNetIn]
Measure=NetIn
Interface=0

[MeasureNetOut]
Measure=NetOut
Interface=0

; ---------------------------------------------------------------- the panel and the header

[MeterPanel]
Meter=Shape
Shape=Rectangle 0.5,0.5,319,227,10 | Fill Color #PanelColor#,#PanelAlpha# | StrokeWidth 1 | Stroke Color 255,255,255,30

[MeterTitle]
Meter=String
MeterStyle=StyleLabel
Text=NOCTURNE
FontSize=13
InlineSetting=CharacterSpacing | 3
X=16
Y=14

[MeterClock]
Meter=String
MeterStyle=StyleValue
MeasureName=MeasureTime
FontSize=13
StringAlign=Right
X=304
Y=14

[MeterRule]
Meter=Shape
Shape=Line 16,38,304,38 | StrokeWidth 1 | Stroke Color #LineColor#

; ---------------------------------------------------------------- the rows

[MeterCPULabel]
Meter=String
MeterStyle=StyleLabel
Text=CPU
X=16
Y=54

[MeterCPU]
Meter=String
MeterStyle=StyleValue
MeasureName=MeasureCPU
Text=%1%
X=62
Y=50

[MeterCPUBar]
Meter=Bar
MeterStyle=StyleBar
MeasureName=MeasureCPU
X=140
Y=60

[MeterCPUTemp]
Meter=String
MeterStyle=StyleValue
MeasureName=MeasureCPUTempC
Postfix=°C
StringAlign=Right
X=304
Y=50

[MeterGPULabel]
Meter=String
MeterStyle=StyleLabel
Text=GPU
X=16
Y=86

[MeterGPU]
Meter=String
MeterStyle=StyleValue
MeasureName=MeasureGPU
Text=%1%
X=62
Y=82

[MeterGPUBar]
Meter=Bar
MeterStyle=StyleBar
MeasureName=MeasureGPU
X=140
Y=92

[MeterGPUTemp]
Meter=String
MeterStyle=StyleValue
MeasureName=MeasureGPUTempC
Postfix=°C
StringAlign=Right
X=304
Y=82

[MeterRAMLabel]
Meter=String
MeterStyle=StyleLabel
Text=RAM
X=16
Y=118

[MeterRAM]
Meter=String
MeterStyle=StyleValue
MeasureName=MeasureRAM
Text=%1B
AutoScale=1
NumOfDecimals=1
X=62
Y=114

[MeterRAMBar]
Meter=Bar
MeterStyle=StyleBar
MeasureName=MeasureRAM
X=140
Y=124

[MeterNetLabel]
Meter=String
MeterStyle=StyleLabel
Text=NET
X=16
Y=150

[MeterNet]
Meter=String
MeterStyle=StyleValue
MeasureName=MeasureNetIn
MeasureName2=MeasureNetOut
Text=↓ %1B/s  ↑ %2B/s
AutoScale=1
NumOfDecimals=1
FontSize=12
X=62
Y=148

[MeterNetGraph]
Meter=Line
MeasureName=MeasureNetIn
LineCount=1
LineColor=#AccentColor#
LineWidth=1.5
AutoScale=1
AntiAlias=1
X=252
Y=148
W=52
H=18

[MeterRule2]
Meter=Shape
Shape=Line 16,178,304,178 | StrokeWidth 1 | Stroke Color 255,255,255,30

; ---------------------------------------------------------------- the buttons

[MeterSteamFrame]
Meter=Shape
Shape=Rectangle 16.5,188.5,91,27,13.5 | Fill Color 0,0,0,0 | StrokeWidth 1 | Stroke Color #AccentColor#,120

[MeterSteam]
Meter=String
MeterStyle=StyleButton
Text=STEAM
InlineSetting=CharacterSpacing | 2
StringAlign=CenterCenter
X=62
Y=202
W=92
H=28
LeftMouseUpAction=["#SteamPath#"]

[MeterMusicFrame]
Meter=Shape
Shape=Rectangle 114.5,188.5,91,27,13.5 | Fill Color 0,0,0,0 | StrokeWidth 1 | Stroke Color #AccentColor#,120

[MeterMusic]
Meter=String
MeterStyle=StyleButton
Text=MUSIC
InlineSetting=CharacterSpacing | 2
StringAlign=CenterCenter
X=160
Y=202
W=92
H=28
LeftMouseUpAction=["#MusicPath#"]

[MeterFilesFrame]
Meter=Shape
Shape=Rectangle 212.5,188.5,91,27,13.5 | Fill Color 0,0,0,0 | StrokeWidth 1 | Stroke Color #AccentColor#,120

[MeterFiles]
Meter=String
MeterStyle=StyleButton
Text=FILES
InlineSetting=CharacterSpacing | 2
StringAlign=CenterCenter
X=258
Y=202
W=92
H=28
LeftMouseUpAction=["#FilesPath#"]
