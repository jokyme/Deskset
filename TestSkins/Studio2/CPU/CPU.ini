; CPU: one small card (an icon and a label, the load as a big number, a bar and a caption), as someone might make it
; in the Skin Studio, for the Studio's checks and screens. Original work, part of Deskset's test fixtures.

[Rainmeter]
Update=1000
AccurateText=1
SkinWidth=170
SkinHeight=170

[Metadata]
Name=CPU
Information=How busy the processor is.

[Variables]
Accent=59,112,232
Ink=34,34,38
Dim=34,34,38,150
Track=59,112,232,50
Card=250,250,250

[MeasureCPU]
Measure=CPU
Processor=0

[MeterCard]
Meter=Shape
Shape=Rectangle 0,0,170,170,26 | Fill Color #Card# | StrokeWidth 0

[MeterIcon]
Meter=Image
ImageName=sf:cpu
ImageTint=#Accent#
X=16
Y=16
W=20
H=20

[MeterLabel]
Meter=String
Text=CPU
FontFace=System Rounded
FontSize=15
FontWeight=600
FontColor=#Dim#
AntiAlias=1
X=42
Y=15

[MeterValue]
Meter=String
MeasureName=MeasureCPU
Text=%1%
NumOfDecimals=0
FontFace=System Rounded
FontSize=40
FontWeight=700
FontColor=#Ink#
AntiAlias=1
X=14
Y=46

[MeterBar]
Meter=Shape
Shape=Rectangle 16,114,138,6,3 | Fill Color #Track# | StrokeWidth 0
Shape2=Rectangle 16,114,(Max(138 * [MeasureCPU:] / 100, 6)),6,3 | Fill Color #Accent# | StrokeWidth 0
DynamicVariables=1

[MeterCaption]
Meter=String
Text=All cores
FontFace=System
FontSize=11
FontColor=#Dim#
AntiAlias=1
X=16
Y=134
