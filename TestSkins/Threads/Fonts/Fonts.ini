; Font-heavy fixture (original content) for the "threads" stress suite (docs/skin-threading.md §10, phase 1): several
; copies of this skin lay out and draw many faces, weights, effects and inline styles at once from threads of their
; own, with texts that change at every update. The suite writes two fonts into @Resources/Fonts (families
; DesksetThrA and DesksetThrB, renamed copies of a system font) before it starts, and keeps adding and removing the
; second one while the skins run; without them those meters use the fallback font.
[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
BackgroundMode=2
SolidColor=250,250,250,255

[Metadata]
Name=Fonts
Author=Deskset
License=Original test fixture

[Variables]
Ink=20,20,20,255

[MeasureCount]
Measure=Calc
Formula=Counter

[MeasureRandom]
Measure=Calc
Formula=Random
LowBound=0
HighBound=99999
UpdateRandom=1

[Line]
FontSize=11
FontColor=#Ink#
AntiAlias=1
X=6
Y=1R

[Arial]
Meter=String
MeterStyle=Line
MeasureName=MeasureCount
FontFace=Arial
Y=4
Text=Arial %1 - The quick brown fox
[SegoeLight]
Meter=String
MeterStyle=Line
MeasureName=MeasureRandom
FontFace=Segoe UI Light
Text=Segoe UI Light %1
[SegoeHeavy]
Meter=String
MeterStyle=Line
MeasureName=MeasureCount
FontFace=Segoe UI
FontWeight=900
StringStyle=Italic
Text=Segoe UI 900 italic %1
[Consolas]
Meter=String
MeterStyle=Line
MeasureName=MeasureRandom
FontFace=Consolas
StringEffect=Border
FontEffectColor=200,0,0,255
Text=Consolas border %1
[Times]
Meter=String
MeterStyle=Line
MeasureName=MeasureCount
FontFace=Times New Roman
StringStyle=BoldItalic
StringEffect=Shadow
Text=Times New Roman %1
[YaHei]
Meter=String
MeterStyle=Line
MeasureName=MeasureCount
FontFace=Microsoft YaHei
Text=Microsoft YaHei 微软雅黑 %1
[Missing]
Meter=String
MeterStyle=Line
MeasureName=MeasureRandom
FontFace=No Such Font Anywhere
Text=A face nobody has %1
[Wrapped]
Meter=String
MeterStyle=Line
MeasureName=MeasureRandom
FontFace=Helvetica Neue
W=150
ClipString=2
ClipStringH=60
Text=Wrapped text that is long enough to wrap onto more lines than one, number %1
[Inline]
Meter=String
MeterStyle=Line
MeasureName=MeasureCount
FontFace=Arial
Text=Inline bold, italic, big and colored %1
InlinePattern=bold
InlineSetting=Weight | 700
InlinePattern2=italic
InlineSetting2=Italic
InlinePattern3=big
InlineSetting3=Size | 16
InlinePattern4=colored
InlineSetting4=Color | 0,120,220,255
InlinePattern5=Inline
InlineSetting5=Face | DesksetThrB
[Turned]
Meter=String
MeterStyle=Line
MeasureName=MeasureCount
FontFace=Georgia
Angle=0.2
Y=6R
Text=Georgia turned %1
[Right]
Meter=String
MeterStyle=Line
MeasureName=MeasureRandom
FontFace=Menlo
StringAlign=Right
X=300
Text=Menlo right %1
[SkinFontB]
Meter=String
MeterStyle=Line
MeasureName=MeasureCount
FontFace=DesksetThrB
X=6
Y=14R
Text=Comes and goes %1

; A face from this skin's own @Resources/Fonts, which stays: monospaced i's are wider than the fallback's (the suite
; checks it).
[Mono]
Meter=String
MeterStyle=Line
FontFace=DesksetThrA
FontSize=20
Text=iiiiiiiiiiii
