; Slideshow fixture (original content) for the "threads" stress suite (docs/skin-threading.md §10, phase 1): several
; copies of this skin show the same photos at once from threads of their own, while the main thread replaces photos
; and purges the image cache. The suite writes the photos (@Resources/Photos/1.png … 8.png, each a size of its own)
; into its copy of the skins before it starts; without them the meters are empty.
[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
BackgroundMode=2
SolidColor=20,22,28,255

[Metadata]
Name=Slideshow
Author=Deskset
License=Original test fixture

[Variables]
Photos=#@#Photos\

[MeasureIndex]
Measure=Loop
StartValue=1
EndValue=8

[MeasureOther]
Measure=Loop
StartValue=1
EndValue=8
Increment=3

[MeasureTurn]
Measure=Loop
StartValue=0
EndValue=36
MaxValue=36

; Decoded as is, no size given: the meter takes the photo's own size (the suite checks it).
[Native]
Meter=Image
ImageName=#Photos#[MeasureIndex].png
DynamicVariables=1
X=0
Y=0

[Fitted]
Meter=Image
ImageName=#Photos#[MeasureOther].png
PreserveAspectRatio=1
W=160
H=120
DynamicVariables=1
X=0
Y=0R

; Derived images: cropped, tinted, turned, flipped and grey.
[Thumb]
Meter=Image
ImageName=#Photos#[MeasureOther].png
ImageCrop=10,10,120,90,1
ImageTint=255,200,160,220
ImageRotate=90
ImageFlip=Horizontal
Greyscale=1
W=60
H=80
DynamicVariables=1
X=0R
Y=r

[Tiled]
Meter=Image
ImageName=#Photos#[MeasureIndex].png
Tile=1
W=48
H=48
DynamicVariables=1
X=0R
Y=r

[Masked]
Meter=Image
ImageName=#Photos#[MeasureOther].png
MaskImageName=#Photos#1.png
W=64
H=48
DynamicVariables=1
X=0R
Y=r

[Sliced]
Meter=Image
ImageName=#Photos#[MeasureIndex].png
ScaleMargins=20,20,20,20
W=90
H=40
DynamicVariables=1
X=0
Y=4R

[Spinner]
Meter=Rotator
MeasureName=MeasureTurn
ImageName=#Photos#2.png
W=80
H=80
OffsetX=40
OffsetY=30
X=0R
Y=r

[Level]
Meter=Bar
MeasureName=MeasureTurn
BarImage=#Photos#3.png
BarOrientation=Horizontal
W=120
H=12
X=0
Y=0R

[Caption]
Meter=String
MeasureName=MeasureIndex
Text=Photo %1 of 8
FontFace=Segoe UI
FontSize=9
FontColor=230,230,230
AntiAlias=1
X=0
Y=2R
