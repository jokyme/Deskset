; Deskset example skin — original work, MIT licensed.
; Two volumes: the startup disk and a second disk chosen with Volume2 (an external or network drive).
[Rainmeter]
Update=5000
AccurateText=1
Group=Deskset
MouseOverAction=#HoverOn#
MouseLeaveAction=#HoverOff#
ContextTitle=Open Disk Utility
ContextAction=["/System/Applications/Utilities/Disk Utility.app"]
ContextTitle2=Show One Volume
ContextAction2=[!ActivateConfig "#CURRENTCONFIG#" "Disk.ini"]
ContextTitle3=#ThemeMenuTitle#
ContextAction3=#ThemeMenuAction#

[Metadata]
Name=Disks
Author=Deskset
Information=Used and free space of the startup disk and of a second disk. Set Volume2 in [Variables] to the disk to show (for example /Volumes/Backup); while it is not connected the skin says so. Click a name to open the disk in Finder.
Version=1.0
License=MIT

[Variables]
@Include=#@#Variables.inc
@Include2=#@#Styles.inc
PanelHeight=170
Volume1=/
; The second disk: /Volumes/<its name>. Volume2Name is shown while it is not connected.
Volume2=/Volumes/Backup
Volume2Name=Backup
BarColor1=#DiskColor#
BarColor1B=#DiskColor2#
BarColor2=#DiskColor#
BarColor2B=#DiskColor2#

; ---------------------------------------------------------------- measures: first disk
; MeasurePercentN is the used share in percent (0 while the disk is missing); the bars and labels use it.
; IgnoreRemovable=0: external drives often count as removable, which FreeDiskSpace skips by default.

[MeasureTotal1]
Measure=FreeDiskSpace
Drive=#Volume1#
Total=1
IgnoreRemovable=0

[MeasureUsed1]
Measure=FreeDiskSpace
Drive=#Volume1#
InvertMeasure=1
IgnoreRemovable=0

[MeasureFree1]
Measure=FreeDiskSpace
Drive=#Volume1#
IgnoreRemovable=0

[MeasureLabel1]
Measure=FreeDiskSpace
Drive=#Volume1#
Label=1

[MeasurePercent1]
Measure=Calc
Formula=MeasureTotal1 > 0 ? MeasureUsed1 / MeasureTotal1 * 100 : 0
IfCondition=MeasurePercent1 >= 90
IfTrueAction=[!SetVariable BarColor1 "#LowColor#"][!SetVariable BarColor1B "#LowColor2#"]
IfFalseAction=[!SetVariable BarColor1 "#DiskColor#"][!SetVariable BarColor1B "#DiskColor2#"]

; ---------------------------------------------------------------- measures: second disk

[MeasureTotal2]
Measure=FreeDiskSpace
Drive=#Volume2#
Total=1
IgnoreRemovable=0

[MeasureUsed2]
Measure=FreeDiskSpace
Drive=#Volume2#
InvertMeasure=1
IgnoreRemovable=0

[MeasureFree2]
Measure=FreeDiskSpace
Drive=#Volume2#
IgnoreRemovable=0

; The volume name, or Volume2Name while the disk is not there.
[MeasureLabel2]
Measure=FreeDiskSpace
Drive=#Volume2#
Label=1
RegExpSubstitute=1
Substitute="^$":"#Volume2Name#"

[MeasurePercent2]
Measure=Calc
Formula=MeasureTotal2 > 0 ? MeasureUsed2 / MeasureTotal2 * 100 : 0
IfCondition=MeasurePercent2 >= 90
IfTrueAction=[!SetVariable BarColor2 "#LowColor#"][!SetVariable BarColor2B "#LowColor2#"]
IfFalseAction=[!SetVariable BarColor2 "#DiskColor#"][!SetVariable BarColor2B "#DiskColor2#"]
IfCondition2=MeasureTotal2 = 0
IfTrueAction2=[!HideMeterGroup Details2][!ShowMeter MeterMissing2]
IfFalseAction2=[!ShowMeterGroup Details2][!HideMeter MeterMissing2]

; ---------------------------------------------------------------- styles

[StyleName]
FontSize=10
FontWeight=600
ToolTipText=Open in Finder

[StylePercent]
FontSize=10
FontWeight=600
NumOfDecimals=0
Text=%1%
DynamicVariables=1

[StyleDetail]
FontSize=9
AutoScale=1
NumOfDecimals=1

; ---------------------------------------------------------------- meters

[MeterBackground]
Meter=Shape
MeterStyle=StylePanel

[MeterTitle]
Meter=String
MeterStyle=StyleText | StyleTitle
Text=Disks

; ---- first disk

[MeterName1]
Meter=String
MeterStyle=StyleText | StyleName | StyleLink
MeasureName=MeasureLabel1
X=#Padding#
Y=44
LeftMouseUpAction=["#Volume1#"]

[MeterPercent1]
Meter=String
MeterStyle=StyleText | StyleValueRight | StyleDigits | StylePercent
MeasureName=MeasurePercent1
FontColor=#BarColor1#

[MeterBar1]
Meter=Shape
MeterStyle=StyleTrack
Y=66
Shape2=Rectangle 0,0,([MeasurePercent1:] > 0 ? Max(#TrackHeight#, #ContentWidth# * [MeasurePercent1:] / 100) : 0),#TrackHeight#,(#TrackHeight# / 2) | Fill LinearGradient Fill1 | StrokeWidth 0
Fill1=180 | #BarColor1# ; 0.0 | #BarColor1B# ; 1.0

[MeterFree1]
Meter=String
MeterStyle=StyleText | StyleDigits | StyleDetail
MeasureName=MeasureFree1
X=#Padding#
Y=80
Text=%1B free
InlineSetting2=Color | #SubtleColor#
InlinePattern2= free$

[MeterTotal1]
Meter=String
MeterStyle=StyleText | StyleValueRight | StyleDigits | StyleDetail
MeasureName=MeasureTotal1
FontColor=#SubtleColor#
Text=%1B total

; ---- second disk

[MeterName2]
Meter=String
MeterStyle=StyleText | StyleName | StyleLink
MeasureName=MeasureLabel2
X=#Padding#
Y=106
LeftMouseUpAction=["#Volume2#"]

[MeterPercent2]
Meter=String
MeterStyle=StyleText | StyleValueRight | StyleDigits | StylePercent
MeasureName=MeasurePercent2
FontColor=#BarColor2#
Group=Details2

[MeterBar2]
Meter=Shape
MeterStyle=StyleTrack
Y=128
Shape2=Rectangle 0,0,([MeasurePercent2:] > 0 ? Max(#TrackHeight#, #ContentWidth# * [MeasurePercent2:] / 100) : 0),#TrackHeight#,(#TrackHeight# / 2) | Fill LinearGradient Fill2 | StrokeWidth 0
Fill2=180 | #BarColor2# ; 0.0 | #BarColor2B# ; 1.0

[MeterFree2]
Meter=String
MeterStyle=StyleText | StyleDigits | StyleDetail
MeasureName=MeasureFree2
X=#Padding#
Y=142
Text=%1B free
InlineSetting2=Color | #SubtleColor#
InlinePattern2= free$
Group=Details2

[MeterTotal2]
Meter=String
MeterStyle=StyleText | StyleValueRight | StyleDigits | StyleDetail
MeasureName=MeasureTotal2
FontColor=#SubtleColor#
Text=%1B total
Group=Details2

; Shown instead of the details while the second disk is not connected.
[MeterMissing2]
Meter=String
MeterStyle=StyleText | StyleDetail
X=#Padding#
Y=142
FontColor=#SubtleColor#
Text=Not connected
ToolTipText=Set Volume2 in Volumes.ini to choose the disk shown here.
Hidden=1
