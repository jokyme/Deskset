; Deskset example skin — original work, MIT licensed.
; Used and free space of the startup disk. Volumes.ini is a variant that also shows a second volume.
[Rainmeter]
Update=5000
AccurateText=1
Group=Deskset
MouseOverAction=#HoverOn#
MouseLeaveAction=#HoverOff#
ContextTitle=Open Disk Utility
ContextAction=["/System/Applications/Utilities/Disk Utility.app"]
ContextTitle2=Show Two Volumes
ContextAction2=[!ActivateConfig "#CURRENTCONFIG#" "Volumes.ini"]
ContextTitle3=#ThemeMenuTitle#
ContextAction3=#ThemeMenuAction#

[Metadata]
Name=Disk
Author=Deskset
Information=Used and free space of the startup disk. Click the name to open the disk in Finder. To show another disk, set Volume in [Variables] (for example /Volumes/Backup); while it is not connected the skin says so.
Version=2.0
License=MIT

[Variables]
@Include=#@#Variables.inc
@Include2=#@#Styles.inc
PanelHeight=98
; The volume to show: / is the startup disk; another disk is /Volumes/<its name>.
Volume=/
BarColor=#DiskColor#
BarColor2=#DiskColor2#

; ---------------------------------------------------------------- measures
; IgnoreRemovable=0: external drives often count as removable, which FreeDiskSpace skips by default.

[MeasureTotal]
Measure=FreeDiskSpace
Drive=#Volume#
Total=1
IgnoreRemovable=0

; FreeDiskSpace gives free bytes; InvertMeasure=1 turns that into used bytes.
[MeasureUsed]
Measure=FreeDiskSpace
Drive=#Volume#
InvertMeasure=1
IgnoreRemovable=0

[MeasureFree]
Measure=FreeDiskSpace
Drive=#Volume#
IgnoreRemovable=0

; The volume name (the path while the disk is not connected).
[MeasureLabel]
Measure=FreeDiskSpace
Drive=#Volume#
Label=1
RegExpSubstitute=1
Substitute="^$":"#Volume#"

; Used share in percent (0 while the disk is missing). Warn in amber when the disk is more than 90 % full.
[MeasurePercent]
Measure=Calc
Formula=MeasureTotal > 0 ? MeasureUsed / MeasureTotal * 100 : 0
IfCondition=MeasurePercent >= 90
IfTrueAction=[!SetVariable BarColor "#LowColor#"][!SetVariable BarColor2 "#LowColor2#"]
IfFalseAction=[!SetVariable BarColor "#DiskColor#"][!SetVariable BarColor2 "#DiskColor2#"]
IfCondition2=MeasureTotal = 0
IfTrueAction2=[!HideMeterGroup Details][!ShowMeter MeterMissing]
IfFalseAction2=[!ShowMeterGroup Details][!HideMeter MeterMissing]

; ---------------------------------------------------------------- meters

[MeterBackground]
Meter=Shape
MeterStyle=StylePanel

; The volume name opens the disk in Finder and lights up under the pointer.
[MeterTitle]
Meter=String
MeterStyle=StyleText | StyleTitle | StyleLink
MeasureName=MeasureLabel
ToolTipText=Open in Finder
LeftMouseUpAction=["#Volume#"]

[MeterPercent]
Meter=String
MeterStyle=StyleText | StyleValueRight | StyleDigits
MeasureName=MeasurePercent
FontSize=11
FontWeight=600
FontColor=#BarColor#
DynamicVariables=1
NumOfDecimals=0
Text=%1%
Group=Details

[MeterBar]
Meter=Shape
MeterStyle=StyleTrack
Y=46
Shape2=Rectangle 0,0,([MeasurePercent:] > 0 ? Max(#TrackHeight#, #ContentWidth# * [MeasurePercent:] / 100) : 0),#TrackHeight#,(#TrackHeight# / 2) | Fill LinearGradient UsedFill | StrokeWidth 0
UsedFill=180 | #BarColor# ; 0.0 | #BarColor2# ; 1.0

[MeterFree]
Meter=String
MeterStyle=StyleText | StyleDigits
MeasureName=MeasureFree
X=#Padding#
Y=62
FontSize=9
AutoScale=1
NumOfDecimals=1
Text=%1B free
InlineSetting2=Color | #SubtleColor#
InlinePattern2= free$
Group=Details

[MeterTotal]
Meter=String
MeterStyle=StyleText | StyleValueRight | StyleDigits
MeasureName=MeasureTotal
FontSize=9
FontColor=#SubtleColor#
AutoScale=1
NumOfDecimals=1
Text=%1B total
Group=Details

; Shown instead of the details while the disk is not connected.
[MeterMissing]
Meter=String
MeterStyle=StyleText
X=#Padding#
Y=62
FontSize=9
FontColor=#SubtleColor#
Text=Not connected
ToolTipText=Set Volume in Disk.ini to choose the disk shown here.
Hidden=1
