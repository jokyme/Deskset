; Deskset example skin — original work, MIT licensed.
; Digital clock: weekday, time with seconds, date and a progress line for the current minute.
[Rainmeter]
Update=1000
AccurateText=1
Group=Deskset
MouseOverAction=#HoverOn#
MouseLeaveAction=#HoverOff#
ContextTitle=#ClockMenuTitle#
ContextAction=[!WriteKeyValue Variables ClockHours "(36 - #ClockHours#)" "#@#Variables.inc"][!Refresh]
ContextTitle2=Use Analog Clock
ContextAction2=[!ActivateConfig "#CURRENTCONFIG#" "Dial.ini"]
ContextTitle3=#ThemeMenuTitle#
ContextAction3=#ThemeMenuAction#

[Metadata]
Name=Clock
Author=Deskset
Information=Digital clock with seconds, weekday, date and week number. Right-click to switch between 24- and 12-hour time. Colors and font come from @Resources/Variables.inc.
Version=2.0
License=MIT

[Variables]
@Include=#@#Variables.inc
@Include2=#@#Styles.inc
PanelHeight=132
ClockMenuTitle24=Use 12-Hour Time
ClockMenuTitle12=Use 24-Hour Time
ClockMenuTitle=[#ClockMenuTitle[#ClockHours]]

; ---------------------------------------------------------------- measures

; MeterTime shows MeasureTime24 or MeasureTime12, picked by ClockHours in Variables.inc.
[MeasureTime24]
Measure=Time
Format=%H:%M

[MeasureTime12]
Measure=Time
Format=%#I:%M

[MeasureSeconds]
Measure=Time
Format=%S

; AM / PM for the 12-hour mode (MeasureSuffix24 is empty).
[MeasureSuffix24]
Measure=String
String=

[MeasureSuffix12]
Measure=Time
Format=%p
FormatLocale=#Locale#

[MeasureWeekday]
Measure=Time
Format=%A
FormatLocale=#Locale#

[MeasureDate]
Measure=Time
Format=#DateFormat#
FormatLocale=#Locale#

; ISO week number without the leading zero (the Calc turns "09" into 9).
[MeasureWeekText]
Measure=Time
Format=%V

[MeasureWeek]
Measure=Calc
Formula=MeasureWeekText

; ---------------------------------------------------------------- meters

[MeterBackground]
Meter=Shape
MeterStyle=StylePanel

[MeterWeekday]
Meter=String
MeterStyle=StyleText | StyleLabel
MeasureName=MeasureWeekday
X=#Padding#
Y=18
FontColor=#AccentColor#

[MeterWeek]
Meter=String
MeterStyle=StyleText | StyleLabel | StyleValueRight
MeasureName=MeasureWeek
Text=Week %1

[MeterTime]
Meter=String
MeterStyle=StyleText | StyleDigits
MeasureName=MeasureTime#ClockHours#
X=(#Padding# - 3)
Y=30
FontSize=36
FontWeight=300

[MeterSeconds]
Meter=String
MeterStyle=StyleText | StyleDigits
MeasureName=MeasureSeconds
X=5R
Y=25r
FontSize=15
FontWeight=400
FontColor=#SubtleColor#

; AM / PM above the seconds; empty in 24-hour mode.
[MeterSuffix]
Meter=String
MeterStyle=StyleText | StyleLabel
MeasureName=MeasureSuffix#ClockHours#
X=1r
Y=-13r

[MeterDate]
Meter=String
MeterStyle=StyleText
MeasureName=MeasureDate
X=#Padding#
Y=88
FontSize=10
FontColor=#SubtleColor#

; The minute so far, as a thin rounded line.
[MeterMinute]
Meter=Shape
MeterStyle=StyleTrack
Y=112
Shape=Rectangle 0,0,#ContentWidth#,3,1.5 | Fill Color #TrackColor# | StrokeWidth 0
Shape2=Rectangle 0,0,(Max(3, #ContentWidth# * ([MeasureSeconds:] + 1) / 60)),3,1.5 | Fill LinearGradient MinuteFill | StrokeWidth 0
MinuteFill=180 | #AccentColor# ; 0.0 | #AccentColor2# ; 1.0
