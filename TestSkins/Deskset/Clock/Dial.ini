; Deskset example skin — original work, MIT licensed.
; Analog clock: a round face drawn with one Shape meter (the minute and hour marks are dashed circles),
; hands drawn with Roundline meters that turn with the time.
[Rainmeter]
Update=1000
AccurateText=1
Group=Deskset
MouseOverAction=#HoverOn#
MouseLeaveAction=#HoverOff#
ContextTitle=Use Digital Clock
ContextAction=[!ActivateConfig "#CURRENTCONFIG#" "Clock.ini"]
ContextTitle2=#ThemeMenuTitle#
ContextAction2=#ThemeMenuAction#

[Metadata]
Name=Analog Clock
Author=Deskset
Information=Analog clock with hour, minute and second hands and the day of the month. Colors come from @Resources/Variables.inc. Size: change Size in [Variables].
Version=1.0
License=MIT

[Variables]
@Include=#@#Variables.inc
@Include2=#@#Styles.inc
; Diameter of the face in pixels; everything else scales with it.
Size=184
Center=(#Size# / 2)
Radius=(#Size# / 2)

; ---------------------------------------------------------------- measures

; No Format: the number is the local time in seconds, which ValueRemainder turns into hand positions.
[MeasureTime]
Measure=Time

[MeasureDay]
Measure=Time
Format=%a %#d
FormatLocale=#Locale#

; ---------------------------------------------------------------- face

; Named MeterBackground so the shared hover effect brightens its rim.
[MeterBackground]
Meter=Shape
; Face: a disc with a vertical gradient and a hairline rim.
Shape=Ellipse #Center#,#Center#,(#Radius# - 0.5) | Fill LinearGradient FaceFill | StrokeWidth 1 | Stroke Color #PanelBorderNow#
FaceFill=270 | #FaceTop# ; 0.0 | #FaceBottom# ; 1.0
; Minute marks: a circle stroked with 60 short dashes. Dash and gap are multiples of StrokeWidth (4),
; so a 1 px dash is 0.25 and the gap fills the rest of 1/60 of the circumference.
Shape2=Ellipse #Center#,#Center#,(#Radius# * 0.87) | Fill Color 0,0,0,0 | StrokeWidth (#Size# / 46) | Stroke Color #TickColor# | StrokeDashes 0.25,(2 * PI * #Radius# * 0.87 / 60 / (#Size# / 46) - 0.25) | StrokeDashOffset 0.125
; Hour marks: 12 longer, wider dashes.
Shape3=Ellipse #Center#,#Center#,(#Radius# * 0.85) | Fill Color 0,0,0,0 | StrokeWidth (#Size# / 20) | Stroke Color #TickMajorColor# | StrokeDashes 0.3,(2 * PI * #Radius# * 0.85 / 12 / (#Size# / 20) - 0.3) | StrokeDashOffset 0.15
DynamicVariables=1

[StyleNumeral]
FontFace=#FontFace#
FontSize=(#Size# / 13)
FontWeight=500
FontColor=#TextColor#
StringAlign=CenterCenter
AntiAlias=1

[Meter12]
Meter=String
MeterStyle=StyleNumeral
X=#Center#
Y=(#Center# - #Radius# * 0.62)
Text=12

[Meter3]
Meter=String
MeterStyle=StyleNumeral
X=(#Center# + #Radius# * 0.64)
Y=#Center#
Text=3

[Meter6]
Meter=String
MeterStyle=StyleNumeral
X=#Center#
Y=(#Center# + #Radius# * 0.62)
Text=6

[Meter9]
Meter=String
MeterStyle=StyleNumeral
X=(#Center# - #Radius# * 0.64)
Y=#Center#
Text=9

; Weekday and day of the month, above the 6. The size follows the face (8 at the default Size), but stays readable.
[MeterDay]
Meter=String
MeterStyle=StyleText | StyleLabel
MeasureName=MeasureDay
X=#Center#
Y=(#Center# + #Radius# * 0.3)
StringAlign=CenterCenter
FontSize=(Max(7, #Size# / 23))
FontColor=#AccentColor#

; ---------------------------------------------------------------- hands

; Styles shared by the hands: the Roundline box is the whole face, so the center of rotation is its center.
; StartAngle 3π/2 points to 12 o'clock; RotationAngle 2π is one full turn clockwise.
[StyleHand]
MeasureName=MeasureTime
X=0
Y=0
W=#Size#
H=#Size#
StartAngle=(PI * 3 / 2)
RotationAngle=(PI * 2)
LineColor=#HandColor#
AntiAlias=1

; 43200 seconds = 12 hours per turn.
[MeterHourHand]
Meter=Roundline
MeterStyle=StyleHand
ValueRemainder=43200
LineStart=0
LineLength=(#Radius# * 0.5)
LineWidth=(#Size# / 34)

; 3600 seconds = 1 hour per turn.
[MeterMinuteHand]
Meter=Roundline
MeterStyle=StyleHand
ValueRemainder=3600
LineStart=0
LineLength=(#Radius# * 0.78)
LineWidth=(#Size# / 56)

[MeterHub]
Meter=Shape
Shape=Ellipse #Center#,#Center#,(#Size# / 36) | Fill Color #HandColor# | StrokeWidth 0

; 60 seconds per turn. A negative LineStart gives the hand a short tail.
[MeterSecondHand]
Meter=Roundline
MeterStyle=StyleHand
ValueRemainder=60
LineStart=(-#Radius# * 0.18)
LineLength=(#Radius# * 0.86)
LineWidth=(#Size# / 120)
LineColor=#SecondHandColor#

[MeterSecondHub]
Meter=Shape
Shape=Ellipse #Center#,#Center#,(#Size# / 70) | Fill Color #SecondHandColor# | StrokeWidth 0
