; Hardware sensors fixture (original content): Plugin=MacSensors on this Mac, next to the Windows plugins that read
; the same catalog (CoreTemp, SpeedFan, MSIAfterburner). Temperatures of the CPU clusters, the GPU and the chip; both
; fans against their own minimum and maximum; whole-Mac, CPU and GPU power; the performance cores' clock; GPU usage;
; battery health. A Mac without a sensor shows an empty value (fanless Macs, desktops without a battery, virtual
; machines). Render with --updates 3 --interval 1100: the first update asks, the readings arrive in the background.
; `!CommandMeasure MeasureCPU List` (a click on the title) logs every sensor this Mac has.
[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
BackgroundMode=2
SolidColor=22,24,30,240

[Metadata]
Name=Sensors
Author=Deskset
Information=Temperatures, fans and power of this Mac (Plugin=MacSensors).
License=MIT
Version=1.0

[Variables]
Text=226,230,238,255
Dim=140,148,162,255
Hot=255,120,90,255
Cool=90,190,255,255
Track=255,255,255,28
Row=22

; ---------- Measures ----------

[MeasureCPU]
Measure=Plugin
Plugin=MacSensors
Sensor=cpu

[MeasureCPUP]
Measure=Plugin
Plugin=MacSensors
Sensor=cpu.performance

[MeasureCPUE]
Measure=Plugin
Plugin=MacSensors
Sensor=cpu.efficiency

[MeasureGPU]
Measure=Plugin
Plugin=MacSensors
Sensor=gpu

[MeasureChip]
Measure=Plugin
Plugin=MacSensors
Sensor=soc

[MeasureChipF]
Measure=Plugin
Plugin=MacSensors
Sensor=soc
Scale=F

[MeasureFan1]
Measure=Plugin
Plugin=MacSensors
Sensor=fan.1

[MeasureFan2]
Measure=Plugin
Plugin=MacSensors
Sensor=fan.2

[MeasurePower]
Measure=Plugin
Plugin=MacSensors
Sensor=power.system

[MeasureCPUPower]
Measure=Plugin
Plugin=MacSensors
Sensor=power.cpu

[MeasureGPUPower]
Measure=Plugin
Plugin=MacSensors
Sensor=power.gpu

[MeasureClock]
Measure=Plugin
Plugin=MacSensors
Sensor=frequency.cpu.performance

[MeasureGPUUsage]
Measure=Plugin
Plugin=MacSensors
Sensor=gpu.usage

[MeasureHealth]
Measure=Plugin
Plugin=MacSensors
Sensor=battery.health

[MeasureCycles]
Measure=Plugin
Plugin=MacSensors
Sensor=battery.cycles

; The Windows plugins over the same sensors.
[MeasureCoreTemp]
Measure=Plugin
Plugin=CoreTemp
CoreTempType=MaxTemperature

[MeasureTjMax]
Measure=Plugin
Plugin=CoreTemp
CoreTempType=TjMax

[MeasureSpeedFan]
Measure=Plugin
Plugin=SpeedFanPlugin
SpeedFanType=Fan
SpeedFanNumber=0

[MeasureAfterburner]
Measure=Plugin
Plugin=Plugins\MSIAfterburner.dll
DataSource=GPU temperature

; ---------- Meters ----------
; Rows: a label on the left, its value on the right; a bar under some rows. StyleRow follows a text row, StyleAfterBar
; a bar, StyleSection starts a group.

[StyleRow]
X=14
Y=20r
FontFace=Helvetica Neue
FontSize=10
FontColor=#Dim#
AntiAlias=1

[StyleAfterBar]
Y=11r

[StyleSection]
Y=28r

[StyleValue]
X=286
Y=0r
StringAlign=Right
FontFace=Helvetica Neue
FontSize=10
FontWeight=600
FontColor=#Text#
AntiAlias=1

[StyleBar]
X=14
Y=18r
W=272
H=3
BarOrientation=Horizontal
BarColor=#Hot#
SolidColor=#Track#

[MeterTitle]
