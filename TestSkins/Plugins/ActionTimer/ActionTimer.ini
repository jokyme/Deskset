; Core plugins regression fixture (original content): ActionTimer.
; OnRefreshAction starts ActionList1: the block slides right in ten 20 ms steps, then the label changes.
; ActionList2 grows the bar with Wait steps. Rendered after ~1 s both animations have finished:
; the block is at X=200, the bar is 150 wide and the label says "done".
[Rainmeter]
Update=1000
AccurateText=1
BackgroundMode=2
SolidColor=24,26,32,240
OnRefreshAction=[!CommandMeasure MeasureMotion "Execute 1"][!CommandMeasure MeasureMotion "Execute 2"]

[Variables]
Status=running

[MeasureMotion]
Measure=Plugin
Plugin=ActionTimer
ActionList1=Repeat Slide, 20, 10 | Wait 20 | Done
Slide=[!SetOption MeterBlock X "([MeterBlock:X]+18)"][!UpdateMeter MeterBlock][!Redraw]
Done=[!SetVariable Status "done"][!UpdateMeter MeterLabel][!Redraw]
ActionList2=Grow | Wait 30 | Grow | Wait 30 | Grow
Grow=[!SetOption MeterBar W "([MeterBar:W]+50)"][!UpdateMeter MeterBar][!Redraw]
IgnoreWarnings=1

[MeterTrack]
Meter=Image
X=10
Y=10
W=220
H=24
SolidColor=60,64,72,255

[MeterBlock]
Meter=Image
X=20
Y=12
W=20
H=20
SolidColor=110,190,255,255

[MeterBar]
Meter=Image
X=10
Y=44
W=0
H=10
SolidColor=255,170,90,255

[MeterLabel]
Meter=String
X=10
Y=62
FontSize=12
FontColor=235,235,240,255
AntiAlias=1
DynamicVariables=1
Text=ActionTimer: #Status#
