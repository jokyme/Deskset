; Core plugins regression fixture (original content): process and CPU plugins on this Mac.
; UsageMonitor top processes (CPU % of the whole machine and private memory), AdvancedCPU busiest process,
; PerfMon processor time (raw difference, inverted like old skins do), CoreTemp per-core load and CPU name,
; RecycleManager item count and a localhost ping. Render with --updates 3 --interval 1100.
[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
BackgroundMode=2
SolidColor=24,26,32,240

[Variables]
Pong=waiting

[MeasureTop1]
Measure=Plugin
Plugin=UsageMonitor
Alias=CPU
Index=1
Blacklist=_Total|Idle|System

[MeasureTop2]
Measure=Plugin
Plugin=UsageMonitor
Alias=CPU
Index=2
Blacklist=_Total|Idle|System

[MeasureTopRAM]
Measure=Plugin
Plugin=UsageMonitor
Alias=RAM
Index=1

[MeasureRAMScaled]
Measure=Calc
Formula=MeasureTopRAM

[MeasureMachine]
Measure=Plugin
Plugin=AdvancedCPU

[MeasureBusiest]
Measure=Plugin
Plugin=AdvancedCPU
CPUExclude=Idle
TopProcess=2

[MeasureBusiestTime]
Measure=Plugin
Plugin=AdvancedCPU
CPUExclude=Idle
TopProcess=1
MaxValue=[MeasureMachine]
DynamicVariables=1

[MeasureIdleTicks]
Measure=Plugin
Plugin=Plugins\PerfMon.dll
PerfMonObject=Processor
PerfMonCounter=% Processor Time
PerfMonInstance=_Total
InvertMeasure=1

[MeasureLoad0]
Measure=Plugin
Plugin=CoreTemp
CoreTempType=Load
CoreTempIndex=0
MaxValue=100

[MeasureLoad1]
Measure=Plugin
Plugin=CoreTemp
CoreTempType=Load
CoreTempIndex=1
MaxValue=100

[MeasureCpuName]
Measure=Plugin
Plugin=CoreTemp
CoreTempType=CpuName

[MeasureTrash]
Measure=RecycleManager
RecycleType=Count

[MeasurePing]
Measure=Plugin
Plugin=PingPlugin
DestAddress=127.0.0.1
FinishAction=[!SetVariable Pong "[MeasurePing] ms"][!UpdateMeter MeterPing][!Redraw]

[TextStyle]
FontSize=11
FontColor=225,228,235,255
AntiAlias=1
X=10
Y=4R

[MeterTitle]
Meter=String
MeterStyle=TextStyle
Y=8
FontSize=13
FontColor=110,190,255,255
MeasureName=MeasureCpuName
Text=%1

[MeterTop1]
Meter=String
MeterStyle=TextStyle
DynamicVariables=1
Text=Top CPU: [MeasureTop1] [MeasureTop1:1]%

[MeterTop2]
Meter=String
MeterStyle=TextStyle
DynamicVariables=1
Text=Next: [MeasureTop2] [MeasureTop2:1]%

[MeterRAM]
Meter=String
MeterStyle=TextStyle
MeasureName=MeasureTopRAM
MeasureName2=MeasureRAMScaled
AutoScale=1
NumOfDecimals=1
Text=Top memory: %1 %2B

[MeterBusiest]
Meter=String
MeterStyle=TextStyle
MeasureName=MeasureBusiest
MeasureName2=MeasureBusiestTime
Percentual=1
NumOfDecimals=1
Text=AdvancedCPU busiest: %1 (%2% of the Mac)

[MeterLoadLabel]
Meter=String
MeterStyle=TextStyle
Text=Core loads (CoreTemp) and processor time (PerfMon):

[MeterLoad0]
Meter=Bar
MeasureName=MeasureLoad0
X=10
Y=4R
W=220
H=8
BarColor=110,190,255,255
SolidColor=60,64,72,255
BarOrientation=Horizontal

[MeterLoad1]
Meter=Bar
MeasureName=MeasureLoad1
X=10
Y=3R
W=220
H=8
BarColor=110,190,255,255
SolidColor=60,64,72,255
BarOrientation=Horizontal

[MeterIdle]
Meter=Bar
MeasureName=MeasureIdleTicks
X=10
Y=3R
W=220
H=8
BarColor=255,170,90,255
SolidColor=60,64,72,255
BarOrientation=Horizontal

[MeterTrash]
Meter=String
MeterStyle=TextStyle
MeasureName=MeasureTrash
Text=Items in the Trash: %1

[MeterPing]
Meter=String
MeterStyle=TextStyle
DynamicVariables=1
Text=Ping 127.0.0.1: #Pong#
