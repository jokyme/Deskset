; Core plugins regression fixture (original content): FileView, FolderInfo and QuotePlugin on this skin's own
; @Resources/Notes folder. FileView lists "..", Sub, alpha.txt, beta.txt (Count=4) with sizes; FolderInfo counts
; 3 files / 1 folder recursively; QuotePlugin shows one line of @Resources/quotes.txt.
[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
BackgroundMode=2
SolidColor=24,26,32,240

[MeasureFolder]
Measure=Plugin
Plugin=FileView
Path=#@#Notes
Count=4
ShowHidden=0
FinishAction=[!UpdateMeasureGroup Items][!UpdateMeter *][!Redraw]

[MeasureName1]
Measure=Plugin
Plugin=FileView
Path=[MeasureFolder]
Type=FileName
Index=1
Group=Items
[MeasureName2]
Measure=Plugin
Plugin=FileView
Path=[MeasureFolder]
Type=FileName
Index=2
Group=Items
[MeasureName3]
Measure=Plugin
Plugin=FileView
Path=[MeasureFolder]
Type=FileName
Index=3
Group=Items
[MeasureSize3]
Measure=Plugin
Plugin=FileView
Path=[MeasureFolder]
Type=FileSize
Index=3
Group=Items
[MeasureName4]
Measure=Plugin
Plugin=FileView
Path=[MeasureFolder]
Type=FileName
Index=4
Group=Items
[MeasureSize4]
Measure=Plugin
Plugin=FileView
Path=[MeasureFolder]
Type=FileSize
Index=4
Group=Items

[MeasureNotesFiles]
Measure=Plugin
Plugin=FolderInfo
Folder=#@#Notes
InfoType=FileCount
IncludeSubFolders=1
[MeasureNotesFolders]
Measure=Plugin
Plugin=FolderInfo
Folder=[MeasureNotesFiles]
InfoType=FolderCount
[MeasureNotesSize]
Measure=Plugin
Plugin=FolderInfo
Folder=[MeasureNotesFiles]
InfoType=FolderSize

[MeasureQuote]
Measure=Plugin
Plugin=QuotePlugin
PathName=#@#quotes.txt

[TextStyle]
FontSize=11
FontColor=225,228,235,255
AntiAlias=1
X=10
Y=3R

[MeterHeader]
Meter=String
MeterStyle=TextStyle
Y=8
FontColor=110,190,255,255
Text=FileView (Count=4):
[MeterItem1]
Meter=String
MeterStyle=TextStyle
MeasureName=MeasureName1
Text=  %1
[MeterItem2]
Meter=String
MeterStyle=TextStyle
MeasureName=MeasureName2
Text=  %1 (folder)
[MeterItem3]
Meter=String
MeterStyle=TextStyle
MeasureName=MeasureName3
MeasureName2=MeasureSize3
Text=  %1  %2 bytes
[MeterItem4]
Meter=String
MeterStyle=TextStyle
MeasureName=MeasureName4
MeasureName2=MeasureSize4
Text=  %1  %2 bytes
[MeterInfo]
Meter=String
MeterStyle=TextStyle
MeasureName=MeasureNotesFiles
MeasureName2=MeasureNotesFolders
MeasureName3=MeasureNotesSize
Text=FolderInfo: %1 files, %2 folder, %3 bytes
[MeterQuote]
Meter=String
MeterStyle=TextStyle
MeasureName=MeasureQuote
FontColor=255,210,150,255
Text=“%1”
