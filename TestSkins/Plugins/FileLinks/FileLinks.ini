; FileView regression fixture (original content): Type=Icon of symbolic links. Safari in /Applications is a symbolic
; link on macOS 26 and the startup disk in /Volumes is a symbolic link to /; both must show the icon of what they lead
; to, without Finder's arrow, like the plain app and the disk beside them. The icons go to the settings folder (a
; temporary one in --render), never into this folder.
[Rainmeter]
Update=500
AccurateText=1
BackgroundMode=2
SolidColor=236,236,240,255
SkinWidth=336
SkinHeight=112

[Variables]
Cache=#SETTINGSPATH#Cache/FileLinks/

[MeasureSafariList]
Measure=Plugin
Plugin=FileView
Path=/Applications/
WildcardSearch=Safari.app
ShowDotDot=0
Count=1
UpdateDivider=-1

[MeasureSafari]
Measure=Plugin
Plugin=FileView
Path=[MeasureSafariList]
Type=Icon
Index=1
IconSize=ExtraLarge
IconPath=#Cache#Safari.png

[MeasureCalculatorList]
Measure=Plugin
Plugin=FileView
Path=/System/Applications/
WildcardSearch=Calculator.app
ShowDotDot=0
Count=1
UpdateDivider=-1

[MeasureCalculator]
Measure=Plugin
Plugin=FileView
Path=[MeasureCalculatorList]
Type=Icon
Index=1
IconSize=ExtraLarge
IconPath=#Cache#Calculator.png

[MeasureVolumes]
; the first mounted volume; on most Macs the startup disk, a symbolic link to /
Measure=Plugin
Plugin=FileView
Path=/Volumes/
ShowDotDot=0
ShowHidden=0
Count=1
UpdateDivider=-1

[MeasureVolume]
Measure=Plugin
Plugin=FileView
Path=[MeasureVolumes]
Type=Icon
Index=1
IconSize=ExtraLarge
IconPath=#Cache#Volume.png

[MeasureVolumeName]
Measure=Plugin
Plugin=FileView
Path=[MeasureVolumes]
Type=FileName
Index=1

[MeasureRootList]
; /System/ lists ".." first: its icon is the one of /, the startup disk itself
Measure=Plugin
Plugin=FileView
Path=/System/
ShowDotDot=1
Count=1
UpdateDivider=-1

[MeasureRoot]
Measure=Plugin
Plugin=FileView
Path=[MeasureRootList]
Type=Icon
Index=1
IconSize=ExtraLarge
IconPath=#Cache#Root.png

[StyleIcon]
Y=12
W=64
H=64
PreserveAspectRatio=1

[StyleLabel]
X=32r
Y=82
FontFace=System
FontSize=8
FontColor=40,40,48,255
StringAlign=Center
AntiAlias=1

[MeterSafari]
Meter=Image
MeasureName=MeasureSafari
MeterStyle=StyleIcon
X=12

[MeterSafariLabel]
Meter=String
MeterStyle=StyleLabel
Text=Safari (link)

[MeterCalculator]
Meter=Image
MeasureName=MeasureCalculator
MeterStyle=StyleIcon
X=96

[MeterCalculatorLabel]
Meter=String
MeterStyle=StyleLabel
Text=Calculator

[MeterVolume]
Meter=Image
MeasureName=MeasureVolume
MeterStyle=StyleIcon
X=180

[MeterVolumeLabel]
Meter=String
MeasureName=MeasureVolumeName
MeterStyle=StyleLabel
Text=%1 (link)

[MeterRoot]
Meter=Image
MeasureName=MeasureRoot
MeterStyle=StyleIcon
X=264

[MeterRootLabel]
Meter=String
MeterStyle=StyleLabel
Text=/
