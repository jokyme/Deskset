; Core plugins regression fixture (original content): RunCommand.
; OnRefreshAction runs a POSIX command (captured output, value 1), a Windows-only PowerShell command (error 103,
; FinishAction still runs), a translated cmd.exe "echo a & echo b" (output "a" and "b" on two lines) and a POSIX
; pipeline with quotes, a redirection and a command name cmd.exe shares (sort) that must reach the shell unchanged.
[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
BackgroundMode=2
SolidColor=24,26,32,240
OnRefreshAction=[!CommandMeasure MeasureKernel "Run"][!CommandMeasure MeasurePowerShell "Run"][!CommandMeasure MeasureTwo "Run"][!CommandMeasure MeasurePipeline "Run"]

[MeasureKernel]
Measure=Plugin
Plugin=RunCommand
Parameter=uname -s
RegExpSubstitute=1
Substitute="\s+$":""
FinishAction=[!UpdateMeasure MeasureKernel][!UpdateMeter *][!Redraw]

[MeasurePowerShell]
Measure=Plugin
Plugin=RunCommand
Program=PowerShell
Parameter=(Get-CimInstance -ClassName Win32_Processor).Name
FinishAction=[!UpdateMeasure MeasurePowerShell][!UpdateMeter *][!Redraw]

[MeasureTwo]
Measure=Plugin
Plugin=RunCommand
Parameter=echo a & echo b
RegExpSubstitute=1
Substitute="\n$":"","\n":" / "
FinishAction=[!UpdateMeasure MeasureTwo][!UpdateMeter *][!Redraw]

[MeasurePipeline]
Measure=Plugin
Plugin=RunCommand
Parameter=printf 'b|2\na|1\n' 2>&1 | sort | tr '\n' ' '
FinishAction=[!UpdateMeasure MeasurePipeline][!UpdateMeter *][!Redraw]

[TextStyle]
FontSize=11
FontColor=225,228,235,255
AntiAlias=1
X=10
Y=4R
DynamicVariables=1

[MeterKernel]
Meter=String
MeterStyle=TextStyle
Y=8
Text=uname -s: "[MeasureKernel]" (code [MeasureKernel:])
[MeterPowerShell]
Meter=String
MeterStyle=TextStyle
Text=PowerShell: code [MeasurePowerShell:] (103 = cannot start)
[MeterTwo]
Meter=String
MeterStyle=TextStyle
Text=cmd "echo a & echo b": [MeasureTwo] (code [MeasureTwo:])
[MeterPipeline]
Meter=String
MeterStyle=TextStyle
Text=printf | sort: [MeasurePipeline](code [MeasurePipeline:])
