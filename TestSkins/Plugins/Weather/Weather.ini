; Weather plugins regression fixture (original content): Plugin=MacWeather and Plugin=MacSun (Deskset extensions).
; Current conditions, the next hours, the next days, sun times, status and attribution.
; Offline except in a skin window: the self-tests install the MET Norway fixture forecast and a fixed clock;
; --render and the thread stress suite show the Preview state (sun times still work);
; DESKSET_WEATHER_DEMO=1 Deskset --render Weather.ini --out weather.png --updates 2 renders demo data.
[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
BackgroundMode=2
SolidColor=22,24,30,235
ContextTitle=Refresh weather
ContextAction=[!CommandMeasure MeasureWeather "Refresh"]
ContextTitle2=Use my location
ContextAction2=[!WriteKeyValue Variables Location auto][!Refresh]

[Metadata]
Name=Weather (plugin fixture)
Author=Deskset
Information=Regression fixture for Plugin=MacWeather and Plugin=MacSun.
License=Original test fixture
Version=1

[Variables]
Location=Oslo, NO
Units=Metric
Text=232,234,240
Subtle=148,154,166
Accent=120,180,255
Face=System Font

; ---------------------------------------------------------------- now
[MeasureWeather]
Measure=Plugin
Plugin=MacWeather
Location=#Location#
Units=#Units#
Type=Temperature
Decimals=0
UnavailableText=--
FinishAction=[!UpdateMeter *][!Redraw]
OnLocationErrorAction=[!Log "Weather fixture: location error [MeasureStatus]"]

[MeasureFeelsLike]
Measure=Plugin
Plugin=MacWeather
Parent=MeasureWeather
Type=FeelsLike

[MeasureCondition]
Measure=Plugin
Plugin=MacWeather
Parent=MeasureWeather
Type=Condition

[MeasureSymbol]
Measure=Plugin
Plugin=MacWeather
Parent=MeasureWeather
Type=Symbol

[MeasureHigh]
Measure=Plugin
Plugin=MacWeather
Parent=MeasureWeather
Type=High
Day=0

[MeasureLow]
Measure=Plugin
Plugin=MacWeather
Parent=MeasureWeather
Type=Low
Day=0

[MeasureHumidity]
Measure=Plugin
Plugin=MacWeather
Parent=MeasureWeather
Type=Humidity

[MeasureWind]
Measure=Plugin
Plugin=MacWeather
Parent=MeasureWeather
Type=Wind

[MeasureWindUnit]
Measure=Plugin
Plugin=MacWeather
Parent=MeasureWeather
Type=WindUnit

[MeasureWindFrom]
Measure=Plugin
Plugin=MacWeather
Parent=MeasureWeather
Type=WindCardinal

[MeasureRainChance]
Measure=Plugin
Plugin=MacWeather
Parent=MeasureWeather
Type=PrecipitationChance

[MeasurePlace]
Measure=Plugin
Plugin=MacWeather
Parent=MeasureWeather
Type=Place

[MeasureStatus]
Measure=Plugin
Plugin=MacWeather
Parent=MeasureWeather
Type=Status
Format=%H:%M
IfCondition=MeasureStatus = 3
IfTrueAction=[!ShowMeter MeterSetLocation]
IfFalseAction=[!HideMeter MeterSetLocation]

[MeasureUpdated]
Measure=Plugin
Plugin=MacWeather
Parent=MeasureWeather
Type=UpdatedAt
Format=%H:%M

[MeasureAttribution]
Measure=Plugin
Plugin=MacWeather
Parent=MeasureWeather
Type=Attribution

[MeasureSourceURL]
Measure=Plugin
Plugin=MacWeather
Parent=MeasureWeather
Type=AttributionURL

