; FrostedGlass regression fixture (original content): an acrylic, rounded background with a light tint behind
; translucent content; clicking the label toggles the blur, the corner and dark mode through the plugin commands.
[Rainmeter]
Update=1000
AccurateText=1
SkinWidth=260
SkinHeight=110

[Metadata]
Name=FrostedGlass test
Author=Deskset
License=Original test fixture

[FrostedGlass]
Measure=Plugin
Plugin=FrostedGlass
Type=Acrylic
Corner=Round
Border=All
Backdrop=255,255,255,30
BorderVisible=1

[Panel]
Meter=Shape
Shape=Rectangle 0,0,260,110,8 | Fill Color 255,255,255,40 | StrokeWidth 0

[Title]
Meter=String
X=16
Y=14
FontFace=Helvetica Neue
FontSize=14
FontWeight=600
FontColor=255,255,255,235
AntiAlias=1
Text=Frosted glass

[Toggle]
Meter=String
X=16
Y=8R
FontSize=9
FontColor=255,255,255,200
AntiAlias=1
Text=Toggle blur · corner · dark mode
LeftMouseUpAction=[!CommandMeasure FrostedGlass "ToggleBlur"]
MiddleMouseUpAction=[!CommandMeasure FrostedGlass "ToggleCorner"]
RightMouseUpAction=[!CommandMeasure FrostedGlass "ToggleMode"]

[Value]
Meter=String
MeasureName=FrostedGlass
X=16
Y=8R
FontSize=8
FontColor=255,255,255,160
AntiAlias=1
Text=effect on: %1
