; WiFiStatus regression fixture (original content): every WiFiInfoType, a quality bar and a network list.
; The SSID and the list need Location Services on current macOS (see docs/compat/media-ui.md).
[Rainmeter]
Update=2000
DynamicWindowSize=1
AccurateText=1
BackgroundMode=2
SolidColor=16,24,20,235

[Metadata]
Name=WiFiStatus test
Author=Deskset
License=Original test fixture

[MeasureSSID]
Measure=WiFiStatus
WiFiInfoType=SSID
Substitute="":"(name hidden)"

[MeasureQuality]
Measure=Plugin
Plugin=WiFiStatus.dll
WiFiInfoType=QUALITY

[MeasureRate]
Measure=WiFiStatus
WiFiInfoType=TXRATE

[MeasureCipher]
Measure=WiFiStatus
WiFiInfoType=ENCRYPTION

[MeasureAuth]
Measure=WiFiStatus
WiFiInfoType=AUTH

[MeasurePHY]
Measure=WiFiStatus
WiFiInfoType=PHY

[MeasureList]
Measure=WiFiStatus
WiFiInfoType=LIST
WiFiListStyle=5
WiFiListLimit=4

[StyleLine]
FontFace=Menlo
FontSize=8
FontColor=180,230,200,255
AntiAlias=1
X=10
Y=2R

[Header]
Meter=String
MeasureName=MeasureSSID
X=10
Y=8
FontFace=Helvetica Neue
FontSize=12
FontColor=230,255,240,255
AntiAlias=1

[QualityBar]
Meter=Bar
MeasureName=MeasureQuality
X=10
Y=6R
W=220
H=5
BarColor=90,220,150,255
SolidColor=40,60,50,255
BarOrientation=Horizontal

[Details]
Meter=String
MeterStyle=StyleLine
MeasureName=MeasureQuality
MeasureName2=MeasureRate
MeasureName3=MeasurePHY
Y=6R
Text=quality %1%   link %2 kbps   %3
NumOfDecimals=0

[Security]
Meter=String
MeterStyle=StyleLine
MeasureName=MeasureCipher
MeasureName2=MeasureAuth
Text=security %1 / %2

[List]
Meter=String
MeterStyle=StyleLine
MeasureName=MeasureList
Y=6R
FontColor=140,190,160,255
