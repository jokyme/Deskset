; NowPlaying regression fixture (original content): a main measure naming the player, child measures with
; PlayerName=[MeasurePlayer], every PlayerType, Substitute on the cover and state, TrackChangeAction and the
; playback commands. Render with DESKSET_NOWPLAYING_DEMO=1 for fixed demo data.
[Rainmeter]
Update=500
DynamicWindowSize=1
AccurateText=1
BackgroundMode=2
SolidColor=22,26,34,240

[Metadata]
Name=NowPlaying test
Author=Deskset
License=Original test fixture

[Variables]
Player=iTunes
Changes=0
Text=220,226,236,255
Dim=140,150,165,255
Accent=110,190,255,255

; ---------------------------------------------------------------- measures

[MeasurePlayer]
Measure=NowPlaying
PlayerName=#Player#
PlayerType=Title
DisableLeadingZero=1
TrackChangeAction=[!SetVariable Changes (#Changes#+1)][!UpdateMeter MeterChanges]
Substitute="":"Nothing playing"

[MeasureArtist]
Measure=NowPlaying
PlayerName=[MeasurePlayer]
PlayerType=Artist

[MeasureAlbum]
Measure=NowPlaying
PlayerName=[MeasurePlayer]
PlayerType=Album

[MeasureYear]
Measure=NowPlaying
PlayerName=[MeasurePlayer]
PlayerType=Year

[MeasureNumber]
Measure=NowPlaying
PlayerName=[MeasurePlayer]
PlayerType=Number

[MeasureCover]
Measure=NowPlaying
PlayerName=[MeasurePlayer]
PlayerType=Cover
Substitute="":"#@#NoCover.png"

[MeasurePosition]
Measure=NowPlaying
PlayerName=[MeasurePlayer]
PlayerType=Position

[MeasureDuration]
Measure=NowPlaying
PlayerName=[MeasurePlayer]
PlayerType=Duration

[MeasureProgress]
Measure=NowPlaying
PlayerName=[MeasurePlayer]
PlayerType=Progress

[MeasureVolume]
Measure=NowPlaying
PlayerName=[MeasurePlayer]
PlayerType=Volume

[MeasureRating]
Measure=NowPlaying
PlayerName=[MeasurePlayer]
PlayerType=Rating

[MeasureState]
Measure=NowPlaying
PlayerName=[MeasurePlayer]
PlayerType=State
Substitute="0":"Stopped","1":"Playing","2":"Paused"

[MeasureStatus]
Measure=NowPlaying
PlayerName=[MeasurePlayer]
PlayerType=Status
Substitute="0":"closed","1":"open"

[MeasureShuffle]
Measure=Plugin
Plugin=Plugins\NowPlaying.dll
PlayerName=[MeasurePlayer]
PlayerType=SHUFFLE

[MeasureRepeat]
Measure=Plugin
Plugin=NowPlaying
PlayerName=[MeasurePlayer]
PlayerType=REPEAT

; ---------------------------------------------------------------- meters

[StyleText]
FontFace=Helvetica Neue
FontSize=9
FontColor=#Text#
AntiAlias=1

[MeterCover]
Meter=Image
MeasureName=MeasureCover
X=10
Y=10
W=72
H=72
PreserveAspectRatio=1
SolidColor=40,46,58,255

[MeterTitle]
Meter=String
MeterStyle=StyleText
MeasureName=MeasurePlayer
X=94
Y=10
W=200
FontSize=12
FontWeight=600
ClipString=1

[MeterArtistAlbum]
Meter=String
MeterStyle=StyleText
MeasureName=MeasureArtist
MeasureName2=MeasureAlbum
MeasureName3=MeasureYear
X=94
Y=4R
W=200
ClipString=1
FontColor=#Dim#
Text=%1 - %2 (%3)

[MeterTrackInfo]
Meter=String
MeterStyle=StyleText
MeasureName=MeasureNumber
MeasureName2=MeasureState
MeasureName3=MeasureStatus
X=94
Y=2R
FontColor=#Dim#
Text=Track %1 · %2 · player %3

[MeterProgressBack]
Meter=Shape
X=94
Y=66
Shape=Rectangle 0,0,200,4,2 | Fill Color 60,68,84,255 | StrokeWidth 0

[MeterProgress]
Meter=Bar
MeasureName=MeasureProgress
X=94
Y=66
W=200
H=4
BarColor=#Accent#
BarOrientation=Horizontal

[MeterTime]
Meter=String
MeterStyle=StyleText
MeasureName=MeasurePosition
MeasureName2=MeasureDuration
X=94
Y=74
FontColor=#Dim#
Text=%1 / %2

[MeterFlags]
Meter=String
MeterStyle=StyleText
MeasureName=MeasureVolume
MeasureName2=MeasureRating
MeasureName3=MeasureShuffle
MeasureName4=MeasureRepeat
X=94
Y=2R
FontColor=#Dim#
Text=vol %1 · ★%2 · shuffle %3 · repeat %4

[MeterPrevious]
Meter=String
MeterStyle=StyleText
X=10
Y=110
Text=Previous
SolidColor=40,46,58,255
Padding=6,3,6,3
LeftMouseUpAction=[!CommandMeasure MeasurePlayer "Previous"]

[MeterPlayPause]
Meter=String
MeterStyle=StyleText
X=6R
Y=r
Text=Play / Pause
SolidColor=40,46,58,255
Padding=6,3,6,3
LeftMouseUpAction=[!CommandMeasure MeasurePlayer "PlayPause"]

[MeterNext]
Meter=String
MeterStyle=StyleText
X=6R
Y=r
Text=Next
SolidColor=40,46,58,255
Padding=6,3,6,3
LeftMouseUpAction=[!CommandMeasure MeasurePlayer "Next"]
MouseScrollUpAction=[!CommandMeasure MeasurePlayer "SetVolume +5"]
MouseScrollDownAction=[!CommandMeasure MeasurePlayer "SetVolume -5"]

[MeterChanges]
Meter=String
MeterStyle=StyleText
X=300
Y=113
StringAlign=Right
FontColor=#Dim#
DynamicVariables=1
Text=track changes: #Changes#
