; InputText regression fixture (original content): a note field (click to edit, Enter saves, Escape cancels),
; a two-step batch with per-command overrides, a number-only field and a password field.
[Rainmeter]
Update=1000
DynamicWindowSize=1
AccurateText=1
BackgroundMode=2
SolidColor=245,240,225,250

[Metadata]
Name=InputText test
Author=Deskset
License=Original test fixture

[Variables]
Note=Click here to write a note
First=first
Second=second
Count=3
Dismissed=0

[MeasureInput]
Measure=Plugin
Plugin=InputText
X=8
Y=8
W=264
H=22
SolidColor=255,255,250,255
FontColor=60,50,30
FontFace=Georgia
FontSize=11
FocusDismiss=1
DefaultValue=#Note#
OnDismissAction=[!SetVariable Dismissed (#Dismissed#+1)][!UpdateMeter Status][!Redraw]
Command1=[!SetVariable Note "$UserInput$"][!UpdateMeter Note][!Redraw]
Command2=[!SetVariable First "$UserInput$"] Y=40 DefaultValue="#First#"
Command3=[!SetVariable Second "$UserInput$"][!SetVariable Both "[MeasureInput] and #First#"] Y=62 DefaultValue="#Second#" StringStyle=Italic
Command4=!SetVariable Count "$UserInput$" X=200 Y=84 W=72 InputNumber=1 InputLimit=4 StringAlign=Right DefaultValue="#Count#"
Command5=[!Log "secret has $UserInput$"] Y=([Secret:Y]) Password=1 DefaultValue=""

[Note]
Meter=String
X=12
Y=12
W=260
FontFace=Georgia
FontSize=11
FontColor=60,50,30,255
AntiAlias=1
ClipString=1
DynamicVariables=1
Text=#Note#
LeftMouseUpAction=[!CommandMeasure MeasureInput "ExecuteBatch 1"]

[Pair]
Meter=String
X=12
Y=40
FontSize=9
FontColor=90,80,60,255
AntiAlias=1
DynamicVariables=1
Text=#First# · #Second# (edit both)
LeftMouseUpAction=[!CommandMeasure MeasureInput "ExecuteBatch 2-3"]

[CountLabel]
Meter=String
X=12
Y=84
FontSize=9
FontColor=90,80,60,255
AntiAlias=1
DynamicVariables=1
Text=count = #Count# (numbers only)
LeftMouseUpAction=[!CommandMeasure MeasureInput "ExecuteBatch 4"]

[Secret]
Meter=String
X=12
Y=106
FontSize=9
FontColor=90,80,60,255
AntiAlias=1
Text=password field
LeftMouseUpAction=[!CommandMeasure MeasureInput "ExecuteBatch 5"]

[Status]
Meter=String
X=12
Y=128
FontSize=8
FontColor=140,130,110,255
AntiAlias=1
DynamicVariables=1
Text=dismissed #Dismissed# times
