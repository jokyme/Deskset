; iTunesPlugin regression fixture (original content): the deprecated plugin's Command=Get… measures, a
; Command=PlayPause measure driven by the old !PluginBang form, and DefaultArtwork.
[Rainmeter]
Update=1000
DynamicWindowSize=1
AccurateText=1
BackgroundMode=2
SolidColor=250,248,244,245

[Metadata]
Name=iTunesPlugin test
Author=Deskset
License=Original test fixture

[mName]
Measure=Plugin
Plugin=Plugins\iTunesPlugin.dll
Command=GetCurrentTrackName

[mArtist]
Measure=Plugin
Plugin=iTunesPlugin
Command=GetCurrentTrackArtist

[mTime]
Measure=Plugin
Plugin=iTunesPlugin
Command=GetCurrentTrackTime

[mPosition]
Measure=Plugin
Plugin=iTunesPlugin
Command=GetPlayerPosition

[mPercent]
Measure=Plugin
Plugin=iTunesPlugin
Command=GetPlayerPositionPercent
MaxValue=100

[mRating]
Measure=Plugin
Plugin=iTunesPlugin
Command=GetCurrentTrackRating

[mVolume]
Measure=Plugin
Plugin=iTunesPlugin
Command=GetSoundVolume

[mArt]
Measure=Plugin
Plugin=iTunesPlugin
Command=GetCurrentTrackArtwork
DefaultArtwork=..\@Resources\NoCover.png

[mPlayPause]
Measure=Plugin
Plugin=iTunesPlugin
Command=PlayPause

[mMinutes]
Measure=Calc
Formula=Floor(mPosition / 60)

[mSeconds]
Measure=Calc
Formula=mPosition % 60

[Art]
Meter=Image
MeasureName=mArt
X=8
Y=8
W=56
H=56

[Name]
Meter=String
MeasureName=mName
MeasureName2=mArtist
X=72
Y=10
FontFace=Georgia
FontSize=11
FontColor=40,36,30,255
AntiAlias=1
Text=%1#CRLF#%2

[Clock]
Meter=String
MeasureName=mMinutes
MeasureName2=mSeconds
MeasureName3=mTime
MeasureName4=mRating
MeasureName5=mVolume
X=72
Y=48
FontSize=8
FontColor=110,100,90,255
AntiAlias=1
NumOfDecimals=0
Text=%1:%2 of %3 · rating %4 · volume %5
LeftMouseUpAction=!RainmeterPluginBang mPlayPause

[Bar]
Meter=Bar
MeasureName=mPercent
X=8
Y=72
W=260
H=3
BarColor=200,120,60,255
SolidColor=225,218,208,255
BarOrientation=Horizontal
