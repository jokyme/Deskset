; NowPlaying regression fixture (original content): song information whose measures each name the player and update
; rarely (UpdateDivider=100 at Update=200: every 20 s) while the meters update five times a second, as in some
; song-information skins. The meters must show a new track at once: a plugin's string value is read whenever it is
; needed (on demand), not only when the measure updates. Also the iTunes plugin and WebNowPlaying forms.
[Rainmeter]
Update=200
DynamicWindowSize=1
AccurateText=1

[Metadata]
Name=NowPlaying live strings test
Author=Deskset
License=Original test fixture

[Variables]
Player=iTunes
TrackChanges=0

[MeasureState]
Measure=NowPlaying
PlayerName=#Player#
PlayerType=State
UpdateDivider=2

[MeasureTrack]
Measure=NowPlaying
PlayerName=#Player#
PlayerType=Title
Substitute="":"No track"
OnChangeAction=[!SetVariable TrackChanges (#TrackChanges#+1)]
UpdateDivider=100

[MeasureArtist]
Measure=NowPlaying
PlayerName=#Player#
PlayerType=Artist
UpdateDivider=100

[MeasureDuration]
Measure=NowPlaying
PlayerName=#Player#
PlayerType=Duration
UpdateDivider=100

[MeasureOldTitle]
Measure=Plugin
Plugin=iTunesPlugin
Command=GetCurrentTrackName
UpdateDivider=100

[MeasureWebTitle]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Title
UpdateDivider=100

; A child measure takes its main measure's DisableLeadingZero.
[MeasureLength]
Measure=NowPlaying
PlayerName=#Player#
PlayerType=Duration
DisableLeadingZero=1
UpdateDivider=100

[MeasureLengthChild]
Measure=NowPlaying
PlayerName=[MeasureLength]
PlayerType=Duration
UpdateDivider=100

[MeasureCover]
Measure=NowPlaying
PlayerName=#Player#
PlayerType=Cover
Substitute="":"nocover.png"
UpdateDivider=100

; "Hide when the player quits": the title updates, then the status disables it in the same update.
[MeasureGone]
Measure=NowPlaying
PlayerName=#Player#
PlayerType=Title
Substitute="":"Not playing"

[MeasureQuit]
Measure=NowPlaying
PlayerName=#Player#
PlayerType=Status
IfCondition=MeasureQuit = 0
IfTrueAction=[!DisableMeasure MeasureGone]

[MeterTrack]
Meter=String
MeasureName=MeasureTrack
FontSize=14
FontColor=255,255,255,255
AntiAlias=1

[MeterArtist]
Meter=String
MeasureName=MeasureArtist
Y=0R
FontColor=255,255,255,255
AntiAlias=1

[MeterLine]
Meter=String
Text=[MeasureArtist] - [MeasureTrack] ([MeasureDuration])
DynamicVariables=1
Y=0R
FontColor=255,255,255,255
AntiAlias=1

[MeterOldTitle]
Meter=String
MeasureName=MeasureOldTitle
Y=0R
FontColor=255,255,255,255
AntiAlias=1

[MeterWebTitle]
Meter=String
MeasureName=MeasureWebTitle
Y=0R
FontColor=255,255,255,255
AntiAlias=1

[MeterLengthChild]
Meter=String
MeasureName=MeasureLengthChild
Y=0R
FontColor=255,255,255,255
AntiAlias=1

[MeterGone]
Meter=String
MeasureName=MeasureGone
Y=0R
FontColor=255,255,255,255
AntiAlias=1

[MeterCover]
Meter=Image
MeasureName=MeasureCover
Y=0R
W=20
H=20
