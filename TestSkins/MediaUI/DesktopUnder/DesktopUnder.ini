; Chameleon CropDesktop=Skin regression fixture (original content): the wallpaper under the skin window, its colors
; and luminance, and an ink that turns white or dark by it (below 0.32 white, above 0.36 dark, in between it stays).
; The luminance child updates as soon as a new sample is in (the window moved) and tells the ink at once.
; Render it over a picture: Deskset --render DesktopUnder.ini --wallpaper Picture.heic --at X,Y [--appearance dark]
[Rainmeter]
Update=1000
AccurateText=1
SkinWidth=300
SkinHeight=120
BackgroundMode=2
SolidColor=0,0,0,1

[Metadata]
Name=Chameleon under the skin
Author=Deskset
License=Original test fixture

[Variables]
Ink=255,255,255
Halo=0,0,0

[MeasureWall]
Measure=Plugin
Plugin=Chameleon
Type=Desktop
CropDesktop=Skin

[MeasureLuminance]
Measure=Plugin
Plugin=Chameleon
Parent=MeasureWall
Color=Luminance
OnChangeAction=[!UpdateMeasure MeasureDark]

[MeasureBG1]
Measure=Plugin
Plugin=Chameleon
Parent=MeasureWall
Color=Background1
Format=Dec

[MeasureFG1]
Measure=Plugin
Plugin=Chameleon
Parent=MeasureWall
Color=Foreground1
Format=Dec

[MeasureDark]
Measure=Calc
Formula=MeasureDark ? (MeasureLuminance > 0.32) : (MeasureLuminance > 0.36)
IfCondition=MeasureDark = 1
IfTrueAction=[!SetVariable Ink "28,28,30"][!SetVariable Halo "255,255,255"][!UpdateMeter *][!Redraw]
IfFalseAction=[!SetVariable Ink "255,255,255"][!SetVariable Halo "0,0,0"][!UpdateMeter *][!Redraw]

[MeterWord]
Meter=String
Text=Aa
X=16
Y=10
Padding=4,4,4,4
FontFace=New York
FontSize=44
FontColor=#Ink#
InlineSetting=Shadow | 0 | 1 | 3 | #Halo#,120
AntiAlias=1
DynamicVariables=1

[MeterLuminance]
Meter=String
MeasureName=MeasureLuminance
Text=luminance %1
NumOfDecimals=3
X=110
Y=24
Padding=2,2,2,2
FontFace=SF Mono
FontSize=11
FontColor=#Ink#
InlineSetting=Shadow | 0 | 1 | 2 | #Halo#,120
AntiAlias=1
DynamicVariables=1

[MeterWhere]
Meter=String
Text=at #CURRENTCONFIGX#,#CURRENTCONFIGY#
X=110
Y=44
Padding=2,2,2,2
FontFace=SF Mono
FontSize=11
FontColor=#Ink#
InlineSetting=Shadow | 0 | 1 | 2 | #Halo#,120
AntiAlias=1
DynamicVariables=1

[MeterSwatchBG1]
; Background1 and Foreground1 of the part under the skin
Meter=Image
X=18
Y=82
W=120
H=24
SolidColor=[MeasureBG1]
DynamicVariables=1

[MeterSwatchFG1]
Meter=Image
X=150
Y=82
W=120
H=24
SolidColor=[MeasureFG1]
DynamicVariables=1
