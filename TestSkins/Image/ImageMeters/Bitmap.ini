BitmapImage=#Img#Digits.png
BitmapFrames=10
BitmapExtend=1
X=10
Y=68
[E7]
Meter=Bitmap
MeterStyle=Cell
MeasureName=V7
BitmapImage=#Img#Digits.png
BitmapFrames=10
BitmapExtend=1
BitmapDigits=3
BitmapSeparation=2
X=10R
Y=0r
[E12345]
Meter=Bitmap
MeterStyle=Cell
MeasureName=V12345
BitmapImage=#Img#Digits.png
BitmapFrames=10
BitmapExtend=1
BitmapDigits=3
X=10R
Y=0r
[ENeg]
