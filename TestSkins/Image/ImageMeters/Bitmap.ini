; Bitmap meter fixture (original). Render with:
;   .build/debug/Deskset --render TestSkins/Image/ImageMeters/Bitmap.ini --out /tmp/Bitmap.png
[Rainmeter]
Update=1000
BackgroundMode=2
SolidColor=40,40,50

[Metadata]
Name=Bitmap meter fixture
Author=Deskset test fixtures
License=Original test content

[Variables]
Img=#@#Images\

[P0]
Measure=Calc
Formula=0
MaxValue=100
[P19]
Measure=Calc
Formula=19
MaxValue=100
[P20]
Measure=Calc
Formula=20
MaxValue=100
[P1]
Measure=Calc
Formula=1
MaxValue=100
[P100]
Measure=Calc
Formula=100
MaxValue=100
[V42]
Measure=Calc
Formula=42
[V7]
Measure=Calc
Formula=7
[V12345]
Measure=Calc
Formula=12345
[VNeg]
Measure=Calc
Formula=-305.6

[Label]
FontFace=Helvetica
FontSize=9
FontColor=230,230,230
AntiAlias=1
[Cell]
SolidColor=255,255,255,40

[L1]
Meter=String
MeterStyle=Label
X=10
Y=6
Text=Percent: 0 / 19 / 20 / 100   ZeroFrame: 0 / 1 / 100
[B0]
Meter=Bitmap
MeterStyle=Cell
MeasureName=P0
BitmapImage=#Img#Level.png
BitmapFrames=5
X=10
Y=24
[B19]
Meter=Bitmap
MeterStyle=Cell
MeasureName=P19
BitmapImage=#Img#Level.png
BitmapFrames=5
X=4R
Y=0r
[B20]
Meter=Bitmap
MeterStyle=Cell
MeasureName=P20
BitmapImage=#Img#Level.png
BitmapFrames=5
X=4R
Y=0r
[B100]
Meter=Bitmap
MeterStyle=Cell
MeasureName=P100
BitmapImage=#Img#Level.png
BitmapFrames=5
X=4R
Y=0r
[Z0]
Meter=Bitmap
MeterStyle=Cell
MeasureName=P0
BitmapImage=#Img#Level.png
BitmapFrames=5
BitmapZeroFrame=1
X=16R
Y=0r
[Z1]
Meter=Bitmap
MeterStyle=Cell
MeasureName=P1
BitmapImage=#Img#Level.png
BitmapFrames=5
BitmapZeroFrame=1
X=4R
Y=0r
[Z100]
Meter=Bitmap
MeterStyle=Cell
