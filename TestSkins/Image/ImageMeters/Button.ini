; Button meter fixture (original). Render with:
;   .build/debug/Deskset --render TestSkins/Image/ImageMeters/Button.ini --out /tmp/Button.png
; In the app: hover shows the light frame, pressing the dark one; ButtonCommand counts clicks on opaque pixels.
[Rainmeter]
Update=1000
BackgroundMode=2
SolidColor=40,40,50
DynamicWindowSize=1

[Metadata]
Name=Button meter fixture
Author=Deskset test fixtures
License=Original test content

[Variables]
Clicks=0

[Label]
FontFace=Helvetica
FontSize=10
FontColor=230,230,230
AntiAlias=1

[MeterButton]
Meter=Button
ButtonImage=#@#Images\Button.png
ButtonCommand=[!SetVariable Clicks "(#Clicks#+1)"][!UpdateMeter MeterText][!Redraw]
X=10
Y=10
W=500
H=500

[MeterButtonGrey]
Meter=Button
ImagePath=#@#Images
ButtonImage=Button
Greyscale=1
ImageFlip=Vertical
X=10R
Y=0r
MouseOverAction=[!SetOption MeterText Text "Over the grey button"][!UpdateMeter MeterText][!Redraw]
MouseLeaveAction=[!SetOption MeterText Text "Clicks: #Clicks#"][!UpdateMeter MeterText][!Redraw]

[MeterText]
Meter=String
MeterStyle=Label
X=10
Y=8R
Text=Clicks: #Clicks#
DynamicVariables=1
