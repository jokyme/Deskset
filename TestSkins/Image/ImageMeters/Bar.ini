; Bar meter fixture (original). Render with:
;   .build/debug/Deskset --render TestSkins/Image/ImageMeters/Bar.ini --out /tmp/Bar.png
[Rainmeter]
Update=1000
BackgroundMode=2
SolidColor=40,40,50

[Metadata]
Name=Bar meter fixture
Author=Deskset test fixtures
License=Original test content

[Variables]
Img=#@#Images\

[M0]
Measure=Calc
Formula=0
[M37]
Measure=Calc
Formula=37
MaxValue=100
[M50]
Measure=Calc
Formula=50
MaxValue=100
[M100]
Measure=Calc
Formula=250
MinValue=50
MaxValue=250

[Label]
FontFace=Helvetica
FontSize=9
FontColor=230,230,230
AntiAlias=1
[Track]
SolidColor=255,255,255,40

[L1]
Meter=String
MeterStyle=Label
X=10
Y=6
Text=Horizontal 0 / 37 / 100 / 37 flip
[BarH0]
Meter=Bar
MeterStyle=Track
MeasureName=M0
X=10
Y=24
W=150
H=10
BarOrientation=Horizontal
[BarH37]
Meter=Bar
MeterStyle=Track
MeasureName=M37
X=10
Y=4R
W=150
H=10
BarOrientation=Horizontal
[BarH100]
Meter=Bar
MeterStyle=Track
MeasureName=M100
X=10
Y=4R
W=150
H=10
BarOrientation=Horizontal
BarColor=255,160,40
[BarH37Flip]
Meter=Bar
MeterStyle=Track
MeasureName=M37
X=10
Y=4R
W=150
H=10
BarOrientation=Horizontal
BarColor=80,160,255
Flip=1

[L2]
Meter=String
MeterStyle=Label
X=330
Y=6
Text=Vertical 37% / flip / 50%
[BarV37]
Meter=Bar
MeterStyle=Track
MeasureName=M37
X=330
Y=24
W=14
H=60
BarColor=80,220,120
[BarV37Flip]
Meter=Bar
MeterStyle=Track
MeasureName=M37
X=6R
Y=0r
W=14
H=60
BarColor=220,120,80
Flip=1
[BarV50Hex]
Meter=Bar
MeterStyle=Track
MeasureName=M50
X=6R
Y=0r
W=14
H=60
BarColor=E0E040
BarOrientation=vertical

[L3]
Meter=String
MeterStyle=Label
X=10
Y=100
Text=BarImage 0 / 50 border 3 / 50 flip / 100 / tint
[BarImg0]
Meter=Bar
MeterStyle=Track
MeasureName=M0
X=10
Y=118
BarImage=#Img#BarH.png
BarOrientation=Horizontal
BarBorder=3
[BarImg50]
Meter=Bar
MeterStyle=Track
MeasureName=M50
X=10
Y=4R
BarImage=#Img#BarH.png
BarOrientation=Horizontal
BarBorder=3
[BarImg50Flip]
Meter=Bar
MeterStyle=Track
MeasureName=M50
X=10
Y=4R
BarImage=#Img#BarH.png
BarOrientation=Horizontal
BarBorder=3
Flip=1
[BarImg100]
Meter=Bar
MeterStyle=Track
MeasureName=M100
X=10
Y=4R
ImagePath=#@#Images
BarImage=BarH
BarOrientation=Horizontal
[BarImgTint]
Meter=Bar
MeterStyle=Track
MeasureName=M50
X=10
Y=4R
BarImage=#Img#BarH.png
BarOrientation=Horizontal
Greyscale=1
ImageTint=120,200,255

[L4]
Meter=String
MeterStyle=Label
X=330
Y=100
Text=V image 37 / flip / 0 / 40x70
[BarImgV37]
Meter=Bar
MeterStyle=Track
MeasureName=M37
X=330
Y=118
BarImage=#Img#BarV.png
BarBorder=4
[BarImgV37Flip]
Meter=Bar
MeterStyle=Track
MeasureName=M37
X=6R
Y=0r
BarImage=#Img#BarV.png
BarBorder=4
Flip=1
[BarImgV0]
Meter=Bar
MeterStyle=Track
MeasureName=M0
X=6R
Y=0r
BarImage=#Img#BarV.png
BarBorder=4
[BarImgVSized]
Meter=Bar
MeterStyle=Track
MeasureName=M50
X=6R
Y=0r
W=40
H=70
BarImage=#Img#BarV.png
