; Regression fixture from the adversarial review of the image meters (original content). Render with:
;   .build/debug/Deskset --render TestSkins/Image/ImageMeters/Review.ini --out /tmp/Review.png --scale 1
; It must render without crashing, and:
; - row 1: the three frames are equally faded (ImageAlpha=60 applies to ScaleMargins, Tile and plain images);
; - row 2: the masked images with hostile sizes / transforms draw nothing (and do not crash); the last one is a
;   normal 40x40 masked card for comparison;
; - row 3: "42" centered on the red marker, on whole pixels (odd total width 25).
; SkinWidth/SkinHeight keep the window finite although [HugeMask] is (10**300) wide.
[Rainmeter]
Update=1000
BackgroundMode=2
SolidColor=0,0,0
SkinWidth=220
SkinHeight=150

[Metadata]
Name=Image meter review fixture
Author=Deskset test fixtures
License=Original test content

[Variables]
Img=#@#Images\

[V42]
Measure=Calc
Formula=42

[NineAlpha]
Meter=Image
ImageName=#Img#Frame9.png
X=10
Y=10
W=60
H=40
ScaleMargins=10,10,10,10
ImageAlpha=60

[TileAlpha]
Meter=Image
ImageName=#Img#Frame9.png
X=80
Y=10
W=60
H=40
Tile=1
ImageAlpha=60

[PlainAlpha]
Meter=Image
ImageName=#Img#Frame9.png
X=150
Y=10
W=60
H=40
ImageAlpha=60

[HugeMask]
Meter=Image
ImageName=#Img#Card.png
MaskImageName=#Img#Mask.png
X=10
Y=60
W=(10**300)
H=20

[ScaledMask]
Meter=Image
ImageName=#Img#Card.png
MaskImageName=#Img#Mask.png
X=10
Y=60
W=40
H=40
TransformationMatrix=1e300;0;0;1e300;0;0

[NormalMask]
Meter=Image
ImageName=#Img#Card.png
MaskImageName=#Img#Mask.png
X=170
Y=60
W=40
H=40

[Marker]
Meter=Image
X=110
Y=110
W=1
H=30
SolidColor=255,80,80

[CenteredOdd]
Meter=Bitmap
MeasureName=V42
BitmapImage=#Img#Digits.png
BitmapFrames=10
BitmapExtend=1
BitmapSeparation=1
BitmapAlign=Center
X=110
Y=116
