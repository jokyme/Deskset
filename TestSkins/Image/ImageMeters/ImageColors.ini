; Image colors, formats and masks
; Original fixture for the Image meter renderer (render with:
;   .build/debug/Deskset --render TestSkins/Image/ImageMeters/ImageColors.ini --out /tmp/ImageColors.png --background 40,40,50)
[Rainmeter]
Update=1000
BackgroundMode=2
SolidColor=40,40,50

[Metadata]
Name=Image colors, formats and masks
Author=Deskset test fixtures
License=Original test content

[Variables]
Img=#@#Images\

[Label]
FontFace=Helvetica
FontSize=9
FontColor=230,230,230
AntiAlias=1

[Box]
SolidColor=255,255,255,30

[MeasureName]
Measure=String
String=Card

[Label0]
Meter=String
MeterStyle=Label
X=10
Y=10
Text=Greyscale
[Image0]
Meter=Image
MeterStyle=Box
X=10
Y=26
ImageName=#Img#Card.png
Greyscale=1

