; Original test skin: a ring that fills with the seconds and the time in the middle.
[Rainmeter]
Update=1000
AccurateText=1

[Metadata]
Name=Orbit Clock
Information=Sample skin of the legacy (Rainstaller) package fixture.

[Variables]
@Include=#@#Variables.inc
Size=120

[MeasureTime]
Measure=Time
Format=%H:%M

[MeasureSeconds]
Measure=Time
Format=%S

[MeasureSecondsValue]
Measure=Calc
Formula=MeasureSeconds
MinValue=0
MaxValue=60

[MeterBack]
Meter=Shape
Shape=Ellipse (#Size#/2),(#Size#/2),(#Size#/2 - 4) | Fill Color 20,24,32,220 | StrokeWidth 2 | Stroke Color #Face#,60

[MeterRing]
Meter=Roundline
MeasureName=MeasureSecondsValue
X=0
Y=0
W=#Size#
H=#Size#
StartAngle=4.7124
RotationAngle=6.2832
LineStart=48
LineLength=56
LineColor=#Accent#
Solid=1
AntiAlias=1

[MeterTime]
Meter=String
MeasureName=MeasureTime
X=(#Size#/2)
Y=(#Size#/2)
StringAlign=CenterCenter
FontFace=Helvetica Neue
FontSize=18
FontColor=#Face#
AntiAlias=1
