; Original test skin: old-style paths through #SKINSPATH# (no @Resources), as in many pre-2012 skins.
[Rainmeter]
Update=1000
AccurateText=1

[Variables]
Folder=#SKINSPATH#Pebble\Images\

[MeasureCPU]
Measure=CPU

[MeterPanel]
Meter=Shape
Shape=Rectangle 0,0,160,44,8 | Fill Color 250,245,235,235 | StrokeWidth 0

[MeterDot]
Meter=Image
ImageName=#Folder#dot.png
X=10
Y=12
W=20
H=20

[MeterBar]
Meter=Bar
MeasureName=MeasureCPU
X=40
Y=14
W=110
H=6
BarColor=90,120,90
SolidColor=0,0,0,30
BarOrientation=Horizontal

[MeterLabel]
Meter=String
MeasureName=MeasureCPU
X=40
Y=22
FontFace=Helvetica Neue
FontSize=9
FontColor=60,60,60
Text=CPU %1%
NumOfDecimals=0
AntiAlias=1
