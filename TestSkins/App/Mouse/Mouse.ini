; Deskset test skin (original work): mouse actions versus dragging (manual: Mouse actions).
; - Red: LeftMouseDownAction, so the skin cannot be dragged from here ("LeftMouseDownAction disables dragging").
; - Green: LeftMouseUpAction + LeftMouseDoubleClickAction; dragging works, a double click runs both.
; - Blue: no action. ⌘ (the Mac stand-in for CTRL) overrides click actions and Draggable.
[Rainmeter]
Update=1000

[Metadata]
Name=Mouse and drag
Author=Deskset tests
License=MIT

[Variables]
Down=0
Up=0
Double=0

[MeterDown]
Meter=Image
X=0
Y=0
W=50
H=50
SolidColor=220,70,70,255
LeftMouseDownAction=[!SetVariable Down 1]

[MeterUp]
Meter=Image
X=60
Y=0
W=50
H=50
SolidColor=70,200,110,255
LeftMouseUpAction=[!SetVariable Up 1]
LeftMouseDoubleClickAction=[!SetVariable Double 1]

[MeterPlain]
Meter=Image
X=120
Y=0
W=50
H=50
SolidColor=70,120,220,255
