; Deskset test skin (original work): Windows-only features, for the compatibility notes in the Manage window.
[Rainmeter]
Update=1000

[Metadata]
Name=Windows Only
Author=Deskset tests
Information=Uses a registry measure, a Windows plugin and a Lua script; they should show up as compatibility notes.
Version=0.1

[MeasureRegistry]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=Software\Example
RegValue=Value

[MeasurePlugin]
Measure=Plugin
Plugin=ExampleWindowsPlugin.dll

[MeasureScript]
Measure=Script
ScriptFile=#@#Example.lua

[MeterText]
Meter=String
FontSize=11
FontColor=255,255,255
SolidColor=40,20,20,220
Padding=10,8,10,8
Text=Registry: [MeasureRegistry] · Plugin: [MeasurePlugin]
DynamicVariables=1
AntiAlias=1
