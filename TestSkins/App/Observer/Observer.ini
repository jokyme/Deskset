; Deskset test skin (original work): counts how often other skins load and close. Other skins send
; [!UpdateMeasure MeasureLoads "App\Observer"] / [!UpdateMeasure MeasureCloses "App\Observer"]; each update adds 1
; (the first update on load sets both to 1).
[Rainmeter]
Update=-1

[MeasureLoads]
Measure=Calc
Formula=MeasureLoads + 1

[MeasureCloses]
Measure=Calc
Formula=MeasureCloses + 1

[MeterText]
Meter=String
MeasureName=MeasureLoads
MeasureName2=MeasureCloses
Text=Loads %1 · Closes %2
FontSize=11
FontColor=255,255,255
SolidColor=30,30,40,220
Padding=6,4,6,4
AntiAlias=1
