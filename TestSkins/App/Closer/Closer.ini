; Deskset test skin (original work): an OnCloseAction that loads and unloads other skins. When the app quits, these
; bangs must not load App\Observer (nobody would close it) nor mark App\Focus as unloaded for the next launch.
[Rainmeter]
Update=1000
OnCloseAction=[!ActivateConfig "App\Observer"][!DeactivateConfig "App\Focus"][!ToggleConfig "App\Once"]

[MeterText]
Meter=String
Text=Closer
FontSize=11
FontColor=255,255,255
SolidColor=30,30,40,220
Padding=6,4,6,4
AntiAlias=1
