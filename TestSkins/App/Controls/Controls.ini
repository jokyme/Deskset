; Deskset test skin (original work): buttons that drive window bangs on App\Focus.
[Rainmeter]
Update=-1
Group=DesksetAppTest
ContextTitle=Show #Target#
ContextAction=[!ShowFade "#Target#"]
ContextTitle2=Hide #Target#
ContextAction2=[!HideFade "#Target#"]
ContextTitle3=-----
ContextTitle4=A context title that is far longer than thirty characters
ContextAction4=[!Log "long title clicked"]
ContextTitle5=No action, so not listed

[Metadata]
Name=Window Controls
Author=Deskset tests
Information=Buttons for !HideFade, !ShowFade, !ToggleFade, !FadeDuration, !ZPos, !SetTransparency and !SetWindowPosition on the App\Focus skin.
Version=1.0
License=MIT

[Variables]
@Include=#@#Style.inc
Target=App\Focus

[MeterBackground]
Meter=Image
W=560
H=76
SolidColor=#Panel#

[MeterTitle]
Meter=String
X=12
Y=8
FontFace=#Font#
FontSize=11
FontWeight=600
FontColor=#Text#
Text=Window controls → #Target#
AntiAlias=1

[ButtonHide]
Meter=String
MeterStyle=StyleButton
X=12
Y=38
Text=Hide (fade)
LeftMouseUpAction=[!HideFade "#Target#"]

[ButtonShow]
Meter=String
MeterStyle=StyleButton
Text=Show (fade)
LeftMouseUpAction=[!ShowFade "#Target#"]

[ButtonToggle]
Meter=String
MeterStyle=StyleButton
Text=Toggle
LeftMouseUpAction=[!ToggleFade "#Target#"]

[ButtonSlow]
Meter=String
MeterStyle=StyleButton
Text=Fade 1 s
LeftMouseUpAction=[!FadeDuration 1000 "#Target#"]

[ButtonTop]
Meter=String
MeterStyle=StyleButton
Text=Topmost
LeftMouseUpAction=[!ZPos 1 "#Target#"]

[ButtonHalf]
Meter=String
MeterStyle=StyleButton
Text=50%
LeftMouseUpAction=[!SetTransparency 128 "#Target#"]

[ButtonCenter]
Meter=String
MeterStyle=StyleButton
Text=Center
LeftMouseUpAction=[!SetWindowPosition 50% 50% 50% 50% "#Target#"]
