; Deskset test skin (original work): the Calc Counter "only resets when the skin is unloaded and then loaded again -
; not when the skin is refreshed".
[Rainmeter]
Update=1000

[MeasureCounter]
Measure=Calc
Formula=Counter

[MeterText]
Meter=String
MeasureName=MeasureCounter
Text=Updates since load: %1
FontSize=11
FontColor=255,255,255
SolidColor=30,30,40,220
Padding=6,4,6,4
AntiAlias=1
