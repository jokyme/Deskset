; Deskset test skin (original work): BackgroundMode=4 tiles a 1x1 image over a large skin. Drawing must stay fast
; (one tiled draw, not one draw call per pixel) and must not hang for absurd SkinWidth / SkinHeight values.
[Rainmeter]
Update=1000
Background=#@#Images\Dot.png
BackgroundMode=4
SkinWidth=1200
SkinHeight=900

[MeterLabel]
Meter=String
X=20
Y=20
FontSize=14
FontColor=255,255,255
Text=Tiled 1x1 background
AntiAlias=1
