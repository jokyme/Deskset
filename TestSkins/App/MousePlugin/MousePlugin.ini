; Deskset test skin (original work): a slider driven by the third-party Mouse plugin (Plugin=Mouse), the way
; settings skins use it. The measure starts disabled; the pointer coming over the track enables it; a press on the
; track sets the value, dragging (also outside the skin) changes it, and the release turns the measure off again.
[Rainmeter]
Update=1000

[Metadata]
Name=Mouse plugin slider
Author=Deskset tests
License=MIT

[Variables]
Value=0
Order=
Released=0

[MeasureMouse]
Measure=Plugin
Plugin=Mouse
LeftMouseDownAction=[!SetVariable Order "[#Order]plugin-down "][!SetVariable Value "(Round(Clamp(($MouseX$-[MeterTrack:X])/[MeterTrack:W],0,1)*100))"]
LeftMouseDoubleClickAction=[!SetVariable Order "[#Order]plugin-double "]
LeftMouseDragAction=[!SetVariable Value "(Round(Clamp(($MouseX$-[MeterTrack:X])/[MeterTrack:W],0,1)*100))"]
LeftMouseUpAction=[!SetVariable Order "[#Order]plugin-up "][!SetVariable Released 1][!DisableMeasure MeasureMouse]
UpdateRate=20
Disabled=1
DynamicVariables=1

[MeterBackground]
Meter=Image
W=200
H=60
SolidColor=30,30,30,255

[MeterTrack]
Meter=Image
X=50
Y=25
W=100
H=10
SolidColor=200,200,200,255
MouseOverAction=[!EnableMeasure MeasureMouse]
LeftMouseDownAction=[!SetVariable Order "[#Order]meter-down "][!EnableMeasure MeasureMouse]
LeftMouseUpAction=[!SetVariable Order "[#Order]meter-up "]
