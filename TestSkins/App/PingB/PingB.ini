; Deskset test skin (original work): App\PingB and App\PingA refresh each other from OnRefreshAction. Each refresh
; loads the other skin synchronously, so without a limit the two recursed until the stack overflowed. They must keep
; running (refreshing each other on later run-loop turns, as a skin refreshing itself does).
[Rainmeter]
Update=1000
OnRefreshAction=[!SetVariable Loaded 1][!Refresh "App\PingA"]

[Variables]
Loaded=0

[MeterText]
Meter=String
Text=Ping B
FontSize=11
FontColor=255,255,255
SolidColor=30,30,40,220
Padding=6,4,6,4
AntiAlias=1
