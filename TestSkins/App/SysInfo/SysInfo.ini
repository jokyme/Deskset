; Deskset test skin (original work): shows the system readings the app provides, for visual checks.
[Rainmeter]
Update=1000

[Metadata]
Name=System Readings
Author=Deskset tests
Information=CPU, memory, swap, network, disk, battery, uptime and SysInfo values.
Version=1.0

[Variables]
@Include=#@#Style.inc

[MeasureCPU]
Measure=CPU
[MeasureRAM]
Measure=PhysicalMemory
[MeasureRAMTotal]
Measure=PhysicalMemory
Total=1
[MeasureSwap]
Measure=SwapMemory
[MeasureNetIn]
Measure=NetIn
Interface=Best
[MeasureNetOut]
Measure=NetOut
Interface=Best
[MeasureDisk]
Measure=FreeDiskSpace
Drive=C:
[MeasureDiskTotal]
Measure=FreeDiskSpace
Drive=/
Total=1
[MeasureBattery]
Measure=Plugin
Plugin=PowerPlugin
PowerState=Percent
[MeasureUptime]
Measure=Uptime
Format="%4!i!d %3!i!h %2!i!m"
[MeasureComputer]
Measure=SysInfo
SysInfoType=COMPUTER_NAME
[MeasureOS]
Measure=SysInfo
SysInfoType=OS_PRODUCT_NAME
[MeasureIP]
Measure=SysInfo
SysInfoType=IP_ADDRESS
[MeasureAdapter]
Measure=SysInfo
SysInfoType=ADAPTER_DESCRIPTION
[MeasureAdapterType]
Measure=SysInfo
SysInfoType=ADAPTER_TYPE
[MeasureScreen]
Measure=SysInfo
SysInfoType=SCREEN_SIZE
[MeasureWorkArea]
Measure=SysInfo
SysInfoType=WORK_AREA
[MeasureMonitors]
Measure=SysInfo
SysInfoType=NUM_MONITORS
[MeasureInternet]
Measure=SysInfo
SysInfoType=INTERNET_CONNECTIVITY
[MeasureBias]
Measure=SysInfo
SysInfoType=TIMEZONE_BIAS

[StyleLine]
X=14
Y=4R
FontFace=#Font#
FontSize=10
FontColor=#Text#
AntiAlias=1

[MeterBackground]
Meter=Image
W=380
H=206
SolidColor=#Panel#

[MeterTitle]
Meter=String
MeterStyle=StyleLine
Y=10
FontWeight=600
FontSize=12
Text=System readings

[Line1]
Meter=String
MeterStyle=StyleLine
MeasureName=MeasureCPU
MeasureName2=MeasureRAM
MeasureName3=MeasureRAMTotal
MeasureName4=MeasureSwap
Text=CPU %1%   RAM %2B / %3B   Swap %4B
AutoScale=1
NumOfDecimals=1

[Line2]
Meter=String
MeterStyle=StyleLine
MeasureName=MeasureNetIn
MeasureName2=MeasureNetOut
Text=Net (Best) in %1B/s   out %2B/s
AutoScale=1
NumOfDecimals=1

[Line3]
Meter=String
MeterStyle=StyleLine
MeasureName=MeasureDisk
MeasureName2=MeasureDiskTotal
Text=Disk free %1B of %2B
AutoScale=2
NumOfDecimals=1

[Line4]
Meter=String
MeterStyle=StyleLine
MeasureName=MeasureBattery
MeasureName2=MeasureUptime
Text=Battery %1%   Uptime %2

[Line5]
Meter=String
MeterStyle=StyleLine
MeasureName=MeasureComputer
MeasureName2=MeasureOS
Text=%1 · %2

[Line6]
Meter=String
MeterStyle=StyleLine
MeasureName=MeasureIP
MeasureName2=MeasureAdapter
MeasureName3=MeasureAdapterType
Text=IP %1 on %2 (%3)

[Line7]
Meter=String
MeterStyle=StyleLine
MeasureName=MeasureScreen
MeasureName2=MeasureWorkArea
MeasureName3=MeasureMonitors
Text=Screen %1, work area %2, monitors %3

[Line8]
Meter=String
MeterStyle=StyleLine
MeasureName=MeasureInternet
MeasureName2=MeasureBias
Text=Internet %1   TZ bias %2 min
