; Deskset test skin (original work): Update=-1 updates once on load; waking the Mac or the display must not update
; it again (its OnUpdateAction would run again).
[Rainmeter]
Update=-1
OnUpdateAction=[!SetVariable Updates ([#Updates]+1)]

[Variables]
Updates=0

[MeterText]
Meter=String
Text=Updated once
FontSize=11
FontColor=255,255,255
SolidColor=30,30,40,220
Padding=6,4,6,4
AntiAlias=1
