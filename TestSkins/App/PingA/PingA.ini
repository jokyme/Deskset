; Deskset test skin (original work): App\PingA and App\PingB refresh each other from OnRefreshAction. Refreshes
; done synchronously recursed until the stack overflowed. They must keep running (refreshing each other on later
; run-loop turns: bangs load, unload and refresh skins after the action that asked has finished).
[Rainmeter]
Update=1000
OnRefreshAction=[!SetVariable Loaded 1][!Refresh "App\PingB"]

[Variables]
Loaded=0

[MeterText]
Meter=String
Text=Ping A
FontSize=11
FontColor=255,255,255
SolidColor=30,30,40,220
Padding=6,4,6,4
AntiAlias=1
