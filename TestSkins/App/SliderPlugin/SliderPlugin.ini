; Deskset test skin (original work): the third-party Slider plugin (Plugin=Slider.dll, version 2 of the Mouse plugin) on
; the right and the middle button. A right press on the track sets Right from where it is, dragging (also outside the
; skin) changes it; a middle drag sets Middle. Every action notes itself in Order, after the meters' own actions if
; they run first. The background's RightMouseUpAction keeps the skin menu closed.
[Rainmeter]
Update=1000

[Metadata]
Name=Slider plugin
Author=Deskset tests
License=MIT

[Variables]
Right=0
Middle=0
Order=

[MeasureRight]
Measure=Plugin
Plugin=Slider.dll
MouseButton=Right
ClickAction=[!SetVariable Order "[#Order]right-click "][!SetVariable Right "(Clamp($MouseX$-[MeterTrack:X],0,[MeterTrack:W]))"]
DragAction=[!SetVariable Right "(Clamp($MouseX$-[MeterTrack:X],0,[MeterTrack:W]))"]
ReleaseAction=[!SetVariable Order "[#Order]right-release "]

[MeasureMiddle]
Measure=Plugin
Plugin=Slider
MouseButton=Middle
ClickAction=[!SetVariable Order "[#Order]middle-click "]
DragAction=[!SetVariable Middle "$MouseY$"]
ReleaseAction=[!SetVariable Order "[#Order]middle-release "]

[MeterBackground]
Meter=Image
W=200
H=60
SolidColor=30,30,30,255
RightMouseUpAction=[!SetVariable Order "[#Order]meter-rightup "]

[MeterTrack]
Meter=Image
X=50
Y=25
W=100
H=10
SolidColor=200,200,200,255
RightMouseDownAction=[!SetVariable Order "[#Order]meter-rightdown "]
MiddleMouseDownAction=[!SetVariable Order "[#Order]meter-middledown "]
