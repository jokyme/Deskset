; Deskset test skin (original work): OnFocusAction / OnUnfocusAction / OnWakeAction, context items, groups.
[Rainmeter]
Update=1000
Group=DesksetAppTest | Widgets
OnFocusAction=[!SetVariable Focus "focused"][!SetOption MeterFocus FontColor "120,220,140"][!UpdateMeter MeterFocus][!Redraw]
OnUnfocusAction=[!SetVariable Focus "not focused"][!SetOption MeterFocus FontColor "#Subtle#"][!UpdateMeter MeterFocus][!Redraw]
OnWakeAction=[!SetVariable Wakes ([#Wakes]+1)][!UpdateMeter MeterWake][!Redraw]
OnCloseAction=[!SetVariable FocusClosed 1 "App\Controls"][!DeactivateConfig]
ContextTitle=Hide, then show again
ContextAction=[!HideFade][!Delay 1500][!ShowFade]
ContextTitle2=---
ContextTitle3=Stay topmost
ContextAction3=[!ZPos 2]

[Metadata]
Name=Focus & Fade
Author=Deskset tests
Information=Click the skin to focus it; click elsewhere to unfocus.|Wake the Mac from sleep to count OnWakeAction.
Version=1.0
License=MIT

[Variables]
@Include=#@#Style.inc
Focus=not focused
Wakes=0

[MeterBackground]
Meter=Image
W=240
H=84
SolidColor=#Panel#

[MeterTitle]
Meter=String
X=14
Y=10
FontFace=#Font#
FontSize=12
FontWeight=600
FontColor=#Text#
Text=Focus & Fade
AntiAlias=1

[MeterFocus]
Meter=String
X=14
Y=34
FontFace=#Font#
FontSize=10
FontColor=#Subtle#
Text=Focus: #Focus#
DynamicVariables=1
AntiAlias=1

[MeterWake]
Meter=String
X=14
Y=54
FontFace=#Font#
FontSize=10
FontColor=#Subtle#
Text=Wakes: #Wakes#
DynamicVariables=1
AntiAlias=1
