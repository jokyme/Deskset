; Deskset test skin (original work): a second variant of App\Focus.
[Rainmeter]
Update=1000
Group=DesksetAppTest
OnFocusAction=[!SetVariable Focus "focused"][!UpdateMeter MeterFocus][!Redraw]
OnUnfocusAction=[!SetVariable Focus "not focused"][!UpdateMeter MeterFocus][!Redraw]

[Metadata]
Name=Focus (compact)
Author=Deskset tests
Version=1.0

[Variables]
@Include=#@#Style.inc
Focus=not focused

[MeterFocus]
Meter=String
FontFace=#Font#
FontSize=10
FontColor=#Text#
SolidColor=#Panel#
Padding=10,6,10,6
Text=#Focus#
DynamicVariables=1
AntiAlias=1
