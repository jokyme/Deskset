; Deskset test skin (original work): App\PongA and App\PongB update each other from OnUpdateAction
; ([!Update "App\PongB"] here, [!Update "App\PongA"] there). The chain across the two skins must stop instead of
; recursing until the stack overflows.
[Rainmeter]
Update=1000
OnUpdateAction=[!Update "App\PongB"]

[MeterText]
Meter=String
Text=Pong A
FontSize=11
FontColor=255,255,255
SolidColor=30,30,40,220
Padding=6,4,6,4
AntiAlias=1
