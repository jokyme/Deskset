; Deskset test skin (original work): the third-party Slider plugin (Plugin=Slider.dll, version 2 of the Mouse plugin)
; sees the mouse anywhere on the screen. Left presses, drags and releases log themselves with $MouseX$ / $MouseY$ from
; the skin's corner; a right press notes its screen coordinates (RelativeToSkin=0); moves are noted while MeasureMoves
; is enabled. The background's LeftMouseDownAction logs the presses made on the skin itself.
[Rainmeter]
Update=1000

[Metadata]
Name=Slider plugin elsewhere on the screen
Author=Deskset tests
License=MIT

[Variables]
Log=
Screen=
Moved=

[MeasureClicks]
Measure=Plugin
Plugin=Slider.dll
ClickAction=[!SetVariable Log "[#Log]click $MouseX$,$MouseY$;"]
DragAction=[!SetVariable Log "[#Log]drag $MouseX$,$MouseY$;"]
ReleaseAction=[!SetVariable Log "[#Log]release $MouseX$,$MouseY$;"]

[MeasureScreen]
Measure=Plugin
Plugin=Slider.dll
MouseButton=Right
ClickAction=[!SetVariable Screen "$MouseX$,$MouseY$"]
RelativeToSkin=0

[MeasureMoves]
Measure=Plugin
Plugin=Slider.dll
MoveAction=[!SetVariable Moved "$MouseX$,$MouseY$"]
Disabled=1

[MeterBackground]
Meter=Image
W=200
H=100
SolidColor=30,30,30,255
LeftMouseDownAction=[!SetVariable Log "[#Log]meter-down;"]
