; Deskset test skin (original work): Container masking and bevel colors (manual: Container, BevelColor).
; - Left: a disc-shaped Shape container; its green content shows only inside the disc (and has a tooltip, gone
;   while the container is hidden).
; - Middle: a half-transparent container; its content is drawn at half opacity ("transparency ... is cumulative").
; - Right: a sunken bevel with BevelColor (yellow: right and bottom) and BevelColor2 (cyan: left and top).
; - The skin background has a raised bevel: BevelColor (red) on the left and top, BevelColor2 (blue) right/bottom.
[Rainmeter]
Update=-1
SkinWidth=300
SkinHeight=100
BackgroundMode=2
SolidColor=0,0,0,255
BevelType=1
BevelColor=255,0,0,255
BevelColor2=0,0,255,255

[Metadata]
Name=Container and bevels
Author=Deskset tests
License=MIT

[Disc]
Meter=Shape
X=0
Y=0
Shape=Ellipse 50,50,40 | Fill Color 255,255,255,255 | StrokeWidth 0

[DiscContent]
Meter=Image
Container=Disc
W=100
H=100
SolidColor=0,255,0,255
ToolTipText=Inside the disc

[Half]
Meter=Image
X=100
Y=0
W=100
H=100
SolidColor=255,255,255,128

[HalfContent]
Meter=Image
Container=Half
W=100
H=100
SolidColor=0,255,0,255

[Sunken]
Meter=Image
X=210
Y=10
W=80
H=80
SolidColor=60,60,60,255
BevelType=2
BevelColor=255,255,0,255
BevelColor2=0,255,255,255
