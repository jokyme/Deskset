; Deskset test skin (original work): Default… window settings, used the first time the config is loaded only.
[Rainmeter]
Update=1000
DefaultWindowX=50%
DefaultWindowY=20B
DefaultAnchorX=50%
DefaultAnchorY=100%
DefaultAlwaysOnTop=1
DefaultDraggable=0
DefaultSnapEdges=0
DefaultKeepOnScreen=0
DefaultClickThrough=1
DefaultAlphaValue=200
DefaultOnHover=2
DefaultFadeDuration=400
DefaultStartHidden=1
DefaultAutoSelectScreen=1
DefaultSavePosition=0

[Metadata]
Name=Default settings
Author=Deskset tests
License=MIT

[MeterText]
Meter=String
Text=Zpos #CURRENTCONFIGZPOS#
DynamicVariables=1
FontSize=11
FontColor=255,255,255
SolidColor=30,30,40,220
W=200
H=40
AntiAlias=1
