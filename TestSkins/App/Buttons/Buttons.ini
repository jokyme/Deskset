; Deskset test skin (original work): presses that must not drag the skin, menus, tooltips and cursors.
; - Button (top left): a Button meter; pressing its disc does not drag, its transparent corners do. A small label
;   (no actions) drawn over its middle does not hide it: the pointer still shows over the label.
; - Right-press (next): RightMouseDownAction replaces the skin menu; a double click runs the DoubleClick and the Down
;   actions of both buttons.
;   A meter with only RightMouseDoubleClickAction (right of the tips) also replaces the skin menu.
; - Tips: two meters with different tooltips side by side; the tooltip changes between them.
; - DragMargins: only the bottom 20 points drag.
[Rainmeter]
Update=-1
DragMargins=0,-20,0,0

[Metadata]
Name=Buttons and tips
Author=Deskset tests
License=MIT

[Variables]
Command=0
RightDown=0
DoubleRight=0
LeftDown=0
DoubleLeft=0

[MeterBackground]
Meter=Image
W=200
H=100
SolidColor=40,40,50,255

[MeterButton]
Meter=Button
X=0
Y=0
ButtonImage=#@#Images\Button.png
ButtonCommand=[!SetVariable Command 1]

[MeterButtonLabel]
Meter=Image
X=7
Y=7
W=6
H=6
SolidColor=255,255,255,255

[MeterRight]
Meter=Image
X=30
Y=0
W=20
H=20
SolidColor=200,200,60,255
RightMouseDownAction=[!SetVariable RightDown 1]
RightMouseDoubleClickAction=[!SetVariable DoubleRight 1]
LeftMouseDownAction=[!SetVariable LeftDown 1]
LeftMouseDoubleClickAction=[!SetVariable DoubleLeft 1]
MouseActionCursorName=Text

[MeterTipA]
Meter=Image
X=60
Y=0
W=20
H=20
SolidColor=60,200,60,255
ToolTipText=First tip
ToolTipTitle=A

[MeterTipB]
Meter=Image
X=80
Y=0
W=20
H=20
SolidColor=60,60,200,255
ToolTipText=Second tip

[MeterHiddenTip]
Meter=Image
X=100
Y=0
W=20
H=20
SolidColor=60,60,60,255
ToolTipText=Hidden tip
ToolTipHidden=1

[MeterRightDoubleOnly]
Meter=Image
X=120
Y=0
W=20
H=20
SolidColor=200,120,60,255
RightMouseDoubleClickAction=[!SetVariable DoubleRight 1]
