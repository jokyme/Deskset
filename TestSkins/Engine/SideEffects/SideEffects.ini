; Engine regression fixture (original content): every way a skin reaches outside itself, on a click of the top line.
; A RunCommand program started and killed (OutputFile=out.txt), FileView's Finder helpers (ContextMenu, Properties),
; RecycleManager's OpenBin, a WebParser DownloadFile and a Debug=2 dump of page.html, !WriteKeyValue into this file and
; Data.inc, a script that writes, renames and removes a file of its own, a folder opened, !Move and a bang for another
; skin. Nothing happens outside the skin until the click; the core self-test clicks it with its side effects recorded
; ("Seams: side effects"), where the skin's folder must stay as it is.
[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
BackgroundMode=2
SolidColor=24,26,32,240

[Variables]
@Include=#CURRENTPATH#Data.inc
Count=0

[MeasureRun]
Measure=Plugin
Plugin=RunCommand
Parameter=echo hello
OutputFile=out.txt
OutputType=UTF8
FinishAction=[!UpdateMeasure MeasureRun][!UpdateMeter *][!Redraw]

[MeasureFolder]
Measure=Plugin
Plugin=FileView
Path=#CURRENTPATH#
Count=1

[MeasureTrash]
Measure=RecycleManager
RecycleType=Count
UpdateDivider=-1

[MeasureDownload]
Measure=WebParser
URL=file://#CURRENTPATH#page.html
Download=1
DownloadFile=copy.html
Disabled=1
FinishAction=[!UpdateMeter *][!Redraw]

[MeasurePage]
Measure=WebParser
URL=file://#CURRENTPATH#page.html
RegExp=(?siU)<title>(.*)</title>
StringIndex=1
Debug=2
Disabled=1
FinishAction=[!UpdateMeter *][!Redraw]

[MeasureScript]
Measure=Script
ScriptFile=#CURRENTPATH#Script.lua

[TextStyle]
FontSize=11
FontColor=225,228,235,255
AntiAlias=1
X=10
Y=4R
DynamicVariables=1

[MeterGo]
Meter=String
MeterStyle=TextStyle
Y=8
SolidColor=60,64,80,255
Text=Click: every side effect (theme #Theme#, count #Count#)
LeftMouseUpAction=[!CommandMeasure MeasureRun "Run"][!CommandMeasure MeasureRun "Kill"][!CommandMeasure MeasureFolder "ContextMenu"][!CommandMeasure MeasureFolder "Properties"][!CommandMeasure MeasureTrash "OpenBin"][!EnableMeasure MeasureDownload][!UpdateMeasure MeasureDownload][!EnableMeasure MeasurePage][!UpdateMeasure MeasurePage][!WriteKeyValue Variables Count 5][!WriteKeyValue Variables Theme dark "#CURRENTPATH#Data.inc"][!CommandMeasure MeasureScript "Touch()"]["#CURRENTPATH#"][!Move 10 20][!SetVariable Shared 1 "Engine\Other"]

[MeterRun]
Meter=String
MeterStyle=TextStyle
Text=RunCommand: "[MeasureRun]" (code [MeasureRun:])

[MeterPage]
Meter=String
MeterStyle=TextStyle
Text=WebParser: [MeasurePage] / [MeasureDownload]

[MeterScript]
Meter=String
MeterStyle=TextStyle
Text=Script: [MeasureScript]
