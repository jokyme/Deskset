; Engine review regression skin (original, written for Deskset).
; - Calc measures without MinValue/MaxValue keep the default range 0…1, widened only by the values seen:
;   the three bars must be 25 %, 50 % and 75 % full, and the text must read 25 / 50 / 75 %.
; - A Calc that grows past 1 widens MaxValue (the "Growing" bar is always full).
; - Four meters that each run [!UpdateMeter *] on update must not hang the skin (bounded fan-out).
[Rainmeter]
Update=1000
BackgroundMode=2
SolidColor=30,32,40,255
DynamicWindowSize=1

[Metadata]
Name=Engine Review
Author=Deskset
License=Original test fixture

[Variables]
@Include=#@#Styles.inc

[Quarter]
Measure=Calc
Formula=0.25

[Half]
Measure=Calc
Formula=1 / 2

[ThreeQuarters]
Measure=Calc
Formula=Half + Quarter

[Growing]
Measure=Calc
Formula=Growing + 10

[BarQuarter]
Meter=Bar
MeasureName=Quarter
X=10
Y=10
W=200
H=10
BarColor=#Accent#
BarOrientation=Horizontal
SolidColor=255,255,255,40
OnUpdateAction=[!UpdateMeter *]

[BarHalf]
Meter=Bar
MeasureName=Half
X=0r
Y=6R
W=200
H=10
BarColor=#Accent#
BarOrientation=Horizontal
SolidColor=255,255,255,40
OnUpdateAction=[!UpdateMeter *]

[BarThreeQuarters]
Meter=Bar
MeasureName=ThreeQuarters
X=0r
Y=6R
W=200
H=10
BarColor=#Accent#
BarOrientation=Horizontal
SolidColor=255,255,255,40
OnUpdateAction=[!UpdateMeter *]

[BarCounter]
Meter=Bar
MeasureName=Growing
X=0r
Y=6R
W=200
H=10
BarColor=255,120,80
BarOrientation=Horizontal
SolidColor=255,255,255,40
OnUpdateAction=[!UpdateMeter *]

[Percentages]
Meter=String
MeterStyle=StyleLabel
X=0r
Y=8R
Text=[Quarter:%] / [Half:%] / [ThreeQuarters:%] %  (Growing max [Growing:MaxValue])
DynamicVariables=1

; Padded label/value rows: the centered title box and the right-aligned values share the 200-wide boxes of the
; left-aligned labels (anchor offsets use the padded size; r/R use the previous meter's real edges).
[RowTitle]
Meter=String
MeterStyle=StyleLabel
X=110
Y=10R
W=190
H=14
Padding=5,3,5,3
SolidColor=60,64,90,255
StringAlign=Center
Text=Centered title

[RowLabel]
Meter=String
MeterStyle=StyleLabel
X=10
Y=3R
W=190
H=14
Padding=5,3,5,3
SolidColor=47,47,60,255
Text=Quarter

[RowValue]
Meter=String
MeterStyle=StyleValue
MeasureName=Quarter
X=210
Y=0r
W=190
H=14
Padding=5,3,5,3
Percentual=1
Text=%1 %
