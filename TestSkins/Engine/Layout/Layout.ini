; Engine regression skin: [Rainmeter] background options, relative positions (r/R), Padding, Hidden meters,
; MeterStyle precedence and section variables. Original skin written for Deskset.
[Rainmeter]
Update=1000
BackgroundMode=2
SolidColor=30,32,40,255
SolidColor2=60,64,90,255
GradientAngle=90
BevelType=1
DynamicWindowSize=1

[Metadata]
Name=Engine Layout
Author=Deskset
License=Original test fixture

[Variables]
@Include=#@#Styles.inc

[StyleBox]
W=60
H=20
SolidColor=#Accent#

[StyleBoxWide]
W=90

[Box1]
Meter=Image
MeterStyle=StyleBox
X=10
Y=10

[Box2]
Meter=Image
MeterStyle=StyleBox | StyleBoxWide
X=10R
Y=0r
SolidColor=255,120,80

[HiddenBox]
Meter=Image
MeterStyle=StyleBox
X=10R
Y=0r
Hidden=1

[Box3]
Meter=Image
MeterStyle=StyleBox
; R after a hidden meter: the hidden meter has W=H=0 but keeps its position.
X=10R
Y=5R
SolidColor=120,220,120
BevelType=2

[Padded]
Meter=String
MeterStyle=StyleLabel
X=10
Y=10R
Padding=6,4,6,4
SolidColor=0,0,0,120
Text=Padded: [Padded:W] x [Padded:H]
DynamicVariables=1

[Info]
Meter=String
MeterStyle=StyleLabel
X=0r
Y=6R
Text=Box3 at [Box3:X],[Box3:Y]  Hidden at [HiddenBox:X],[HiddenBox:Y] ([HiddenBox:W]x[HiddenBox:H])
DynamicVariables=1

[Section]
Meter=String
MeterStyle=StyleLabel
X=0r
Y=4R
Text=#CURRENTSECTION# in #CURRENTCONFIG#
