; Engine regression skin (original work written for Deskset): legacy and misspelled forms that skins use.
; - Measure=Plugin with Plugin=SysInfo / SysInfo.dll / Plugins\SysInfo.dll / Process.dll: the built-in measures.
; - Measure=Registry: Windows version and hardware keys answered with macOS facts.
; - Roundline hands set with ValueReminder (the common misspelling of ValueRemainder).
; - A Shape Rectangle with empty X / Y parameters (read as 0).
[Rainmeter]
Update=1000
BackgroundMode=2
SolidColor=18,22,30,255

[Metadata]
Name=Engine Legacy Forms
Author=Deskset
License=Original test fixture

[MeasureUser]
Measure=Plugin
Plugin=SysInfo
SysInfoType=USER_NAME

[MeasureHost]
Measure=Plugin
Plugin=Plugins\SysInfo.dll
SysInfoType=COMPUTER_NAME

[MeasureFinder]
Measure=Plugin
Plugin=Process.dll
ProcessName=Finder.exe

[MeasureProduct]
Measure=Registry
RegHKey=HKEY_LOCAL_MACHINE
RegKey=SOFTWARE\Microsoft\Windows NT\CurrentVersion
RegValue=ProductName
UpdateDivider=-1

[MeasureBuild]
Measure=Registry
RegHKey=HKEY_LOCAL_MACHINE
RegKey=SOFTWARE\Microsoft\Windows NT\CurrentVersion
RegValue=CurrentBuild
UpdateDivider=-1

[MeasureGPU]
Measure=Registry
RegHKey=HKEY_LOCAL_MACHINE
RegKey=SOFTWARE\Microsoft\Windows NT\CurrentVersion\WinSat
RegValue=PrimaryAdapterString
UpdateDivider=-1

[MeasureTime]
Measure=Time

[StyleText]
X=12
Y=4R
FontFace=Helvetica
FontSize=10
FontColor=220,228,240
AntiAlias=1

[Card]
Meter=Shape
X=6
Y=6
Shape=Rectangle ,,288,110,8 | Fill Color 40,48,64 | StrokeWidth 0

[Line1]
Meter=String
MeterStyle=StyleText
Y=14
MeasureName=MeasureUser
MeasureName2=MeasureHost
Text=%1 on %2

[Line2]
Meter=String
MeterStyle=StyleText
MeasureName=MeasureProduct
MeasureName2=MeasureBuild
Text=%1 (build %2)

[Line3]
Meter=String
MeterStyle=StyleText
MeasureName=MeasureGPU
Text=Graphics: %1

[Line4]
Meter=String
MeterStyle=StyleText
MeasureName=MeasureFinder
Text=Finder running: %1

[StyleHand]
MeasureName=MeasureTime
X=300
Y=6
W=110
H=110
StartAngle=4.7123889
RotationAngle=6.2831853
AntiAlias=1

[Face]
Meter=Roundline
MeterStyle=StyleHand
LineLength=52
LineStart=48
Solid=1
LineColor=40,48,64
ControlAngle=0

[HourHand]
Meter=Roundline
MeterStyle=StyleHand
ValueReminder=43200
LineLength=28
LineWidth=3
LineColor=220,228,240

[MinuteHand]
Meter=Roundline
MeterStyle=StyleHand
ValueReminder=3600
LineLength=44
LineWidth=2
LineColor=220,228,240

[SecondHand]
Meter=Roundline
MeterStyle=StyleHand
ValueReminder=60
LineStart=-8
LineLength=46
LineColor=255,120,90
