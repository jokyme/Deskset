; Engine regression skin (original work written for Deskset): relative positions after aligned String meters.
; r / R follow the previous meter's anchor (its X / Y option), not the box that StringAlign moved:
; - a long shadow made of right-aligned copies, each one pixel right of and below the previous one;
; - a centered "backlight" with the live text placed over it with X=0r / Y=0r (must overlap exactly);
; - right-aligned labels with their value 8 px to the right of the label's X;
; - captions centered on pill buttons, the next row placed with Y=..R below the caption's anchor.
[Rainmeter]
Update=1000
BackgroundMode=2
SolidColor=236,232,224,255

[Metadata]
Name=Engine Anchors
Author=Deskset
License=Original test fixture

[Variables]
Ink=40,44,52
Shade=40,44,52,

[MeasureWord]
Measure=Time
Format=%A

[MeasureClock]
Measure=Time
Format=%H:%M

[StyleShadow]
X=1r
Y=1r
FontFace=Arial
FontSize=30
StringStyle=Bold
StringAlign=Right
StringCase=Upper
AntiAlias=1
MeasureName=MeasureWord

[ShadowBase]
Meter=String
MeterStyle=StyleShadow
X=330
Y=12
FontColor=#Shade#60

[Shadow2]
Meter=String
MeterStyle=StyleShadow
FontColor=#Shade#50

[Shadow3]
Meter=String
MeterStyle=StyleShadow
FontColor=#Shade#40

[Shadow4]
Meter=String
MeterStyle=StyleShadow
FontColor=#Shade#30

[Shadow5]
Meter=String
MeterStyle=StyleShadow
FontColor=#Shade#20

[Shadow6]
Meter=String
MeterStyle=StyleShadow
FontColor=#Shade#10

[Word]
Meter=String
MeterStyle=StyleShadow
X=330
Y=12
FontColor=#Ink#

[LedBack]
Meter=String
X=180
Y=80
FontFace=Menlo
FontSize=26
FontColor=210,204,190
StringAlign=Center
Text=88:88
AntiAlias=1

[LedFront]
Meter=String
MeasureName=MeasureClock
X=0r
Y=0r
FontFace=Menlo
FontSize=26
FontColor=200,60,40
StringAlign=Center
AntiAlias=1

[StyleLabel]
X=70
W=50
FontFace=Arial
FontSize=10
FontColor=120,120,120
StringAlign=Right
AntiAlias=1

[StyleValue]
X=8r
Y=r
FontFace=Arial
FontSize=10
FontColor=#Ink#
StringStyle=Bold
AntiAlias=1

[DividerLabels]
Meter=Image
X=74
Y=130
W=1
H=40
SolidColor=180,176,168

[LabelA]
Meter=String
MeterStyle=StyleLabel
Y=132
Text=HOUR

[ValueA]
Meter=String
MeterStyle=StyleValue
MeasureName=MeasureClock

[LabelB]
Meter=String
MeterStyle=StyleLabel
Y=6R
Text=DAY

[ValueB]
Meter=String
MeterStyle=StyleValue
MeasureName=MeasureWord

[StylePill]
W=100
H=30
SolidColor=210,204,190

[StyleCaption]
X=50r
Y=15r
FontFace=Arial
FontSize=11
FontColor=#Ink#
StringAlign=CenterCenter
AntiAlias=1

[Pill1]
Meter=Image
MeterStyle=StylePill
X=220
Y=128

[Caption1]
Meter=String
MeterStyle=StyleCaption
Text=First

[Pill2]
Meter=Image
MeterStyle=StylePill
X=-50r
Y=8R

[Caption2]
Meter=String
MeterStyle=StyleCaption
Text=Second
