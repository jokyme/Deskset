; Engine regression skin (original work written for Deskset): meter geometry before the first update.
; - EarlyGeometry.lua reads meter sizes and positions in Initialize() (the first update, before the meters are laid
;   out): it sees a provisional layout from the options, not zeros;
; - [MeasureBadgeEnd] computes from [Badge:X] + [Badge:W] in the first update (measures update before meters);
; - the page dots use MeterStyle=StyleDot | StyleDot[MeasurePageN], whose DynamicVariables=1 comes from the style:
;   no "MeterStyle does not exist" warning at load, the right dot is bright after the first update.
; The window has no DynamicWindowSize: it is still sized at the end of the first update.
[Rainmeter]
Update=1000
AccurateText=1

[Metadata]
Name=Engine Early Geometry
Author=Deskset
License=Original test fixture

[Variables]
Page=1

[MeasureScript]
Measure=Script
ScriptFile=EarlyGeometry.lua

[MeasurePage1]
Measure=Calc
Formula=#Page#=1
DynamicVariables=1

[MeasurePage2]
Measure=Calc
Formula=#Page#=2
DynamicVariables=1

[MeasureBadgeEnd]
Measure=Calc
Formula=[Badge:X] + [Badge:W]
DynamicVariables=1

[StyleDot]
X=6R
Y=r
W=10
H=10
DynamicVariables=1

[StyleDot0]
SolidColor=255,255,255,70

[StyleDot1]
SolidColor=120,200,255,255

[Background]
Meter=Shape
Shape=Rectangle 0,0,240,84,8 | Fill Color 26,30,38,235 | StrokeWidth 0

[Title]
Meter=String
X=12
Y=10
FontFace=Helvetica Neue
FontSize=11
FontColor=255,255,255
AntiAlias=1
Text=Early geometry

[Badge]
Meter=String
X=8R
Y=0r
FontFace=Helvetica Neue
FontSize=11
FontColor=120,200,255
AntiAlias=1
Text=beta

[Dot1]
Meter=Image
MeterStyle=StyleDot | StyleDot[MeasurePage1]
X=196
Y=15
LeftMouseUpAction=[!SetVariable Page 1][!Update]

[Dot2]
Meter=Image
MeterStyle=StyleDot | StyleDot[MeasurePage2]
LeftMouseUpAction=[!SetVariable Page 2][!Update]

[Report]
Meter=String
MeasureName=MeasureScript
MeasureName2=MeasureBadgeEnd
X=12
Y=40
FontFace=Helvetica Neue
FontSize=9
FontColor=200,205,215
AntiAlias=1
Text=Initialize(): %1#CRLF#first update: the badge ends at %2
