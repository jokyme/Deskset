; Engine regression skin (original work written for Deskset): empty String meters.
; - A value that is empty in Rainmeter too (an empty String measure) has no size: the next row moves up.
; - A value that is empty only because its measure has no data on the Mac (a Windows plugin DLL, a registry value
;   that is not emulated) keeps one line of height, so the rows below keep their places as on Windows.
[Rainmeter]
Update=1000
BackgroundMode=2
SolidColor=24,28,36,255

[Metadata]
Name=Engine Empty Rows
Author=Deskset
License=Original test fixture

[MeasureNothing]
Measure=String
String=

[MeasureWindowsOnly]
Measure=Plugin
Plugin=Plugins\VendorSensors.dll
SensorType=CpuName

[MeasureVendorKey]
Measure=Registry
RegHKey=HKEY_LOCAL_MACHINE
RegKey=SOFTWARE\ExampleVendor\Tool
RegValue=Edition

[MeasureCPUName]
Measure=Registry
RegHKey=HKEY_LOCAL_MACHINE
RegKey=HARDWARE\DESCRIPTION\System\CentralProcessor\0
RegValue=ProcessorNameString

[StyleTitle]
X=10
Y=6R
FontFace=Helvetica
FontSize=10
FontColor=150,160,180
AntiAlias=1

[StyleValue]
X=110r
Y=0r
FontFace=Helvetica
FontSize=10
FontColor=235,240,250
AntiAlias=1

[Top]
Meter=Image
X=0
Y=0
W=300
H=4

[Title1]
Meter=String
MeterStyle=StyleTitle
Text=Processor:

[Value1]
Meter=String
MeterStyle=StyleValue
MeasureName=MeasureCPUName

[Title2]
Meter=String
MeterStyle=StyleTitle
Text=Sensor (Windows):

[Value2]
Meter=String
MeterStyle=StyleValue
MeasureName=MeasureWindowsOnly

[Title3]
Meter=String
MeterStyle=StyleTitle
Text=Vendor key:

[Value3]
Meter=String
MeterStyle=StyleValue
MeasureName=MeasureVendorKey

[Title4]
Meter=String
MeterStyle=StyleTitle
Text=Empty text:

[Value4]
Meter=String
MeterStyle=StyleValue
MeasureName=MeasureNothing

[Title5]
Meter=String
MeterStyle=StyleTitle
FontColor=255,190,90
Text=(moves up: the empty text above has no height)
