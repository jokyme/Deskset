; Engine regression skin (original work written for Deskset): section variables without DynamicVariables.
; They are resolved when the options are read (the first update on the Mac) and then keep that value:
; - hidden rings placed with X=[TileN:X] and the next tile at X=150r after the ring (three tiles in a row, not stacked);
; - a caption centered under a square with X=([Square:X] + [Square:W] / 2);
; - a greeting with Postfix=, [MeasureUser]! (the user name, read once).
[Rainmeter]
Update=1000
BackgroundMode=2
SolidColor=22,26,34,255

[Metadata]
Name=Engine Section Variables
Author=Deskset
License=Original test fixture

[MeasureUser]
Measure=SysInfo
SysInfoType=USER_NAME
UpdateDivider=-1

[MeasureSecond]
Measure=Time
Format=%S

[StyleTile]
Y=10
W=140
H=36
SolidColor=52,64,86

[StyleRing]
Shape=Rectangle 0,0,140,36,6 | Fill Color 0,0,0,0 | StrokeWidth 2 | Stroke Color 120,190,255
Hidden=1

[Tile1]
Meter=Image
MeterStyle=StyleTile
X=10

[Ring1]
Meter=Shape
MeterStyle=StyleRing
X=[Tile1:X]
Y=[Tile1:Y]

[Tile2]
Meter=Image
MeterStyle=StyleTile
X=150r

[Ring2]
Meter=Shape
MeterStyle=StyleRing
X=[Tile2:X]
Y=[Tile2:Y]

[Tile3]
Meter=Image
MeterStyle=StyleTile
X=150r

[Square]
Meter=Image
X=40
Y=60
W=60
H=60
SolidColor=240,170,60

[Caption]
Meter=String
StringAlign=Center
X=([Square:X] + [Square:W] / 2)
Y=([Square:Y] + [Square:H] + 4)
FontFace=Helvetica
FontSize=10
FontColor=230,235,245
AntiAlias=1
Text=centered

[Greeting]
Meter=String
X=140
Y=80
FontFace=Helvetica
FontSize=14
FontColor=230,235,245
AntiAlias=1
Text=Hello
Postfix=, [MeasureUser]!

[FrozenSecond]
Meter=String
X=140
Y=110
FontFace=Helvetica
FontSize=10
FontColor=150,160,180
AntiAlias=1
Text=Second at load: [MeasureSecond]
