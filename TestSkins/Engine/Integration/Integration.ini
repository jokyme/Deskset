; Engine integration regression skin (original, written for Deskset).
; - [Pic] names "#@#Images\Pic" without an extension: ".png is assumed" (a blue square with an orange dot).
; - [Styled] has an empty FontColor= of its own: the MeterStyle's accent color applies (blue text, not black).
; - [Slots] binds MeasureName=Missing and MeasureName2=Value: "%2" still means MeasureName2 ("Value: 42"), and
;   its tooltip reads "Missing: [] Value: [42]".
; - [Circle] is a Shape: clicks on its empty corners reach the panel behind (not visible in a render).
; - [Big] has W=(10**300): the width is clamped, the skin keeps its fixed size and an orange bar fills the right edge.
[Rainmeter]
Update=1000
BackgroundMode=2
SolidColor=30,32,40,255
SkinWidth=260
SkinHeight=120

[Metadata]
Name=Engine Integration
Author=Deskset
License=Original test fixture

[Variables]
@Include=#@#Styles.inc

[Value]
Measure=Calc
Formula=42

[Panel]
Meter=Image
X=0
Y=60
W=60
H=60
SolidColor=0,0,0,1
LeftMouseUpAction=[!Log panel]

[Pic]
Meter=Image
ImageName=#@#Images\Pic
X=10
Y=10
W=48
H=48

[Styled]
Meter=String
MeterStyle=StyleValue
FontColor=
StringAlign=Left
X=70
Y=10
Text=Style color

[Slots]
Meter=String
MeterStyle=StyleLabel
MeasureName=Missing
MeasureName2=Value
X=70
Y=32
Text=Value: %2
ToolTipText=Missing: [%1] Value: [%2]

[Circle]
Meter=Shape
X=10
Y=65
Shape=Ellipse 25,25,25 | Fill Color #Accent# | StrokeWidth 0
LeftMouseUpAction=[!Log circle]

[Big]
Meter=Image
X=200
Y=70
W=(10**300)
H=20
SolidColor=255,140,0
