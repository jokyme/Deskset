; Engine regression skin: Container. The first content meter is placed relative to the container
; ("r is assumed and R is ignored"), later content is relative to each other, and the meter after the
; content is relative to the container again. Content outside the container must be clipped by the renderer
; and the container itself is not drawn. Original skin written for Deskset.
[Rainmeter]
Update=1000
BackgroundMode=2
SolidColor=24,26,32,255

[Metadata]
Name=Engine Container
Author=Deskset
License=Original test fixture

[Variables]
@Include=#@#Styles.inc

[Outline]
Meter=Image
X=19
Y=19
W=122
H=62
SolidColor=255,255,255,60

[Box]
Meter=Image
X=20
Y=20
W=120
H=60
SolidColor=255,255,255,255

[Content1]
Meter=Image
Container=Box
X=-20R
Y=10R
W=80
H=20
SolidColor=80,170,255

[Content2]
Meter=Image
Container=Box
X=0R
Y=10R
W=100
H=20
SolidColor=255,120,80

[After]
Meter=String
MeterStyle=StyleLabel
X=0r
Y=10R
Text=Box is container: content clipped to the white area
