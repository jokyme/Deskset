; Engine regression skin: built-in measures on macOS (values depend on the machine).
; Original skin written for Deskset.
[Rainmeter]
Update=1000
BackgroundMode=2
SolidColor=#Panel#
DynamicWindowSize=1
ContextTitle=Reset loop
ContextAction=[!CommandMeasure MeasureLoop Reset]

[Metadata]
Name=Engine Measures
Author=Deskset
License=Original test fixture

[Variables]
@Include=#@#Styles.inc

[MeasureCPU]
Measure=CPU

[MeasureRAM]
Measure=PhysicalMemory

[MeasureSwap]
Measure=SwapMemory

[MeasureDisk]
Measure=FreeDiskSpace
Drive=C:
InvertMeasure=1

[MeasureDiskLabel]
Measure=FreeDiskSpace
Label=1

[MeasureUptime]
Measure=Uptime

[MeasureLoop]
Measure=Loop
StartValue=0
EndValue=10
Increment=3

[MeasureCalc]
Measure=Calc
Formula=(MeasureCPU > 50) ? 1 : 0
IfCondition=MeasureCalc = 1
IfTrueAction=[!SetOption MeterCPUValue FontColor 255,120,80]
IfFalseAction=[!SetOption MeterCPUValue FontColor #Accent#]

[MeasureOS]
Measure=SysInfo
SysInfoType=OS_VERSION

[MeasureScreens]
Measure=Plugin
Plugin=SysInfo
SysInfoType=NUM_MONITORS

[MeasureBattery]
Measure=Plugin
Plugin=PowerPlugin
PowerState=Percent

[MeasureRegistry]
Measure=Registry
RegKey=Software\Nothing

[LabelCPU]
Meter=String
MeterStyle=StyleLabel
X=10
Y=10
Text=CPU

[MeterCPUValue]
Meter=String
MeterStyle=StyleValue
MeasureName=MeasureCPU
X=250
Y=0r
NumOfDecimals=1
Text=%1 %

[LabelRAM]
Meter=String
MeterStyle=StyleLabel
X=10
Y=4R
Text=RAM / Swap

[MeterRAMValue]
Meter=String
MeterStyle=StyleValue
MeasureName=MeasureRAM
MeasureName2=MeasureSwap
X=250
Y=0r
AutoScale=1
Text=%1B / %2B

[MeterRAMBar]
Meter=Bar
MeasureName=MeasureRAM
X=10
Y=2R
W=240
H=4
BarColor=#Accent#
BarOrientation=Horizontal
SolidColor=255,255,255,40

[LabelDisk]
Meter=String
MeterStyle=StyleLabel
X=10
Y=6R
Text=Disk used ([MeasureDiskLabel])
DynamicVariables=1

[MeterDiskValue]
Meter=String
MeterStyle=StyleValue
MeasureName=MeasureDisk
X=250
Y=0r
Percentual=1
Text=%1 %

[LabelUptime]
Meter=String
MeterStyle=StyleLabel
X=10
Y=4R
Text=Uptime

[MeterUptimeValue]
Meter=String
MeterStyle=StyleValue
MeasureName=MeasureUptime
X=250
Y=0r

[LabelLoop]
Meter=String
MeterStyle=StyleLabel
X=10
Y=4R
Text=Loop 0..10 step 3

[MeterLoopValue]
Meter=String
MeterStyle=StyleValue
MeasureName=MeasureLoop
X=250
Y=0r
Text=%1 ([MeasureLoop:%]%)
DynamicVariables=1

[LabelSys]
Meter=String
MeterStyle=StyleLabel
X=10
Y=4R
Text=[MeasureOS], [MeasureScreens] display(s), battery [MeasureBattery:0]%
DynamicVariables=1

[LabelUnsupported]
Meter=String
MeterStyle=StyleLabel
X=10
Y=4R
FontColor=160,160,170
Text=Registry (Windows-only): "[MeasureRegistry]"
DynamicVariables=1
