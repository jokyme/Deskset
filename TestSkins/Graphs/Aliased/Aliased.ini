; Deskset test fixture (original work): AntiAlias=0 (the default) Line and Histogram meters at half-pixel
; positions, an even LineWidth, a value that falls exactly between two pixel rows, and a histogram whose cropped
; image is missing.
; Render at both scales and zoom in:
;   .build/debug/Deskset --render TestSkins/Graphs/Aliased/Aliased.ini --skins-dir TestSkins --updates 60 --interval 0 --scale 1
;   (and --scale 2)
; Every histogram column and every 1-pixel line must be exactly one pixel (two device pixels at 2x) wide;
; the LineWidth=2 line exactly two pixels thick.
[Rainmeter]
Update=1000
BackgroundMode=2
SolidColor=24,26,34,255

[Variables]
@Include=#@#Waves.inc

[MeasureHalf]
; 50 of 0…100: on a 20 px graph this lands exactly between two pixel rows without whole-pixel vertices.
Measure=Calc
Formula=50
MinValue=0
MaxValue=100

[StyleLabel]
FontFace=Helvetica Neue
FontSize=8
FontColor=255,255,255,170
AntiAlias=1

[StyleGraph]
W=60
H=20
SolidColor=255,255,255,25

; ---- Row 1: Line meters ----

[LabelLineHalf]
Meter=String
MeterStyle=StyleLabel
X=10
Y=4
Text=X/Y .5

[LineHalf]
Meter=Line
MeterStyle=StyleGraph
MeasureName=MeasureSine
LineColor=110,190,255
X=10.5
Y=18.5

[LabelLineWidth]
Meter=String
MeterStyle=StyleLabel
X=80
Y=4
Text=Width 2

[LineWidth2]
Meter=Line
MeterStyle=StyleGraph
MeasureName=MeasureHalf
MeasureName2=MeasureSquare
LineCount=2
LineWidth=2
LineColor=255,220,90
LineColor2=120,230,140
HorizontalLines=1
HorizontalLineColor=255,255,255,70
X=80
Y=18

[LabelLineFlat]
Meter=String
MeterStyle=StyleLabel
X=150
Y=4
Text=50% of 20

[LineFlat]
Meter=Line
MeterStyle=StyleGraph
MeasureName=MeasureHalf
LineColor=255,150,120
X=150
Y=18

[LabelLineHalfSize]
Meter=String
MeterStyle=StyleLabel
X=220
Y=4
Text=W/H .5

[LineHalfSize]
; The right edge and the baseline are at half pixels: the graph is laid out from that corner.
Meter=Line
MeterStyle=StyleGraph
MeasureName=MeasureSaw
LineColor=200,140,255
X=220
Y=18
W=60.5
H=20.5

; ---- Row 2: Histogram meters ----

[LabelHistHalf]
Meter=String
MeterStyle=StyleLabel
X=10
Y=44
Text=X/Y .5

[HistHalf]
Meter=Histogram
MeterStyle=StyleGraph
MeasureName=MeasureSaw
PrimaryColor=110,190,255
X=10.5
Y=58.5

[LabelHistQuarter]
Meter=String
MeterStyle=StyleLabel
X=80
Y=44
Text=X/Y .25

[HistQuarter]
Meter=Histogram
MeterStyle=StyleGraph
MeasureName=MeasureSine
MeasureName2=MeasureSquare
PrimaryColor=110,190,255
SecondaryColor=255,150,120
BothColor=230,230,240
X=80.25
Y=58.25

[LabelHistMissing]
Meter=String
MeterStyle=StyleLabel
X=150
Y=44
Text=No image

[HistMissingCrop]
; The image does not exist: its crop must not size the meter (stays W×H, drawn with PrimaryColor).
Meter=Histogram
MeterStyle=StyleGraph
MeasureName=MeasureSaw
PrimaryImage=DoesNotExist
PrimaryImageCrop=0,0,200,200
PrimaryColor=200,140,255
X=150
Y=58

[LabelHistHalfSize]
Meter=String
MeterStyle=StyleLabel
X=220
Y=44
Text=W/H .5

[HistHalfSize]
Meter=Histogram
MeterStyle=StyleGraph
MeasureName=MeasureSine
PrimaryColor=120,230,140
X=220
Y=58
W=60.5
H=20.5
