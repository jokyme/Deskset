; Deskset test fixture (original work): Histogram meter options.
; Render: .build/debug/Deskset --render TestSkins/Graphs/Histogram/Histogram.ini --skins-dir TestSkins --updates 60 --interval 0
[Rainmeter]
Update=1000
BackgroundMode=2
SolidColor=24,26,34,255

[Variables]
@Include=#@#Waves.inc
GraphW=120
GraphH=40

[StyleLabel]
FontFace=Helvetica Neue
FontSize=9
FontColor=255,255,255,170
AntiAlias=1

[StyleGraph]
W=#GraphW#
H=#GraphH#
SolidColor=255,255,255,25

; ---- Row 1: two measures with default colors; GraphStart=Left + Flip ----

[LabelDefault]
Meter=String
MeterStyle=StyleLabel
X=10
Y=6
Text=Default: sine, saw

[HistDefault]
Meter=Histogram
MeterStyle=StyleGraph
MeasureName=MeasureSine
MeasureName2=MeasureSaw
X=10
Y=2R

[LabelLeftFlip]
Meter=String
MeterStyle=StyleLabel
X=150
Y=6
Text=Left + Flip: square

[HistLeftFlip]
Meter=Histogram
MeterStyle=StyleGraph
MeasureName=MeasureSquare
GraphStart=Left
Flip=1
PrimaryColor=110,190,255
X=150
Y=2R

; ---- Row 2: Horizontal orientation; AutoScale ----

[LabelHorizontal]
Meter=String
MeterStyle=StyleLabel
X=10
Y=68
Text=Horizontal: saw, sine

[HistHorizontal]
Meter=Histogram
MeterStyle=StyleGraph
MeasureName=MeasureSaw
; Deprecated alias of MeasureName2.
SecondaryMeasureName=MeasureSine
GraphOrientation=Horizontal
PrimaryColor=255,150,120
SecondaryColor=110,190,255
BothColor=230,230,240
X=10
Y=2R
H=60

[LabelAuto]
Meter=String
MeterStyle=StyleLabel
X=150
Y=68
Text=AutoScale 1 (top), 0

[HistAuto]
Meter=Histogram
MeterStyle=StyleGraph
MeasureName=MeasureSmall
AutoScale=1
AntiAlias=1
PrimaryColor=200,140,255
X=150
Y=2R
H=28

[HistNoAuto]
Meter=Histogram
MeterStyle=StyleGraph
MeasureName=MeasureSmall
PrimaryColor=200,140,255
X=150
Y=4R
H=28

; ---- Row 3: images (size comes from the image, W/H ignored) ----

[LabelImages]
Meter=String
MeterStyle=StyleLabel
X=10
Y=152
Text=Images: sine, saw

[HistImages]
Meter=Histogram
MeasureName=MeasureSine
MeasureName2=MeasureSaw
PrimaryImage=Primary.png
SecondaryImage=Secondary
BothImage=Both.png
PrimaryImagePath=#@#
SecondaryImagePath=#@#
BothImagePath=#@#
W=300
H=300
SolidColor=255,255,255,25
X=10
Y=2R

[LabelImageOptions]
Meter=String
MeterStyle=StyleLabel
X=150
Y=152
Text=Tint, crop, flip

[HistImageOptions]
Meter=Histogram
MeasureName=MeasureSquare
PrimaryImage=#@#Primary.png
PrimaryImageTint=255,200,120
PrimaryGreyScale=1
PrimaryImageCrop=0,0,120,30
PrimaryImageFlip=Vertical
SolidColor=255,255,255,25
X=150
Y=2R
