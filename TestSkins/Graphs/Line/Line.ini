; Deskset test fixture (original work): Line meter options.
; Render: .build/debug/Deskset --render TestSkins/Graphs/Line/Line.ini --skins-dir TestSkins --updates 60 --interval 0
[Rainmeter]
Update=1000
BackgroundMode=2
SolidColor=24,26,34,255

[Variables]
@Include=#@#Waves.inc
GraphW=120
GraphH=40

[StyleLabel]
FontFace=Helvetica Neue
FontSize=9
FontColor=255,255,255,170
AntiAlias=1

[StyleGraph]
W=#GraphW#
H=#GraphH#
SolidColor=255,255,255,25
AntiAlias=1

; ---- Row 1: default (GraphStart=Right, Vertical) two lines; GraphStart=Left + HorizontalLines ----

[LabelDefault]
Meter=String
MeterStyle=StyleLabel
X=10
Y=6
Text=Right: sine, saw

[GraphDefault]
Meter=Line
MeterStyle=StyleGraph
MeasureName=MeasureSine
MeasureName2=MeasureSaw
LineCount=2
LineColor=110,190,255
LineColor2=255,150,120
X=10
Y=2R

[LabelLeft]
Meter=String
MeterStyle=StyleLabel
X=150
Y=6
Text=Left, markers, width 2

[GraphLeft]
Meter=Line
MeterStyle=StyleGraph
MeasureName=MeasureSine
GraphStart=Left
LineWidth=2
LineColor=120,230,140
HorizontalLines=1
HorizontalLineColor=255,255,255,60
X=150
Y=2R

; ---- Row 2: Flip; Horizontal orientation ----

[LabelFlip]
Meter=String
MeterStyle=StyleLabel
X=10
Y=68
Text=Flip=1: square

[GraphFlip]
Meter=Line
MeterStyle=StyleGraph
MeasureName=MeasureSquare
Flip=1
LineColor=255,220,90
X=10
Y=2R

[LabelHorizontal]
Meter=String
MeterStyle=StyleLabel
X=150
Y=68
Text=Horizontal: saw

[GraphHorizontal]
Meter=Line
MeterStyle=StyleGraph
MeasureName=MeasureSaw
GraphOrientation=Horizontal
HorizontalLines=1
HorizontalLineColor=255,255,255,60
LineColor=255,150,120
X=150
Y=2R
W=#GraphW#
H=60

; ---- Row 3: AutoScale vs fixed scale; Scale2 and MinValue ----

[LabelAuto]
Meter=String
MeterStyle=StyleLabel
X=10
Y=152
Text=AutoScale 1 (top), 0

[GraphAuto]
Meter=Line
MeterStyle=StyleGraph
MeasureName=MeasureSmall
AutoScale=1
LineColor=200,140,255
X=10
Y=2R
H=18

[GraphNoAuto]
Meter=Line
MeterStyle=StyleGraph
MeasureName=MeasureSmall
LineColor=200,140,255
X=10
Y=4R
H=18

[LabelScale]
Meter=String
MeterStyle=StyleLabel
X=150
Y=152
Text=Scale2=0.5, MinValue=-1

[GraphScale]
Meter=Line
MeterStyle=StyleGraph
MeasureName=MeasureSaw
MeasureName2=MeasureSaw
MeasureName3=MeasureSigned
LineCount=3
Scale2=0.5
LineColor=255,150,120,120
LineColor2=255,150,120
LineColor3=110,190,255
X=150
Y=2R

; ---- Row 4: TransformationMatrix stretching Y by 3 around Y=236: TransformStroke Normal vs Fixed ----

[LabelStroke]
Meter=String
MeterStyle=StyleLabel
X=10
Y=218
Text=TransformStroke Normal, Fixed

[GraphStrokeNormal]
Meter=Line
MeterStyle=StyleGraph
MeasureName=MeasureSquare
LineColor=255,220,90
X=10
Y=236
H=12
TransformationMatrix=1;0;0;3;0;-472

[GraphStrokeFixed]
Meter=Line
MeterStyle=StyleGraph
MeasureName=MeasureSquare
LineColor=255,220,90
TransformStroke=Fixed
X=150
Y=236
H=12
TransformationMatrix=1;0;0;3;0;-472

[Spacer]
; The transformed graphs reach Y=272; the window size ignores transformations.
Meter=Image
X=0
Y=272
W=1
H=4
