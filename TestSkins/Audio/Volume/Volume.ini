; Deskset regression skin — original work, MIT licensed.
; Win7AudioPlugin volume slider (click or scroll the track, −/+ steps, mute, next output device) and MediaKey
; transport buttons. The volume reads -1 while muted, as skins expect.
[Rainmeter]
Update=250
AccurateText=1

[Metadata]
Name=Volume
Author=Deskset
Information=Output volume slider, mute, output device switch and media keys (Win7AudioPlugin, MediaKey).
Version=1.0
License=MIT

[Variables]
Step=5
Width=240
TrackX=16
TrackW=208
Accent=255,176,72,255
Muted=130,130,140,255
Track=255,255,255,30
Text=238,240,246,255
Subtle=150,156,170,255

; ---------- Measures ----------

[MeasureVolume]
Measure=Plugin
Plugin=Win7AudioPlugin

[MeasurePercent]
Measure=Calc
Formula=Max(MeasureVolume, 0)
MinValue=0
MaxValue=100

[MeasureMuted]
Measure=Calc
Formula=MeasureVolume < 0
IfCondition=MeasureMuted = 1
IfTrueAction=[!SetOption MeterMute Text "Unmute"][!SetOption MeterFill BarColor "#Muted#"]
IfFalseAction=[!SetOption MeterMute Text "Mute"][!SetOption MeterFill BarColor "#Accent#"]

[MeasureKeys]
Measure=MediaKey

; ---------- Styles ----------

[StyleButton]
Y=70
FontFace=Helvetica Neue
FontSize=10
FontColor=#Text#
SolidColor=255,255,255,22
Padding=8,4,8,4
AntiAlias=1

; ---------- Meters ----------

[MeterBackground]
Meter=Shape
Shape=Rectangle 0,0,#Width#,132,10 | Fill Color 20,22,30,235 | StrokeWidth 0

[MeterDevice]
Meter=String
MeasureName=MeasureVolume
X=#TrackX#
Y=12
W=150
ClipString=1
FontFace=Helvetica Neue
FontSize=11
FontWeight=600
FontColor=#Text#
Text=%1
AntiAlias=1

[MeterPercent]
Meter=String
MeasureName=MeasurePercent
X=(#TrackX# + #TrackW#)
Y=14
StringAlign=Right
FontFace=Helvetica Neue
FontSize=10
FontColor=#Subtle#
NumOfDecimals=0
Postfix=%
AntiAlias=1

[MeterFill]
Meter=Bar
MeasureName=MeasurePercent
X=#TrackX#
Y=48
W=#TrackW#
H=10
BarOrientation=Horizontal
BarColor=#Accent#
SolidColor=#Track#
LeftMouseUpAction=[!CommandMeasure MeasureVolume "SetVolume $MouseX:%$"][!Update]
MouseScrollUpAction=[!CommandMeasure MeasureVolume "ChangeVolume 2"][!Update]
MouseScrollDownAction=[!CommandMeasure MeasureVolume "ChangeVolume -2"][!Update]
ToolTipText=Click to set the volume, scroll to adjust

[MeterDown]
Meter=String
MeterStyle=StyleButton
X=#TrackX#
Text=−#Step#
LeftMouseUpAction=[!CommandMeasure MeasureVolume "ChangeVolume -#Step#"][!Update]

[MeterUp]
Meter=String
MeterStyle=StyleButton
X=6R
Text=+#Step#
LeftMouseUpAction=[!CommandMeasure MeasureVolume "ChangeVolume +#Step#"][!Update]

[MeterMute]
Meter=String
MeterStyle=StyleButton
X=6R
Text=Mute
LeftMouseUpAction=[!CommandMeasure MeasureVolume "ToggleMute"][!Update]

[MeterNextDevice]
Meter=String
MeterStyle=StyleButton
X=6R
Text=Output ›
LeftMouseUpAction=[!CommandMeasure MeasureVolume "ToggleNext"][!Update]

[MeterPrevTrack]
Meter=String
MeterStyle=StyleButton
X=#TrackX#
Y=100
FontSize=8
Text=Prev
LeftMouseUpAction=[!CommandMeasure MeasureKeys "PrevTrack"]

[MeterPlayPause]
Meter=String
MeterStyle=StyleButton
X=6R
Y=100
FontSize=8
Text=Play / Pause
LeftMouseUpAction=[!CommandMeasure MeasureKeys "PlayPause"]

[MeterNextTrack]
Meter=String
MeterStyle=StyleButton
X=6R
Y=100
FontSize=8
Text=Next
LeftMouseUpAction=[!CommandMeasure MeasureKeys "NextTrack"]
