; Deskset regression skin — original work, MIT licensed.
; AudioLevel: 16 log-spaced bands, L/R RMS with a peak marker, device name and band edges.
; Without audio capture (command-line renders, no permission) every value is 0: the bars are empty.
[Rainmeter]
Update=25
AccurateText=1

[Metadata]
Name=Audio Visualizer
Author=Deskset
Information=Spectrum bars and stereo level meters from the system audio output (Plugin=AudioLevel).
Version=1.0
License=MIT

[Variables]
BarW=9
BarGap=3
BarH=96
Left=14
Width=(14*2 + 16*9 + 15*3)
Accent=120,200,255,255
Track=255,255,255,28
Text=235,238,245,255
Subtle=150,158,175,255

; ---------- Measures ----------

[MeasureAudio]
Measure=Plugin
Plugin=AudioLevel
Port=Output
FFTSize=1024
FFTOverlap=512
FFTAttack=10
FFTDecay=180
Bands=16
FreqMin=40
FreqMax=16000
Sensitivity=35
RMSAttack=60
RMSDecay=250
RMSGain=1.8
PeakAttack=0
PeakDecay=1200

[MeasureBand0]
Measure=Plugin
Plugin=AudioLevel
Parent=MeasureAudio
Type=Band
BandIdx=0

[MeasureBand1]
Measure=Plugin
Plugin=AudioLevel
Parent=MeasureAudio
Type=Band
BandIdx=1

[MeasureBand2]
Measure=Plugin
Plugin=AudioLevel
Parent=MeasureAudio
Type=Band
BandIdx=2

[MeasureBand3]
Measure=Plugin
Plugin=AudioLevel
Parent=MeasureAudio
Type=Band
BandIdx=3

[MeasureBand4]
Measure=Plugin
Plugin=AudioLevel
Parent=MeasureAudio
Type=Band
BandIdx=4

[MeasureBand5]
Measure=Plugin
Plugin=AudioLevel
Parent=MeasureAudio
Type=Band
BandIdx=5

[MeasureBand6]
Measure=Plugin
Plugin=AudioLevel
Parent=MeasureAudio
Type=Band
BandIdx=6

[MeasureBand7]
Measure=Plugin
Plugin=AudioLevel
Parent=MeasureAudio
Type=Band
BandIdx=7

[MeasureBand8]
Measure=Plugin
Plugin=AudioLevel
Parent=MeasureAudio
Type=Band
BandIdx=8

[MeasureBand9]
Measure=Plugin
Plugin=AudioLevel
Parent=MeasureAudio
Type=Band
BandIdx=9

[MeasureBand10]
Measure=Plugin
Plugin=AudioLevel
Parent=MeasureAudio
Type=Band
BandIdx=10

[MeasureBand11]
Measure=Plugin
Plugin=AudioLevel
Parent=MeasureAudio
Type=Band
BandIdx=11

[MeasureBand12]
Measure=Plugin
Plugin=AudioLevel
Parent=MeasureAudio
Type=Band
BandIdx=12

[MeasureBand13]
Measure=Plugin
Plugin=AudioLevel
Parent=MeasureAudio
Type=Band
BandIdx=13

[MeasureBand14]
Measure=Plugin
Plugin=AudioLevel
Parent=MeasureAudio
Type=Band
BandIdx=14

[MeasureBand15]
Measure=Plugin
Plugin=AudioLevel
Parent=MeasureAudio
Type=Band
BandIdx=15

[MeasureLeft]
Measure=Plugin
Plugin=AudioLevel
Parent=MeasureAudio
Type=RMS
Channel=L

[MeasureRight]
Measure=Plugin
Plugin=AudioLevel
Parent=MeasureAudio
Type=RMS
Channel=R

[MeasurePeak]
Measure=Plugin
Plugin=AudioLevel
Parent=MeasureAudio
Type=Peak
Channel=Avg

[MeasurePeakX]
Measure=Calc
Formula=#Left# + 22 + Clamp(MeasurePeak, 0, 1) * (#Width# - #Left# * 2 - 24)
DynamicVariables=1

[MeasureDevice]
Measure=Plugin
Plugin=AudioLevel
Parent=MeasureAudio
Type=DeviceName

[MeasureLowFreq]
Measure=Plugin
Plugin=AudioLevel
Parent=MeasureAudio
Type=BandFreq
BandIdx=0

[MeasureHighFreq]
Measure=Plugin
Plugin=AudioLevel
Parent=MeasureAudio
Type=BandFreq
BandIdx=15

; ---------- Styles ----------

[StyleBand]
X=#BarGap#R
Y=36
W=#BarW#
H=#BarH#
BarOrientation=Vertical
BarColor=#Accent#
SolidColor=#Track#

[StyleLevel]
X=(#Left# + 22)
W=(#Width# - #Left# * 2 - 24)
H=5
BarOrientation=Horizontal
BarColor=#Accent#
SolidColor=#Track#

[StyleSmall]
FontFace=Helvetica Neue
FontSize=8
FontColor=#Subtle#
AntiAlias=1

; ---------- Meters ----------

[MeterBackground]
Meter=Shape
Shape=Rectangle 0,0,#Width#,196,10 | Fill Color 16,19,28,235 | StrokeWidth 0

[MeterTitle]
Meter=String
X=#Left#
Y=12
FontFace=Helvetica Neue
FontSize=11
FontWeight=600
FontColor=#Text#
Text=Audio
AntiAlias=1

[MeterDevice]
Meter=String
MeasureName=MeasureDevice
MeterStyle=StyleSmall
X=(#Width# - #Left#)
Y=15
W=120
StringAlign=Right
ClipString=1
Text=%1

[MeterBand0]
Meter=Bar
MeasureName=MeasureBand0
MeterStyle=StyleBand
X=#Left#

[MeterBand1]
Meter=Bar
MeasureName=MeasureBand1
MeterStyle=StyleBand
X=#BarGap#R

[MeterBand2]
Meter=Bar
MeasureName=MeasureBand2
MeterStyle=StyleBand
X=#BarGap#R

