MeterStyle=StyleBand
X=#BarGap#R

[MeterBand15]
Meter=Bar
MeasureName=MeasureBand15
MeterStyle=StyleBand
X=#BarGap#R

[MeterLowFreq]
Meter=String
MeasureName=MeasureLowFreq
MeterStyle=StyleSmall
X=#Left#
Y=(36 + #BarH# + 4)
NumOfDecimals=0
Text=%1 Hz

[MeterHighFreq]
Meter=String
MeasureName=MeasureHighFreq
MeterStyle=StyleSmall
X=(#Width# - #Left#)
Y=0r
StringAlign=Right
NumOfDecimals=0
Text=%1 Hz

[MeterLeftLabel]
Meter=String
MeterStyle=StyleSmall
X=#Left#
Y=158
Text=L

[MeterLeft]
Meter=Bar
MeasureName=MeasureLeft
MeterStyle=StyleLevel
Y=162

[MeterRightLabel]
Meter=String
MeterStyle=StyleSmall
X=#Left#
Y=172
Text=R

[MeterRight]
Meter=Bar
MeasureName=MeasureRight
MeterStyle=StyleLevel
Y=176

[MeterPeak]
Meter=Image
X=[MeasurePeakX]
Y=158
W=2
H=27
SolidColor=255,255,255,200
DynamicVariables=1
