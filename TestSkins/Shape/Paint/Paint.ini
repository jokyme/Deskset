; Original test skin: Shape meter paints and transforms — LinearGradient at 0/90/180/270/45 degrees,
; out-of-range stops, LinearGradient1, RadialGradient with center/offset/radius, stroke gradients,
; Rotate / Scale / Skew / Offset with anchors, TransformOrder, Extend and variables in modifiers.
[Rainmeter]
Update=1000

[Variables]
Ink=30,34,42,255
Angle=45
Box=0,0,60,60

[MeterLinear]
Meter=Shape
X=10
Y=10
Shape=Rectangle #Box# | StrokeWidth 0 | Fill LinearGradient G0
Shape2=Rectangle #Box# | StrokeWidth 0 | Fill LinearGradient G90 | Offset 70,0
Shape3=Rectangle #Box# | StrokeWidth 0 | Fill LinearGradient G180 | Offset 140,0
Shape4=Rectangle #Box# | StrokeWidth 0 | Fill LinearGradient G270 | Offset 210,0
Shape5=Rectangle #Box# | StrokeWidth 0 | Fill LinearGradient G45 | Offset 280,0
; Red at 0 → blue at 1: 0 runs right→left, 90 bottom→top, 180 left→right, 270 top→bottom.
G0=0 | 255,0,0,255 ; 0.0 | 0,0,255,255 ; 1.0
G90=90 | 255,0,0,255 ; 0.0 | 0,0,255,255 ; 1.0
G180=180 | 255,0,0,255 ; 0.0 | 0,0,255,255 ; 1.0
G270=270 | 255,0,0,255 ; 0.0 | 0,0,255,255 ; 1.0
G45=#Angle# | 255,0,0,255 ; 0.0 | 255,255,0,255 ; 0.5 | 0,0,255,255 ; 1.0

[MeterStops]
Meter=Shape
X=10
Y=80
; Manual example (three stops), a stop outside 0..1 and the gamma-corrected LinearGradient1 form.
Shape=Rectangle 0,0,170,24 | StrokeWidth 0 | Fill LinearGradient Three
Three=180 | 255,0,0,255 ; 0.0 | 0,255,0,255 ; 0.5 | 0,0,255,255 ; 1.0
Shape2=Rectangle 0,30,170,24 | StrokeWidth 0 | Fill LinearGradient Outside
Outside=180 | 0,0,0,255 ; 0.0 | 255,255,255,255 ; 2.0
Shape3=Rectangle 180,0,170,24 | StrokeWidth 0 | Fill LinearGradient Plain
Shape4=Rectangle 180,30,170,24 | StrokeWidth 0 | Fill LinearGradient1 Plain
Plain=180 | 255,0,0,255 ; 0.0 | 0,255,0,255 ; 1.0

[MeterRadial]
Meter=Shape
X=10
Y=145
; Manual examples: centered, and origin offset by 20,20.
Shape=Ellipse 50,50,50 | StrokeWidth 0 | Fill RadialGradient R1
R1=0,0 | 155,200,232,255 ; 0.0 | 6,46,75,255 ; 1.0
Shape2=Ellipse 170,50,50 | StrokeWidth 0 | Fill RadialGradient R2
R2=0,0,20,20 | 155,200,232,255 ; 0.0 | 6,46,75,255 ; 1.0
; Elliptical gradient with explicit radii on a wide rectangle, center moved left.
Shape3=Rectangle 230,10,120,80,10 | StrokeWidth 0 | Fill RadialGradient1 R3
R3=-30,0,0,0,50,30 | 255,255,255,255 ; 0.0 | 230,150,70,255 ; 0.6 | 60,30,10,255 ; 1.0

[MeterStrokeGradient]
Meter=Shape
X=10
Y=260
Shape=Rectangle 10,10,80,80 | StrokeWidth 10 | Stroke LinearGradient SG | Fill Color 0,0,0,0
SG=270 | 0,0,255,255 ; 0.0 | 0,255,0,255 ; 0.5 | 255,0,0,255 ; 1.0
; A gauge: 270° arc with a gradient stroke and round caps.
Shape2=Arc 125,85,185,85,40,40,0,0,1 | StrokeWidth 12 | Stroke LinearGradient Gauge | StrokeStartCap Round | StrokeEndCap Round
Gauge=180 | 80,200,120,255 ; 0.0 | 240,200,60,255 ; 0.5 | 230,60,60,255 ; 1.0

[MeterTransforms]
Meter=Shape
X=240
Y=270
Shape=Rectangle 0,0,40,40 | Fill Color 86,156,214,255 | StrokeWidth 2 | Rotate 45
Shape2=Rectangle 60,0,40,40 | Fill Color 86,156,214,255 | StrokeWidth 2 | Rotate 30,0,0
Shape3=Rectangle 120,0,40,40 | Fill Color 230,150,70,255 | StrokeWidth 2 | Scale 1.5,0.5
Shape4=Rectangle 180,0,40,40 | Fill Color 230,150,70,255 | StrokeWidth 2 | Scale -1,1 | Fill LinearGradient Flip
Flip=180 | 255,255,255,255 ; 0.0 | 230,150,70,255 ; 1.0
Shape5=Rectangle 0,60,40,40 | Fill Color 120,200,140,255 | StrokeWidth 2 | Skew 20,0
Shape6=Rectangle 60,60,40,40 | Fill Color 120,200,140,255 | StrokeWidth 2 | Skew 0,-20,40,0
Shape7=Rectangle 120,60,40,40 | Fill Color 200,120,200,255 | StrokeWidth 2 | Rotate 45,0,0 | Scale 1,0.5,0,0
Shape8=Rectangle 180,60,40,40 | Fill Color 200,120,200,255 | StrokeWidth 2 | Rotate 45,0,0 | Scale 1,0.5,0,0 | TransformOrder Scale,Rotate
Shape9=Ellipse 20,140,15 | Extend Shared, Moved
Shared=Fill Color 255,210,90,255 | StrokeWidth 3 | Stroke Color #Ink#
Moved=Offset 50,0 | StrokeWidth 1
Shape10=Rectangle 0,125,30,30 | Fill Color 86,156,214,255 | StrokeWidth 2 | Offset 120,0 | Rotate 45 | TransformOrder Offset

[MeterCombineTransforms]
Meter=Shape
X=10
Y=380
; Child rotated before combining; the combined shape rotated afterwards and inheriting the parent's gradient.
Shape=Rectangle 0,0,80,80,10 | Fill LinearGradient CG | StrokeWidth 3 | Stroke Color #Ink#
CG=270 | 255,255,255,255 ; 0.0 | 86,156,214,255 ; 1.0
Shape2=Rectangle 25,25,30,30 | Rotate 45
Shape3=Combine Shape | Exclude Shape2 | Rotate 10
Shape4=Ellipse 150,40,38 | Fill Color 230,150,70,255 | StrokeWidth 3 | StrokeDashes 2,1
Shape5=Rectangle 150,0,60,80
Shape6=Combine Shape4 | Intersect Shape5
Shape7=Combine Shape6 | Union Shape8
Shape8=Ellipse 230,40,30
