; Original test skin: regression fixture for the Shape meter review — squared-off Miter joins, translucent strokes
; on combined shapes (miter tips must not be clipped), ClosePath with SetRoundJoin / SetNoStroke still active,
; StrokeType on open shapes, the one-word StrokeColor spelling, and a Combine chain that must not hang.
[Rainmeter]
Update=1000

[Variables]
Ink=30,34,42,255
Guide=255,60,60,255
Accent=86,156,214,255

[MeterSpikes]
Meter=Shape
X=20
Y=40
; About 6 degree spikes, StrokeWidth 6: Miter is cut flat 30 above the tip (limit 10 x half width, red line),
; MiterOrBevel stops at the tip (green line), Miter 4 is cut 12 above it; the translucent copy shows no seams.
Shape=Path Spike | StrokeWidth 6 | Stroke Color #Ink#
Shape2=Path Spike | StrokeWidth 6 | Stroke Color #Ink# | StrokeLineJoin MiterOrBevel | Offset 40,0
Shape3=Path Spike | StrokeWidth 6 | Stroke Color #Ink# | StrokeLineJoin Miter, 4 | Offset 80,0
Shape4=Path Spike | StrokeWidth 6 | Stroke Color 200,40,40,128 | Offset 120,0
Spike=0,100 | LineTo 5,0 | LineTo 10,100
Shape5=Line -10,-30,150,-30 | StrokeWidth 0.5 | Stroke Color #Guide#
Shape6=Line -10,0,150,0 | StrokeWidth 0.5 | Stroke Color 0,160,0,255

[MeterCombinedStar]
Meter=Shape
X=190
Y=20
; Star combined with a small square, stroked with a translucent color: all five miter tips are complete.
Shape=Path Star | Fill Color #Accent# | StrokeWidth 8 | Stroke Color 230,60,60,160
Star=30,0 | LineTo 48,57 | LineTo 0,21 | LineTo 60,21 | LineTo 12,57 | ClosePath 1
Shape2=Rectangle 80,20,12,12
Shape3=Combine Shape | Union Shape2

[MeterClose]
Meter=Shape
X=20
Y=170
; Left: SetRoundJoin 1 is still active when ClosePath draws the closing line, so the bottom corner is round
; (the start corner keeps its miter). Right: SetNoStroke 1 before ClosePath leaves the closing line unstroked.
Shape=Path Round | Fill Color 120,200,140,255 | StrokeWidth 12 | Stroke Color #Ink#
Round=10,10 | LineTo 90,10 | SetRoundJoin 1 | LineTo 50,80 | ClosePath 1
Shape2=Path NoStroke | Fill Color 120,200,140,255 | StrokeWidth 12 | Stroke Color #Ink# | Offset 110,0
NoStroke=10,10 | LineTo 90,10 | LineTo 50,80 | SetNoStroke 1 | ClosePath 1

[MeterManualSpelling]
Meter=Shape
X=250
Y=170
; The manual's Path section writes "StrokeColor" as one word; the stroke must be green.
Shape=Path Octo | StrokeWidth 4 | StrokeColor 0,200,0,255 | Fill Color #Accent#
Octo=15,0 | LineTo 45,0 | LineTo 60,15 | LineTo 60,45 | LineTo 45,60 | LineTo 15,60 | LineTo 0,45 | LineTo 0,15 | ClosePath 1

[MeterOpenStrokeType]
Meter=Shape
X=20
Y=280
; StrokeType has no sides on open shapes: both lines are 6 wide and centered on the red hairlines.
Shape=Line 0,10,120,10 | StrokeWidth 6 | Stroke Color #Ink# | StrokeType Outer
Shape2=Line 0,30,120,30 | StrokeWidth 6 | Stroke Color #Ink# | StrokeType Inner
Shape3=Line 0,10,120,10 | StrokeWidth 0.5 | Stroke Color #Guide#
Shape4=Line 0,30,120,30 | StrokeWidth 0.5 | Stroke Color #Guide#

[MeterChain]
Meter=Shape
X=170
Y=280
; Every level combines the previous level with itself (operands double). Shape9 holds 256 operands, the limit;
; Shape10 and above are skipped with a log line instead of hanging, so Shape9 (the square) is drawn.
Shape=Rectangle 0,0,40,40 | Fill Color 230,150,70,255 | StrokeWidth 2 | Stroke Color #Ink#
Shape2=Combine Shape | Union Shape
Shape3=Combine Shape2 | Union Shape2
Shape4=Combine Shape3 | Union Shape3
Shape5=Combine Shape4 | Union Shape4
Shape6=Combine Shape5 | Union Shape5
Shape7=Combine Shape6 | Union Shape6
Shape8=Combine Shape7 | Union Shape7
Shape9=Combine Shape8 | Union Shape8
Shape10=Combine Shape9 | Union Shape9
Shape11=Combine Shape10 | Union Shape10
Shape12=Combine Shape11 | Union Shape11
Shape13=Combine Shape12 | Union Shape12
Shape14=Combine Shape13 | Union Shape13
Shape15=Combine Shape14 | Union Shape14
Shape16=Combine Shape15 | Union Shape15
Shape17=Combine Shape16 | Union Shape16
Shape18=Combine Shape17 | Union Shape17
Shape19=Combine Shape18 | Union Shape18
Shape20=Combine Shape19 | Union Shape19
Shape21=Combine Shape20 | Union Shape20
Shape22=Combine Shape21 | Union Shape21
Shape23=Combine Shape22 | Union Shape22
Shape24=Combine Shape23 | Union Shape23
Shape25=Combine Shape24 | Union Shape24
Shape26=Combine Shape25 | Union Shape25
Shape27=Combine Shape26 | Union Shape26
Shape28=Combine Shape27 | Union Shape27
Shape29=Combine Shape28 | Union Shape28
Shape30=Combine Shape29 | Union Shape29
