; Original test skin: Shape meter stroke modifiers — caps, joins (with miter limit), dashes, dash caps,
; dash offset, SetRoundJoin / SetNoStroke path commands, StrokeType and semi-transparent strokes.
[Rainmeter]
Update=1000

[Variables]
Ink=30,34,42,255
Guide=255,60,60,255

[MeterCaps]
Meter=Shape
X=20
Y=16
; StrokeStartCap: Flat, Round, Square, Triangle (end caps flat). The red hairlines mark the line ends.
Shape=Line 0,0,120,0 | StrokeWidth 14 | Stroke Color #Ink#
Shape2=Line 0,24,120,24 | StrokeWidth 14 | Stroke Color #Ink# | StrokeStartCap Round
Shape3=Line 0,48,120,48 | StrokeWidth 14 | Stroke Color #Ink# | StrokeStartCap Square
Shape4=Line 0,72,120,72 | StrokeWidth 14 | Stroke Color #Ink# | StrokeStartCap Triangle | StrokeEndCap Round
Shape5=Line 0,-10,0,82 | StrokeWidth 1 | Stroke Color #Guide#
Shape6=Line 120,-10,120,82 | StrokeWidth 1 | Stroke Color #Guide#

[MeterJoins]
Meter=Shape
X=180
Y=10
Shape=Path Zig | StrokeWidth 10 | Stroke Color #Ink# | StrokeLineJoin Miter
Shape2=Path Zig | StrokeWidth 10 | Stroke Color #Ink# | StrokeLineJoin Bevel | Offset 70,0
Shape3=Path Zig | StrokeWidth 10 | Stroke Color #Ink# | StrokeLineJoin Round | Offset 140,0
Shape4=Path Zig | StrokeWidth 10 | Stroke Color #Ink# | StrokeLineJoin MiterOrBevel, 1.5 | Offset 210,0
Zig=0,0 | LineTo 50,0 | LineTo 50,60 | LineTo 10,35 | LineTo 30,20

[MeterDashes]
Meter=Shape
X=20
Y=130
Shape=Line 0,0,240,0 | StrokeWidth 6 | Stroke Color #Ink# | StrokeDashes 2,1.5
Shape2=Line 0,20,240,20 | StrokeWidth 6 | Stroke Color #Ink# | StrokeDashes 2,1,3,1.5,4,2
Shape3=Line 0,40,240,40 | StrokeWidth 6 | Stroke Color #Ink# | StrokeDashes 0,2 | StrokeDashCap Round
Shape4=Line 0,60,240,60 | StrokeWidth 6 | Stroke Color #Ink# | StrokeDashes 0,2 | StrokeDashCap Triangle
Shape5=Line 0,80,240,80 | StrokeWidth 6 | Stroke Color #Ink# | StrokeDashes 2,2 | StrokeDashCap Square
Shape6=Line 0,100,240,100 | StrokeWidth 6 | Stroke Color #Ink# | StrokeDashes 2,2 | StrokeDashOffset 1.0
Shape7=Line 0,-8,0,108 | StrokeWidth 1 | Stroke Color #Guide#

[MeterDashedShapes]
Meter=Shape
X=290
Y=100
Shape=Ellipse 45,45,40 | Fill Color 86,156,214,255 | StrokeWidth 5 | Stroke Color #Ink# | StrokeDashes 3,2 | StrokeDashCap Round
Shape2=Rectangle 100,5,80,80,12 | Fill Color 230,150,70,255 | StrokeWidth 4 | Stroke Color #Ink# | StrokeDashes 4,2 | StrokeDashCap Triangle

[MeterPathCommands]
Meter=Shape
X=20
Y=270
; Round joins only after SetRoundJoin 1; no stroke on the segments after SetNoStroke 1.
Shape=Path Cmd | StrokeWidth 10 | Stroke Color #Ink# | Fill Color 120,200,140,255
Cmd=0,0 | LineTo 60,0 | LineTo 60,50 | SetRoundJoin 1 | LineTo 120,50 | LineTo 120,0 | SetNoStroke 1 | LineTo 180,0 | LineTo 180,60 | SetNoStroke 0 | LineTo 0,60 | ClosePath 1

[MeterStrokeType]
Meter=Shape
X=240
Y=270
; Center (default), Outer, Inner — the red hairline is the geometry.
Shape=Rectangle 0,0,50,50 | Fill Color 86,156,214,160 | StrokeWidth 8 | Stroke Color #Ink#
Shape2=Rectangle 0,0,50,50 | Fill Color 0,0,0,0 | StrokeWidth 1 | Stroke Color #Guide#
Shape3=Rectangle 70,0,50,50,10 | Fill Color 86,156,214,160 | StrokeWidth 8 | Stroke Color #Ink# | StrokeType Outer
Shape4=Rectangle 70,0,50,50,10 | Fill Color 0,0,0,0 | StrokeWidth 1 | Stroke Color #Guide#
Shape5=Ellipse 165,25,25 | Fill Color 86,156,214,160 | StrokeWidth 8 | Stroke Color #Ink# | StrokeType Inner
Shape6=Ellipse 165,25,25 | Fill Color 0,0,0,0 | StrokeWidth 1 | Stroke Color #Guide#

[MeterAlpha]
Meter=Shape
X=20
Y=360
; Semi-transparent strokes with caps and dashes must not show darker overlaps.
Shape=Path Hook | StrokeWidth 16 | Stroke Color 200,40,40,128 | StrokeStartCap Triangle | StrokeEndCap Round | StrokeLineJoin Round
Hook=0,20 | LineTo 100,20 | LineTo 100,0 | LineTo 60,40
Shape2=Line 130,20,380,20 | StrokeWidth 14 | Stroke Color 40,40,200,128 | StrokeDashes 1,0.5 | StrokeDashCap Round
