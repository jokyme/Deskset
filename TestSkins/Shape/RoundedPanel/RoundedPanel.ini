; Original example: a rounded panel background (StylePanel from @Resources/Panel.inc) with a title,
; a value and a rounded progress track drawn with Shape meters.
[Rainmeter]
Update=1000
AccurateText=1

[Metadata]
Name=Rounded Panel
Author=Deskset
License=Original example for Deskset
Information=Demonstrates the reusable StylePanel / StyleTrack Shape meter styles.

[Variables]
@Include=#@#Panel.inc
PanelWidth=240
PanelHeight=104

[MeasureLoad]
Measure=Calc
Formula=62

[BarValue]
Measure=Calc
Formula=MeasureLoad

[MeterBackground]
Meter=Shape
MeterStyle=StylePanel

[MeterTitle]
Meter=String
X=16
Y=14
FontFace=Helvetica Neue
FontSize=10
FontColor=255,255,255,150
StringStyle=Bold
AntiAlias=1
Text=PROCESSOR

[MeterValue]
Meter=String
MeasureName=MeasureLoad
X=16
Y=32
FontFace=Helvetica Neue
FontSize=22
FontColor=255,255,255,235
AntiAlias=1
Text=%1%

[MeterTrack]
Meter=Shape
MeterStyle=StyleTrack
X=16
Y=78
DynamicVariables=1
