; Original test skin: every Shape meter shape type (Rectangle, rounded Rectangle, Ellipse, Line, Arc, Curve,
; Path, Path1, Combine). Regression fixture for the Shape meter renderer.
[Rainmeter]
Update=1000

[Variables]
Ink=40,44,52,255
Accent=86,156,214,255
Warm=230,150,70,255

[MeterRect]
Meter=Shape
X=10
Y=10
Shape=Rectangle 0,0,60,40 | Fill Color #Accent# | StrokeWidth 2 | Stroke Color #Ink#

[MeterRounded]
Meter=Shape
X=10R
Y=10
Shape=Rectangle 0,0,60,40,12 | Fill Color #Warm# | StrokeWidth 2

[MeterRoundedXY]
Meter=Shape
X=10R
Y=10
Shape=Rectangle 0,0,60,40,24,8 | Fill Color 120,200,140 | StrokeWidth 2

[MeterEllipse]
Meter=Shape
X=10R
Y=10
Shape=Ellipse 20,20,20 | Fill Color #Accent# | StrokeWidth 2
Shape2=Ellipse 70,20,25,12 | Fill Color #Warm# | StrokeWidth 2

[MeterLine]
Meter=Shape
X=10
Y=70
Shape=Line 0,0,60,40 | StrokeWidth 4 | Stroke Color #Ink#
Shape2=Line 0,40,60,0 | StrokeWidth 4 | Stroke Color #Warm# | StrokeStartCap Round | StrokeEndCap Round

[MeterArc]
Meter=Shape
X=10R
Y=70
; Half circle, default radius, clockwise over the top.
Shape=Arc 0,30,60,30 | StrokeWidth 4 | Stroke Color #Ink#
; Counter-clockwise, large arc, closed.
Shape2=Arc 70,20,110,20,20,20,0,1,1,1 | StrokeWidth 2 | Fill Color #Accent#
; Asterisks for defaults.
Shape3=Arc 120,40,160,0,*,*,*,1 | StrokeWidth 3 | Stroke Color #Warm#

[MeterCurve]
Meter=Shape
X=10R
Y=70
Shape=Curve 0,40,60,40,30,-10,0 | StrokeWidth 3 | Stroke Color #Ink#
Shape2=Curve 70,40,130,0,70,0,130,40,1 | StrokeWidth 2 | Fill Color #Warm#

[MeterPath]
Meter=Shape
X=10
Y=130
Shape=Path Octagon | StrokeWidth 2 | Stroke Color #Ink# | Fill Color #Accent#
Octagon=20,0 | LineTo 60,0 | LineTo 80,20 | LineTo 80,40 | LineTo 60,60 | LineTo 20,60 | LineTo 0,40 | LineTo 0,20 | ClosePath 1
Shape2=Path Mixed | StrokeWidth 2 | Stroke Color #Ink# | Fill Color #Warm# | Offset 90,0
Mixed=0,0 | LineTo 50,0 | ArcTo 50,40 | CurveTo 0,0,25,40

[MeterStar]
Meter=Shape
X=10R
Y=130
; Self-intersecting star: Path (even-odd) leaves the middle empty, Path1 (non-zero) fills it.
Shape=Path Star | Fill Color #Accent# | StrokeWidth 1
Shape2=Path1 Star | Fill Color #Warm# | StrokeWidth 1 | Offset 70,0
Star=30,0 | LineTo 48,57 | LineTo 0,21 | LineTo 60,21 | LineTo 12,57 | ClosePath 1

[MeterCombine]
Meter=Shape
X=10
Y=200
Shape=Ellipse 25,25,22 | Fill Color #Accent# | StrokeWidth 2
Shape2=Ellipse 50,25,22
Shape3=Combine Shape | Union Shape2
Shape4=Ellipse 105,25,22 | Fill Color #Warm# | StrokeWidth 2
Shape5=Ellipse 130,25,22
Shape6=Combine Shape4 | Intersect Shape5
Shape7=Ellipse 185,25,22 | Fill Color 120,200,140 | StrokeWidth 2
Shape8=Ellipse 210,25,22
Shape9=Combine Shape7 | XOR Shape8
Shape10=Ellipse 265,25,22 | Fill Color #Accent# | StrokeWidth 2
Shape11=Ellipse 290,25,22
Shape12=Combine Shape10 | Exclude Shape11
