; Lua regression fixture (original content): inline Lua section variables ([&Script:Function(args)] and
; [&Script:variable]) with every documented parameter type. Each row shows the result, then the expected text.
; The Script measure is disabled: it only hosts functions, as in the manual's examples.
[Rainmeter]
Update=1000
AccurateText=1
BackgroundMode=2
SolidColor=28,30,40,240
SkinWidth=520
SkinHeight=222

[Metadata]
Name=Inline Lua
Author=Deskset
License=Original test fixture

[Variables]
City=Saint-Étienne
Scale=C

[MeasureScript]
Measure=Script
ScriptFile=#@#Inline.lua
Disabled=1

[MeasureTemperature]
Measure=Calc
Formula=21.5

[MeasureQuote]
Measure=String
String=It's "quoted", isn't it

[RowStyle]
X=12
Y=5R
FontFace=Helvetica Neue
FontSize=11
FontColor=225,228,235
AntiAlias=1
DynamicVariables=1

[Title]
Meter=String
MeterStyle=RowStyle
Y=10
FontWeight=700
Text=Inline Lua (result | expected); the bar is 240 wide

[Row1]
Meter=String
MeterStyle=RowStyle
Text=[&MeasureScript:Convert([&MeasureTemperature], '[#Scale]')] | 70.7 F
[Row2]
Meter=String
MeterStyle=RowStyle
Text=[&MeasureScript:Letter('Rainmeter', (2+3))] | m
[Row3]
Meter=String
MeterStyle=RowStyle
Text=[&MeasureScript:Describe(true, FALSE, nil, 0x1F)] | boolean true, boolean false, nil, 31
[Row4]
Meter=String
MeterStyle=RowStyle
Text=[&MeasureScript:Shout('[&MeasureQuote]')] | IT'S "QUOTED", ISN'T IT!
[Row5]
Meter=String
MeterStyle=RowStyle
Text=[&MeasureScript:Welcome('[#City]')], [&MeasureScript:unit] | Hi Saint-Étienne, metric
[Row6]
Meter=String
MeterStyle=RowStyle
Text=[&MeasureScript:IsWarm([&MeasureTemperature])] / [&MeasureScript:IsWarm((5 - 10))] | 1 / 0
[Row7]
Meter=Image
MeterStyle=RowStyle
W=[&MeasureScript:Width(12)]
H=8
SolidColor=110,200,255
