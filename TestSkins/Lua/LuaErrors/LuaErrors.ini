; Lua regression fixture (original content): scripts that fail in every documented way must never hang or crash
; the skin. Each row shows the Script measure's string value; the expected result is written after the arrow.
; The skin log lists one message per problem, with the script file and line.
[Rainmeter]
Update=500
AccurateText=1
BackgroundMode=2
SolidColor=30,30,34,240
SkinWidth=400
SkinHeight=200

[Metadata]
Name=Lua errors
Author=Deskset
License=Original test fixture

[Healthy]
Measure=Script
ScriptFile=#@#Healthy.lua

[Missing]
Measure=Script
ScriptFile=#@#DoesNotExist.lua

[Syntax]
Measure=Script
ScriptFile=#@#Syntax.lua

[Runtime]
Measure=Script
ScriptFile=#@#Runtime.lua

[Endless]
Measure=Script
ScriptFile=#@#Endless.lua

[Memory]
Measure=Script
ScriptFile=#@#Memory.lua

[Misuse]
Measure=Script
ScriptFile=#@#Misuse.lua

[RowStyle]
X=12
Y=4R
FontFace=Helvetica Neue
FontSize=11
FontColor=225,228,235
AntiAlias=1
DynamicVariables=1

[Title]
Meter=String
MeterStyle=RowStyle
Y=10
FontWeight=700
Text=Lua failure modes (value -> expected)

[Row1]
Meter=String
MeterStyle=RowStyle
Text=Healthy: [Healthy] -> ok 3
[Row2]
Meter=String
MeterStyle=RowStyle
Text=Missing file: "[Missing]" -> ""
[Row3]
Meter=String
MeterStyle=RowStyle
Text=Syntax error: "[Syntax]" -> ""
[Row4]
Meter=String
MeterStyle=RowStyle
Text=Runtime error: "[Runtime]" -> ""
[Row5]
Meter=String
MeterStyle=RowStyle
Text=Endless loop: "[Endless]" -> "" (stopped)
[Row6]
Meter=String
MeterStyle=RowStyle
Text=Memory: [Memory] -> caught: not enough memory
[Row7]
Meter=String
MeterStyle=RowStyle
Text=API misuse: "[Misuse]" -> "" (clear message)
