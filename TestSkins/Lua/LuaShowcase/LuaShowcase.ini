; Lua regression fixture (original content): a Script measure driving a small dashboard.
; Update() return values (number + string), Initialize() laying out meters with Meter:SetX/SetW,
; SKIN:Bang with separate parameters, dofile of a library in @Resources, io reading a data file through a
; Windows-style relative path, inline Lua in Text options, and !CommandMeasure from a mouse action.
[Rainmeter]
Update=1000
AccurateText=1
BackgroundMode=2
SolidColor=22,26,36,240
SkinWidth=300
SkinHeight=214

[Metadata]
Name=Lua showcase
Author=Deskset
License=Original test fixture

[Variables]
Accent=94,196,255
User=Mac user
Clicks=0
Tip=waiting for Lua
Label=?

[MeasureScript]
Measure=Script
ScriptFile=#@#Scripts\Showcase.lua
Bars=7
Palette=94,196,255|120,220,160|250,200,90|240,120,120|190,150,255|90,220,220|255,170,210
Greeting=Hello
MaxValue=100

[MeasureSeconds]
Measure=Time
Format=%S

[MeterTitle]
Meter=String
X=16
Y=12
FontFace=Helvetica Neue
FontSize=15
FontWeight=700
FontColor=255,255,255
AntiAlias=1
Text=[&MeasureScript:Greeting('[#User]')]
DynamicVariables=1

[MeterValue]
Meter=String
X=284
Y=40
StringAlign=Right
FontFace=Helvetica Neue
FontSize=10
FontColor=[#Accent]
AntiAlias=1
Text=#Label#
DynamicVariables=1

[MeterNumber]
Meter=String
MeasureName=MeasureScript
X=16
Y=40
NumOfDecimals=1
FontFace=Helvetica Neue
FontSize=10
FontColor=170,180,200
AntiAlias=1
Text=Load %1 %

[MeterBar]
Meter=Bar
MeasureName=MeasureScript
X=16
Y=60
W=268
H=6
BarColor=[#Accent]
SolidColor=255,255,255,30
BarOrientation=Horizontal
DynamicVariables=1

[Bar1]
Meter=Image
Group=Bars
Y=132
W=10
H=10
[Bar2]
Meter=Image
Group=Bars
Y=132
W=10
H=10
[Bar3]
Meter=Image
Group=Bars
Y=132
W=10
H=10
[Bar4]
Meter=Image
Group=Bars
Y=132
W=10
H=10
[Bar5]
Meter=Image
Group=Bars
Y=132
W=10
H=10
[Bar6]
Meter=Image
Group=Bars
Y=132
W=10
H=10
[Bar7]
Meter=Image
Group=Bars
Y=132
W=10
H=10

[MeterTip]
Meter=String
X=16
Y=76
W=268
ClipString=2
FontFace=Helvetica Neue
FontSize=10
FontColor=220,225,235
AntiAlias=1
Text=#Tip#
DynamicVariables=1

[MeterLibrary]
Meter=String
X=16
Y=150
FontFace=Helvetica Neue
FontSize=10
FontColor=170,180,200
AntiAlias=1
Text=Library: [&MeasureScript:libraryVersion] | Weekday: [&MeasureScript:Weekday((1+2))]
DynamicVariables=1

[MeterButton]
Meter=String
X=16
Y=176
Padding=8,4,8,4
SolidColor=[#Accent],60
FontFace=Helvetica Neue
FontSize=10
FontColor=255,255,255
AntiAlias=1
Text=Clicked #Clicks# times
DynamicVariables=1
LeftMouseUpAction=[!CommandMeasure MeasureScript "Click()"][!UpdateMeter *][!Redraw]
