; WebParser regression fixture (original content): the error actions and ErrorString.
; Every row should end with its expected outcome written by FinishAction / OnConnectErrorAction /
; OnRegExpErrorAction / OnDownloadErrorAction.
[Rainmeter]
Update=1000
DynamicWindowSize=1
AccurateText=1
BackgroundMode=2
SolidColor=30,30,34,240

[Variables]
Ok=waiting
Connect=waiting
RegExp=waiting
Fallback=waiting
Download=waiting

[MeasureOk]
Measure=WebParser
URL=file://#@#status.txt
RegExp=(?siU)build=(.*);.*state=(.*);.*coverage=(.*);
StringIndex=2
FinishAction=[!SetVariable Ok "finished: [MeasureOk]"][!UpdateMeter *][!Redraw]

[MeasureBuild]
Measure=WebParser
URL=[MeasureOk]
StringIndex=1

[MeasureCoverage]
Measure=WebParser
URL=[MeasureOk]
StringIndex=3
MaxValue=100

[MeasureMissingFile]
Measure=WebParser
URL=file://#@#does-not-exist.txt
OnConnectErrorAction=[!SetVariable Connect "OnConnectErrorAction"][!UpdateMeter *][!Redraw]
FinishAction=[!SetVariable Connect "wrong: FinishAction"]

[MeasureNoMatch]
Measure=WebParser
URL=file://#@#status.txt
RegExp=(?siU)<nothing>(.*)</nothing>
ErrorString=ErrorString shown
OnRegExpErrorAction=[!SetVariable RegExp "OnRegExpErrorAction"][!UpdateMeter *][!Redraw]
FinishAction=[!SetVariable RegExp "wrong: FinishAction"]

[MeasureNoMatchNoHandler]
Measure=WebParser
URL=file://#@#status.txt
RegExp=(?siU)<nothing>(.*)</nothing>
FinishAction=[!SetVariable Fallback "FinishAction (no OnRegExpErrorAction)"][!UpdateMeter *][!Redraw]

[MeasureBadDownload]
Measure=WebParser
URL=[MeasureOk]
StringIndex=1
Download=1
OnDownloadErrorAction=[!SetVariable Download "OnDownloadErrorAction"][!UpdateMeter *][!Redraw]

[Style]
FontFace=Menlo
FontSize=11
FontColor=225,225,230,255
AntiAlias=1
X=10
Y=4R
DynamicVariables=1

[MeterHeader]
Meter=String
MeterStyle=Style
Y=10
Text=build [MeasureBuild] ([MeasureOk]) · coverage [MeasureCoverage]%
FontColor=140,200,255,255

[MeterCoverage]
Meter=Bar
MeasureName=MeasureCoverage
X=10
Y=6R
W=300
H=5
BarColor=120,220,140,255
SolidColor=255,255,255,30
BarOrientation=Horizontal

[MeterOk]
Meter=String
MeterStyle=Style
Y=8R
Text=ok:       #Ok#

[MeterConnect]
Meter=String
MeterStyle=Style
Text=connect:  #Connect#

[MeterRegExp]
Meter=String
MeterStyle=Style
Text=regexp:   #RegExp# / [MeasureNoMatch]

[MeterFallback]
Meter=String
MeterStyle=Style
Text=fallback: #Fallback#

[MeterDownload]
Meter=String
MeterStyle=Style
Text=download: #Download#
Padding=0,0,10,10
