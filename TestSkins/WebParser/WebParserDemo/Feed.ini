; WebParser regression fixture (original content). Reads @Resources/news.xml through file://:
; parent/child measures, StringIndex2, a lookahead for a missing third item, DecodeCharacterReference,
; Download=1 of a local image, a number value on a Bar, and FinishAction redraws.
[Rainmeter]
Update=1000
DynamicWindowSize=1
AccurateText=1
BackgroundMode=2
SolidColor=24,28,38,235

[Metadata]
Name=WebParser demo
Author=Deskset
License=Original test fixture

[Variables]
Item=(?(?=.*<item>).*<item>(.*)</item>)
Sub="<![CDATA[":"","]]>":""

[MeasureDesk]
Measure=WebParser
URL=file://#@#news.xml
RegExp=(?siU)<channel>.*<title>(.*)</title>.*<url>(.*)</url>.*temp="(.*)".*condition="(.*)".*humidity="(.*)"#Item##Item##Item#
UpdateRate=600
LogSubstringErrors=0
FinishAction=[!UpdateMeter *][!Redraw]

[MeasureTitle]
Measure=WebParser
URL=[MeasureDesk]
StringIndex=1
Substitute=#Sub#

[MeasureBadge]
Measure=WebParser
URL=file://#@#[MeasureDesk]
StringIndex=2
Download=1
FinishAction=[!UpdateMeter MeterBadge][!Redraw]

[MeasureTemp]
Measure=WebParser
URL=[MeasureDesk]
StringIndex=3
MinValue=-10
MaxValue=40

[MeasureCondition]
Measure=WebParser
URL=[MeasureDesk]
StringIndex=4
DecodeCharacterReference=1

[MeasureHumidity]
Measure=WebParser
URL=[MeasureDesk]
StringIndex=5
MaxValue=100

[MeasureItem1]
Measure=WebParser
URL=[MeasureDesk]
RegExp=(?siU)<title>(.*)</title>
StringIndex=6
StringIndex2=1
DecodeCharacterReference=1

[MeasureItem2]
Measure=WebParser
URL=[MeasureDesk]
RegExp=(?siU)<title>(.*)</title>
StringIndex=7
StringIndex2=1
DecodeCharacterReference=1

[MeasureItem3]
Measure=WebParser
URL=[MeasureDesk]
StringIndex=8
Substitute="":"(no third item)"

[TextStyle]
FontFace=Helvetica Neue
FontSize=11
FontColor=230,236,245,255
AntiAlias=1

[MeterBadge]
Meter=Image
MeasureName=MeasureBadge
X=12
Y=12
W=40
H=40

[MeterTitle]
Meter=String
MeasureName=MeasureTitle
MeterStyle=TextStyle
X=62
Y=12
FontSize=15
StringStyle=Bold

[MeterNow]
Meter=String
MeasureName=MeasureTemp
MeasureName2=MeasureCondition
MeasureName3=MeasureHumidity
MeterStyle=TextStyle
X=62
Y=2R
Text=%1 °C · %2 · %3% humidity
FontColor=170,200,235,255

[MeterTempBar]
Meter=Bar
MeasureName=MeasureTemp
X=12
Y=12R
W=296
H=6
BarColor=110,180,255,255
SolidColor=255,255,255,40
BarOrientation=Horizontal

[MeterItem1]
Meter=String
MeasureName=MeasureItem1
MeterStyle=TextStyle
X=12
Y=10R
Text=• %1

[MeterItem2]
Meter=String
MeasureName=MeasureItem2
MeterStyle=TextStyle
X=12
Y=4R
Text=• %1

[MeterItem3]
Meter=String
MeasureName=MeasureItem3
MeterStyle=TextStyle
X=12
Y=4R
Text=• %1
FontColor=150,150,160,255
Padding=0,0,12,12
