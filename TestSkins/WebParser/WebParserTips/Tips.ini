; WebParser review fixture (original content): the manual's tip patterns on a local feed.
; - Lookahead assertions: three item slots, the feed has two; the third shows the Substitute placeholder.
; - StringIndex2: children with their own RegExp parse one <item> chunk each.
; - DecodeCharacterReference=1 + RegExpSubstitute strip CDATA and leading tabs (RSS tutorial).
; - DecodeCodePoints=1 on a JSON value; a number from JSON drives a Bar.
[Rainmeter]
Update=1000
DynamicWindowSize=1
AccurateText=1
BackgroundMode=2
SolidColor=18,32,24,240

[Variables]
Chunk=(?(?=.*<item>).*<item>(.*)</item>)
Sub="^\s+":"","<!\[CDATA\[":"","\]\]>":""

[MeasureFeed]
Measure=WebParser
URL=file://#@#garden.xml
RegExp=(?siU)<channel>.*<title>(.*)</title>#Chunk##Chunk##Chunk#
LogSubstringErrors=0
FinishAction=[!UpdateMeter *][!Redraw]

[MeasureFeedTitle]
Measure=WebParser
URL=[MeasureFeed]
StringIndex=1
RegExpSubstitute=1
Substitute=#Sub#

[MeasureItem1]
Measure=WebParser
URL=[MeasureFeed]
RegExp=(?siU)<title>(.*)</title>.*<pubDate>.*, (.*) \d{4}
StringIndex=2
StringIndex2=1
DecodeCharacterReference=1
RegExpSubstitute=1
Substitute=#Sub#

[MeasureItem1Date]
Measure=WebParser
URL=[MeasureItem1]
StringIndex=2

[MeasureItem2]
Measure=WebParser
URL=[MeasureFeed]
RegExp=(?siU)<title>(.*)</title>
StringIndex=3
StringIndex2=1
DecodeCharacterReference=1
RegExpSubstitute=1
Substitute=#Sub#

[MeasureItem3]
Measure=WebParser
URL=[MeasureFeed]
StringIndex=4
Substitute="":"(no third note yet)"

[MeasureSensor]
Measure=WebParser
URL=file://#@#sensor.json
RegExp=(?siU)"station":"(.*)".*"moisture":(.*),.*"unit":"(.*)".*"note":"(.*)"
FinishAction=[!UpdateMeter *][!Redraw]

[MeasureStation]
Measure=WebParser
URL=[MeasureSensor]
StringIndex=1
DecodeCodePoints=1

[MeasureMoisture]
Measure=WebParser
URL=[MeasureSensor]
StringIndex=2
MinValue=0
MaxValue=100

[MeasureUnit]
Measure=WebParser
URL=[MeasureSensor]
StringIndex=3
DecodeCodePoints=1

[MeasureNote]
Measure=WebParser
URL=[MeasureSensor]
StringIndex=4
DecodeCodePoints=1

[Text]
FontFace=Helvetica Neue
FontSize=11
FontColor=226,240,228,255
AntiAlias=1
X=12
Y=4R

[MeterTitle]
Meter=String
MeasureName=MeasureFeedTitle
MeterStyle=Text
Y=12
FontSize=15
StringStyle=Bold
FontColor=170,230,160,255

[MeterItem1]
Meter=String
MeasureName=MeasureItem1
MeasureName2=MeasureItem1Date
MeterStyle=Text
Y=8R
Text=1. %1  (%2)

[MeterItem2]
Meter=String
MeasureName=MeasureItem2
MeterStyle=Text
Text=2. %1

[MeterItem3]
Meter=String
MeasureName=MeasureItem3
MeterStyle=Text
Text=3. %1
FontColor=150,170,150,255

[MeterSensor]
Meter=String
MeasureName=MeasureStation
MeasureName2=MeasureMoisture
MeasureName3=MeasureUnit
MeasureName4=MeasureNote
MeterStyle=Text
Y=12R
Text=%1: soil %2%3 · %4

[MeterMoisture]
Meter=Bar
MeasureName=MeasureMoisture
X=12
Y=6R
W=288
H=6
BarColor=120,200,120,255
SolidColor=255,255,255,40
BarOrientation=Horizontal

[MeterPad]
; transparent margin on the right and at the bottom
Meter=Image
X=0
Y=0R
W=312
H=12
