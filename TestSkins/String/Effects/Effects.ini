; StringEffect, Angle, AntiAlias and StringCase regression fixture.
[Rainmeter]
Update=1000
AccurateText=1
BackgroundMode=2
SolidColor=90,110,140,255
SkinWidth=440
SkinHeight=300

[S]
FontFace=Arial
FontSize=16
FontColor=255,255,255,255
AntiAlias=1

[Shadow]
Meter=String
MeterStyle=S
X=10
Y=10
StringEffect=Shadow
FontEffectColor=0,0,0,255
Text=StringEffect=Shadow
[Border]
Meter=String
MeterStyle=S
X=10
Y=40
StringEffect=Border
FontEffectColor=200,30,30,255
Text=StringEffect=Border
[Aliased]
Meter=String
MeterStyle=S
X=10
Y=70
AntiAlias=0
