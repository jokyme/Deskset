[Upper]
Meter=String
MeterStyle=S
X=10
Y=100
FontSize=11
StringCase=Upper
Text=stringcase upper
[Proper]
Meter=String
MeterStyle=S
X=10
Y=120
FontSize=11
StringCase=Proper
Text=stringCASE proper: hello wORLD (don't)
[Lower]
Meter=String
MeterStyle=S
X=10
Y=140
FontSize=11
