; ClipString / ClipStringW / ClipStringH regression fixture.
[Rainmeter]
Update=1000
AccurateText=1
BackgroundMode=2
SolidColor=30,30,40,255
SkinWidth=520
SkinHeight=360

[StyleText]
FontFace=Arial
FontSize=10
FontColor=255,255,255,255
AntiAlias=1
SolidColor=40,90,160,255

[Clip0]
Meter=String
MeterStyle=StyleText
X=10
Y=10
W=120
H=18
Text=ClipString=0 overflows the box width
[Clip1]
Meter=String
MeterStyle=StyleText
X=10
Y=40
W=120
ClipString=1
Text=ClipString=1 without H gets an ellipsis
[Clip1H]
Meter=String
MeterStyle=StyleText
X=10
Y=70
W=120
H=50
ClipString=1
Text=ClipString=1 with enough height wraps the text until H is reached, then clips with an ellipsis
[Clip1Long]
Meter=String
MeterStyle=StyleText
X=10
Y=130
W=120
H=50
ClipString=1
Text=Supercalifragilisticexpialidocious words break
[Clip2W]
Meter=String
MeterStyle=StyleText
X=160
Y=10
W=150
ClipString=2
Text=ClipString=2 with W wraps on spaces and the meter grows in height to fit all of the text.
[Clip2WH]
Meter=String
MeterStyle=StyleText
X=160
Y=110
W=150
H=34
ClipString=2
Text=ClipString=2 with W and H wraps and clips at the height with an ellipsis on the last line.
[Clip2Max]
Meter=String
MeterStyle=StyleText
X=330
Y=10
ClipString=2
ClipStringW=170
ClipStringH=60
Text=ClipStringW=170 and ClipStringH=60 limit how far the meter grows before it wraps and clips the text.
[Clip2Short]
Meter=String
MeterStyle=StyleText
X=330
Y=90
ClipString=2
ClipStringW=170
Text=Short text shrinks
[Clip2Word]
Meter=String
MeterStyle=StyleText
X=330
Y=120
ClipString=2
ClipStringW=100
Text=Antidisestablishmentarianism is long
[Clip2Right]
Meter=String
MeterStyle=StyleText
X=500
Y=170
W=160
StringAlign=Right
ClipString=2
Text=Right aligned wrapped text inside a 160 pixel wide box
[Clip1Center]
Meter=String
MeterStyle=StyleText
X=250
Y=240
W=200
H=50
StringAlign=CenterCenter
ClipString=1
Text=Centered CenterCenter text that is long enough to wrap onto two lines
[Trailing]
Meter=String
MeterStyle=StyleText
X=500
Y=300
StringAlign=Right
TrailingSpaces=1
Text="  kept spaces   "
[Trimmed]
Meter=String
MeterStyle=StyleText
X=500
Y=325
StringAlign=Right
Text="  trimmed spaces   "
