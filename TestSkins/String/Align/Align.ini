; StringAlign regression fixture: X/Y is the anchor (red dot); boxes with W/H show the meter rectangle.
[Rainmeter]
Update=1000
AccurateText=1
BackgroundMode=2
SolidColor=30,30,40,255
SkinWidth=460
SkinHeight=330

[Variables]
Box=40,90,160,255

[StyleText]
FontFace=Arial
FontSize=11
FontColor=255,255,255,255
AntiAlias=1
SolidColor=#Box#

[StyleDot]
W=3
H=3
SolidColor=255,60,60,255

; --- Row 1: no W/H, anchors at x = 20 / 230 / 440, y = 20
[L]
Meter=String
MeterStyle=StyleText
X=20
Y=20
Text=LeftTop
[DotL]
Meter=Image
MeterStyle=StyleDot
X=19
Y=19
[C]
Meter=String
MeterStyle=StyleText
X=230
Y=20
StringAlign=Center
Text=CenterTop
[DotC]
Meter=Image
MeterStyle=StyleDot
X=229
Y=19
[R]
Meter=String
MeterStyle=StyleText
X=440
Y=20
StringAlign=Right
Text=RightTop
[DotR]
Meter=Image
MeterStyle=StyleDot
X=439
Y=19

; --- Row 2: vertical anchors at y = 80
[LC]
Meter=String
MeterStyle=StyleText
X=20
Y=80
StringAlign=LeftCenter
Text=LeftCenter
[DotLC]
Meter=Image
MeterStyle=StyleDot
X=19
Y=79
[CC]
Meter=String
MeterStyle=StyleText
X=230
Y=80
StringAlign=CenterCenter
Text=CenterCenter
[DotCC]
Meter=Image
MeterStyle=StyleDot
X=229
Y=79
[RB]
Meter=String
MeterStyle=StyleText
X=440
Y=80
StringAlign=RightBottom
Text=RightBottom
[DotRB]
Meter=Image
MeterStyle=StyleDot
X=439
Y=79

; --- Row 3: W=120 H=60 boxes, manual rule: X=60,Y=... CenterCenter centers the text in the box
[BoxLT]
Meter=String
MeterStyle=StyleText
X=20
Y=120
W=120
H=60
Text=LT in box
[BoxCC]
Meter=String
MeterStyle=StyleText
X=230
Y=150
W=120
H=60
StringAlign=CenterCenter
Text=CC in box
[DotBoxCC]
Meter=Image
MeterStyle=StyleDot
X=229
Y=149
[BoxRB]
Meter=String
MeterStyle=StyleText
X=440
Y=180
W=120
H=60
StringAlign=RightBottom
Text=RB in box
[DotBoxRB]
Meter=Image
MeterStyle=StyleDot
X=439
Y=179

; --- Row 4: multi-line text, each line aligned; padding
[Multi]
Meter=String
MeterStyle=StyleText
X=230
Y=200
StringAlign=Center
Padding=6,4,6,4
Text=First line#CRLF#second#CRLF#the third line
[DotMulti]
Meter=Image
MeterStyle=StyleDot
X=229
Y=199
[RightMulti]
Meter=String
MeterStyle=StyleText
X=440
Y=250
StringAlign=Right
Text=Right aligned#CRLF#lines
[Relative]
Meter=String
MeterStyle=StyleText
X=0R
Y=0r
Text=<0R
[Below]
Meter=String
MeterStyle=StyleText
X=20
Y=250
FontSize=20
Text=Size 20 Ag
[Next]
Meter=String
MeterStyle=StyleText
X=0R
Y=0r
FontSize=8
Text=then 8pt
