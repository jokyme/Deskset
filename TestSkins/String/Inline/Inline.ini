; InlineSetting / InlinePattern regression fixture (original text).
[Rainmeter]
Update=1000
AccurateText=1
BackgroundMode=2
SolidColor=30,30,40,255
DynamicWindowSize=1

[MeasureText]
Measure=String
String=Deskset draws skins natively. Prices: 128 and 256 units.#CRLF#Colors: amber and teal, a RainbowGradient too!#CRLF#Spacing, struck, underlined, oblique and Italic words.

[MeterInline]
Meter=String
MeasureName=MeasureText
X=10
Y=10
Padding=6,6,6,6
FontFace=Arial
FontSize=14
FontColor=235,235,235,255
SolidColor=45,45,60,255
AntiAlias=1
InlineSetting=Weight | 700
InlinePattern=^(\S+) draws
InlineSetting2=Size | 18
InlinePattern2=(\d{3})
InlineSetting3=Color | 255,180,60,255
InlinePattern3=Colors: (\w+) and
InlineSetting4=Color | 60,200,190,255
InlinePattern4=Colors: \w+ and (\w+),
InlineSetting5=GradientColor | 180 | 255,0,0,255 ; 0.0 | 255,255,0,255 ; 0.35 | 0,200,255,255 ; 0.7 | 200,0,255,255 ; 1.0
InlinePattern5=RainbowGradient
InlineSetting6=CharacterSpacing | 2 | 2
InlinePattern6=Spacing
InlineSetting7=Strikethrough
InlinePattern7=struck
InlineSetting8=Underline
InlinePattern8=underlined
InlineSetting9=Oblique
InlinePattern9=oblique
InlineSetting10=Italic
InlinePattern10=Italic
InlineSetting11=Face | Courier New
InlinePattern11=Prices
InlineSetting12=Shadow | 2 | 2 | 2 | 0,0,0,255
InlinePattern12=natively
InlineSetting13=Case | Upper
InlinePattern13=units
InlineSetting14=None

[MeterGradientVertical]
Meter=String
X=10
Y=10R
FontFace=Arial
FontSize=26
FontWeight=900
AntiAlias=1
Text=Vertical gradient
InlineSetting=GradientColor | 270 | 255,255,255,255 ; 0.2 | 40,120,255,255 ; 0.8
InlineSetting2=Shadow | 1 | 3 | 4 | 0,0,0,200

[MeterWholeString]
Meter=String
X=10
Y=6R
FontFace=Arial
FontSize=12
FontColor=200,200,200,255
AntiAlias=1
Text=default pattern applies to the whole string
InlineSetting=Case | Proper
InlineSetting2=Color | 140,220,120,255
InlinePattern2=^$
InlineSetting3=Stretch | 3
InlineSetting4=Typography | smcp
InlinePattern4=string

[MeterTypography]
Meter=String
X=10
Y=6R
FontFace=Baskerville
FontSize=14
FontColor=230,230,230,255
AntiAlias=1
Text=Small Caps 1234567890 | Old style 1234567890
InlineSetting=Typography | smcp
InlinePattern=^(.*) \|
InlineSetting2=Typography | onum
InlinePattern2=^.* \| (.*)

[MeterStretch]
Meter=String
X=10
Y=6R
FontFace=Helvetica Neue
FontSize=14
FontColor=230,230,230,255
AntiAlias=1
Text=Condensed bold | normal | Segoe UI condensed
InlineSetting=Stretch | 3
InlinePattern=^(Condensed bold)
InlineSetting2=Weight | 700
InlinePattern2=^(Condensed bold)
InlineSetting3=Face | Segoe UI
InlinePattern3=Segoe UI condensed
InlineSetting4=Stretch | 2
InlinePattern4=Segoe UI condensed
