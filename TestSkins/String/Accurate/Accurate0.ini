; AccurateText=0: with 0 the meter is 1/6 em wider on each side (GDI+-like padding).
[Rainmeter]
Update=1000
AccurateText=0
BackgroundMode=2
SolidColor=30,30,40,255
DynamicWindowSize=1

[S]
FontFace=Arial
FontSize=12
FontColor=255,255,255,255
SolidColor=40,90,160,255
AntiAlias=1
X=10
Y=4R

[A]
Meter=String
MeterStyle=S
Y=10
Text=AccurateText=0 left
[B]
Meter=String
MeterStyle=S
X=210
StringAlign=Right
W=200
Text=right in W=200
[C]
Meter=String
MeterStyle=S
FontSize=24
Text=Big 24pt
[Width]
Meter=String
MeterStyle=S
FontSize=9
SolidColor=0,0,0,0
Text=A: [A:W] x [A:H]  C: [C:W] x [C:H]
DynamicVariables=1
