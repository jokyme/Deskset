; Adversarial-review regression fixture (original text): empty Text, tab stops, ClipString=2 with CJK text,
; per-range inline gradients, Border around simulated bold, and long / combining-mark text.
[Rainmeter]
Update=1000
AccurateText=1
BackgroundMode=2
SolidColor=30,30,40,255
DynamicWindowSize=1

[Variables]
Box=40,90,160,255

[S]
FontFace=Arial
FontSize=12
FontColor=255,255,255,255
AntiAlias=1
SolidColor=#Box#
X=10
Y=6R

[MeasureValue]
Measure=String
String=Empty Text shows the bound measure

; Text= (empty) is "not set": the measure value is shown.
[EmptyText]
Meter=String
MeterStyle=S
Y=10
MeasureName=MeasureValue
Text=

; Tab stops every 4 x font size (64 px at 12 pt).
[Tabs]
Meter=String
MeterStyle=S
Text=CPU[\x9]42%[\x9]RAM[\x9]7.9 GB

; ClipString=2 wraps between CJK characters (no spaces); a Latin word longer than W is still clipped.
[Chinese]
Meter=String
MeterStyle=S
FontFace=Microsoft YaHei
W=190
ClipString=2
Text=今天天气晴朗，最高气温二十五度，适合外出散步。
[Japanese]
Meter=String
MeterStyle=S
FontFace=Meiryo
W=190
ClipString=2
Text=明日は雨が降るかもしれません。傘を忘れずに。
[LongWord]
Meter=String
MeterStyle=S
W=190
ClipString=2
Text=Deskset 显示 Pneumonoultramicroscopicsilicovolcanoconiosis 很长
[CJKHeight]
Meter=String
MeterStyle=S
FontFace=Microsoft YaHei
W=190
H=40
ClipString=2
Text=高度有限的时候，最后一行会被截断并加上省略号，其余的文字不再显示。

; Every match gets its own gradient (red -> blue across each number).
[Gradients]
Meter=String
MeterStyle=S
FontSize=16
FontWeight=700
Text=128 MB  and  4096 MB
InlineSetting=GradientColor | 180 | 255,80,80,255 ; 0.0 | 80,160,255,255 ; 1.0
InlinePattern=(\d+)

; The border follows the stroked outline of simulated bold (Chalkduster has one weight).
[BoldBorder]
Meter=String
MeterStyle=S
FontFace=Chalkduster
FontSize=16
FontWeight=800
FontColor=20,20,20,255
StringEffect=Border
FontEffectColor=255,210,80,255
SolidColor=0,0,0,0
; Chalkduster's glyphs overhang their advance: keep room for the overhang and the 1px border.
Padding=1,1,6,1
Text=Simulated bold with Border

; Combining marks and emoji measure and draw without trouble.
[Unicode]
Meter=String
MeterStyle=S
Text=Ẓ̵̢a̶l̷g̸o̵ · 😀👍🏽 · مرحبا · עברית

; CharacterSpacing leading space also applies before the first character of every line (box includes it).
[Spacing]
Meter=String
MeterStyle=S
Text=Leading 6#CRLF#on each line
InlineSetting=CharacterSpacing | 6 | 0

; Inline Shadow over several lines: one shadow beneath all the text, clipped to the meter (Padding gives it room).
[ShadowLines]
Meter=String
MeterStyle=S
FontSize=14
Padding=0,0,6,6
Text=Shadowed first line#CRLF#and a second line
InlineSetting=Shadow | 2 | 3 | 3 | 0,0,0,255
InlineSetting2=Color | 255,220,120,255
InlinePattern2=second
