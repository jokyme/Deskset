; Original test skin: the clock, week and temperature variables (#MACCLOCKHOURS#, #MACFIRSTWEEKDAY#,
; #MACTEMPERATUREUNIT#) and the "Auto" settings built on them, the way the default suite does it: ClockHours=Auto
; resolves through [#ClockHours[#ClockHours]] to the Mac's clock, the time follows it. A change of one of the
; settings in System Settings refreshes the skin (MacOnAppearanceChangeAction).
; Render it with each setting: Deskset --render Regional.ini --clock-hours 12 --first-weekday 1 --temperature-unit F
[Rainmeter]
Update=1000
AccurateText=1

[Metadata]
Name=Mac Regional Settings
Author=Deskset
Information=The Mac's 12/24-hour clock, first day of the week and temperature unit as built-in variables.
License=MIT
Version=1.0

[Variables]
ClockHours=Auto
ClockHoursAuto=#MACCLOCKHOURS#
ClockHours24=24
ClockHours12=12
TimeFormat24=%H:%M
TimeFormat12=%#I:%M %p
WeekStart=Auto
WeekStartAuto=#MACFIRSTWEEKDAY#
TempUnit=Auto
TempUnitAuto=#MACTEMPERATUREUNIT#

[MeasureTime]
Measure=Time
Format=[#TimeFormat[#ClockHours[#ClockHours]]]
DynamicVariables=1

[MeasureWeekStartStamp]
Measure=Calc
; The weekday that starts the week: noon on Sunday 2026-09-27 (a Windows timestamp) plus WeekStart days
Formula=13434984000 + [#WeekStart[#WeekStart]] * 86400
DynamicVariables=1

[MeasureWeekStart]
Measure=Time
TimeStamp=[MeasureWeekStartStamp:]
Format=%A
DynamicVariables=1

[MeterPanel]
Meter=Shape
Shape=Rectangle 0,0,260,96,12 | Fill Color #MACSEPARATORCOLOR# | StrokeWidth 0

[MeterVariables]
Meter=String
X=14
Y=12
FontFace=System Rounded
FontSize=11
FontColor=#MACLABELCOLOR#
AntiAlias=1
Text=#MACCLOCKHOURS# h · weekday #MACFIRSTWEEKDAY# · °#MACTEMPERATUREUNIT#

[MeterTime]
Meter=String
MeasureName=MeasureTime
X=14
Y=36
FontFace=System Rounded
FontSize=16
FontWeight=600
FontColor=#MACLABELCOLOR#
AntiAlias=1
Text=%1

[MeterWeek]
Meter=String
MeasureName=MeasureWeekStart
X=14
Y=66
FontFace=System
FontSize=9
FontColor=#MACSECONDARYLABELCOLOR#
AntiAlias=1
Text=Weeks start on %1 · [#TempUnit[#TempUnit]]
DynamicVariables=1
