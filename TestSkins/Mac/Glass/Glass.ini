; Original test skin: MacGlass, the Deskset extension that puts macOS glass (Liquid Glass on macOS 26) behind a skin
; or behind any of its meters. Three rounded glass cards with text:
; - a Shape meter whose first shape is a Rectangle: the glass takes the rectangle and its 22 px corners;
; - an Image meter with Clear glass and its own corner radius;
; - a tinted card whose style changes when it is clicked (DynamicVariables; the card has no fill of its own, so the
;   glass is what catches the click).
; Rainmeter ignores the MacGlass options (they all start with Mac): there the skin shows only its text.
[Rainmeter]
Update=1000
AccurateText=1

[Metadata]
Name=Glass
Author=Deskset
Information=Test skin for MacGlass: rounded glass cards behind text. Click the blue card to switch its glass between Regular and Clear.
Version=1.0
License=MIT

[Variables]
Ink=255,255,255,255
Soft=255,255,255,200
Shade=0,0,0,90
Style=Regular
Other=Clear

; ---------------------------------------------------------------- measures

[MeasureTime]
Measure=Time
Format=%H:%M

[MeasureDate]
Measure=Time
Format=%A %#d %B

[MeasureCPU]
Measure=CPU

; ---------------------------------------------------------------- styles

[TextStyle]
FontFace=Helvetica Neue
FontColor=#Ink#
StringEffect=Shadow
FontEffectColor=#Shade#
AntiAlias=1

[LabelStyle]
FontSize=12
FontWeight=600
FontColor=#Soft#

; ---------------------------------------------------------------- the clock card: glass in the shape's rectangle

[ClockCard]
Meter=Shape
Shape=Rectangle 0,0,272,120,22 | Fill Color 255,255,255,0 | StrokeWidth 0
MacGlass=Regular

[ClockText]
Meter=String
MeterStyle=TextStyle
MeasureName=MeasureTime
X=24
Y=14
FontSize=48
FontWeight=300

[DateText]
Meter=String
MeterStyle=TextStyle | LabelStyle
MeasureName=MeasureDate
X=26
Y=84
FontSize=13

; ---------------------------------------------------------------- the processor card: Clear glass, own radius

[CPUCard]
Meter=Image
Y=132
W=130
H=104
MacGlass=Clear
MacGlassCornerRadius=24

[CPULabel]
Meter=String
MeterStyle=TextStyle | LabelStyle
X=18
Y=146
Text=PROCESSOR

[CPUText]
Meter=String
MeterStyle=TextStyle
MeasureName=MeasureCPU
X=16
Y=166
FontSize=34
FontWeight=500
NumOfDecimals=0
Postfix=%

; ---------------------------------------------------------------- the tinted card: click to switch Regular / Clear

[TintCard]
Meter=Image
X=142
Y=132
W=130
H=104
MacGlass=#Style#
MacGlassCornerRadius=24
MacGlassTint=70,130,255,120
DynamicVariables=1
LeftMouseUpAction=[!SetVariable Style "#Other#"][!SetVariable Other "#Style#"][!UpdateMeter TintCard][!UpdateMeter TintText][!Redraw]
ToolTipText=Click to switch between Regular and Clear glass

[TintLabel]
Meter=String
MeterStyle=TextStyle | LabelStyle
X=160
Y=146
Text=TINTED

[TintText]
Meter=String
MeterStyle=TextStyle
X=158
Y=172
FontSize=22
FontWeight=500
Text=#Style#
DynamicVariables=1
