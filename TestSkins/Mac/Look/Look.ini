; Original test skin: the Mac look extensions — system font designs (System, System Rounded, System Mono, New York),
; SF Symbols as images (sf:, tinted, weights, hierarchical and multicolor rendering, a Bar and a Button), and the
; appearance variables (#MACAPPEARANCE# picks the theme include; text, symbols and hairlines use the label, secondary,
; tertiary, accent and separator colors). Switching between light and dark refreshes it.
[Rainmeter]
Update=1000
AccurateText=1
MacOnAppearanceChangeAction=[!Refresh]

[Metadata]
Name=Mac Look
Author=Deskset
Information=System font designs, SF Symbols and the light / dark appearance variables.
License=MIT
Version=1.0

[Variables]
@Include=#@#Theme-#MACAPPEARANCE#.inc
Width=300

[MeasureLoad]
Measure=Calc
Formula=0.62
MinValue=0
MaxValue=1

[MeterPanel]
Meter=Shape
Shape=Rectangle 0,0,#Width#,234,14 | Fill Color #Panel# | StrokeWidth 1 | Stroke Color #MACSEPARATORCOLOR#

[MeterTitle]
Meter=String
X=16
Y=14
FontFace=System Rounded
FontWeight=700
FontSize=14
FontColor=#MACLABELCOLOR#
AntiAlias=1
Text=Mac Look

[MeterMode]
Meter=String
X=(#Width# - 16)
Y=19
StringAlign=Right
FontFace=System
FontSize=9
FontColor=#MACSECONDARYLABELCOLOR#
AntiAlias=1
Text=#MACAPPEARANCE# · dark mode #MACDARKMODE#

[MeterWell]
Meter=Shape
X=12
Y=48
Shape=Rectangle 0,0,(#Width# - 24),40,9 | Fill Color #Well# | StrokeWidth 0

[StyleSymbol]
Y=56
W=24
H=24
ImageTint=#MACACCENTCOLOR#

[MeterCPU]
Meter=Image
MeterStyle=StyleSymbol
X=24
ImageName=sf:cpu.fill

[MeterMemory]
Meter=Image
MeterStyle=StyleSymbol
X=20R
ImageName=sf:memorychip
MacSymbolWeight=Semibold

[MeterWiFi]
Meter=Image
MeterStyle=StyleSymbol
X=20R
ImageName=sf:wifi
MacSymbolRendering=Hierarchical

[MeterGauge]
Meter=Image
MeterStyle=StyleSymbol
X=20R
ImageName=sf:gauge.with.needle
ImageTint=#MACLABELCOLOR#
MacSymbolWeight=Light

[MeterWeather]
Meter=Image
MeterStyle=StyleSymbol
X=20R
ImageName=sf:cloud.sun.fill
ImageTint=255,255,255,255
MacSymbolRendering=Multicolor

[MeterPower]
Meter=Button
X=20R
Y=58
ButtonImage=sf:power.circle.fill
MacSymbolSize=17
ImageTint=#MACSECONDARYLABELCOLOR#
ButtonCommand=[!Log "Power button"]

[MeterBattery]
Meter=Bar
MeasureName=MeasureLoad
X=16
Y=104
BarImage=sf:battery.100percent
BarOrientation=Horizontal
MacSymbolSize=20
ImageTint=#MACACCENTCOLOR#

[MeterBatteryText]
Meter=String
MeasureName=MeasureLoad
X=8R
Y=104
FontFace=SF Mono
FontSize=10
FontColor=#MACLABELCOLOR#
AntiAlias=1
Percentual=1
Text=%1% charged

[MeterMono]
Meter=String
X=16
Y=134
FontFace=System Mono
FontSize=9
FontColor=#MACTERTIARYLABELCOLOR#
AntiAlias=1
Text=0123456789 · MONO · iiiWWW

[MeterRule]
Meter=Shape
X=16
Y=158
Shape=Line 0,0,(#Width# - 32),0 | StrokeWidth 1 | Stroke Color #MACSEPARATORCOLOR#

[MeterSerif]
Meter=String
X=16
Y=168
FontFace=New York
FontSize=12
StringStyle=Italic
FontColor=#MACLABELCOLOR#
AntiAlias=1
Text=New York, set in italic

[MeterAccent]
Meter=String
X=16
Y=198
FontFace=System Rounded
FontWeight=600
FontSize=10
FontColor=#MACACCENTCOLOR#
AntiAlias=1
Text=Accent color

[MeterSecondary]
Meter=String
X=8R
Y=200
FontFace=System
FontSize=9
FontColor=#MACSECONDARYLABELCOLOR#
AntiAlias=1
Text=secondary text
