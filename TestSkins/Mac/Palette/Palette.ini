; Original test skin: SF Symbols drawn with palettes (MacSymbolRendering=Palette, MacSymbolColors), a Deskset
; extension. Row 1: every weather symbol MacWeather names, each layer in its role's color (the cloud in the secondary
; ink, a yellow sun, rain in the rain color), as MacWeather's Type=SymbolPalette gives them. Row 2: the same outline.
; Row 3: sunrise and sunset (the sun on an ink horizon), a lone translucent color (it keeps its alpha), a palette
; shorter than the layers (the last color repeats), ImageTint multiplying a palette, no colors (white, as Monochrome)
; and a symbol read from a MacWeather measure (empty without a forecast). Switching between light and dark refreshes it.
[Rainmeter]
Update=1000
AccurateText=1
MacOnAppearanceChangeAction=[!Refresh]

[Metadata]
Name=Palette Symbols
Author=Deskset
Information=SF Symbols drawn with palettes: the weather symbols, sunrise and sunset, and the edge cases.
License=MIT
Version=1.0

[Variables]
@Include=#@#Theme-#MACAPPEARANCE#.inc
Width=508
; the Light and Dark values of the Stationery suite's roles
InkLight=0,0,0,153
InkDark=255,255,255,166
SunLight=255,204,0
SunDark=255,214,0
RainLight=0,82,118
RainDark=60,211,254
Ink=[#Ink#MACAPPEARANCE#]
Sun=[#Sun#MACAPPEARANCE#]
Rain=[#Rain#MACAPPEARANCE#]

[MeterPanel]
Meter=Shape
Shape=Rectangle 0,0,#Width#,128,14 | Fill Color #Panel# | StrokeWidth 1 | Stroke Color #MACSEPARATORCOLOR#

[StyleSymbol]
