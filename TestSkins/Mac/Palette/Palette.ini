Plugin=MacWeather
Location=59.91,10.75
Type=Symbol
PaletteInk=#Ink#
PaletteSun=#Sun#
PaletteRain=#Rain#

[MeasureWeatherPalette]
Measure=Plugin
Plugin=MacWeather
Parent=MeasureWeather
Type=SymbolPalette

[MeterWeather]
Meter=Image
MeterStyle=StyleSymbol
