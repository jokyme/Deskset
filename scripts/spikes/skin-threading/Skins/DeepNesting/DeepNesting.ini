; Stack probe fixture (original content, see docs/skin-threading.md "Stack depth"). The first update starts a chain
; of IfTrueActions: each measure updates the next one with !UpdateMeasure, until the engine's limit of 16 nested
; actions stops it. Every level also resolves inline Lua ([&Script:deep(25)], 25 nested pcalls whose innermost call
; measures a meter) and a meter section variable ([T1:W], which lays the meters out and measures their text).
[Rainmeter]
Update=1000
AccurateText=1

[Metadata]
Name=Deep nesting
Author=Deskset
License=Original test fixture

[Variables]
X=0

[Script]
Measure=Script
ScriptFile=#@#deep.lua

[M1]
Measure=Calc
Formula=([&Script:deep(25)] * 0 + [T1:W] * 0 + 1)
DynamicVariables=1
IfCondition=(M1 > 0)
IfTrueAction=[!SetVariable X "[&Script:deep(25)] [T1:W]"][!UpdateMeterGroup G][!UpdateMeasure M2]
IfConditionMode=1

[M2]
