name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  core:
    name: Core self-tests (arm64)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      # Clocks, random numbers, timers, background work and outside effects go through the engine's seams; a new
      # direct use, or an allowance the sources no longer need, fails here (scripts/seams-allowlist.tsv).
      - name: Seam check
        run: swift scripts/check-seams.swift --check

      # The app's text goes through L and the String Catalogs in Localization/: a key missing from them, a language
      # without a text, a format that differs from the English one, or new untranslated text in a covered file fails.
      - name: Localization check
        run: swift scripts/localization.swift check

      - name: Build Core self-tests
        run: swift build --product DesksetSelfTest

      - name: Core self-tests
        run: .build/debug/DesksetSelfTest

  app:
    name: App self-tests (arm64)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Build App
        run: swift build --product Deskset

      - name: App self-tests
        run: .build/debug/Deskset --self-test

  bundle:
    name: App bundle (arm64)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: App bundle
        run: bash scripts/build-app.sh --arch arm64

  intel:
    name: Build and test (x86_64)
    runs-on: macos-26-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: App bundle
        run: bash scripts/build-app.sh --arch x86_64

      - name: App smoke self-tests
        run: |
          build/x86_64/Deskset.app/Contents/MacOS/Deskset --self-test "Studio2: window"

